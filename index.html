        <div class="card-sub">${isNda?'Step 1 of 2':'Step 2 of 2'} — please read the full agreement below before signing.</div>
      </div>
      <div class="agreement-fields">
        <div><b>Tester Name:</b> ${esc(fullName)}</div>
        <div><b>Email:</b> ${esc((currentUser&&currentUser.email)||'')}</div>
        ${businessName?`<div><b>Business Name:</b> ${esc(businessName)}</div>`:''}
        <div><b>Date:</b> ${fmtDate(todayStr())}</div>
      </div>
      <div class="agreement-body">${bodyHtml}</div>
      <div class="agreement-checks">
        ${checks.map((c,i)=>`<label class="agreement-check"><input type="checkbox" data-ackidx="${i}"><span>${esc(c)}</span></label>`).join('')}
      </div>
      <div class="agreement-sig">
        <div class="card-sub" style="margin-bottom:6px;">Sign below with your finger or mouse:</div>
        <canvas id="sigCanvas" width="600" height="180"></canvas>
        <button class="btn btn-secondary" id="sigClearBtn" type="button" style="margin-top:8px;">Clear signature</button>
      </div>
      <button class="btn btn-primary" style="width:100%; margin-top:16px;" id="agreementSubmitBtn" disabled>I Agree &amp; Sign</button>
      <div class="auth-message" id="agreementMessage"></div>
    </div>`;

  const checkEls = Array.from(screen.querySelectorAll('[data-ackidx]'));
  const submitBtn = document.getElementById('agreementSubmitBtn');
  let hasInk = false;
  function updateSubmitState(){ submitBtn.disabled = !(checkEls.every(c=>c.checked) && hasInk); }
  checkEls.forEach(c=>c.onchange=updateSubmitState);

  const canvas = document.getElementById('sigCanvas');
  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#142440'; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  let drawing=false, lastX=0, lastY=0;
  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x:(clientX-rect.left)*scaleX, y:(clientY-rect.top)*scaleY };
  }
  function start(e){ e.preventDefault(); drawing=true; const p=getPos(e); lastX=p.x; lastY=p.y; }
  function move(e){
    if(!drawing) return;
    e.preventDefault();
    const p=getPos(e);
    ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke();
    lastX=p.x; lastY=p.y; hasInk=true; updateSubmitState();
  }
  function end(){ drawing=false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);

  document.getElementById('sigClearBtn').onclick = ()=>{
    ctx.clearRect(0,0,canvas.width,canvas.height); hasInk=false; updateSubmitState();
  };

  submitBtn.onclick = async ()=>{
    submitBtn.disabled = true;
    const msg = document.getElementById('agreementMessage');
    msg.textContent = 'Saving your signature…';
    try{
      const sigDataUrl = canvas.toDataURL('image/png');
      const payload = { user_id: currentUser.id, name: fullName, email: currentUser.email };
      if(isNda){ payload.nda_signature = sigDataUrl; payload.nda_signed_at = new Date().toISOString(); }
      else { payload.license_signature = sigDataUrl; payload.license_signed_at = new Date().toISOString(); }
      const { data:existing } = await sb.from('demo_agreements').select('id').eq('user_id',currentUser.id).maybeSingle();
      let error;
      if(existing){ ({error} = await sb.from('demo_agreements').update(payload).eq('id',existing.id)); }
      else { ({error} = await sb.from('demo_agreements').insert(payload)); }
      if(error) throw error;
      if(isNda){ agreementStep='license'; renderAgreementScreen(); }
      else { await finishAgreementFlow(); }
    }catch(err){
      msg.textContent = err.message || 'Could not save your signature — try again.';
      submitBtn.disabled = false;
    }
  };
}

async function finishAgreementFlow(){
  document.getElementById('agreementScreen').classList.add('hidden');
  document.body.classList.remove('auth-locked');
  await loadData();
  maybeStartTour();
}


// ===== NEW ACCOUNT TOUR START =====
// Display only: a few made-up "practice" screens. It never reads, creates or changes any rabbit or account data.
// The only thing stored is a "seen" flag in this browser (localStorage), so it cannot affect or mix accounts.
function tourSeenKey(){ return 'hn_tour_seen_'+((currentUser&&currentUser.id)||'anon'); }
function tourWasSeen(){ try{ return localStorage.getItem(tourSeenKey())==='1'; }catch(e){ return true; } }
function tourMarkSeen(){ try{ localStorage.setItem(tourSeenKey(),'1'); }catch(e){} }
function closeTour(){ const o=document.getElementById('tourOv'); if(o) o.remove(); document.removeEventListener('keydown',tourKey); tourMarkSeen(); try{ render(); }catch(e){} }
function tourKey(e){
  if(e.key==='Escape'){ closeTour(); return; }
  if(e.key==='Tab'){   // keep keyboard focus inside the tour while it is open
    const o=document.getElementById('tourOv'); if(!o) return;
    const f=[...o.querySelectorAll('button')]; if(!f.length) return;
    const first=f[0], last=f[f.length-1];
    if(!o.contains(document.activeElement)){ e.preventDefault(); first.focus(); }
    else if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
}
function maybeStartTour(){
  try{
    if(!currentUser || viewingAsCustomer || localSandboxMode) return;
    if(!Array.isArray(rabbits) || rabbits.length>0) return;
    if(tourWasSeen()) return;
    startTour(false);
  }catch(e){ console.error(e); }
}
function startTour(replay){
  if(document.getElementById('tourOv')) return;
  const E=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const dots=n=>`<div class="tr-dots">${[1,2,3,4].map(i=>`<span class="${i===n?'on':''}"></span>`).join('')}</div>`;
  const card=(n,title,text,last)=>`<div class="tr-card">${dots(n)}<h3>${title}</h3><p>${text}</p><div class="tr-acts"><button type="button" class="tr-skip" data-tr="skip">Skip tour</button><button type="button" class="tr-next" data-tr="next">${last?'Finish':'Next'}</button></div></div>`;
  const BTN='border:0;cursor:pointer;font:inherit;';
  // Everything typed or tapped here lives only in these variables and disappears when the tour closes.
  let i=0, sub=0, pn='Practice Doe', sex='Doe', sire='', kits=6;
  const frames=[
    ()=>`<div class="tr-frame tr-welcome" role="dialog" aria-modal="true" aria-label="Welcome tour">
      <div class="tr-big">HerdNerd <em>Pro</em></div>
      <h2>Welcome. Let's try it with one rabbit.</h2>
      <p>It takes about a minute. We'll use a practice rabbit, so nothing is saved to your account.</p>
      <div class="tr-btns"><button type="button" class="tr-next" data-tr="next">Let's go</button><button type="button" class="tr-skip" data-tr="skip">Skip, I'll explore</button></div>
    </div>`,
    ()=> sub===0 ? `<div class="tr-frame" role="dialog" aria-modal="true" aria-label="Tour: add a rabbit">
      <div class="tr-hdr"><b>HerdNerd Pro</b></div>
      <div class="tr-row"><div class="tr-search">Name, ear #, color, breed</div><button type="button" class="tr-plus tr-spot" data-act="plus" aria-label="Add a rabbit" style="${BTN}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
      <div class="tr-row" style="padding-top:0"><div class="tr-pill on">Does</div><div class="tr-pill">Bucks</div><div class="tr-pill">Juniors</div></div>
      <div class="tr-banner">PRACTICE &middot; nothing here is saved to your account</div>
      ${card(2,'Tap the + to add a rabbit','Go ahead, tap the green + button.')}
    </div>` : `<div class="tr-frame" role="dialog" aria-modal="true" aria-label="Tour: new rabbit form">
      <div class="tr-hdr"><b>HerdNerd Pro</b></div>
      <div class="tr-banner" style="margin-top:12px">PRACTICE &middot; nothing here is saved to your account</div>
      <div class="tr-sheet"><h4>New rabbit</h4>
        <div class="tr-lbl">NAME</div>
        <input id="trName" type="text" maxlength="40" autocomplete="off" placeholder="Type any name" value="${E(pn==='Practice Doe'?'':pn)}" style="width:100%;box-sizing:border-box;height:48px;border-radius:12px;border:1.5px solid #2a1a2e;padding:0 14px;font-size:17px;margin-top:6px">
        <div class="tr-lbl" style="margin-top:12px">SEX</div>
        <div style="display:flex;gap:8px;margin-top:6px"><button type="button" data-act="sexDoe" class="tr-pill ${sex==='Doe'?'on':''}" style="${BTN}">Doe</button><button type="button" data-act="sexBuck" class="tr-pill ${sex==='Buck'?'on':''}" style="${BTN}">Buck</button></div>
        <button type="button" id="trAdd" data-act="addRabbit" class="tr-save" style="${BTN}width:100%;margin-top:16px">Add rabbit</button>
      </div>
      ${card(2,'Name and sex','Type a name, pick Doe or Buck, then tap Add rabbit.')}
    </div>`,
    ()=>`<div class="tr-frame" role="dialog" aria-modal="true" aria-label="Tour: pedigree">
      <div class="tr-hdr"><b>${E(pn)}</b><small>${sex} &middot; Holland Lop &middot; OPEN</small></div>
      <div class="tr-row"><div class="tr-pill">Overview</div><div class="tr-pill">Breeding</div><div class="tr-pill on">Pedigree</div></div>
      <div class="tr-banner" style="margin-bottom:12px">PRACTICE &middot; nothing here is saved</div>
      ${ sub===1 ? `<div class="tr-slot tr-spot" style="gap:8px"><i>SIRE</i><input id="trSire" type="text" maxlength="40" autocomplete="off" placeholder="Type a name" value="${E(sire)}" style="flex:1;min-width:0;height:42px;border-radius:10px;border:1.5px solid #2a1a2e;padding:0 10px;font-size:16px"><button type="button" data-act="saveSire" class="tr-next" style="min-height:42px;padding:0 16px;font-size:14px">Add</button></div>`
        : sire ? `<div class="tr-slot"><i>SIRE</i><span style="color:#2a1a2e">${E(sire)}</span></div>`
        : `<button type="button" class="tr-slot tr-spot" data-act="openSire" style="${BTN}width:calc(100% - 32px);text-align:left"><i>SIRE</i><span>+ Add name</span></button>` }
      <div class="tr-slot"><i>DAM</i><span>+ Add name</span></div>
      ${card(3,'Add a parent', sire ? 'Nice. That is all it takes. You can build the rest of the pedigree later.' : 'Tap the sire row and type a name. You can build the rest of the pedigree later.')}
    </div>`,
    ()=> sub===0 ? `<div class="tr-frame" role="dialog" aria-modal="true" aria-label="Tour: kindled">
      <div class="tr-hdr"><b>${E(pn)}</b><small>${sex} &middot; Holland Lop &middot; BRED</small></div>
      <div class="tr-banner" style="margin-top:12px">PRACTICE &middot; nothing here is saved</div>
      <div style="margin:12px 16px;background:#fff;border:1px solid #e1d5d1;border-radius:14px;padding:14px"><div style="font:700 18px 'Cormorant Garamond',serif">Current breeding</div><div style="font-size:13px;color:#4a3b4d;margin-top:4px">Due in 2 days</div>
        <button type="button" data-act="openKindled" class="tr-spot" style="${BTN}margin-top:12px;height:44px;border-radius:22px;background:#a7d63a;padding:0 22px;font-weight:700;font-size:14px;color:#2a1a2e">Kindled</button></div>
      ${card(4,'When the kits arrive','Tap the green Kindled button.',true)}
    </div>` : sub===1 ? `<div class="tr-frame" role="dialog" aria-modal="true" aria-label="Tour: kindled">
      <div class="tr-hdr"><b>${E(pn)}</b><small>${sex} &middot; Holland Lop &middot; BRED</small></div>
      <div class="tr-banner" style="margin-top:12px">PRACTICE &middot; nothing here is saved</div>
      <div class="tr-sheet"><h4>${E(pn)} kindled</h4><div class="tr-lbl">BABIES BORN ALIVE</div>
        <div class="tr-step"><button type="button" data-act="less" aria-label="Fewer" style="${BTN}background:#fff;width:50px;height:50px;border-radius:25px;border:1.5px solid #2a1a2e;font-size:26px">&minus;</button><span id="trKits">${kits}</span><button type="button" data-act="more" aria-label="More" style="${BTN}background:#3a1d44;color:#fff;width:50px;height:50px;border-radius:25px;font-size:26px">+</button></div>
        <div style="font-size:13px;color:#4a3b4d;text-align:center;margin-top:10px">Sex and color can be filled in later.</div>
        <button type="button" data-act="saveKits" class="tr-save" style="${BTN}width:100%">Save</button></div>
      ${card(4,'How many kits?','Use the + and − to set how many are alive, then tap Save.',true)}
    </div>` : `<div class="tr-frame" role="dialog" aria-modal="true" aria-label="Tour: done">
      <div class="tr-hdr"><b>${E(pn)}</b><small>${sex} &middot; Holland Lop &middot; KINDLED</small></div>
      <div style="margin:16px;background:#fff;border:1px solid #e1d5d1;border-radius:14px;padding:16px;text-align:center"><div style="font:700 28px 'Cormorant Garamond',serif">${kits} kit${kits===1?'':'s'} Kindled</div><div style="font-size:14px;color:#4a3b4d;margin-top:6px">HerdNerd works out weaning and rebreed dates for you.</div></div>
      ${card(4,"That's the whole flow","You added a rabbit, a parent, and a litter. Everything here was practice, so your herd is still empty.",true)}
    </div>`
  ];
  const ov=document.createElement('div'); ov.id='tourOv';
  const go=(n,sb)=>{ i=n; sub=sb||0; draw(); };
  const acts={
    plus:()=>go(1,1),
    sexDoe:()=>{ keep(); sex='Doe'; draw(); }, sexBuck:()=>{ keep(); sex='Buck'; draw(); },
    addRabbit:()=>{ keep(); if(!pn||pn==='Practice Doe'){ const n=document.getElementById('trName'); if(n){ n.focus(); n.style.borderColor='#b8452d'; } return; } go(2,0); },
    openSire:()=>{ sub=1; draw(); }, saveSire:()=>{ const v=document.getElementById('trSire'); sire=(v&&v.value.trim())||''; if(!sire){ if(v){ v.focus(); v.style.borderColor='#b8452d'; } return; } sub=0; draw(); },
    openKindled:()=>{ sub=1; draw(); }, less:()=>{ kits=Math.max(0,kits-1); const k=document.getElementById('trKits'); if(k) k.textContent=kits; }, more:()=>{ kits=Math.min(15,kits+1); const k=document.getElementById('trKits'); if(k) k.textContent=kits; },
    saveKits:()=>{ sub=2; draw(); }
  };
  function keep(){ const n=document.getElementById('trName'); if(n){ const v=n.value.trim(); pn=v||'Practice Doe'; } }
  function draw(){
    ov.innerHTML=frames[i]();
    ov.querySelectorAll('[data-tr]').forEach(b=>b.onclick=()=>{
      if(b.dataset.tr==='skip'){ closeTour(); return; }
      if(i>=frames.length-1){ closeTour(); return; }
      keep(); i++; sub=0; draw();
    });
    ov.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>acts[b.dataset.act]());
    const inp=ov.querySelector('#trName,#trSire');
    if(inp){ inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); (inp.id==='trName'?acts.addRabbit:acts.saveSire)(); } }); inp.focus(); }
    else { const first=ov.querySelector('.tr-spot')||ov.querySelector('.tr-next'); if(first) first.focus(); }
  }
  document.body.appendChild(ov); draw();
  document.addEventListener('keydown',tourKey);
}

let enterAppForUserId = null;
async function enterApp(user){
  if(enterAppForUserId === user.id) return;
  enterAppForUserId = user.id;
  try{
    document.body.classList.add('auth-locked');
    await initCloudStorage(user);
    await loadMyProfile();
    if(myProfile && myProfile.access_granted===false){
      await sb.auth.signOut();
      currentUser=null; cloudDataReady=false; cloudDataCache={}; myProfile=null; isAdminUser=false; adminSelf=null;
      enterAppForUserId = null;
      authScreen.classList.remove('hidden'); document.body.classList.remove('restoring');
      setAuthMessage("Your account doesn't have access yet. Contact CJM Legacy Rabbitry to get set up.");
      return;
    }
    authScreen.classList.add('hidden'); document.body.classList.remove('restoring');
    if(!isAdminUser){
      const status = await checkAgreementStatus();
      if(!status || !status.nda_signed_at){ agreementStep='nda'; showAgreementScreen(); return; }
      if(!status.license_signed_at){ agreementStep='license'; showAgreementScreen(); return; }
    }
    document.body.classList.remove('auth-locked');
    await loadData();
    maybeStartTour();
  }catch(err){
    console.error(err);
    authScreen.classList.remove('hidden'); document.body.classList.remove('restoring');
    document.body.classList.add('auth-locked');
    setAuthMessage('Could not connect to HerdNerd Pro data. '+(err.message||''));
    enterAppForUserId = null;
  }
}

sb.auth.onAuthStateChange((event,session)=>{
  if(session?.user){
    if(event==='INITIAL_SESSION' || event==='SIGNED_IN' || event==='USER_UPDATED') enterApp(session.user);
  } else {
    currentUser=null; cloudDataReady=false; cloudDataCache={};
    myProfile=null; isAdminUser=false; adminSelf=null; viewingAsCustomer=null;
    clearAccountMemory(); try{ closeSheet(); document.getElementById('profileView').classList.remove('on'); render(); }catch(e){}
    applyPalette(null);
    enterAppForUserId = null;
    authScreen.classList.remove('hidden'); document.body.classList.remove('restoring');
    document.body.classList.add('auth-locked');
    setAuthMode('login');
    authPassword.value=''; authConfirm.value='';
  }
});

// Ask Supabase for the current session so a returning user goes straight in.
// (enterApp's own guard above makes this safe to call alongside the
// onAuthStateChange listener even though both can fire for one login.)
sb.auth.getSession().then(({data})=>{
  if(data.session) enterApp(data.session.user);
});
