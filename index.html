      r.gcNumber=document.getElementById('f-gc').value;
      r.sireName=finalSire; r.damName=finalDam; r.notes=document.getElementById('f-notes').value;
      if(finalSire) ensureAncestor(finalSire,'buck');
      if(finalDam) ensureAncestor(finalDam,'doe');
      if(r.status==='growing'&&r.dob) r.flag='';
      saveData().then(ok=>{ if(ok) done(origin); });
    }));
  };
  const dec=document.getElementById('f-deceased');
  const sellBtn=document.getElementById('f-sell');
  if(sellBtn) sellBtn.onclick=()=>{ closeSheet(); openSaleSheet(r); };
  const forSaleBtn=document.getElementById('f-forsale');
  if(forSaleBtn) forSaleBtn.onclick=()=>{ r.forSale=!r.forSale; saveData(); closeSheet(); render(); if(profileRabbitId) renderProfile(); showToast(r.forSale?r.name+' marked for sale':r.name+' unmarked'); };
  if(dec) dec.onclick=()=>{
    r.status='deceased';
    if(r.damName&&r.dob){
      const dam=rabbits.find(x=>x.sex==='doe'&&x.name===r.damName&&x.litterBornDate===r.dob);
      if(dam){ dam.litterDead=dam.litterDead||{DOA:0,peanut:0,passed:0}; dam.litterDead.passed=(dam.litterDead.passed||0)+1;
        if(dam.litterKits){ let i=dam.litterKits.findIndex(k=>k.individualId===r.id); if(i<0 && r.sex && r.color) i=dam.litterKits.findIndex(k=>!k.individualId&&k.sex===r.sex&&(k.color||'')===r.color); if(i>=0) dam.litterKits.splice(i,1); } }
    }
    saveData(); closeSheet(); render(); if(profileRabbitId) renderProfile(); showToast(r.name+' marked deceased');
  };
  const ret=document.getElementById('f-retired');
  if(ret) ret.onclick=()=>{ r.status='retired'; saveData(); closeSheet(); render(); if(profileRabbitId) renderProfile(); showToast(r.name+' marked retired'); };
  const delBtn=document.getElementById('f-delete');
  if(delBtn) delBtn.onclick=(e)=>{ armConfirm(e.target, 'Tap again to confirm', async ()=>{ if(!(await moveToTrash(r))){ showToast('Could not delete — check your connection and try again'); return; } rabbits=rabbits.filter(x=>x.id!==r.id); saveData(); closeSheet(); closeProfile(); render(); showToast(r.name+' deleted · kept 30 days in More › Recently deleted'); }); };
}

function commitAdd(name, sex, d){
  d = d || {};
  // status is worked out, not asked: under 6 months goes to Juniors, otherwise open (does) / available (bucks)
  let status = (d.dob && isUnderSixMonths({dob:d.dob})) ? 'growing' : (sex==='buck'?'available':'open');
  const sire=d.sireName||'', dam=d.damName||'';
  const newRabbit = blankRabbit({ name, sex, status, breed:d.breed||'', color:d.color||'', earNumber:d.earNumber||'',
    weight:d.weightLbs?String(d.weightLbs):'', dob:d.dob||null, sireName:sire, damName:dam,
    registrationNumber:d.registrationNumber||'', gcNumber:d.gcNumber||'', legsWins:d.legsWins||'', alias:d.alias||'' });
  newRabbit.projects=(d.projectIds||[]).filter(id=>projects.some(p=>p.id===id));
  newRabbit.carries=Object.assign({}, d.carries||{});
  if(d.weightOz) newRabbit.weightLog=[{id:uid(), date:d.weightDate||todayStr(), oz:d.weightOz, source:'manual'}];
  if(d.origin) newRabbit.origin=d.origin;
  if(d.notes) newRabbit.notesLog=[{id:uid(), date:todayStr(), text:d.notes}];
  rabbits.push(newRabbit);
  if(sire) ensureAncestor(sire,'buck');
  if(dam) ensureAncestor(dam,'doe');
  saveData(); closeSheet(); render();
  openRabbitProfile(newRabbit);
  showToast(name+' added');
  if(d.photo){ addPhotoToRabbit(newRabbit, d.photo, 'Primary').then(ok=>{ if(profileRabbitId===newRabbit.id) renderProfile(); }); }
}

// On a computer the tree boxes show the same details the printed pedigree will show (the checkboxes under the tree).
function pedPrintOptionsHTML(){
  const wide=pedWide();

  const rows=[['dob','Date of birth',f.dob!==false],['reg','Registration #',!!f.reg],['gc','GC #',!!f.gc],['ear','Ear #',!!f.ear],['color','Color',!!f.color],['weight','Weight',!!f.weight]];
  const cb=(id,label,on)=>`<label style="display:flex; align-items:center; gap:8px; padding:6px 0; font-size:14px; font-weight:600;"><input type="checkbox" id="${id}" ${on?'checked':''} ${locked?'disabled':''} style="width:18px; height:18px;"> ${label}</label>`;
  return `<div class="card no-tap" id="pedPrintOpts" style="margin:14px 0;"><details ${wide?'open':''}><summary class="section-label" style="margin:0 0 6px;cursor:pointer;">SHOWN IN THE BOXES AND ON THE PRINT</summary>
    <div style="display:grid; grid-template-columns:repeat(${wide?3:1},minmax(0,1fr)); gap:0 18px;">${rows.map(([k,l,on])=>cb('pof-'+k,l,on)).join('')}${cb('pof-cert','Certification statement and signature line',pedigreeSettings.hasCertification!==false)}${cb('pof-wm','Diagonal watermark',!!pedigreeSettings.watermarkEnabled)}</div>
    <div class="card-sub" style="margin-top:6px;">These are saved for your account. Logo, fonts and other customization are under More &rarr; Pedigree settings.</div></details></div>`;
}
function wirePedPrintOptions(r){
  const box=document.getElementById('pedPrintOpts'); if(!box || viewingAsCustomer) return;
  const apply=async ()=>{
    pedigreeSettings.fields=Object.assign({}, pedigreeSettings.fields||{});
    ['dob','reg','gc','ear','color','weight'].forEach(k=>{ pedigreeSettings.fields[k]=document.getElementById('pof-'+k).checked; });
    pedigreeSettings.hasCertification=document.getElementById('pof-cert').checked;
    pedigreeSettings.watermarkEnabled=document.getElementById('pof-wm').checked;
    const wrap=document.getElementById('pedTreeWrap');
    if(wrap){ wrap.innerHTML=pedigreeTreeHTML(r); wirePedigreeTaps(wrap, r, renderProfile); }
    await savePedigreeSettings();
  };
  box.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=apply);
}
function pedWide(){ return !!(window.matchMedia && window.matchMedia('(min-width:900px)').matches); }
function pedFieldParts(n,isSelf){
  const f=(pedigreeSettings&&pedigreeSettings.fields)||{}, out=[], extra=[];
  if(!n || !n.id) return {facts:out, extra};   // a name with no record behind it has nothing to show; a pedigree-only ancestor record does
  if(f.color && n.color) out.push(n.color);
  if(f.dob!==false && n.dob) out.push('DOB '+fmtDateShort(n.dob));
  if(f.ear && n.earNumber) out.push('Ear # '+n.earNumber);
  if(f.reg && n.registrationNumber) out.push('Reg # '+n.registrationNumber);
  if(f.gc && n.gcNumber) out.push('GC # '+n.gcNumber);
  if(f.weight && n.weight) out.push(fmtWeight(n.weight));
  // legs and winnings always print, so they always show here too (5 for this rabbit, 2 for each ancestor, like the print)
  if(n.legsWins) extra.push('Legs: '+n.legsWins);
  (n.wins||[]).slice(0,isSelf?5:2).forEach(w=>{ try{ extra.push(pedigreeWinLineText(w)); }catch(e){} });
  return {facts:out, extra};
}
function pedFieldLines(n,isSelf){ const x=pedFieldParts(n,isSelf); return x.facts.concat(x.extra); }
function pedBox(node,path,role){
  const label = role?`<div class="pc" style="opacity:.6; text-transform:uppercase; font-size:9px; letter-spacing:.04em;">${role}</div>`:'';
  if(!node||!node.name) return `<div class="ped-box unknown" data-pedpath="${path}" data-pedat="${path}">${label}<div class="pn">+ Add name</div></div>`;
  if(pedWide()){
    const ls=pedFieldLines(node);
    return `<div class="ped-box ${node.external?'unknown':''}" data-pedname="${esc(node.name)}" data-pedat="${path}">${label}<div class="pn">${esc(node.name)}</div>${ls.map(x=>`<div class="pc">${esc(x)}</div>`).join('')}</div>`;
  }
  return `<div class="ped-box ${node.external?'unknown':''}" data-pedname="${esc(node.name)}" data-pedat="${path}">${label}<div class="pn">${esc(node.name)}</div>${node.color?`<div class="pc">${esc(node.color)}</div>`:''}</div>`;
}
function historyEntryHTML(damObj, e){
  const cls = e.outcome==='litter'?'took':e.outcome==='lost'?'lost':'pending';
  const label = e.outcome==='litter'?'Took — kindled':e.outcome==='lost'?'Did not take / litter lost':'Pending';
  let detail = `Bred to <b>${esc(e.partner||'?')}</b> on ${fmtDate(e.bredDate)}`;
  if(damObj) detail = `<b>${esc(damObj.name)}</b> &times; ${esc(e.partner||'?')} — bred ${fmtDate(e.bredDate)}`;
  if(e.outcome==='litter' && e.litterKits) detail += `<br>${kitCountText(e.litterKits,e.litterDead)} &middot; born ${fmtDate(e.litterBornDate)}`;
  if(e.palpated==='positive') detail += `<br>Palpated positive${e.palpatedDate?' '+esc(fmtShort(e.palpatedDate)):''}`;
  const canAgain = damObj && e.partner && damObj.sex==='doe' && damObj.status!=='pregnant' && damObj.status!=='growing' && (damObj.status!=='nursing' || canRebred(damObj));
  return `<div class="history-entry ${cls}"><div class="card-detail" style="margin:0;"><b>${label}</b></div><div class="card-detail" style="margin-top:2px;">${detail}</div>
    ${damObj?`<div class="card-actions" style="margin-top:8px;"><button class="btn btn-secondary btn-sm" data-histedit="${damObj.id}:${e.id}">Edit this entry</button>${canAgain?`<button class="btn btn-secondary btn-sm" data-again="${damObj.id}:${e.id}">Breed again to ${esc(e.partner)}</button>`:''}</div>`:''}</div>`;
}
function openHistorySheet(r){
  let html;
  if(r.sex==='doe'){
    const hist = (r.breedingHistory||[]).slice().sort((a,b)=>b.bredDate.localeCompare(a.bredDate));
    html = hist.length ? hist.map(e=>historyEntryHTML(r,e)).join('') : `<div class="empty">No breedings logged yet for ${esc(r.name)}.</div>`;
  } else {
    const rows=[];
    rabbits.forEach(d=>{ if(d.sex==='doe') (d.breedingHistory||[]).forEach(e=>{ if(e.partner && nameKey(e.partner)===nameKey(r.name)) rows.push({dam:d, e}); }); });
    rows.sort((a,b)=>b.e.bredDate.localeCompare(a.e.bredDate));
    html = rows.length ? rows.map(x=>historyEntryHTML(x.dam,x.e)).join('') : `<div class="empty">No breedings logged yet for ${esc(r.name)}.</div>`;
  }
  openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button>
    <h2>${esc(r.name)} — Breeding history</h2>${html}
    <div class="sheet-actions"><button class="btn btn-secondary" onclick="closeSheet()" style="flex:1;">Close</button></div>`);

function pedigreeTreeHTML(r){

  const cell=(html,col,row,span,extra)=>`<div class="pt-cell" style="grid-column:${col};grid-row:${row} / span ${span};${extra||''}">${html}</div>`;
  const br=(col,row,span)=>`<div class="pt-gap" style="grid-column:${col};grid-row:${row} / span ${span};"><i></i></div>`;
  const gens=[['', 's','d'],['ss','sd','ds','dd'],['sss','ssd','sds','sdd','dss','dsd','dds','ddd']];
  const roleOf=(path)=>path.slice(-1)==='s'?(path.length===1?'Sire':path.length===2?'Grandsire':'Sire'):(path.length===1?'Dam':path.length===2?'Granddam':'Dam');
  let tree = `<div class="pt-head" style="grid-column:1;grid-row:1;">THIS RABBIT</div><div class="pt-head" style="grid-column:3;grid-row:1;">PARENTS</div><div class="pt-head" style="grid-column:5;grid-row:1;">GRANDPARENTS</div><div class="pt-head" style="grid-column:7;grid-row:1;">GREAT-GRANDPARENTS</div>`;

  ['s','d'].forEach((pth,i)=>{ tree += cell(pedBox(g(pth),pth,roleOf(pth)),3,2+i*4,4); });
  ['ss','sd','ds','dd'].forEach((pth,i)=>{ tree += cell(pedBox(g(pth),pth,roleOf(pth)),5,2+i*2,2); });
  ['sss','ssd','sds','sdd','dss','dsd','dds','ddd'].forEach((pth,i)=>{ tree += cell(pedBox(g(pth),pth,roleOf(pth)),7,2+i,1); });
  tree += br(2,2,8);

// Previous / Next inside the edit panel: saves what you typed, closes, and opens the next rabbit in the order you read the pedigree
// (the order the boxes appear on screen: top to bottom on a phone, left to right then top to bottom on a computer)
function pedVisibleSlots(){
  return Array.from(document.querySelectorAll('[data-pedat]')).filter(el=>el.offsetParent!==null);
}
function pedSlotUsable(el){
  if(el.hasAttribute('data-pedname')) return true;
  const path=el.dataset.pedat, pp=path.slice(0,-1);
  if(pp==='') return true;
  const parentEl=document.querySelector('[data-pedat="'+pp+'"]');
  return !!(parentEl && parentEl.hasAttribute('data-pedname'));
}
function pedNeighbor(path, dir){
  const slots=pedVisibleSlots(); const i=slots.findIndex(el=>el.dataset.pedat===path);
  if(i<0) return null;
  for(let j=i+dir; j>=0 && j<slots.length; j+=dir){ if(pedSlotUsable(slots[j])) return slots[j]; }
  return null;
}
async function pedAdvance(path, dir){
  const nameQ=document.getElementById('f-qn');
  if(nameQ && !nameQ.value.trim()){ const c=document.getElementById('f-cancel'); if(c) c.click(); }   // blank slot, nothing typed: just move on
  else { const sv=document.getElementById('f-save'); if(!sv) return; sv.click(); }
  const bd=document.getElementById('sheetBackdrop');
  for(let t=0; t<80 && bd.classList.contains('on'); t++) await new Promise(r=>setTimeout(r,60));
  if(bd.classList.contains('on')) return;          // a question or a failed save is still open: stay put, nothing is skipped
  await new Promise(r=>setTimeout(r,30));
  if(dir===0) return;      // Close: saved and closed
  const nx=pedNeighbor(path, dir);
  if(nx){ try{ nx.scrollIntoView({block:'nearest'}); }catch(e){} nx.click(); }
}
function pedNavButtons(path){
  const sheet=document.getElementById('sheet'); const bar=sheet.querySelector('.sheet-actions'); if(!bar || !path) return;
  const usable=pedVisibleSlots().filter(pedSlotUsable);
  const idx=usable.findIndex(el=>el.dataset.pedat===path);
  const hasPrev=idx>0, hasNext=idx>=0 && idx<usable.length-1;
  // one tidy bar pinned to the bottom of the panel replaces Cancel / Save: Previous, Close, Next. Each of them saves first.
  bar.style.display='none';
  const h2=sheet.querySelector('h2');
  if(h2 && idx>=0 && usable.length>1){ const pos=document.createElement('div'); pos.className='card-sub'; pos.style.cssText='margin:-8px 0 12px;'; pos.textContent='Rabbit '+(idx+1)+' of '+usable.length; h2.insertAdjacentElement('afterend',pos); }
  const row=document.createElement('div');

  row.innerHTML=(hasPrev?'<button type="button" class="btn btn-secondary" style="flex:1; min-width:0;" id="pedPrev">&lsaquo; Previous</button>':'')
    +`<button type="button" class="btn ${hasNext?'btn-secondary':'btn-primary'}" style="flex:1; min-width:0;" id="pedClose">Close</button>`
    +(hasNext?'<button type="button" class="btn btn-primary" style="flex:1; min-width:0;" id="pedNext">Next &rsaquo;</button>':'');
  sheet.appendChild(row);
  const pv=document.getElementById('pedPrev'), nx=document.getElementById('pedNext'), cl=document.getElementById('pedClose');

    if(!myProfileForPdf) myProfileForPdf = await getMyPedigreeProfile();
    const pdfBytes = await buildDynamicGenericPedigreePdfBytes(r, myProfileForPdf, overrides);
    const blob = new Blob([pdfBytes], { type:'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${(r.name||'pedigree').replace(/\s+/g,'-')}-pedigree.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(err){
    console.error(err);
    alert('Pedigree PDF error:\n\n' + (err && err.message ? err.message : err));
    showToast('Could not generate the official PDF.');
  }
}

/* Quick, one-time choice shown only when this account has a custom
   background on file: use it (the normal case), or skip it for this one
   download and pick from the full color range instead — nothing here is
   saved back to Pedigree settings. */
// Renders a generated pedigree PDF's single page onto the live-preview
// canvas, scaled to fit the whole page — so the entire pedigree (every
// generation, both sides) is visible at a glance rather than only a
// slice of it. (A previous version cropped to just the right half, but
// the box tree's actual content doesn't start as far right as that
// assumed, so it was cutting off real boxes and part of the header —
// showing the full page, smaller, beats showing part of it bigger.)
async function renderPedigreePreviewCanvas(bytes){
  const visible = document.getElementById('ped-preview-canvas');
  if(!visible) return;
  if(!window.pdfjsLib) throw new Error("The PDF reader didn't load — refresh the page and try again.");
  const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
  const page = await pdf.getPage(1);
  const renderScale = 2.5; // render crisp, then downscale into the box
  const viewport = page.getViewport({ scale: renderScale });
  const full = document.createElement('canvas');
  full.width = viewport.width; full.height = viewport.height;
  await page.render({ canvasContext: full.getContext('2d'), viewport }).promise;

  const dpr = window.devicePixelRatio || 1;
  const boxW = visible.clientWidth || visible.parentElement.clientWidth || 300;
  const boxH = 320;
  visible.width = boxW * dpr; visible.height = boxH * dpr;
  visible.style.width = boxW+'px'; visible.style.height = boxH+'px';
  const ctx = visible.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, visible.width, visible.height);
  const scale = Math.min(visible.width/full.width, visible.height/full.height);
  const drawW = full.width*scale, drawH = full.height*scale;
  const dx = (visible.width-drawW)/2, dy = (visible.height-drawH)/2;
  ctx.drawImage(full, 0, 0, full.width, full.height, dx, dy, drawW, drawH);
  window._pedPreviewFull = full;            // kept so a tap can open it big
  visible.style.cursor = 'zoom-in';
  visible.onclick = openPedigreeZoom;
}
// Tap the small preview to look at the page up close. Its own - / Fit / + buttons and two-finger pinch zoom in and out,
// and Close is always on screen, so you can't get stuck zoomed in.
function openPedigreeZoom(){
  const full = window._pedPreviewFull; if(!full) return;
  const old = document.getElementById('pedZoomOv'); if(old) old.remove();
  const ov = document.createElement('div'); ov.id='pedZoomOv';
  ov.style.cssText = 'position:fixed; inset:0; z-index:100000; background:#6b6e70; display:flex; flex-direction:column;';
  const bar = document.createElement('div');
  bar.style.cssText = 'flex:none; display:flex; gap:8px; align-items:center; padding:8px 10px; background:#3a1d44;';
  const mk = (txt, fn, flex)=>{ const b=document.createElement('button'); b.type='button'; b.textContent=txt; b.onclick=fn;
    b.style.cssText = 'height:44px; min-width:44px; padding:0 14px; border-radius:22px; border:0; background:#fff; color:#2a1a2e; font:700 15px "Public Sans",sans-serif;'+(flex?'flex:1;':''); return b; };
  const area = document.createElement('div');
  area.style.cssText = 'flex:1; overflow:auto; -webkit-overflow-scrolling:touch; touch-action:pan-x pan-y;';
  const c = document.createElement('canvas'); c.width=full.width; c.height=full.height;
  c.getContext('2d').drawImage(full,0,0);
  c.style.cssText = 'display:block; height:auto; background:#fff; margin:0;';
  area.appendChild(c);
  let z = 1;
  const fitW = ()=>Math.max(200, area.clientWidth);
  const apply = (nz, cx, cy)=>{
    nz = Math.min(5, Math.max(1, nz));
    const oldW = c.offsetWidth || fitW(), r = area.getBoundingClientRect();
    const px = (area.scrollLeft + (cx==null ? area.clientWidth/2 : cx - r.left)) / oldW;
    const py = (area.scrollTop + (cy==null ? area.clientHeight/2 : cy - r.top)) / (c.offsetHeight || 1);
    z = nz; c.style.width = Math.round(fitW()*z)+'px';
    area.scrollLeft = px*c.offsetWidth - (cx==null ? area.clientWidth/2 : cx - r.left);
    area.scrollTop  = py*c.offsetHeight - (cy==null ? area.clientHeight/2 : cy - r.top);
  };
  bar.appendChild(mk('Close', ()=>ov.remove()));
  const sp = document.createElement('div'); sp.style.flex='1'; bar.appendChild(sp);
  bar.appendChild(mk('\u2212', ()=>apply(z/1.5)));
  bar.appendChild(mk('Fit', ()=>apply(1)));
  bar.appendChild(mk('+', ()=>apply(z*1.5)));
  // two-finger pinch
  let pinch = null;
  const dist = t=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  area.addEventListener('touchstart', e=>{ if(e.touches.length===2) pinch = { d:dist(e.touches), z }; }, {passive:true});
  area.addEventListener('touchmove', e=>{ if(pinch && e.touches.length===2){ e.preventDefault();
    apply(pinch.z*dist(e.touches)/pinch.d, (e.touches[0].clientX+e.touches[1].clientX)/2, (e.touches[0].clientY+e.touches[1].clientY)/2); } }, {passive:false});
  area.addEventListener('touchend', e=>{ if(e.touches.length<2) pinch=null; }, {passive:true});
  area.addEventListener('dblclick', ()=>apply(z>1.2?1:2.5));
  ov.appendChild(bar); ov.appendChild(area); document.body.appendChild(ov);
  c.style.width = fitW()+'px';
}
/* ---------------- LIVE PEDIGREE PREVIEW ----------------
   Shown whenever "Download Official Pedigree PDF" is tapped for an
   account on the dynamic renderer (generic template, or any custom
   background). Every control edits a local draft and regenerates the
   actual PDF into the embedded preview — nothing is saved until
   "Save & download" is pressed. */
function openPedigreeLivePreviewSheet(r, myProfileForPdf, hasCustomBackground){
  const draft = JSON.parse(JSON.stringify(pedigreeSettings));
  let useBackgroundDraft = hasCustomBackground;
  const fieldRows = [['dob','Date of birth'],['reg','Registration #'],['gc','GC #'],['ear','Ear #'],['color','Color'],['weight','Weight']];
  let regenTimer = null, regenSeq = 0;

  function themeButtonsHTML(){
    const t = draft.printTheme==='sex' ? 'mono' : draft.printTheme;
    return `<button type="button" data-v="mono" class="${t==='mono'?'on':''}">Black &amp; white</button>
      <button type="button" data-v="custom" class="${t==='custom'?'on':''}">Custom</button>`;
  }

  function renderSheet(){
    openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button>
      <h2>${esc(r.name)} — Pedigree preview</h2>
      <div style="border:1px solid var(--line-strong); border-radius:10px; overflow:hidden; margin-bottom:6px; background:#6b6e70;">
        <canvas id="ped-preview-canvas" style="width:100%; height:320px; display:block; background:#fff;"></canvas>
      </div>
      <div id="ped-preview-status" class="card-sub" style="margin-bottom:4px; min-height:16px;">Loading preview&hellip;</div>
      <div class="card-sub" style="margin-bottom:12px;">Tap the preview to zoom in and out.</div>
      <div class="card-sub" style="margin:-6px 0 12px;">Pedigree customization settings are under More &rarr; Pedigree settings.</div>
      ${hasCustomBackground?`<div class="field"><label>Background</label>
        <div class="seg" id="pp-bg-choice">
          <button type="button" data-v="custom" class="${useBackgroundDraft?'on':''}">Use custom background</button>
          <button type="button" data-v="plain" class="${useBackgroundDraft?'':'on'}">Plain white</button>
        </div>
      </div>`:''}
      <div class="field"><label>Print colors</label><div class="seg" id="pp-theme">${themeButtonsHTML()}</div></div>
      <div class="field" id="pp-customwrap" style="${draft.printTheme==='custom'?'':'display:none;'}"><label>Custom accent color</label><input type="color" id="pp-customcolor" value="${esc(draft.customAccent||'#c6a15b')}" style="height:44px; padding:4px;"></div>
      <div class="field"><label>Fields to print</label>
        <div style="display:flex; flex-direction:column; gap:2px;">
          ${fieldRows.map(([k,l])=>`<label style="display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px;"><input type="checkbox" id="pp-field-${k}" ${draft.fields[k]!==false?'checked':''} style="width:18px; height:18px;"> ${l}</label>`).join('')}
        </div>
      </div>
      <label style="display:flex; align-items:center; gap:8px; padding:10px 0; font-size:13px;"><input type="checkbox" id="pp-cert" ${draft.hasCertification!==false?'checked':''} style="width:18px; height:18px;"> Include certification statement and signature line</label>
      <label style="display:flex; align-items:center; gap:8px; padding:10px 0 4px; font-size:13px;"><input type="checkbox" id="pp-watermark" ${draft.watermarkEnabled?'checked':''} style="width:18px; height:18px;"> Show diagonal watermark</label>
      <div class="field" id="pp-watermarkwrap" style="${draft.watermarkEnabled?'':'display:none;'}">
        <label>Watermark text</label><input id="pp-watermarktext" value="${esc(draft.watermarkText||'')}" placeholder="Defaults to your rabbitry name">
      </div>
      ${(hasCustomBackground && useBackgroundDraft)?`<div class="field"><label>Footer layout</label>
        <div class="seg" id="pp-footerstyle">
          <button type="button" data-v="plain" class="${(draft.footerStyle||'plain')==='plain'?'on':''}">Centered, no box</button>
          <button type="button" data-v="boxed" class="${draft.footerStyle==='boxed'?'on':''}">Boxed, bottom corner</button>
        </div>
      </div>`:''}
      <div class="sheet-actions"><button class="btn btn-secondary" onclick="closeSheet()">Cancel</button><button class="btn btn-secondary" id="pp-download">Save &amp; download</button><button class="btn btn-primary" id="pp-share">Save &amp; share</button></div>`);
    wireEvents();
    scheduleRegen(true);
  }

  function readDraftFromControls(){
    draft.printTheme = document.querySelector('#pp-theme button.on').dataset.v;
    draft.customAccent = document.getElementById('pp-customcolor').value;
    draft.hasCertification = document.getElementById('pp-cert').checked;
    draft.watermarkEnabled = document.getElementById('pp-watermark').checked;
    draft.watermarkText = document.getElementById('pp-watermarktext').value.trim();
    const footerStyleBtn = document.querySelector('#pp-footerstyle button.on');
    if(footerStyleBtn) draft.footerStyle = footerStyleBtn.dataset.v;
    draft.fields = {
      dob: document.getElementById('pp-field-dob').checked,
      reg: document.getElementById('pp-field-reg').checked,
      gc: document.getElementById('pp-field-gc').checked,
      ear: document.getElementById('pp-field-ear').checked,
      color: document.getElementById('pp-field-color').checked,
      weight: document.getElementById('pp-field-weight').checked
    };
  }

  function scheduleRegen(immediate){
    clearTimeout(regenTimer);
    regenTimer = setTimeout(runRegen, immediate?0:450);
  }
  async function runRegen(){
    const mySeq = ++regenSeq;
    const statusEl = document.getElementById('ped-preview-status');
    if(statusEl) statusEl.textContent = 'Updating preview\u2026';
    try{
      const overrides = { settings: draft };
      if(hasCustomBackground) overrides.useBackground = useBackgroundDraft;
      const bytes = await buildDynamicGenericPedigreePdfBytes(r, myProfileForPdf, overrides);
      if(mySeq!==regenSeq) return;
      await renderPedigreePreviewCanvas(bytes);
      if(mySeq!==regenSeq) return;
      const stillStatusEl = document.getElementById('ped-preview-status');
      if(stillStatusEl) stillStatusEl.textContent = '';
    }catch(err){
      console.error(err);
      const stillStatusEl = document.getElementById('ped-preview-status');
      if(stillStatusEl) stillStatusEl.textContent = "Preview error: " + (err && err.message ? err.message : err);
    }
  }

  function wireEvents(){
    const bgSeg = document.getElementById('pp-bg-choice');
    if(bgSeg) bgSeg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      useBackgroundDraft = b.dataset.v==='custom';
      renderSheet();
    });

    document.querySelectorAll('#pp-theme button').forEach(b=>b.onclick=()=>{
      document.querySelectorAll('#pp-theme button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
      document.getElementById('pp-customwrap').style.display = b.dataset.v==='custom' ? '' : 'none';
      readDraftFromControls(); scheduleRegen(true);
    });
    document.getElementById('pp-customcolor').oninput = ()=>{ readDraftFromControls(); scheduleRegen(false); };
    document.getElementById('pp-cert').onchange = ()=>{ readDraftFromControls(); scheduleRegen(true); };
    document.getElementById('pp-watermark').onchange = (e)=>{
      document.getElementById('pp-watermarkwrap').style.display = e.target.checked ? '' : 'none';
      readDraftFromControls(); scheduleRegen(true);
    };
    document.getElementById('pp-watermarktext').oninput = ()=>{ readDraftFromControls(); scheduleRegen(false); };
    const ppFooterStyleSeg = document.getElementById('pp-footerstyle');
    if(ppFooterStyleSeg) ppFooterStyleSeg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      ppFooterStyleSeg.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
      readDraftFromControls(); scheduleRegen(true);
    });
    fieldRows.forEach(([k])=>{
      document.getElementById('pp-field-'+k).onchange = ()=>{ readDraftFromControls(); scheduleRegen(true); };
    });

    const ppRun = async (share)=>{
      readDraftFromControls();
      Object.assign(pedigreeSettings, draft);
      await savePedigreeSettings();
      try{
        const overrides = { settings: pedigreeSettings };
        if(hasCustomBackground) overrides.useBackground = useBackgroundDraft;
        const bytes = await buildDynamicGenericPedigreePdfBytes(r, myProfileForPdf, overrides);
        const blob = new Blob([bytes], { type:'application/pdf' });
        const fname = `${(r.name||'pedigree').replace(/\s+/g,'-')}-pedigree.pdf`;
        if(share){
          closeSheet();
          await sharePdfBlob(blob, fname, r.name+' — Pedigree');
          return;
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = fname;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        closeSheet();
        showToast('Pedigree settings saved and PDF downloaded');
      }catch(err){
        console.error(err);
        alert('Pedigree PDF error:\n\n' + (err && err.message ? err.message : err));
        showToast('Could not generate the PDF.');
      }
    };
    document.getElementById('pp-download').onclick = ()=>ppRun(false);
    document.getElementById('pp-share').onclick = ()=>ppRun(true);
  }

  renderSheet();
}

/* ---------------- ADMIN: worst-case background preview ----------------
   Builds a fully-packed synthetic 4-generation pedigree — max wins, long
   names, every field filled — so an admin can confirm a background PDF
   holds up before it ever reaches a real customer. Temporarily adds the
   synthetic rabbits to the in-memory roster so the normal ancestor
   lookups work, then removes them again once the PDF is built. */
function worstCasePreviewRabbits(){
  const longNames = ["Bramblewood's Midnight Constellation","Hollowcreek's Autumn Symphony","Fernwood's Copper Thunderbolt","Ironwood's Velvet Duchess","Prairiewind's Golden Sentinel","Marshgate's Obsidian Comet","Willowmere's Cinnamon Empress","Stonefield's Rustic Nobleman","Cloverdale's Amber Wanderer","Birchwood's Sable Aristocrat","Meadowlight's Chestnut Voyager","Ravenscroft's Ivory Sovereign","Thornfield's Umber Cavalier","Wildflower's Mahogany Countess","Foxglove's Slate Adventurer"];
  const colors = ['Broken Black Tortoiseshell','Chestnut Agouti Frosted','Solid Blue Eyed White','Broken Chocolate Tort'];
  let ni = 0;

  const nextName = ()=> longNames[ni++ % longNames.length]+' '+uid();
  const makeWins = (n)=> Array.from({length:n}, (_,i)=>({ id:uid(), award:['Best in Show','Best of Breed','Best Opposite Sex','Grand Champion Leg','1st Broken Group','Reserve Best in Show'][i%6], date: addDays(todayStr(), -30*(i+1)), show:['ARBA National Convention','Great Lakes Regional','State Fairgrounds Show','Midwest Classic'][i%4] }));
  function makeRabbit(nameOverride, sex, tier){
    const name = nameOverride || nextName();
    return blankRabbit({
      id:'zzpreview_'+uid(), name, sex, breed:'Holland Lop', dob: addDays(todayStr(), -900),
      earNumber:'ZZ-PREVIEW-'+uid().toUpperCase(), weight:'3.85', color: colors[ni%colors.length],
      registrationNumber:'ARBA-PREVIEW-99182', gcNumber:'GC-PREVIEW-14', legsWins:'4 legs',
      wins: tier==='self'?makeWins(5): tier==='parent'?makeWins(2): tier==='grand'?makeWins(1):[]
    });
  }
  const self = makeRabbit(null,'doe','self');
  const sire = makeRabbit(null,'buck','parent'); const dam = makeRabbit(null,'doe','parent');
  self.sireName = sire.name; self.damName = dam.name;
  const grandNames = [];
  [sire,dam].forEach(parent=>{
    const gs = makeRabbit(null,'buck','grand'), gd = makeRabbit(null,'doe','grand');
    parent.sireName = gs.name; parent.damName = gd.name;
    grandNames.push(gs, gd);
  });
  const greatNames = [];
  grandNames.forEach(gp=>{
    const ggs = makeRabbit(null,'buck','great'), ggd = makeRabbit(null,'doe','great');
    gp.sireName = ggs.name; gp.damName = ggd.name;
    greatNames.push(ggs, ggd);
  });
  return [self, sire, dam, ...grandNames, ...greatNames];
}
async function previewWorstCaseBackgroundPDF(filename){
  if(!filename){ showToast('Enter a filename first'); return; }
  const synthetic = worstCasePreviewRabbits();
  rabbits.push(...synthetic);
  try{
    const fakeProfile = { rabbitry_name:'Worst-Case Preview Rabbitry', first_name:'Preview', last_name:'Admin', website:'www.example.com', phone:'(555) 555-5555', pedigree_template:filename, pedigree_background:true };
    const pdfBytes = await buildDynamicGenericPedigreePdfBytes(synthetic[0], fakeProfile, { useBackground:true, theme:'mono' });
    const blob = new Blob([pdfBytes], { type:'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `worst-case-preview-${filename}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(err){
    console.error(err);
    showToast('Could not generate the preview — check console for details.');
  }finally{
    const ids = new Set(synthetic.map(x=>x.id));
    rabbits = rabbits.filter(x=>!ids.has(x.id));
  }
}


// Opens the phone's own share menu with the PDF attached (Messages, Email, etc.), so nothing has to be saved first.
// Where the browser can't share files (many computers), it downloads the PDF instead. Nothing is uploaded anywhere.
async function sharePdfBlob(blob, fileName, title){
  try{
    const file = new File([blob], fileName, { type:'application/pdf' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title: title||fileName });
      return true;
    }
  }catch(e){
    if(e && e.name==='AbortError') return true;   // they closed the share menu: nothing went wrong
    if(e && e.name==='NotAllowedError'){
      // Some phones only allow the share menu straight after a tap, and making the PDF took a moment. Ask for one more tap.
      const file2 = new File([blob], fileName, { type:'application/pdf' });
      openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button><h2>Ready to share</h2>
        <div class="card-sub" style="margin-bottom:12px;">Your pedigree PDF is ready. Tap Share to choose where to send it.</div>
        <div class="sheet-actions"><button class="btn btn-secondary" onclick="closeSheet()">Cancel</button><button class="btn btn-primary" id="shareNowBtn">Share</button></div>`);
      document.getElementById('shareNowBtn').onclick=async()=>{
        try{ await navigator.share({ files:[file2], title: title||fileName }); closeSheet(); }
        catch(e2){ if(e2 && e2.name==='AbortError'){ closeSheet(); return; } console.error(e2); closeSheet(); showToast('Could not open sharing on this device.'); }
      };
      return true;
    }
    console.error(e);
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=fileName; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(e){} }, 4000);
  showToast("Sharing isn't available here, so the PDF was saved instead.");
  return false;
}
async function shareOfficialPedigreePDF(r){
  try{
    const prof = await getMyPedigreeProfile();
    const templateName = prof.pedigree_template || 'generic';
    const hasCustomBackground = !!(prof.pedigree_background && templateName!=='generic');
    const staticTemplateName = prof.pedigree_static_template || (!prof.pedigree_background && templateName!=='generic' ? templateName : null);
    if(staticTemplateName){ openPedigreeStyleChooserSheet(r, prof, staticTemplateName, hasCustomBackground, { share:true }); return; }
    showToast('Getting the PDF ready…');
    const overrides = { settings: pedigreeSettings };
    if(hasCustomBackground) overrides.useBackground = true;
    const bytes = await buildDynamicGenericPedigreePdfBytes(r, prof, overrides);
    await sharePdfBlob(new Blob([bytes], { type:'application/pdf' }), `${(r.name||'pedigree').replace(/\s+/g,'-')}-pedigree.pdf`, r.name+' — Pedigree');
  }catch(err){
    console.error(err);
    showToast('Could not make the PDF to share.');
  }
}
async function downloadOfficialPedigreePDF(r, opts){
  try{
    const myProfileForPdf = await getMyPedigreeProfile();
    const templateName = myProfileForPdf.pedigree_template || 'generic';
    const hasCustomBackground = !!(myProfileForPdf.pedigree_background && templateName!=='generic');
    // A dedicated "preset template" (a fillable-form PDF with its boxes
    // already drawn, like the classic CJM Legacy layout) is independent
    // from the background-overlay template above — an account can have
    // either, both, or neither. Falling back to the old single-field
    // setup (template set + background off) keeps existing accounts
    // working exactly as before if they never set the new field.
    const staticTemplateName = myProfileForPdf.pedigree_static_template
      || (!myProfileForPdf.pedigree_background && templateName!=='generic' ? templateName : null);
    if(staticTemplateName){
      openPedigreeStyleChooserSheet(r, myProfileForPdf, staticTemplateName, hasCustomBackground, opts);
      return;
    }
    openPedigreeLivePreviewSheet(r, myProfileForPdf, hasCustomBackground);
  }catch(err){
    console.error(err);
    alert('Could not open pedigree options:\n\n' + (err && err.message ? err.message : err));
  }
}
function openPedigreeStyleChooserSheet(r, myProfileForPdf, staticTemplateName, hasCustomBackground, opts){
  openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button>
    <h2>${esc(r.name)} — Pedigree style</h2>
    <div class="card-sub" style="margin-bottom:14px;">This account has more than one pedigree layout set up. Choose which one to use.</div>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <button type="button" class="btn btn-secondary" style="width:100%; text-align:left; padding:14px; height:auto;" id="pp-choice-static">
        <div style="font-weight:600;">Preset template</div>
        <div class="card-sub" style="margin-top:2px;">Your uploaded fillable form (${esc(staticTemplateName)}) — fixed boxes, fields fill in</div>
      </button>
      <button type="button" class="btn btn-secondary" style="width:100%; text-align:left; padding:14px; height:auto;" id="pp-choice-dynamic">
        <div style="font-weight:600;">${hasCustomBackground ? 'Standard or custom background' : 'Standard (black &amp; white)'}</div>
        <div class="card-sub" style="margin-top:2px;">Live preview &mdash; customizable fonts, colors${hasCustomBackground ? ', and your custom background' : ''}</div>
      </button>

async function buildBirthCertPdfBytes(d, prof){

    const e=await Promise.all(bytes.map(b=>pdfDoc.embedFont(b,{features:{liga:false,clig:false,calt:false}})));
    const [serifBold, serifItalic, sans, sansBold, mono, monoBold, playfair, cinzel, script, libre, dmserif, montserrat, jost, allura, alexbrush, blackletter, handwritten]=e;
    F={ serifBold, serifItalic, sans, sansBold, mono, title:{cormorant:serifBold, cinzel, playfair, libre, dmserif, montserrat, jost, script, allura, alexbrush, blackletter, handwritten}, adj:{script:1.3,allura:1.35,alexbrush:1.35,dmserif:0.95,blackletter:1.15,handwritten:1.2} };
  }catch(err){
    console.warn('Certificate fonts not available, using built-in fonts', err);
    const tb=await pdfDoc.embedFont(StandardFonts.TimesRomanBold), ti=await pdfDoc.embedFont(StandardFonts.TimesRomanItalic), h=await pdfDoc.embedFont(StandardFonts.Helvetica), hb=await pdfDoc.embedFont(StandardFonts.HelveticaBold), c=await pdfDoc.embedFont(StandardFonts.Courier);
    F={ serifBold:tb, serifItalic:ti, sans:h, sansBold:hb, mono:c, title:{}, adj:{} };
  }
  const tf=key=>F.title[key]||F.serifBold, ts=(key,base)=>base*(F.adj[key]||1);
  const T=v=>sanitizeForPdf(String(v==null?'':v));
  // colors: the account's own app colors (main for the title and frame, accent for the fine lines), or plain black and white
  let mainHex='#141414', accHex='#6b6b6b';

  const centered=(t,cx,top,f,s,c)=>{ if(t) text(t,cx-wid(t,f,s)/2,top,f,s,c); };
  const fit=(t,f,s,maxW)=>{ let z=s; while(z>8 && wid(t,f,z)>maxW) z-=1; return z; };
  const longDate=iso=>{ if(!iso) return ''; const x=new Date(iso+'T00:00:00'); return isNaN(x)?'':x.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); };

  const title=scriptTitle?'Birth Certificate':'BIRTH CERTIFICATE', tfnt=tf(S.titleFont), tsz=fit(title,tfnt,ts(S.titleFont,scriptTitle?31:40),W-300), tw=wid(title,tfnt,tsz);
  centered(title,W/2,top,tfnt,tsz,main);

  page.drawLine({start:{x:W/2+tw/2+14,y:H-top+tsz*0.3},end:{x:W-34,y:H-top+tsz*0.3},thickness:1.2,color:accent});

async function generateStaticTemplatePedigreePDF(r, myProfileForPdf, templateNameArg, opts){
  try{
    const templateName = templateNameArg || myProfileForPdf.pedigree_static_template || myProfileForPdf.pedigree_template || 'generic';
    const { PDFDocument, StandardFonts } = PDFLib;
    const storageUrl = `${SUPABASE_URL}/storage/v1/object/public/pedigree-templates/${templateName}.pdf`;
    let existingBytes;
    try{
      const res = await fetch(storageUrl);
      if(!res.ok) throw new Error('not found in storage');
      existingBytes = await res.arrayBuffer();
    }catch(storageErr){
      // Fall back to the file bundled with the app so an export never
      // fails outright just because a template name isn't set up yet.
      existingBytes = await fetch('pedigree-template.pdf').then(res=>{
        if(!res.ok) throw new Error('Template PDF not found: '+res.status);
        return res.arrayBuffer();
      });
    }
    const pdfDoc = await PDFDocument.load(existingBytes);
    const form = pdfDoc.getForm();
    const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
    const values = buildOfficialPedigreeValues(r);
    const fieldMap = fieldMapForTemplate(templateName);
    if(templateName==='generic'){
      // This template combines rabbitry/pedigree, breed/DOB/sex, and
      // breeder contact info into three single boxes (rather than one
      // field per line like older templates), so they're built and
      // filled directly here instead of going through the normal
      // per-role field map.
      const rabbitryName = sanitizeForPdf(myProfileForPdf.rabbitry_name || '');
      try{ form.getTextField('RABBITRY_PEDIGREE_LINE').setText(rabbitryName ? `${rabbitryName}  Pedigree` : 'Pedigree'); }catch(e){}
      try{
        const breedVal = sanitizeForPdf(r.breed||'');
        const dobVal = r.dob ? fmtDate(r.dob) : '';
        const sexVal = r.sex ? (r.sex==='doe'?'Doe':'Buck') : '';
        form.getTextField('BREED_DOB_SEX_LINE').setText([breedVal,dobVal,sexVal].filter(Boolean).join('   \u2022   '));
      }catch(e){}
      try{
        const breederName = [myProfileForPdf.first_name, myProfileForPdf.last_name].filter(Boolean).join(' ');
        const infoLines = [breederName, myProfileForPdf.location, myProfileForPdf.website, myProfileForPdf.phone]
          .map(v=>sanitizeForPdf(v||'')).filter(Boolean);
        form.getTextField('BREEDER_INFO_BLOCK').setText(infoLines.join('\n'));
      }catch(e){}
    } else {
      // Older/custom templates that use one field per contact line.
      const fullFieldMap = { ...fieldMap, ...CONTACT_FIELD_IDS };
      const breederName = [myProfileForPdf.first_name, myProfileForPdf.last_name].filter(Boolean).join(' ');
      values.RABBITRY_NAME = sanitizeForPdf(myProfileForPdf.rabbitry_name || '');
      values.BREEDER_NAME = sanitizeForPdf(breederName);
      values.CONTACT_PHONE = sanitizeForPdf(myProfileForPdf.phone || '');
      values.CONTACT_WEBSITE = sanitizeForPdf(myProfileForPdf.website || '');
      Object.assign(fieldMap, fullFieldMap);
    }

    const MAX_SIZE = 11, MIN_SIZE = 6, H_PADDING = 8; // points
    Object.entries(values).forEach(([role, value])=>{
      const fieldId = fieldMap[role];
      if(!fieldId) return;
      try{
        const field = form.getTextField(fieldId);
        // Shrink-to-fit: measure the field's real width and reduce
        // font size only as much as needed so long values (long
        // rabbit names, colors, etc.) never get clipped at the box
        // edge. Falls back gracefully if widget geometry is missing.
        let fontSize = MAX_SIZE;
        try{
          const widget = field.acroField.getWidgets()[0];
          const rect = widget.getRectangle();
          const availableWidth = Math.max(rect.width - H_PADDING, 1);
          while (fontSize > MIN_SIZE && font.widthOfTextAtSize(value, fontSize) > availableWidth) {
            fontSize -= 0.5;
          }
        }catch(geomErr){ /* keep default MAX_SIZE if geometry read fails */ }
        field.setFontSize(fontSize);
        field.setText(value);
      }
      catch(err){ console.warn('Pedigree field could not be set:', role, err); }
    });
    const pdfBytes = await pdfDoc.save();
    const blob = new Blob([pdfBytes], { type:'application/pdf' });
    const fileName = `${(r.name||'pedigree').replace(/\s+/g,'-')}-pedigree.pdf`;
    if(opts && opts.preview){ openPdfPreviewSheet(blob, fileName, r.name+' — Pedigree preview'); return; }
    if(opts && opts.share){ await sharePdfBlob(blob, fileName, r.name+' — Pedigree'); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(err){
    console.error(err);
    alert('Could not generate the preset-template PDF:\n\n' + (err && err.message ? err.message : err));
  }
}

async function openStartOverSheet(){

  let info=null;
  try{ const {data}=await sb.rpc('reset_archive_info'); info=data||null; }catch(e){ info=null; }
  const n=(a)=>Array.isArray(a)?a.length:0;
  const counts=[[n(rabbits),'rabbits'],[n(planned),'planned breedings'],[n(projects),'projects'],[n(shows),'shows'],[n(expenses),'expenses'],[n(customReminders),'reminders'],[n(waitlist),'waitlist entries']].filter(x=>x[0]>0);
  const cs=counts.length?counts.map(x=>x[0]+' '+x[1]).join(', '):'nothing yet';
  openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button><h2>Start over</h2>
    <div class="card-sub" style="margin-bottom:10px;">This clears this account&rsquo;s herd data and sets it up like new: <b>${esc(cs)}</b>.<br><br>

    ${info?`<div class="lit-card" style="margin-bottom:12px;"><b>You can undo your last start over</b><div class="card-sub">Saved ${esc(shortD(String(info.archived_at).slice(0,10)))} &middot; ${esc(String(info.rabbits))} rabbits &middot; available until ${esc(shortD(String(info.expires_at).slice(0,10)))}</div>
      <button class="btn btn-secondary" style="width:100%;margin-top:8px;" id="so-restore">Restore my data</button></div>`:''}
    <button class="btn btn-secondary" style="width:100%;margin-bottom:12px;" id="so-backup">1. Download a backup file first</button>
    <div class="field"><label>2. Type CLEAR to confirm</label><input id="so-word" autocomplete="off" autocapitalize="characters" placeholder="CLEAR"></div>
    <div class="card-sub" id="so-status" style="min-height:16px;"></div>
    <div class="sheet-actions"><button class="btn btn-secondary" onclick="closeSheet()">Cancel</button><button class="btn btn-danger" id="so-go" disabled>Clear and start over</button></div>`);
  const st=document.getElementById('so-status'), go=document.getElementById('so-go'), w=document.getElementById('so-word');
  w.oninput=()=>{ go.disabled = w.value.trim().toUpperCase()!=='CLEAR'; };
  document.getElementById('so-backup').onclick=()=>{ try{ downloadFullBackup(); st.textContent='Backup downloaded.'; }catch(e){ st.textContent='Could not download a backup: '+((e&&e.message)||e); } };
  go.onclick=async ()=>{
    if(w.value.trim().toUpperCase()!=='CLEAR') return;
    go.disabled=true; st.textContent='Saving a safe copy and clearing…';
    try{
      await saveChain.catch(()=>{});
      const {data,error}=await sb.rpc('reset_my_barn_data'); if(error) throw error;
      if(!data||data.ok!==true) throw new Error('The account was not cleared.');
      st.textContent='Done. Reloading…'; setTimeout(()=>window.location.reload(),600);
    }catch(e){ console.error(e); go.disabled=false; st.textContent='Nothing was cleared: '+((e&&e.message)||e); }
  };
  const rb=document.getElementById('so-restore');
  if(rb) rb.onclick=async ()=>{
    rb.disabled=true; st.textContent='Restoring…';
    try{
      await saveChain.catch(()=>{});
      const {data,error}=await sb.rpc('restore_my_barn_data'); if(error) throw error;
      st.textContent='Restored. Reloading…'; setTimeout(()=>window.location.reload(),600);
    }catch(e){ console.error(e); rb.disabled=false; st.textContent=((e&&e.message)||String(e)).replace(/^RESTORE_BLOCKED:\s*/,''); }
  };
}
// Runs one More-menu action (also used by the grouped sub-menus below).
function moreAction(k){
  if(k==='add') openAddSheet();
  else if(k==='kittags') openKitTagsSettings();
  else if(k==='waitlist') openWaitlistSheet();
  else if(k==='colors') openPaletteSheet();
  else if(k==='myreminders') openMyRemindersSheet();
  else if(k==='reminders') openRemindersSheet();
  else if(k==='pedigreesettings') openPedigreeSettingsSheet();
  else if(k==='merge') openMergeSheet();
  else if(k==='import') openImportCsvSheet();
  else if(k==='importpdf') openImportPedigreePdfSheet();
  else if(k==='shows') openShowsSheet();
  else if(k==='cleanup') openAncestorCleanupSheet();
  else if(k==='myinfo') openMyInfoSheet();
  else if(k==='startover') openStartOverSheet();
  else { currentTab=k; closeSheet(); render(); window.scrollTo(0,0); }
}
// A small second menu for a group of related items, with a Back button to More.
function openMoreGroup(title, items){
  openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button><h2>${esc(title)}</h2>
    ${items.map(([k,l])=>`<button class="btn btn-secondary" style="width:100%; margin-bottom:8px;" data-moreg="${k}">${l}</button>`).join('')}
    <div class="sheet-actions"><button class="btn btn-secondary" style="width:100%;" id="moreBack">&larr; Back to More</button></div>`);
  document.getElementById('moreBack').onclick=()=>openMoreSheet();
  document.querySelectorAll('[data-moreg]').forEach(b=>b.onclick=()=>moreAction(b.dataset.moreg));
}
async function openMoreSheet(){
  const groups={
    import:['Import',[['import','Import from CSV'],['importpdf','Import from Pedigree PDF']]],
    records:['Records',[['ancestors','Ancestors'],['cleanup','Move herd rabbits to Ancestors'],['archive','Archive'],['merge','Merge duplicates'],['trash','Recently deleted']]],
    settings:['Settings',[['reminders','Reminders'],['colors','Colors'],['pedigreesettings','Pedigree settings'],...(litterUiOn?[['kittags','Kit tags']]:[]),...(!localSandboxMode?[['myinfo','My info']]:[]),['backup','Backup and restore'],...((!localSandboxMode&&!viewingAsCustomer)?[['startover','Start over (clear this account)']]:[])]]
  };
  const items=[['add','Add rabbit'],['planned','Planned breedings'],['forsale','For sale'],['shows','Upcoming shows'],...(litterUiOn?[['waitlist','Waitlist']]:[])];
  const gitems=[['import','Import'],['records','Records'],['settings','Settings']];
  openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button><h2>More</h2>
    <div style="background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:12px;">
      <div class="section-label" style="margin:0 0 3px;">SIGNED IN AS</div>
      <div style="font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(currentUser?.email||'')}</div>
    </div>
    ${isAdminUser ? `<button class="btn btn-primary" style="width:100%; margin-bottom:8px;" id="openAdminBtn">Admin — all accounts</button>` : ''}
    ${items.map(([k,l])=>`<button class="btn btn-secondary" style="width:100%; margin-bottom:8px;" data-more="${k}">${l}</button>`).join('')}
    ${gitems.map(([k,l])=>`<button class="btn btn-secondary" style="width:100%; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;" data-moregroup="${k}"><span>${l}</span><span aria-hidden="true">&rsaquo;</span></button>`).join('')}
    <button class="btn btn-secondary" style="width:100%; margin-bottom:8px;" id="tourBtn">Take the tour</button>
    ${(!localSandboxMode && !viewingAsCustomer) ? `<button class="btn btn-secondary" style="width:100%; margin-bottom:8px;" id="practiceModeBtn">Try practice mode (local only)</button>` : ''}
    <button class="btn btn-danger" style="width:100%; margin-top:4px;" id="signOutBtn">Sign out</button>`);
  if(document.getElementById('openAdminBtn')) document.getElementById('openAdminBtn').onclick = openAdminSheet;
  if(document.getElementById('practiceModeBtn')) document.getElementById('practiceModeBtn').onclick = enterPracticeMode;
  if(document.getElementById('tourBtn')) document.getElementById('tourBtn').onclick = ()=>{ closeSheet(); startTour(true); };
  document.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>moreAction(b.dataset.more));
  document.querySelectorAll('[data-moregroup]').forEach(b=>b.onclick=()=>{ const g=groups[b.dataset.moregroup]; openMoreGroup(g[0], g[1]); });
  document.getElementById('signOutBtn').onclick = async ()=>{
    closeSheet();
    if(localSandboxMode){ window.location.reload(); return; }
    const {error}=await sb.auth.signOut();
    if(error) showToast(error.message);
  };
}

function openRabbitPickSheet(title, list, onPick, note){
  const sorted=list.slice().sort((a,b)=>a.name.localeCompare(b.name));
  openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button><h2>${esc(title)}</h2>
    ${note?`<div class="card-sub" style="margin-bottom:6px;">${esc(note)}</div>`:''}
    <div class="field"><input id="rp-q" placeholder="Search name or ear #" autocomplete="off"></div>
    <div id="rp-list"></div>`);
  const draw=()=>{
    const q=nameKey(document.getElementById('rp-q').value);
    const hits=sorted.filter(r=>!q||nameKey(r.name).includes(q)||(r.earNumber&&nameKey(r.earNumber)===q)||(r.alias&&nameKey(r.alias).includes(q)));
    document.getElementById('rp-list').innerHTML = hits.length ? hits.map(r=>`<button class="suggest-item" style="display:block;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;" data-rp="${r.id}"><b>${esc(r.name)}</b> <span style="opacity:.7;font-size:12.5px;">${subLine(r)}</span></button>`).join('') : '<div class="empty">No rabbits match.</div>';
    document.querySelectorAll('[data-rp]').forEach(b=>b.onclick=()=>{ const r=rabbits.find(x=>x.id===b.dataset.rp); if(r) onPick(r); });
  };
  document.getElementById('rp-q').addEventListener('input',draw); draw();
}
function renderForSale(main){
  const rabbitsForSale = rabbits.filter(r=>r.forSale && r.status!=='sold' && !isArchived(r) && r.status!=='external');
  const litterKitRows = [];
  rabbits.forEach(d=>{ if(d.sex==='doe'&&d.litterKits) d.litterKits.forEach((k,i)=>{ if(k.forSale && !k.individualId) litterKitRows.push({dam:d, kit:k, idx:i}); }); });
  const wlBtn = litterUiOn ? `<button class="btn btn-secondary" style="width:100%; margin-bottom:12px;" id="wlOpenBtn">Waitlist (${waitlist.filter(w=>!w.status||w.status==='waiting'||w.status==='contacted').length})</button>` : '';
  const bindWl=()=>{ const b=document.getElementById('wlOpenBtn'); if(b) b.onclick=openWaitlistSheet; };
  if(!rabbitsForSale.length && !litterKitRows.length){
    main.innerHTML = wlBtn+`<div class="empty">Nothing marked for sale right now.<br>Toggle "Mark for sale" from a rabbit's Edit screen, or "For sale" on a kit's Litters card.</div>`;
    bindWl();
    return;
  }
  let h=wlBtn;
  const total = rabbitsForSale.length + litterKitRows.length;
  h += `<div class="section-label">${total} TOTAL FOR SALE</div>`;
  if(rabbitsForSale.length){
    h += `<div class="section-label">RABBITS</div>`;
    h += rabbitsForSale.sort((a,b)=>a.name.localeCompare(b.name)).map(r=>{
      const detail = r.sale ? saleLine(r) : ((r.sireName||r.damName)?`Sire: ${esc(r.sireName||'?')} &middot; Dam: ${esc(r.damName||'?')}`:'');
      return `<div class="card" data-openprofile="${r.id}"><div class="card-top"><div><div class="card-name">${esc(r.name)}</div><div class="card-sub">${subLine(r)}</div></div>${statusBadge(r)}</div>
        ${detail?`<div class="card-detail">${detail}</div>`:''}
        <div class="card-actions">
          <button class="btn btn-secondary btn-sm" data-act="pedigree" data-id="${r.id}">Pedigree</button>
          <button class="btn btn-secondary btn-sm" data-act="edit" data-id="${r.id}">Edit</button>
        </div></div>`;
    }).join('');
  }
  if(litterKitRows.length){
    h += `<div class="section-label">KITS STILL IN A LITTER</div>`;
    h += litterKitRows.map(({dam,kit,idx})=>`<div class="card no-tap">
        <div class="card-top"><div><div class="card-name">${kit.sex==='buck'?'Buck':kit.sex==='doe'?'Doe':'Sex?'} kit &middot; ${esc(kit.color||'color?')}</div><div class="card-sub">From ${esc(dam.name)}'s litter, born ${fmtDate(dam.litterBornDate)}</div></div></div>
        <div class="card-actions">
          <button class="btn btn-primary btn-sm" data-keepkit="${dam.id}:${idx}">Create a profile</button>
          <button class="btn btn-secondary btn-sm" data-act="litterpedigree" data-id="${dam.id}">Litter pedigree</button>
        </div></div>`).join('');
  }
  main.innerHTML = h;
  bindWl();
  attachCardEvents();
}

/* ---------------- MONEY (financials) ---------------- */
const MONEY_PERIOD_LABELS = {thismonth:'This month', lastmonth:'Last month', thisyear:'This year', alltime:'All time'};
function moneyActivityForPeriod(period){
  const soldInPeriod = rabbits.filter(r=>r.status==='sold' && r.sale && r.sale.soldDate && inMoneyPeriod(r.sale.soldDate, period))
    .concat(soldKitPseudoRabbits().filter(r=>r.sale.soldDate && inMoneyPeriod(r.sale.soldDate, period)));
  const soldWithPrice = soldInPeriod.filter(r=>priceEntered(r.sale.price));
  const soldNoPrice = soldInPeriod.filter(r=>!priceEntered(r.sale.price));
  const expensesInPeriod = expenses.filter(e=>inMoneyPeriod(e.date, period));
  return {soldWithPrice, soldNoPrice, expensesInPeriod};
}
function renderMoney(main){
  const period = currentMoneyPeriod;
  const {soldWithPrice, soldNoPrice, expensesInPeriod} = moneyActivityForPeriod(period);

  const incomeTotal = soldWithPrice.reduce((sum,r)=>sum+parsePriceNum(r.sale.price),0);
  const expenseTotal = expensesInPeriod.reduce((sum,e)=>sum+(Number(e.amount)||0),0);
  const net = incomeTotal - expenseTotal;

  const catMap = {};
  expensesInPeriod.forEach(e=>{ const c=e.category||'Other'; catMap[c]=(catMap[c]||0)+(Number(e.amount)||0); });
  const catRows = Object.entries(catMap).sort((a,b)=>b[1]-a[1]);

  const activity = [
    ...soldWithPrice.map(r=>({type:'income', date:r.sale.soldDate, amount:parsePriceNum(r.sale.price), rabbitId:r.id, name:r.name, buyer:r.sale.buyer||''})),
    ...expensesInPeriod.map(e=>({type:'expense', date:e.date, amount:Number(e.amount)||0, id:e.id, category:e.category||'Other', note:e.note||''}))
  ].sort((a,b)=> (b.date||'').localeCompare(a.date||''));

  let h = `<div class="seg" id="moneyPeriodSeg">
    ${Object.entries(MONEY_PERIOD_LABELS).map(([k,l])=>`<button data-period="${k}" class="${period===k?'on':''}">${l}</button>`).join('')}
  </div>
  <div class="stats" style="grid-template-columns:repeat(3,1fr); padding:0; margin:12px 0;">
    <div class="stat" style="cursor:default;"><div class="n" style="color:var(--green);">${fmtMoney(incomeTotal)}</div><div class="l">INCOME</div></div>
    <div class="stat" style="cursor:default;"><div class="n" style="color:var(--rust-text);">${fmtMoney(expenseTotal)}</div><div class="l">EXPENSES</div></div>
    <div class="stat" style="cursor:default;"><div class="n" style="color:${net>=0?'var(--green)':'var(--rust-text)'};">${fmtMoney(net)}</div><div class="l">NET</div></div>
  </div>
  <div style="display:flex; gap:8px; margin-bottom:14px;">
    <button class="btn btn-primary" id="moneyAddExpenseBtn" style="flex:1;">+ Add expense</button>
    <button class="btn btn-secondary" id="moneyExportBtn" style="flex:1;">Export CSV</button>
  </div>`;

  if(soldNoPrice.length){
    h += `<div class="section-label">SOLD, BUT NO PRICE YET</div>`;
    h += soldNoPrice.map(r=>`<div class="card" data-openprofile="${r.id}">
      <div class="card-top"><div><div class="card-name">${esc(r.name)}</div><div class="card-sub">Sold ${fmtDate(r.sale.soldDate)}${r.sale.buyer?' &middot; Sold to '+esc(r.sale.buyer):''}</div></div></div>
      <div class="card-actions"><button class="btn btn-primary btn-sm" data-addprice="${r.id}">Add price</button></div>
    </div>`).join('');
  }

  if(catRows.length){
    h += `<div class="section-label">WHERE THE MONEY WENT</div><div class="card no-tap">`;
    h += catRows.map(([name,amt],i)=>{
      const pct = expenseTotal>0 ? Math.round((amt/expenseTotal)*100) : 0;
      return `<div style="${i<catRows.length-1?'margin-bottom:10px;':''}">
        <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px;"><span>${esc(name)}</span><span>${fmtMoney(amt)}</span></div>
        <div style="background:var(--line); border-radius:4px; height:5px; overflow:hidden;"><div style="background:var(--gold); height:100%; width:${pct}%;"></div></div>
      </div>`;
    }).join('');
    h += `</div>`;
  }

  h += `<div class="section-label">ACTIVITY</div>`;
  if(!activity.length){
    h += `<div class="empty">Nothing here for this period yet. Tap "+ Add expense" when you buy feed, wire, or supplies. Rabbit sales show up on their own once you mark a rabbit sold with a price.</div>`;
  } else {
    h += activity.map(a=>{
      if(a.type==='income'){
        return `<div class="card" data-openprofile="${a.rabbitId}" style="padding:12px 14px;">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
            <div><div class="card-name" style="font-size:14px;">${esc(a.name)}</div><div class="card-sub">${a.buyer?('Sold to '+esc(a.buyer)+' &middot; '):''}${fmtDate(a.date)}</div></div>
            <div style="color:var(--green); font-weight:600; white-space:nowrap;">+${fmtMoney(a.amount)}</div>
          </div></div>`;
      }
      return `<div class="card" data-editexpense="${a.id}" style="padding:12px 14px;">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
          <div><div class="card-name" style="font-size:14px;">${esc(a.category)}</div><div class="card-sub">${a.note?esc(a.note)+' &middot; ':''}${fmtDate(a.date)}</div></div>
          <div style="color:var(--rust-text); font-weight:600; white-space:nowrap;">${fmtMoney(-Math.abs(Number(a.amount)||0))}</div>
        </div></div>`;
    }).join('');
  }

  main.innerHTML = h;
  attachCardEvents();

  document.querySelectorAll('#moneyPeriodSeg [data-period]').forEach(btn=>{
    btn.onclick = ()=>{ currentMoneyPeriod = btn.dataset.period; render(); };
  });
  document.getElementById('moneyAddExpenseBtn').onclick = ()=>openAddExpenseSheet(null);
  document.getElementById('moneyExportBtn').onclick = ()=>{
    const rows = activity.map(a=> a.type==='income'
      ? { date:a.date, type:'Income', category:'Rabbit sale', description:a.name+(a.buyer?' — Sold to '+a.buyer:''), amount:a.amount.toFixed(2) }
      : { date:a.date, type:'Expense', category:a.category, description:a.note||'', amount:(-a.amount).toFixed(2) });
    downloadCSV('herdnerd-financials-'+period+'.csv', toCSV(rows, ['date','type','category','description','amount']));
  };
  document.querySelectorAll('[data-addprice]').forEach(btn=>{
    btn.onclick=(ev)=>{ ev.stopPropagation(); const id=btn.dataset.addprice; if(id.startsWith('kit:')){ openKitSaleSheet(id.slice(4)); return; } const r=rabbits.find(x=>x.id===id); if(r) openAddPriceSheet(r); };
  });
  document.querySelectorAll('[data-editexpense]').forEach(el=>{
    el.addEventListener('click',(ev)=>{
      if(ev.target.closest('button')) return;
      const ex=expenses.find(x=>x.id===el.dataset.editexpense); if(ex) openAddExpenseSheet(ex);
    });
  });
}
function openAddExpenseSheet(existing){
  const e = existing || {};
  openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button>
    <h2>${existing?'Edit expense':'Add expense'}</h2>
    <div class="row2">
      <div class="field"><label>Amount ($)</label><input type="number" id="f-exp-amt" value="${esc(e.amount||'')}" placeholder="0.00"></div>
      <div class="field"><label>Date</label><input type="date" id="f-exp-date" value="${esc(e.date||todayStr())}"></div>
    </div>
    <div class="field"><label>Category</label><select id="f-exp-cat">${EXPENSE_CATEGORIES.map(c=>`<option value="${esc(c)}" ${e.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
    <div class="field"><label>Note (optional)</label><textarea id="f-exp-note">${esc(e.note||'')}</textarea></div>
    <div class="sheet-actions">
      <button class="btn btn-secondary" onclick="closeSheet()">Cancel</button>
      <button class="btn btn-primary" id="f-exp-save">Save</button>
    </div>
    ${existing?'<button class="btn btn-danger" id="f-exp-delete" style="width:100%; margin-top:10px;">Delete</button>':''}`);
  document.getElementById('f-exp-save').onclick = async ()=>{
    const amt = parseFloat(document.getElementById('f-exp-amt').value);
    if(!amt || amt<=0){ showToast('Enter an amount greater than 0'); return; }
    const date = csvParseDate(document.getElementById('f-exp-date').value) || todayStr();
    const category = document.getElementById('f-exp-cat').value;
    const note = document.getElementById('f-exp-note').value.trim();
    if(existing){
      existing.amount=amt; existing.date=date; existing.category=category; existing.note=note;
    } else {
      expenses.push({ id:uid(), amount:amt, date, category, note });
    }
    await saveExpenses(); closeSheet(); render(); showToast(existing?'Expense updated':'Expense added');
  };
  const delBtn = document.getElementById('f-exp-delete');
  if(delBtn) delBtn.onclick = ()=>{
    armConfirm(delBtn, 'Tap again to confirm', async ()=>{
      expenses = expenses.filter(x=>x.id!==existing.id);
      await saveExpenses(); closeSheet(); render(); showToast('Expense deleted');
    });
  };
}
function openAddPriceSheet(r){
  openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button>
    <h2>Add sale price — ${esc(r.name)}</h2>
    <div class="card-sub" style="margin-bottom:12px;">Sold ${fmtDate(r.sale.soldDate)}${r.sale.buyer?' &middot; Sold to '+esc(r.sale.buyer):''}</div>
    <div class="field"><label>Sale price ($)</label><input type="number" id="f-price-add" value="${esc(r.sale.price||'')}" placeholder="150"><div class="card-sub" style="margin-top:4px;">Enter 0 for a gift or trade.</div></div>
    <div class="sheet-actions"><button class="btn btn-secondary" onclick="closeSheet()">Cancel</button><button class="btn btn-primary" id="f-price-save">Save</button></div>`);
  document.getElementById('f-price-save').onclick = async ()=>{
    const v = document.getElementById('f-price-add').value.trim();
    if(!priceEntered(v)){ showToast('Enter a price (0 is fine for a gift or trade)'); return; }
    r.sale.price = v;
    await saveData(); closeSheet(); render(); showToast(r.name+' price added');
  };
}

/* ---------------- SHOW WINS ---------------- */
function openWinsSheet(r, origin){
  r.wins = r.wins || [];
  const rows = r.wins.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button>
    <h2>${esc(r.name)} — Show wins</h2>
    <button class="btn btn-secondary" style="width:100%; margin-bottom:12px;" id="win-add-btn">+ Add win</button>
    ${rows.length ? rows.map(w=>`<div class="card" data-editwin="${w.id}">
        <div class="card-top"><div><div class="card-name">${esc(w.award||'Win')}</div><div class="card-sub">${fmtDate(w.date)}${w.show?' &middot; '+esc(w.show):''}</div></div></div>
      </div>`).join('') : '<div class="empty">No wins logged yet. Tap "+ Add win" after a show.</div>'}
    <div class="sheet-actions"><button class="btn btn-secondary" onclick="closeSheet()">Close</button></div>`);
  document.getElementById('win-add-btn').onclick = ()=>openAddWinSheet(r, null, ()=>openWinsSheet(r, origin));
  document.querySelectorAll('[data-editwin]').forEach(el=>{
    el.onclick = ()=>{ const w=r.wins.find(x=>x.id===el.dataset.editwin); if(w) openAddWinSheet(r, w, ()=>openWinsSheet(r, origin)); };
  });
}
function openAddWinSheet(r, existing, back){
  const w = existing || {};
  openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button>
    <h2>${existing?'Edit win':'Add win'}</h2>
    <div class="field"><label>Award</label><input id="f-win-award" value="${esc(w.award||'')}" placeholder="BOB, BOS, Grand Champion Leg…"></div>
    <div class="row2">
      <div class="field"><label>Date</label><input type="date" id="f-win-date" value="${esc(w.date||todayStr())}"></div>
      <div class="field"><label>Show</label><input id="f-win-show" value="${esc(w.show||'')}" list="wins-shows-datalist" placeholder="Show name"></div>
    </div>
    <datalist id="wins-shows-datalist">${shows.map(s=>`<option value="${esc(s.name)}">`).join('')}</datalist>
    <div class="sheet-actions">
      <button class="btn btn-secondary" onclick="closeSheet()">Cancel</button>
      <button class="btn btn-primary" id="f-win-save">Save</button>
    </div>
    ${existing?'<button class="btn btn-danger" id="f-win-delete" style="width:100%; margin-top:10px;">Delete</button>':''}`);
  document.getElementById('f-win-save').onclick = ()=>{
    const award = document.getElementById('f-win-award').value.trim();
    if(!award){ showToast('Enter an award'); return; }
    const date = csvParseDate(document.getElementById('f-win-date').value) || todayStr();
    const show = document.getElementById('f-win-show').value.trim();
    if(existing){ existing.award=award; existing.date=date; existing.show=show; }
    else { r.wins = r.wins||[]; r.wins.push({id:uid(), award, date, show}); }
    saveData(); closeSheet(); if(back) back();
  };
  const delBtn = document.getElementById('f-win-delete');
  if(delBtn) delBtn.onclick = ()=>{
    armConfirm(delBtn, 'Tap again to confirm', ()=>{
      r.wins = r.wins.filter(x=>x.id!==existing.id);
      saveData(); closeSheet(); if(back) back();
    });
  };
}

       <button type="button" data-v="custom" class="${narrowedTheme==='custom'?'on':''}">Custom</button>`;

    <div class="card-sub" style="margin-bottom:12px;">Controls what shows up on your printed pedigree — your logo, contact info, print colors, and which fields appear. Your name, rabbitry name, phone, and website come from <b>More &rarr; My info</b>.</div>
    ${isAdminUser?`<div class="card no-tap" style="margin-bottom:14px;">

      <div class="field"><label>Background template filename</label><input type="text" id="ps-mytemplate" placeholder="generic" value="${esc(myProfileForPdf.pedigree_template||'')}"></div>
      <label style="display:flex; align-items:center; gap:8px; padding:4px 0 10px; font-size:13px;"><input type="checkbox" id="ps-mytemplate-bg" ${myProfileForPdf.pedigree_background?'checked':''} style="width:18px; height:18px;"> This is a background PDF (draw pedigree on top)</label>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
        <button class="btn btn-secondary btn-sm" id="ps-mytemplate-upload">Upload background PDF&hellip;</button>

function csvEscape(v){
  if(v===null||v===undefined) return '';
  const s=String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function toCSV(rows, columns){
  const header=columns.join(',');
  const body=rows.map(row=>columns.map(c=>csvEscape(row[c])).join(',')).join('\n');
  return header+(rows.length?'\n'+body:'');
}
function parseCSV(text){
  const rows=[]; let row=[], field='', inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c==='\r'){ /* skip */ }
      else field+=c;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const header=rows[0];
  return rows.slice(1).filter(r=>r.some(v=>v!=='')).map(r=>{
    const obj={}; header.forEach((h,i)=>obj[h]=r[i]!==undefined?r[i]:''); return obj;
  });
}
function downloadCSV(filename, csvText){
  const blob=new Blob([csvText], {type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

const RABBIT_CSV_COLUMNS = ['id','name','sex','breed','color','earNumber','dob','weight','legsWins','registrationNumber','gcNumber',
  'sireName','damName','status','partner','bredDate','dueDate','litterBornDate','weanDate','sellDate','rebreedDate',
  'notes','flag','alias','forSale','graduatedDate','wins',
  'sale_buyer','sale_price','sale_deposit','sale_depositDate','sale_pickupDate','sale_soldDate'];
function encodeWinsForCsv(wins){
  return (wins||[]).map(w=>[w.award,w.date,w.show].map(v=>String(v||'').replace(/[|;]/g,' ')).join('|')).join(';');
}
function decodeWinsFromCsv(str){
  if(!str) return [];
  return str.split(';').filter(Boolean).map(chunk=>{
    const [award,date,show] = chunk.split('|');
    return { id:uid(), award:award||'', date:date||'', show:show||'' };
  });
}
function rabbitToCsvRow(r){
  const s=r.sale||{};
  return { id:r.id, name:r.name, sex:r.sex, breed:r.breed||'', color:r.color||'', earNumber:r.earNumber||'', dob:r.dob||'',
    weight:r.weight||'', legsWins:r.legsWins||'', registrationNumber:r.registrationNumber||'', gcNumber:r.gcNumber||'', sireName:r.sireName||'', damName:r.damName||'',
    status:r.status, partner:r.partner||'', bredDate:r.bredDate||'', dueDate:r.dueDate||'', litterBornDate:r.litterBornDate||'',
    weanDate:r.weanDate||'', sellDate:r.sellDate||'', rebreedDate:r.rebreedDate||'', notes:r.notes||'', flag:r.flag||'', alias:r.alias||'',
    forSale:r.forSale?'yes':'no', graduatedDate:r.graduatedDate||'', wins:encodeWinsForCsv(r.wins),
    sale_buyer:s.buyer||'', sale_price:s.price||'', sale_deposit:s.deposit||'', sale_depositDate:s.depositDate||'',
    sale_pickupDate:s.pickupDate||'', sale_soldDate:s.soldDate||'' };
}
function csvRowToRabbit(row, existing){
  const base = existing || blankRabbit({});
  const hasSale = row.sale_buyer||row.sale_price||row.sale_pickupDate||row.sale_soldDate;
  const incomingWins = decodeWinsFromCsv(row.wins);
  const existingWins = base.wins||[];
  const sig = w => [w.award,w.date,w.show].join('|');
  const existingSigs = new Set(existingWins.map(sig));
  const mergedWins = existingWins.concat(incomingWins.filter(w=>!existingSigs.has(sig(w))));
  return Object.assign(base, {
    id: row.id || base.id, name: row.name, sex: row.sex||'doe', breed: row.breed, color: row.color,
    earNumber: row.earNumber, dob: row.dob||null, weight: row.weight, legsWins: row.legsWins,
    registrationNumber: row.registrationNumber, gcNumber: row.gcNumber||'', sireName: row.sireName, damName: row.damName,
    status: row.status||'open', partner: row.partner||null, bredDate: row.bredDate||null, dueDate: row.dueDate||null,
    litterBornDate: row.litterBornDate||null, weanDate: row.weanDate||null, sellDate: row.sellDate||null,
    rebreedDate: row.rebreedDate||null, notes: row.notes||'', flag: row.flag||'', alias: row.alias||'',
    forSale: row.forSale==='yes', graduatedDate: row.graduatedDate||null, wins: mergedWins,
    sale: hasSale ? { buyer:row.sale_buyer||'', price:row.sale_price||'', deposit:row.sale_deposit||'', depositDate:row.sale_depositDate||'',
      pickupDate:row.sale_pickupDate||'', soldDate:row.sale_soldDate||'' } : base.sale
  });
}

function renderBackup(main){
  const lockedBk = !!viewingAsCustomer;
  main.innerHTML=`
    <div class="section-label">FULL BACKUP (ONE FILE)</div>
    <div class="card no-tap"><div class="card-detail">${lockedBk ? 'You are viewing a customer&rsquo;s account, so a backup can only be made by the account&rsquo;s owner.' : 'Saves everything in your account &mdash; rabbits, photos, notes, weights, litters, planned breedings, shows and expenses &mdash; as one file on your own device. Only you have it.'}</div>

      <div class="card-detail" style="margin-top:12px;">To bring things back, choose a backup file below. This <b>only adds what is missing</b> from your account. It never changes or removes anything you already have.</div>
