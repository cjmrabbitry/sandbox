<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HerdNerd Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Public+Sans:wght@400;500;600&family=Jost:wght@500;600&family=JetBrains+Mono:wght@500&family=Pinyon+Script&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="pdf-lib.min.js"></script>
<script src="pdf.min.js"></script>
<style>
  :root{
    --navy:#142440; --navy-deep:#0c1830;
    --gold:#c6a15b; --gold-light:#e5cd97; --gold-deep:#b08535;
    --cream:#f7f2e6; --ivory:#fffdf8;
    --marsh:#4e6146; --marsh-deep:#37452f;
    --rust:#a34632; --rust-light:#f3ded9;
    --page:#f7f2e6; --card:#fffdf8; --ink:#0c1830; --ink-soft:#142440;
    --line:#e7ddc6; --line-strong:#cabb95;
    --navbar:#142440; --navbar-dim:#9aa6bb;
  }
  [data-theme="dark"]{
    --page:#0e141f; --card:#18202e; --ink:#e8e4d8; --ink-soft:#c9c4b4;
    --line:#2a3446; --line-strong:#3c4759;
    --cream:#0e141f; --ivory:#18202e; --navy:#e8e4d8; --navy-deep:#f2efe6;
    --rust-light:#3a2320; --navbar:#080d16;
  }
  *{box-sizing:border-box;}
  button, .card, .stat, [data-openprofile]{ touch-action:manipulation; }
  body{
    margin:0; background:var(--page); color:var(--ink);
    font-family:'Public Sans',sans-serif; -webkit-tap-highlight-color:transparent;
    padding-bottom:92px;
  }
  header.top{ background:var(--navbar); color:#fffdf8; padding:16px 16px 14px; display:flex; justify-content:space-between; align-items:flex-start; }
  header.top .eyebrow{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.06em; color:var(--gold-light); margin-bottom:3px; }
  header.top h1{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:22px; margin:0; color:#fffdf8; }
  .wordmark{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:28px; margin:0; color:#fffdf8; }
  .wordmark .pro{ font-style:italic; color:var(--gold-light); margin-left:6px; }
  .auth-brand .wordmark{ font-size:32px; color:var(--navy); }
  .auth-brand .wordmark .pro{ color:var(--gold-deep); }
  .theme-btn{ background:none; border:1px solid rgba(255,255,255,.3); border-radius:8px; color:#fffdf8; padding:6px 9px; cursor:pointer; display:flex; align-items:center; }

  .toolbar{ padding:10px 14px 4px; }
  .searchwrap{ position:relative; margin-bottom:8px; }
  .searchwrap input{ width:100%; padding:12px 34px 12px 34px; border-radius:9px; border:1px solid var(--line-strong); font-size:16px; background:var(--card); color:var(--ink); font-family:'Public Sans',sans-serif; }
  .searchwrap svg{ position:absolute; left:10px; top:13px; width:16px; height:16px; stroke:var(--ink-soft); opacity:.6; }
  #searchClear{ position:absolute; right:6px; top:4px; width:32px; height:32px; border:none; background:var(--line); color:var(--ink); border-radius:50%; font-size:18px; line-height:1; cursor:pointer; }
  .quickbred{ width:100%; }

  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:6px 14px 0; }
  .stat{ background:var(--card); border-radius:10px; padding:11px 5px; min-height:56px; text-align:center; border:1px solid var(--line); cursor:pointer; }
  .stat.active{outline:2px solid var(--gold-deep);}
  .stat .n{font-family:'Cormorant Garamond',serif; font-size:21px; font-weight:600; color:var(--navy);}
  .stat .l{font-family:'Jost',sans-serif; font-size:9.5px; color:var(--ink-soft); line-height:1.2; margin-top:2px;}
  .stat.urgent .n{color:var(--rust);}

  main{padding:8px 14px 20px;}
  .empty{ text-align:center; padding:36px 20px; color:var(--ink-soft); opacity:.7; font-size:14px; }
  .section-label{ font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.05em; color:var(--ink-soft); opacity:.7; margin:16px 2px 7px; }

  .card{ background:var(--card); border-radius:12px; padding:14px 14px 12px; margin-bottom:10px; border:1px solid var(--line); cursor:pointer; }
  .card.urgent{border-left:4px solid var(--rust);}
  .card.no-tap{cursor:default;}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .card-name{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:19px; color:var(--navy); line-height:1.2;}
  .card-sub{font-size:12px; color:var(--ink-soft); opacity:.85; margin-top:2px;}
  .badge{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.03em; padding:3px 8px; border-radius:20px; white-space:nowrap; flex:0 0 auto; }
  .b-preg{background:var(--gold-light); color:#0c1830;}
  .b-nurse{background:#dfe8dc; color:#37452f;}
  .b-open{background:var(--line); color:var(--ink);}
  .b-rest{background:var(--line); color:var(--ink-soft);}
  .b-urgent{background:var(--rust); color:#fff;}
  .b-grow{background:#e3e9f3; color:#142440;}
  .b-reserved{background:var(--gold-deep); color:#fff;}
  .b-sold{background:#4e6146; color:#fff;}
  .b-gone{background:#8a8a8a; color:#fff;}

  .card-detail{ font-size:13.5px; color:var(--ink); margin-top:8px; line-height:1.5; }
  .card-detail b{color:var(--navy);}
  .flag{ margin-top:8px; font-size:12px; color:var(--rust); background:var(--rust-light); padding:6px 8px; border-radius:6px; }
  .card-actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .btn{ font-family:'Jost',sans-serif; font-weight:600; font-size:13.5px; padding:11px 16px; min-height:44px; border-radius:8px; border:none; cursor:pointer; }
  .btn-primary{background:var(--navy); color:var(--page);}
  [data-theme="dark"] .btn-primary{background:var(--gold-deep); color:#0c1830;}
  .btn-secondary{background:transparent; color:var(--ink); border:1px solid var(--line-strong);}
  .btn-danger{background:transparent; color:var(--rust); border:1px solid var(--rust);}
  .btn-sm{padding:9px 13px; min-height:38px; font-size:12.5px;}

  nav.bottom{ position:fixed; bottom:0; left:0; right:0; background:var(--navbar); display:grid; grid-template-columns:repeat(5,1fr); padding:7px 1px 9px; z-index:25; }
  nav.bottom button{ background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; padding:2px 0; }
  nav.bottom svg{ width:19px; height:19px; stroke:var(--navbar-dim); fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  nav.bottom svg text{ fill:var(--navbar-dim); }
  nav.bottom button.on svg text{ fill:var(--gold-light); }
  nav.bottom span{ font-family:'Jost',sans-serif; font-size:9.5px; color:var(--navbar-dim); }
  nav.bottom button.on svg{ stroke:var(--gold-light); }
  nav.bottom button.on span{ color:var(--gold-light); font-weight:600; }

  .sheet-backdrop{ position:fixed; inset:0; background:rgba(12,24,48,.55); z-index:45; display:none; align-items:flex-end; }
  .sheet-backdrop.on{display:flex;}
  .sheet{ background:var(--page); width:100%; border-radius:18px 18px 0 0; padding:18px 18px 26px; max-height:88vh; overflow-y:auto; -webkit-overflow-scrolling:touch; position:relative; }
  .sheet h2{ font-family:'Cormorant Garamond',serif; font-size:21px; color:var(--navy); margin:0 0 14px; padding-right:44px; }
  .field{margin-bottom:12px;}
  .field label{ display:block; font-family:'Jost',sans-serif; font-size:12px; font-weight:600; color:var(--ink); margin-bottom:5px; }
  .field input, .field select, .field textarea{ width:100%; padding:12px 12px; border-radius:8px; border:1px solid var(--line-strong); font-size:16px; background:var(--card); color:var(--ink); font-family:'Public Sans',sans-serif; }
  .field textarea{resize:vertical; min-height:50px;}
  .row2{display:flex; gap:10px;} .row2 .field{flex:1; min-width:0;}
  .row3{display:flex; gap:8px;} .row3 .field{flex:1; min-width:0;}
  .field input[type="date"]{ min-width:0; }
  .suggest-box{ display:none; border:1px solid var(--line-strong); border-top:none; border-radius:0 0 8px 8px; background:var(--card); max-height:180px; overflow-y:auto; margin-top:-12px; margin-bottom:12px; position:relative; z-index:5; }
  .suggest-item{ display:block; width:100%; text-align:left; padding:12px 12px; min-height:44px; background:none; border:none; border-top:1px solid var(--line); font-size:15px; color:var(--ink); cursor:pointer; font-family:'Public Sans',sans-serif; }
  .suggest-item:first-child{border-top:none;}
  .history-entry{ border-left:3px solid var(--line-strong); padding:6px 0 6px 10px; margin-bottom:10px; }
  .todo-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--card); border:1px solid var(--gold); border-left:5px solid var(--gold-deep); border-radius:10px; padding:13px 14px; margin-bottom:9px; box-shadow:0 1px 4px rgba(12,24,48,.08); }
  .todo-row .todo-text{ font-size:14.5px; color:var(--ink); flex:1; font-weight:500; line-height:1.4; }
  .history-entry.took{border-left-color:var(--marsh);}
  .history-entry.lost{border-left-color:var(--rust);}
  .history-entry.pending{border-left-color:var(--gold-deep);}

  /* Quick actions row */
  .quick-actions{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px; }
  .qa-btn{ display:flex; flex-direction:column; align-items:center; gap:6px; background:var(--card); border:1px solid var(--gold); border-radius:10px; padding:10px 4px 9px; font-family:'Jost',sans-serif; font-size:10.5px; font-weight:600; color:var(--ink); cursor:pointer; min-height:64px; text-align:center; }
  .qa-btn .qa-icon{ height:20px; display:flex; align-items:center; justify-content:center; }
  .qa-primary{ background:var(--navy); color:#fffdf8; border-color:var(--navy); }
  [data-theme="dark"] .qa-primary{ background:var(--gold-deep); color:#0c1830; }

  /* Show countdown banner */
  .show-banner{ display:flex; justify-content:space-between; align-items:center; background:var(--navy); color:#fffdf8; border-radius:12px; padding:14px 16px; margin-bottom:16px; cursor:pointer; }
  .show-banner-name{ font-family:'Cormorant Garamond',serif; font-size:17px; font-weight:600; }
  .show-banner-sub{ font-family:'Jost',sans-serif; font-size:12px; color:var(--gold-light); margin-top:2px; }
  .show-banner-days{ text-align:center; flex:0 0 auto; padding-left:12px; }
  .show-banner-days .n{ font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:600; color:var(--gold-light); line-height:1; }
  .show-banner-days .l{ font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--gold-light); margin-top:2px; }

  /* Needs Attention rows */
  .todo-row.overdue{ border-color:var(--rust); border-left-color:var(--rust); }
  .todo-row{ align-items:flex-start; }
  .todo-row.todo-complete{ opacity:.4; }
  .todo-row.todo-complete .todo-text{ text-decoration:line-through; }
  .todo-circle{ width:22px; height:22px; border-radius:50%; border:2px solid var(--gold-deep); flex:0 0 auto; cursor:pointer; margin-top:1px; margin-right:2px; background:transparent; }
  .todo-circle.overdue{ border-color:var(--rust); }
  .todo-clock{ background:none; border:none; padding:4px; cursor:pointer; color:var(--ink-soft); display:flex; align-items:center; }
  .todo-sub-text{ font-size:12px; opacity:.75; margin-top:2px; }
  .todo-chevron{ background:none; border:none; padding:4px; cursor:pointer; color:var(--ink-soft); flex:0 0 auto; }
  .todo-sub{ margin:6px 0 9px 4px; padding-left:10px; border-left:2px solid var(--line); }
  .attn-viewall{ display:block; text-align:center; font-family:'Jost',sans-serif; font-size:13px; font-weight:600; color:var(--gold-deep); background:none; border:none; width:100%; padding:8px; cursor:pointer; }

  /* Coming up list */
  .comingup-row{ display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .comingup-row:last-child{ border-bottom:none; }
  .comingup-date{ opacity:.75; font-size:12.5px; flex:0 0 auto; padding-left:10px; }

  /* Admin support-view banner */
  .admin-view-banner{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 10px; background:var(--rust); color:#fffdf8; padding:9px 16px; font-family:'Jost',sans-serif; font-size:12.5px; font-weight:600; line-height:1.3; }
  .admin-view-banner span{ flex:1 1 200px; min-width:0; }
  .admin-view-banner button{ background:#fffdf8; color:var(--rust); border:none; border-radius:7px; padding:5px 11px; font-size:12px; font-weight:700; cursor:pointer; flex:0 0 auto; }
  .seg{display:flex; gap:6px;}
  .seg button{ flex:1; padding:12px 9px; min-height:44px; border-radius:8px; border:1px solid var(--line-strong); background:var(--card); font-family:'Jost',sans-serif; font-size:13.5px; font-weight:600; color:var(--ink); cursor:pointer; }
  .seg button.on{background:var(--navy); color:var(--page); border-color:var(--navy);}
  [data-theme="dark"] .seg button.on{background:var(--gold-deep); color:#0c1830;}
  .sheet-actions{display:flex; gap:10px; margin-top:16px;}
  .sheet-actions .btn{flex:1;}
  .close-x{ position:absolute; top:6px; right:6px; width:40px; height:40px; display:flex; align-items:center; justify-content:center; background:none; border:none; font-size:22px; color:var(--ink); opacity:.5; cursor:pointer; line-height:1; }
  .toast{ position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--navy); color:var(--page); padding:10px 18px; border-radius:20px; font-size:13px; z-index:50; opacity:0; transition:opacity .25s; pointer-events:none; max-width:88%; text-align:center; font-family:'Jost',sans-serif; }
  .save-error-banner{ display:none; position:fixed; top:0; left:0; right:0; z-index:70; background:var(--rust); color:#fff; padding:12px 16px; font-family:'Public Sans',sans-serif; font-size:13.5px; line-height:1.4; box-shadow:0 2px 10px rgba(0,0,0,.25); }
  .save-error-banner.on{ display:flex; align-items:flex-start; gap:10px; }
  .save-error-banner .seb-text{ flex:1; }
  .save-error-banner .seb-text b{ display:block; margin-bottom:2px; }
  .save-error-banner button{ flex:0 0 auto; background:rgba(255,255,255,.18); border:none; color:#fff; border-radius:6px; padding:6px 10px; font-family:'Jost',sans-serif; font-weight:600; font-size:12px; cursor:pointer; }
  [data-theme="dark"] .toast{background:var(--gold-deep); color:#0c1830;}
  .toast.on{opacity:1;}

  .relate-box{ background:#fbf7ec; border:1px solid var(--gold); border-radius:8px; padding:10px 12px; font-size:13px; margin-top:6px; line-height:1.5; color:#0c1830; }
  .relate-box.close{border-color:var(--rust); background:var(--rust-light); color:var(--ink);}
  [data-theme="dark"] .relate-box{background:#2a2416; color:var(--ink);}
  .dupe-box{ background:var(--rust-light); border:1px solid var(--rust); border-radius:8px; padding:10px 12px; font-size:13px; margin-top:8px; line-height:1.5; color:var(--ink); }

  .ped-gen{ margin-bottom:14px; }
  .ped-gen-label{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.05em; color:var(--gold-deep); margin-bottom:6px; }
  .ped-side-label{ font-family:'Jost',sans-serif; font-size:10px; font-weight:600; letter-spacing:.03em; color:var(--ink-soft); opacity:.75; margin:8px 0 5px; padding-left:6px; border-left:3px solid var(--line-strong); }
  .ped-subgroup-label{ font-family:'Public Sans',sans-serif; font-size:11px; font-style:italic; color:var(--ink-soft); opacity:.7; margin:6px 0 4px 12px; }
  .ped-row{ display:flex; gap:8px; margin-bottom:6px; flex-wrap:wrap; }
  .ped-box{ flex:1; min-width:130px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 10px; cursor:pointer; }
  .ped-box .pn{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:14.5px; color:var(--navy); }
  .ped-box .pc{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .ped-box.unknown{opacity:.55;}

  #printPedigree{display:none;}
  #printPedigree.active{display:block;}
  .pp-page{ background:#f6efe0; color:#0c1830; font-family:'Public Sans',sans-serif; position:relative; box-sizing:border-box; overflow:hidden; display:flex; flex-direction:column; border:3px solid #0c1830; border-radius:18px; }
  .pp-page::before{ content:''; position:absolute; inset:7px; border:1px solid #c6a15b; border-radius:13px; pointer-events:none; }
  .pp-page.pp-landscape{ width:1020px; height:774px; padding:20px 26px 16px; }
  .pp-page.pp-portrait{ width:774px; height:1014px; padding:20px 22px 16px; }
  .pp-header{ display:flex; justify-content:space-between; align-items:flex-start; flex:0 0 auto; margin-bottom:10px; }
  .pp-brand{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:32px; color:#142440; line-height:1; }
  .pp-brand2{ font-family:'Jost',sans-serif; font-size:12px; letter-spacing:.25em; color:#b08535; margin-top:2px; }
  .pp-rope{ width:110px; border-top:1px solid #b08535; margin:7px 0 5px; }
  .pp-tag1{ font-family:'Jost',sans-serif; font-size:8px; letter-spacing:.2em; color:#142440; }
  .pp-script{ font-family:'Pinyon Script',cursive; font-size:17px; color:#142440; margin-top:4px; }
  .pp-meta-table{ display:grid; grid-template-columns:auto minmax(120px,auto); column-gap:10px; row-gap:7px; align-content:start; margin-top:2px; }
  .pp-meta-label{ font-family:'Jost',sans-serif; font-size:10px; font-weight:700; letter-spacing:.03em; color:#142440; text-align:left; white-space:nowrap; align-self:end; padding-bottom:2px; }
  .pp-meta-value{ font-size:11px; color:#142440; border-bottom:1px solid #142440; padding-bottom:2px; min-height:14px; }
  .pp-simple-title{ text-align:right; }
  .pp-simple-title .pp-simple-name{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:22px; color:#142440; }
  .pp-simple-title .pp-simple-color{ font-family:'Jost',sans-serif; font-size:11px; color:#7a6a44; margin-top:2px; }
  .pp-simple-title .pp-simple-dob{ font-family:'Jost',sans-serif; font-size:10px; color:#142440; margin-top:3px; }
  .pp-gen-labels{ display:grid; flex:0 0 auto; margin-bottom:6px; }
  .pp-gen-label{ font-family:'Jost',sans-serif; font-weight:600; letter-spacing:.1em; color:#142440; text-align:center; }
  .pp-grid{ display:grid; gap:7px; flex:1 1 auto; min-height:0; }
  .pp-box{ border:1px solid #b08535; border-radius:5px; background:#fbf6ea; padding:4px 7px 5px; display:flex; flex-direction:column; justify-content:flex-start; overflow:hidden; min-height:0; }
  .pp-pill{ background:#142440; color:#e5cd97; font-family:'Jost',sans-serif; letter-spacing:.06em; text-align:center; padding:2px 4px; border-radius:3px; margin:-4px -7px 4px; flex:0 0 auto; }
  .pp-line{ color:#0c1830; border-bottom:1px solid #cabb95; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pp-line-compact{ color:#0c1830; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pp-box-simple{ align-items:center; justify-content:center; text-align:center; }
  .pp-simple-box-name{ font-family:'Cormorant Garamond',serif; font-weight:600; color:#142440; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .pp-simple-box-color{ font-family:'Jost',sans-serif; color:#7a6a44; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .pp-footer{ display:flex; justify-content:space-between; align-items:flex-end; flex:0 0 auto; margin-top:10px; }
  .pp-anchor{ width:28px; height:28px; border-radius:50% 50% 0 0; background:#142440; display:flex; align-items:center; justify-content:center; color:#c6a15b; font-size:15px; }
  /* Full-detail sizing */
  .pp-landscape.pp-full .pp-line{ font-size:9px; line-height:1.65; }
  .pp-landscape.pp-full .pp-line-compact{ font-size:7.6px; line-height:1.45; }
  .pp-landscape.pp-full .pp-pill{ font-size:8.5px; }
  .pp-portrait.pp-full .pp-line{ font-size:7.6px; line-height:1.5; }
  .pp-portrait.pp-full .pp-line-compact{ font-size:6.6px; line-height:1.3; }
  .pp-portrait.pp-full .pp-pill{ font-size:7.4px; }
  /* Simplified sizing */
  .pp-full .pp-gen-label{ font-size:9.5px; }
  .pp-simple .pp-gen-label{ font-size:10.5px; }
  .pp-landscape.pp-simple .pp-simple-box-name{ font-size:13px; }
  .pp-landscape.pp-simple .pp-simple-box-color{ font-size:10px; }
  .pp-landscape.pp-simple .pp-pill{ font-size:8.5px; }
  .pp-portrait.pp-simple .pp-simple-box-name{ font-size:11px; }
  .pp-portrait.pp-simple .pp-simple-box-color{ font-size:8.8px; }
  .pp-portrait.pp-simple .pp-pill{ font-size:7.6px; }
  @media print{
    /* display:none (not visibility:hidden) so the rest of the app
       contributes zero layout height during print — otherwise the
       normal screen content, though invisible, still occupies its
       full height and can push pagination to a spurious near-blank

let cloudDataCache = {};
let cloudDataReady = false;

// Keep a read-only path to the old browser storage so the first login can
// migrate an existing local HerdNerd Pro dataset on this device into the cloud.
const legacyStorage = {
  get: async (key)=>{ const v=localStorage.getItem('cjm_'+key); if(v===null) throw new Error('not found'); return {value:v}; },
  set: async (key,val)=>{ localStorage.setItem('cjm_'+key,val); return {ok:true}; }

async function initCloudStorage(user){
  currentUser = user;
  const {data:row,error} = await sb.from('barn_data').select('data').eq('user_id',user.id).maybeSingle();
  if(error) throw error;
  if(row && row.data){
    cloudDataCache = row.data || {};
  } else {
    cloudDataCache = {};
    // Migrate existing local data on this device when available.
    const legacyKeys = [RABBITS_KEY, PLANNED_KEY, EVENTS_KEY, THEME_KEY];
    for(const key of legacyKeys){
      try{ cloudDataCache[key] = JSON.parse((await legacyStorage.get(key)).value); }catch(e){
        try{ cloudDataCache[key] = (await legacyStorage.get(key)).value; }catch(ignore){}
      }
    }
  }
  cloudDataReady = true;
  window.storage = {
    get: async (key)=>{
      if(!cloudDataReady) throw new Error('Cloud storage is not ready');
      if(!(key in cloudDataCache)) throw new Error('not found');
      const v=cloudDataCache[key];
      return {value:typeof v==='string'?v:JSON.stringify(v)};
    },
    set: async (key,val)=>{
      if(!cloudDataReady || !currentUser) throw new Error('Not signed in');
      let parsed;
      try{ parsed=JSON.parse(val); }catch(e){ parsed=val; }
      const oldVal = cloudDataCache[key];
      cloudDataCache[key]=parsed;
      const {error}=await sb.from('barn_data').upsert({user_id:currentUser.id,data:cloudDataCache},{onConflict:'user_id'});
      if(error) throw error;
      if(viewingAsCustomer && adminSelf){
        sb.from('audit_log').insert({
          admin_id: adminSelf.id, customer_id: viewingAsCustomer.id,
          table_name: 'barn_data', row_id: key,
          old_value: oldVal===undefined?null:oldVal, new_value: parsed
        }).then(()=>{}, ()=>{});
      }
      return {ok:true};
    }
  };
}

function ensureAncestor(name, sexHint){
  let r = findByName(name);
  if(!r){ r = blankRabbit({name, sex:sexHint||'doe', status:'external', external:true}); rabbits.push(r); saveData(); }
  return r;

function enrichFromRoster(){
  ROSTER.forEach(entry=>{
    let existing = rabbits.find(r=>r.name.trim().toLowerCase()===entry.name.trim().toLowerCase());
    if(!existing){
      const nickKey = Object.keys(NICK_MAP).find(k=>NICK_MAP[k]===entry.name);
      if(nickKey){
        const m = rabbits.find(r=>r.name.trim().toLowerCase()===nickKey);
        if(m){ m.alias = m.alias || m.name; m.name = entry.name; existing = m; }
      }
    }
    if(existing){
      if(!existing.color) existing.color = entry.color||'';
      if(!existing.breed) existing.breed = entry.breed||'';
      if(!existing.sireName && entry.sireName) existing.sireName = entry.sireName;
      if(!existing.damName && entry.damName) existing.damName = entry.damName;
    } else {
      rabbits.push(blankRabbit({
        name:entry.name, sex:entry.sex, breed:entry.breed||'', color:entry.color||'',
        sireName:entry.sireName||'', damName:entry.damName||'',
        status: entry.junior ? 'growing' : (entry.sex==='doe' ? 'open':'available'),
        flag: entry.junior ? 'No birthdate on file yet — add one so I can flag when ready to breed.' : ''
      }));
    }
  });
  rabbits.forEach(r=>{
    if(r.sex==='unknown') r.sex = 'doe';
    if(!r.weightLog) r.weightLog=[];
    if(!r.breedingHistory) r.breedingHistory=[];
    if(r.presaleFlag===undefined) r.presaleFlag=false;
    if(r.activeBreedingId===undefined) r.activeBreedingId=null;
    if(!r.notesLog){ r.notesLog = r.notes ? [{id:uid(), date:r.createdAt?r.createdAt.slice(0,10):todayStr(), text:r.notes}] : []; }
    if(!r.photos) r.photos=[];
    r.photos.forEach(p=>{ if(p.category==='Show / Stack') p.category='Front'; });
    if(r.registrationNumber===undefined) r.registrationNumber='';
    if(r.graduatedDate===undefined) r.graduatedDate=null;
    if(r.juniorAckDone===undefined) r.juniorAckDone=false;
  });
}

const ARCHIVED = ['deceased','retired','sold'];
function isArchived(r){ return ARCHIVED.includes(r.status); }
function isActive(r){ return !isArchived(r) && r.status!=='external'; }
function findByName(name){ if(!name) return null; const k=name.trim().toLowerCase(); return rabbits.find(r=>r.name.trim().toLowerCase()===k || (r.alias&&r.alias.trim().toLowerCase()===k)); }
function litterAgeDays(r){ return daysBetween(r.litterBornDate, todayStr()); }
function isRebreedReady(r){ return r.status==='nursing' && litterAgeDays(r) >= r.rebreedWeeks*7; }
function canRebred(r){ return r.status==='nursing' && (isRebreedReady(r) || !r.litterKits || r.litterKits.length===0); }
function daysToDue(r){ return r.dueDate ? daysBetween(todayStr(), r.dueDate) : null; }
function needsNestBox(r){ const d=daysToDue(r); return r.status==='pregnant' && d!==null && d<=3; }
function isOverdue(r){ const d=daysToDue(r); return r.status==='pregnant' && d!==null && d<0; }
function ageDays(r){ return r.dob ? daysBetween(r.dob, todayStr()) : null; }
function isJuniorReady(r){ return r.status==='growing' && r.dob && ageDays(r)>=182; }
function bucksCoverage(n){ return rabbits.filter(r=>r.sex==='doe' && r.partner===n && ['pregnant','nursing'].includes(r.status)); }

function levenshtein(a,b){
  a=a.toLowerCase().trim(); b=b.toLowerCase().trim();
  if(a===b) return 0;
  const m=[]; for(let i=0;i<=b.length;i++) m[i]=[i];
  for(let j=0;j<=a.length;j++) m[0][j]=j;
  for(let i=1;i<=b.length;i++) for(let j=1;j<=a.length;j++)
    m[i][j] = b[i-1]===a[j-1] ? m[i-1][j-1] : Math.min(m[i-1][j-1]+1, m[i][j-1]+1, m[i-1][j]+1);
  return m[b.length][a.length];
}
function fuzzyMatches(name, excludeId){
  const q = name.trim().toLowerCase();
  if(!q) return [];
  return rabbits.filter(r=>{
    if(r.id===excludeId) return false;
    const n = r.name.trim().toLowerCase();
    if(n===q) return true;
    const tol = q.length<=4 ? 1 : q.length<=8 ? 2 : 3;
    if(levenshtein(n,q)<=tol) return true;
    if(n.includes(q)||q.includes(n)) return Math.abs(n.length-q.length)<=4;
    return false;
  }).slice(0,4);
}

function ancestorByPath(startName, path){
  let cur = findByName(startName);
  for(const ch of path){
    if(!cur) return null;
    const nx = ch==='s' ? cur.sireName : cur.damName;
    if(!nx) return null;
    cur = findByName(nx) || {name:nx, external:true};
  }
  return cur;
}
function getAncestorMap(name, maxD){
  const map = new Map();
  (function walk(n,d){
    if(!n||d>maxD) return;
    const k=n.trim().toLowerCase();
    if(!map.has(k)||map.get(k).depth>d) map.set(k,{depth:d,name:n});
    const r=findByName(n); if(r){ walk(r.sireName,d+1); walk(r.damName,d+1); }
  })(name,0);
  return map;
}
function relatednessSummary(doeName, buckName){
  if(!doeName||!buckName) return {close:false, any:false, closeness:'', lines:[], text:'Select both a doe and a buck to check relatedness.'};
  const dm=getAncestorMap(doeName,4), bm=getAncestorMap(buckName,4);
  dm.delete(doeName.trim().toLowerCase()); bm.delete(buckName.trim().toLowerCase());
  const shared=[];
  dm.forEach((info,k)=>{ if(bm.has(k)) shared.push({name:info.name, dd:info.depth, bd:bm.get(k).depth}); });
  if(!shared.length) return {close:false, any:false, closeness:'', lines:[], text:'No common ancestors found within 4 generations on file. (Pedigree data may be incomplete.)'};
  const min = Math.min(...shared.map(s=>s.dd+s.bd));
  const closeness = min<=2?'Closely related':min===3?'Moderately related':'Distantly related';
  const lines = shared.map(s=>`${s.name} — ${s.dd} gen from doe, ${s.bd} gen from buck`);
  return {close:min<=2, any:true, closeness, lines, text:closeness+' — shared ancestor(s): '+lines.join('; ')};
}
function relateBoxHTML(rel){
  if(!rel.any) return esc(rel.text);
  return `<b>${esc(rel.closeness)}</b> — shared ancestor${rel.lines.length===1?'':'s'}:<br>`+rel.lines.map(l=>`&bull; ${esc(l)}`).join('<br>');
}

function statusBadge(r){
  const s=r.status;
  if(s==='pregnant') return isOverdue(r)?`<span class="badge b-urgent">OVERDUE</span>`:needsNestBox(r)?`<span class="badge b-urgent">NEST BOX &middot; ${daysToDue(r)===0?'TODAY':daysToDue(r)+'D'}</span>`:`<span class="badge b-preg">BRED</span>`;
  if(s==='nursing') return isRebreedReady(r)?`<span class="badge b-urgent">READY TO REBREED</span>`:`<span class="badge b-nurse">ON A LITTER</span>`;
  if(s==='reserved') return `<span class="badge b-reserved">RESERVED</span>`;
  if(s==='sold') return `<span class="badge b-sold">SOLD</span>`;
  if(s==='deceased') return `<span class="badge b-gone">DECEASED</span>`;
  if(s==='retired') return `<span class="badge b-gone">RETIRED</span>`;

function subLine(r){

function cardHTML(r, forceUrgent, origin){
  const urgent = forceUrgent || isRebreedReady(r) || needsNestBox(r);
  let detail='';
  if(r.status==='pregnant'){
    const d=daysToDue(r);
    const t = d===0?'due today':d>0?`due in ${d} day${d===1?'':'s'}`:`${-d} day${-d===1?'':'s'} overdue`;
    detail = `Bred to <b>${esc(r.partner||'?')}</b> ${fmtDate(r.bredDate)} &middot; <b>${t}</b> (${fmtDate(r.dueDate)})`;
    if(needsNestBox(r)) detail += `<br><b>Give her a nest box</b> — due in 3 days.`;
  } else if(r.status==='nursing'){
    const age=litterAgeDays(r), rem=r.rebreedWeeks*7-age;

    detail = r.lastLitterSummary ? 'Last litter: '+esc(r.lastLitterSummary) : ((r.sireName||r.damName)?`Sire: ${esc(r.sireName||'?')} &middot; Dam: ${esc(r.damName||'?')}`:'No breeding history yet');
  }

  else if(r.status==='nursing') a=`${canRebred(r)?`<button class="btn btn-primary" data-act="rebred" data-id="${r.id}">Rebred</button>`:`<button class="btn btn-secondary btn-sm" disabled style="opacity:.5;">Rebreed available ${fmtDate(addDays(r.litterBornDate,r.rebreedWeeks*7))}</button>`}<button class="btn btn-secondary" data-act="wean" data-id="${r.id}">Weaned</button>`;
  else if(isArchived(r)) a=`<button class="btn btn-primary" data-act="unarchive" data-id="${r.id}">Return to roster</button>`;
  else if(r.sex==='doe') a=`<button class="btn btn-primary" data-act="bred" data-id="${r.id}">Mark bred</button><button class="btn btn-secondary btn-sm" data-act="plan" data-id="${r.id}">Plan a breeding</button>`;
  else a='';

  return `<div class="card ${urgent?'urgent':''}" data-openprofile="${r.id}"><div class="card-top"><div><div class="card-name">${esc(r.name)}</div><div class="card-sub">${subLine(r)}</div></div>${statusBadge(r)}</div>
    <div class="card-detail">${detail}</div>${flag}<div class="card-actions">${a}</div></div>`;

function saleLine(r){
  const s=r.sale; if(!s) return '';

  if(s.deposit) bits.push('deposit $'+esc(s.deposit)+(s.depositDate?' on '+fmtDate(s.depositDate):''));
  if(s.soldDate) bits.push('sold '+fmtDate(s.soldDate));
  if(s.pickupDate) bits.push('pickup '+fmtDate(s.pickupDate));
  if(s.notes) bits.push(esc(s.notes));

}

function convertLitterToIndividuals(damId){
  const dam=rabbits.find(x=>x.id===damId); if(!dam||!dam.litterKits) return;
  let count=0;
  dam.litterKits.forEach((k,i)=>{
    if(k.individualId) return;
    const kit=blankRabbit({ name:`${dam.name} x ${dam.partner||'?'} — ${k.sex==='buck'?'Buck':'Doe'} ${i+1}`,
      sex:k.sex, breed:dam.breed, color:k.color||'', dob:dam.litterBornDate, sireName:dam.partner||'', damName:dam.name, status:'growing' });
    rabbits.push(kit); k.individualId=kit.id; count++;
  });
  saveData(); render(); showToast(count+' individual page'+(count===1?'':'s')+' created');
}

function renderMain(){
  const main=document.getElementById('main');
  const gridTabs = ['rabbits','litters','planned','ancestors','archive','forsale'];
  main.classList.toggle('card-grid', !!searchQuery.trim() || gridTabs.includes(currentTab));
  if(searchQuery.trim()){ renderSearch(main); return; }
  if(currentTab==='home'){ renderHome(main); }
  else if(currentTab==='rabbits'){ renderRabbits(main); }
  else if(currentTab==='litters'){
    const it=rabbits.filter(r=>r.sex==='doe'&&r.status==='nursing').sort((a,b)=>(a.litterBornDate||'').localeCompare(b.litterBornDate||''));
    main.innerHTML=`<div class="section-label">${it.length} CURRENT LITTER${it.length===1?'':'S'}</div>`+(it.length?it.map(nurseryCardHTML).join(''):`<div class="empty">No litters in the nursery right now.</div>`);
  } else if(currentTab==='calendar'){ renderCalendar(main); return; }
  else if(currentTab==='does'||currentTab==='bucks'||currentTab==='juniors'){ currentTab='rabbits'; rabbitsGroup = currentTab; renderRabbits(main); }
  else if(currentTab==='planned'){
    main.innerHTML=`<div class="section-label">PLANNED BREEDINGS</div><button class="btn btn-secondary" style="width:100%; margin-bottom:12px;" id="planTopBtn">+ Plan a breeding</button>`+
      (planned.length?planned.map(plannedCardHTML).join(''):`<div class="empty">No breedings planned yet.</div>`);
    document.getElementById('planTopBtn').onclick=openAddPlannedSheet;
  } else if(currentTab==='ancestors'){
    const it=rabbits.filter(r=>r.status==='external').sort((a,b)=>a.name.localeCompare(b.name));
    main.innerHTML=`<div class="section-label">PEDIGREE-ONLY RABBITS</div>`+(it.length?it.map(ancestorCardHTML).join(''):`<div class="empty">No standalone ancestor records yet. They're created automatically when you enter a sire or dam who isn't one of your own rabbits.</div>`);
  } else if(currentTab==='archive'){
    const it=rabbits.filter(isArchived).sort((a,b)=>a.name.localeCompare(b.name));
    main.innerHTML=`<button class="btn btn-secondary" style="width:100%; margin-bottom:12px;" id="archiveAddBtn">+ Add rabbit</button>
      <div class="section-label">SOLD, RETIRED, AND DECEASED</div>`+(it.length?it.map(r=>cardHTML(r)).join(''):`<div class="empty">Nothing archived yet. Rabbits you mark sold, retired, or deceased land here — and can be returned to the roster any time.</div>`);
    document.getElementById('archiveAddBtn').onclick=openAddSheet;
  } else if(currentTab==='backup'){ renderBackup(main); return; }
  else if(currentTab==='forsale'){ renderForSale(main); return; }
  attachCardEvents();
}

function snoozed(r,type){ return !!(r.attnSnooze && r.attnSnooze[type] && r.attnSnooze[type] > todayStr()); }
function showUndoToast(label, revertFn){
  const t = document.getElementById('toast');
  clearTimeout(window._toastTimer);
  t.innerHTML = `${esc(label)} <button id="toastUndo" style="margin-left:10px; background:none; border:none; color:var(--gold-light); font-weight:600; text-decoration:underline; cursor:pointer;">Undo</button>`;
  t.classList.add('on');
  window._toastTimer = setTimeout(()=>t.classList.remove('on'), 4000);
  document.getElementById('toastUndo').onclick = ()=>{ revertFn(); saveData(); render(); t.classList.remove('on'); };
}

function wireAttentionRows(root){
  root.querySelectorAll('[data-nesttoggle]').forEach(b=>b.onclick=()=>{ const body=root.querySelector('#nestGroupBody'); if(body) body.style.display = body.style.display==='none'?'block':'none'; });
  root.querySelectorAll('[data-circledone]').forEach(el=>el.onclick=()=>{
    const id=el.dataset.circledone, type=el.dataset.circletype, label=el.dataset.circlelabel;
    const r=rabbits.find(x=>x.id===id); if(!r) return;
    let prevVal;
    if(type==='nest'){ prevVal=r.nestBoxAckDate; r.nestBoxAckDate=todayStr(); }
    else if(type==='graduate'){ prevVal=r.juniorAckDone; r.juniorAckDone=true; }
    else if(type==='pickup'){ prevVal=r.sale?r.sale.pickupAckDate:null; if(r.sale) r.sale.pickupAckDate=todayStr(); }
    el.closest('.todo-row').classList.add('todo-complete');
    saveData();
    setTimeout(()=>{
      render();
      showUndoToast(label, ()=>{
        const rr=rabbits.find(x=>x.id===id); if(!rr) return;
        if(type==='nest') rr.nestBoxAckDate=prevVal;
        else if(type==='graduate') rr.juniorAckDone=prevVal;
        else if(type==='pickup' && rr.sale) rr.sale.pickupAckDate=prevVal;
      });
    }, 380);
  });
  root.querySelectorAll('[data-snooze]').forEach(el=>el.onclick=()=>{
    const id=el.dataset.snooze, type=el.dataset.snoozetype;
    const r=rabbits.find(x=>x.id===id); if(!r) return;
    r.attnSnooze = r.attnSnooze || {};
    r.attnSnooze[type] = addDays(todayStr(),1);
    saveData(); render(); showToast('Snoozed until tomorrow');
  });
}

function renderHome(main){
  const t = todayStr();
  const nursingDoes = rabbits.filter(r=>r.sex==='doe'&&r.status==='nursing');

  const nest = rabbits.filter(r=>r.sex==='doe'&&needsNestBox(r)&&r.nestBoxAckDate!==t&&!snoozed(r,'nest')).sort((a,b)=>daysToDue(a)-daysToDue(b));
  const overdueDoes = rabbits.filter(r=>r.sex==='doe'&&isOverdue(r)&&!snoozed(r,'overdue')).sort((a,b)=>daysToDue(a)-daysToDue(b));
  const pickupOverdue = rabbits.filter(r=>r.sale&&r.sale.pickupDate&&r.sale.pickupDate<t&&!r.sale.pickupAckDate&&!snoozed(r,'pickup'));
  const convert = rabbits.filter(r=>r.sex==='doe'&&r.status==='nursing'&&r.sellDate&&r.sellDate<=t&&r.litterConvertAckDate!==t&&(r.litterKits||[]).some(k=>!k.individualId)&&!snoozed(r,'convert'));
  const reb = rabbits.filter(r=>r.sex==='doe'&&isRebreedReady(r)&&!snoozed(r,'reb'));
  const recentGraduates = rabbits.filter(r=>r.graduatedDate && !r.juniorAckDone && daysBetween(r.graduatedDate,t)<=14 && !snoozed(r,'graduate')).sort((a,b)=>a.graduatedDate.localeCompare(b.graduatedDate));

  // Build attention rows — nest box prep collapses into one group row; everything else is one row per rabbit.
  const rows = [];
  if(nest.length) rows.push({ urgent:false, sortKey:-1, html: nestGroupHTML(nest) });
  overdueDoes.forEach(r=>{
    const d=daysToDue(r);
    rows.push({ urgent:true, sortKey:d, html: attnRowHTML({
      urgent:true, text:`<b>${esc(r.name)}</b> is overdue — ${-d} day${-d===1?'':'s'} past due`,
      buttons:`<button class="btn btn-primary btn-sm" data-act="kindled" data-id="${r.id}">Kindled</button>`,
      snoozeId:r.id, snoozeType:'overdue'
    })});
  });
  pickupOverdue.forEach(r=>{
    rows.push({ urgent:true, sortKey:0, html: attnRowHTML({
      urgent:true, text:`Overdue — pickup: <b>${esc(r.name)}</b>`, sub:`Buyer pickup was scheduled for ${fmtDate(r.sale.pickupDate)}`,
      circleId:r.id, circleType:'pickup', circleLabel:`${r.name}'s pickup marked complete`,
      snoozeId:r.id, snoozeType:'pickup'
    })});
  });
  convert.forEach(r=>{
    rows.push({ urgent:false, sortKey:5, html: attnRowHTML({
      text:`<b>${esc(r.name)}'s litter</b> is 8 weeks old — make individual pages?`,
      buttons:`<button class="btn btn-primary btn-sm" data-convertyes="${r.id}">Yes</button><button class="btn btn-secondary btn-sm" data-convertno="${r.id}">Not yet</button>`,
      snoozeId:r.id, snoozeType:'convert'
    })});
  });
  reb.forEach(r=>{
    rows.push({ urgent:false, sortKey:6, html: attnRowHTML({
      text:`<b>${esc(r.name)}</b> is ready to rebreed`,
      buttons:`<button class="btn btn-primary btn-sm" data-act="rebred" data-id="${r.id}">Rebred</button>`,
      snoozeId:r.id, snoozeType:'reb'
    })});
  });
  recentGraduates.forEach(r=>{
    rows.push({ urgent:false, sortKey:7, html: attnRowHTML({
      text:`<b>${esc(r.name)}</b> turned 6 months — moved to the main roster`,
      circleId:r.id, circleType:'graduate', circleLabel:`${r.name} acknowledged`,
      snoozeId:r.id, snoozeType:'graduate'
    })});
  });
  rows.sort((a,b)=> a.urgent===b.urgent ? a.sortKey-b.sortKey : (a.urgent?-1:1));
  const attnTotal = rows.length;
  const VISIBLE_CAP = 3;
  const visibleRows = rows.slice(0,VISIBLE_CAP);
  const hiddenCount = attnTotal - visibleRows.length;

  // Coming up: bucketed into "This week" (next 7 days) and "Later" (8-30 days).
  const upcoming = [];
  rabbits.forEach(r=>{
    if(r.sex==='doe'&&r.status==='pregnant'&&r.dueDate&&daysToDue(r)>=0) upcoming.push({date:r.dueDate, label:`${r.name} due to kindle`});
    if(r.sex==='doe'&&r.status==='nursing'){
      if(r.weanDate&&r.weanDate>=t) upcoming.push({date:r.weanDate, label:`${r.name}'s litter ready to wean`});
      if(r.sellDate&&r.sellDate>=t) upcoming.push({date:r.sellDate, label:`${r.name}'s litter ready to go`});
    }
  });
  planned.forEach(p=>{ if(p.targetDate>=t) upcoming.push({date:p.targetDate, label:`Planned: ${p.doeName||'?'} × ${p.buckName||'?'}`}); });
  customEvents.forEach(e=>{ if(e.date>=t) upcoming.push({date:e.date, label:e.title}); });
  upcoming.sort((a,b)=>a.date.localeCompare(b.date));
  const thisWeek = upcoming.filter(e=>daysBetween(t,e.date)<=6);
  const later = upcoming.filter(e=>{ const d=daysBetween(t,e.date); return d>6 && d<=30; });

  const show = nextUpcomingShow();

  let h = `<div class="quick-actions">
    <button class="qa-btn qa-primary" id="qaAddBreeding"><span class="qa-icon">${QA_PLUS_SVG}</span><span>Add breeding</span></button>
    <button class="qa-btn" id="qaOpenDoes"><span class="qa-icon">${QA_BUNNY_SVG}</span><span>Open does</span></button>
    <button class="qa-btn" id="qaForSale"><span class="qa-icon">${QA_TAG_SVG}</span><span>For sale</span></button>
    <button class="qa-btn" id="qaAddRabbit"><span class="qa-icon">${QA_PLUS_SVG}</span><span>Add rabbit</span></button>
  </div>`;

  if(show){
    const daysLeft = daysBetween(t, show.entryDeadline);
    h += `<div class="show-banner" id="showBannerCard">
      <div><div class="show-banner-name">${esc(show.name)}</div><div class="show-banner-sub">Entries close ${fmtDate(show.entryDeadline)}</div></div>
      <div class="show-banner-days"><div class="n">${daysLeft}</div><div class="l">day${daysLeft===1?'':'s'}</div></div>
    </div>`;
  }

  h += `<div class="section-label" style="display:flex; align-items:center; justify-content:space-between; margin-top:0;">
    <span>NEEDS ATTENTION</span>
    ${attnTotal ? `<span style="font-size:11px; font-weight:600; color:#fffdf8; background:var(--rust); padding:2px 9px; border-radius:10px;">${attnTotal}</span>` : ''}
  </div>`;
  if(!attnTotal){
    h += `<div class="card no-tap"><div class="card-detail">Nothing needs attention right now.</div></div>`;
  } else {
    h += visibleRows.map(r=>r.html).join('');
    if(hiddenCount>0) h += `<button class="attn-viewall" id="attnViewAll">View all (${attnTotal}) &rarr;</button>`;
  }

  h += `<div class="section-label">COMING UP</div>`;
  if(!thisWeek.length && !later.length){
    h += `<div class="card no-tap"><div class="card-detail">Nothing coming up in the next month.</div></div>`;
  } else {
    if(thisWeek.length) h += `<div class="section-label" style="margin-top:10px; opacity:.6;">THIS WEEK</div><div class="card no-tap">${thisWeek.map(comingUpRowHTML).join('')}</div>`;
    if(later.length) h += `<div class="section-label" style="margin-top:10px; opacity:.6;">LATER</div><div class="card no-tap">${later.map(comingUpRowHTML).join('')}</div>`;
  }

  main.innerHTML = h;

  document.getElementById('qaAddBreeding').onclick = ()=>openAddPlannedSheet();
  document.getElementById('qaOpenDoes').onclick = ()=>{ currentTab='rabbits'; rabbitsGroup='does'; render(); window.scrollTo(0,0); };
  document.getElementById('qaForSale').onclick = ()=>{ currentTab='forsale'; render(); window.scrollTo(0,0); };
  document.getElementById('qaAddRabbit').onclick = openAddSheet;
  if(document.getElementById('showBannerCard')) document.getElementById('showBannerCard').onclick = openShowsSheet;
  if(document.getElementById('attnViewAll')) document.getElementById('attnViewAll').onclick = ()=>openAttentionSheet(rows.map(r=>r.html).join(''));
  wireAttentionRows(main);
  wireConvertButtons(main);
  attachCardEvents();
}

function renderRabbits(main){
  const groupTabs = `<div class="subnav-wrap"><div class="seg">
    <button data-rgroup="does" class="${rabbitsGroup==='does'?'on':''}">Does</button>
    <button data-rgroup="bucks" class="${rabbitsGroup==='bucks'?'on':''}">Bucks</button>
    <button data-rgroup="juniors" class="${rabbitsGroup==='juniors'?'on':''}">Juniors</button>
  </div></div>`;
  let body='';
  if(rabbitsGroup==='does'){
    const rank = {pregnant:0, nursing:1, open:2, reserved:3};
    const labels = {pregnant:'BRED', nursing:'ON A LITTER', open:'OPEN', reserved:'RESERVED'};
    const allDoes = rabbits.filter(r=>r.sex==='doe'&&isActive(r)&&r.status!=='growing');
    const totalsRow = `<div class="stats" style="padding:0; margin-bottom:12px;">${
      [['all','All'],['pregnant','Bred'],['nursing','On a litter'],['open','Open']].map(([k,l])=>
        `<div class="stat ${doesFilter===k?'active':''}" data-doesfilter="${k}"><div class="n">${k==='all'?allDoes.length:allDoes.filter(r=>r.status===k).length}</div><div class="l">${l}</div></div>`).join('')
    }</div>`;
    let it=allDoes.sort((a,b)=>{
      const ra=rank[a.status]!=null?rank[a.status]:2, rb=rank[b.status]!=null?rank[b.status]:2;
      if(ra!==rb) return ra-rb;
      if(a.status==='pregnant') return daysToDue(a)-daysToDue(b);
      if(a.status==='nursing') return (a.rebreedWeeks*7-litterAgeDays(a))-(b.rebreedWeeks*7-litterAgeDays(b));
      return a.name.localeCompare(b.name);
    });
    if(doesFilter!=='all') it = it.filter(r=>r.status===doesFilter);
    if(!it.length){ body=totalsRow+`<div class="empty">No does match this filter.</div>`; }
    else{
      let h='', lastGroup=null;
      it.forEach(r=>{
        const g = rank[r.status]!=null?r.status:'open';
        if(g!==lastGroup && doesFilter==='all'){ h+=`<div class="section-label">${labels[g]||g.toUpperCase()}</div>`; lastGroup=g; }
        h+=cardHTML(r);
      });
      body=totalsRow+h;
    }
  } else if(rabbitsGroup==='bucks'){
    const it=rabbits.filter(r=>r.sex==='buck'&&isActive(r)&&r.status!=='growing').sort((a,b)=>a.name.localeCompare(b.name));
    body=`<div class="section-label">${it.length} TOTAL BUCK${it.length===1?'':'S'}</div>`+
      (it.length?it.map(buckCardHTML).join(''):`<div class="empty">No bucks yet. Tap Add rabbit in More.</div>`);
  } else if(rabbitsGroup==='juniors'){
    const it=rabbits.filter(r=>r.status==='growing'||(r.status==='reserved'&&r.dob&&ageDays(r)<182)).sort((a,b)=>(a.dob||'9').localeCompare(b.dob||'9'));
    body=it.length?it.map(juniorCardHTML).join(''):`<div class="empty">No juniors on file. They appear automatically after you log a litter.</div>`;
  }
  main.innerHTML = groupTabs + body;
  document.querySelectorAll('[data-rgroup]').forEach(b=>b.onclick=()=>{ rabbitsGroup=b.dataset.rgroup; render(); window.scrollTo(0,0); });
  document.querySelectorAll('[data-doesfilter]').forEach(b=>b.onclick=()=>{ doesFilter=b.dataset.doesfilter; render(); });
}

/* ---------- calendar ---------- */
function renderCalendar(main){
  const t = todayStr();
  if(!calSelectedDate) calSelectedDate = t;
  if(!calWeekStart) calWeekStart = startOfWeek(calSelectedDate);

  const events = [];
  rabbits.forEach(r=>{
    if(!isActive(r)) return;
    if(r.status==='pregnant' && r.dueDate){
      events.push({date:r.dueDate, label:`${r.name} — estimated kindling`, sub:`Bred to ${r.partner||'?'} · check for a nest box a few days before`, id:r.id, type:'due', overdue:isOverdue(r)});
    }
    if(r.status==='nursing'){
      const rebreedDate = addDays(r.litterBornDate, r.rebreedWeeks*7);
      events.push({date:rebreedDate, label:`${r.name} — rebreed target`, sub:`${r.rebreedWeeks} week target from litter born ${fmtDate(r.litterBornDate)}`, id:r.id, type:'rebreed'});
      if(r.weanDate) events.push({date:r.weanDate, label:`${r.name}'s litter — wean`, sub:'Kits weaned at 6 weeks', id:r.id, type:'wean'});
      if(r.sellDate) events.push({date:r.sellDate, label:`${r.name}'s litter — ready to go`, sub:'8 weeks old, ready for new homes', id:r.id, type:'sell'});
    }
  });
  planned.forEach(p=>{
    const doe=rabbits.find(r=>r.id===p.doeId);
    events.push({date:p.targetDate, label:`Planned: ${p.doeName||(doe?doe.name:'?')} × ${p.buckName}`, sub:p.notes||'Planned breeding', id:doe?doe.id:null, type:'planned'});
  });
  customEvents.forEach(e=>{ events.push({date:e.date, label:e.title, sub:'Custom event', id:null, customId:e.id, type:'custom'}); });

  const DOT = {due:'var(--rust)', rebreed:'var(--gold-deep)', wean:'var(--marsh)', sell:'var(--marsh)', planned:'var(--gold-deep)', custom:'var(--ink-soft)'};

  const days=[]; for(let i=0;i<7;i++){ days.push(addDays(calWeekStart,i)); }
  const dayLabels=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const weekEnd = days[6];
  const rangeLabel = fmtDate(calWeekStart).replace(/, \d{4}$/,'') + ' - ' + fmtDate(weekEnd);

  let strip = `<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
    <button id="calPrevWeek" aria-label="Previous week" style="width:32px; height:32px; border-radius:8px; border:1px solid var(--line-strong); background:var(--card); color:var(--navy); font-size:16px;">&lsaquo;</button>
    <span style="font-size:12px; font-weight:500; color:var(--navy); letter-spacing:.03em; font-family:'Jost',sans-serif;">${rangeLabel}</span>
    <button id="calNextWeek" aria-label="Next week" style="width:32px; height:32px; border-radius:8px; border:1px solid var(--line-strong); background:var(--card); color:var(--navy); font-size:16px;">&rsaquo;</button>
  </div>
  <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:16px;">`;

  days.forEach((d,i)=>{
    const dayEvents = events.filter(e=>e.date===d);
    const isSel = d===calSelectedDate;
    const isToday = d===t;
    const dnum = new Date(d+'T00:00:00').getDate();
    const dotColors = [...new Set(dayEvents.map(e=> e.overdue ? 'var(--rust)' : (DOT[e.type]||'var(--ink-soft)')))].slice(0,3);
    strip += `<button data-calday="${d}" style="text-align:center; background:none; border:none; padding:0; cursor:pointer;">
      <div style="font-size:10px; color:var(--ink-soft); opacity:${isSel?'1':'.6'}; font-weight:${isSel?'600':'400'}; margin-bottom:4px; font-family:'Jost',sans-serif;">${dayLabels[i]}</div>
      <div style="border-radius:10px; padding:7px 0 6px; background:${isSel?'var(--navbar)':'var(--card)'}; border:1px solid ${isSel?'var(--navbar)':(isToday?'var(--gold-deep)':'var(--line)')};">
        <div style="font-size:14px; font-weight:500; color:${isSel?'#fffdf8':'var(--navy)'}; font-family:'Jost',sans-serif;">${dnum}</div>
        <div style="display:flex; justify-content:center; gap:2px; margin-top:3px; height:4px;">
          ${dotColors.map(c=>`<span style="width:4px; height:4px; border-radius:50%; background:${c};"></span>`).join('')}
        </div>
      </div>
    </button>`;
  });
  strip += `</div>`;

  const selDate = new Date(calSelectedDate+'T00:00:00');
  const weekdayFull = selDate.toLocaleDateString('en-US',{weekday:'long'});
  const dateFull = selDate.toLocaleDateString('en-US',{month:'long', day:'numeric', year:'numeric'});
  const dayEvents = events.filter(e=>e.date===calSelectedDate).sort((a,b)=>(a.overdue?0:1)-(b.overdue?0:1));

  let agenda = `<button class="btn btn-secondary" style="width:100%; margin-bottom:12px;" id="calAddBtn">+ Add an event</button>
    <div style="font-family:'Cormorant Garamond',serif; font-weight:600; font-size:17px; color:var(--navy); margin-bottom:10px;">${weekdayFull}, ${dateFull}${calSelectedDate===t?' — Today':''}</div>`;

  if(!dayEvents.length){
    agenda += `<div class="empty">Nothing on the calendar for this day.</div>`;
  } else {
    dayEvents.forEach(e=>{ agenda += calRowHTML(e, e.overdue); });
  }

  main.innerHTML = strip + agenda;

  document.getElementById('calPrevWeek').onclick=()=>{ calWeekStart=addDays(calWeekStart,-7); render(); };
  document.getElementById('calNextWeek').onclick=()=>{ calWeekStart=addDays(calWeekStart,7); render(); };
  document.querySelectorAll('[data-calday]').forEach(b=>b.onclick=()=>{ calSelectedDate=b.dataset.calday; render(); });
  document.getElementById('calAddBtn').onclick=()=>openAddEventSheet(calSelectedDate);
  document.querySelectorAll('[data-calopen]').forEach(b=>b.onclick=()=>{
    const r=rabbits.find(x=>x.id===b.dataset.calopen); if(r) openRabbitProfile(r);
  });
  document.querySelectorAll('[data-caldel]').forEach(b=>b.onclick=(ev)=>{
    ev.stopPropagation();
    customEvents = customEvents.filter(x=>x.id!==b.dataset.caldel); saveEvents(); render();
  });
}
function calRowHTML(e, overdue){
  return `<div class="cal-row ${overdue?'overdue':''}" ${e.id?`data-calopen="${e.id}"`:''}>
    <div class="cal-dot" style="background:${overdue?'var(--rust)':'var(--gold-deep)'};"></div>
    <div style="flex:1;">
      <div class="cal-row-text"><b>${esc(e.label)}</b></div>
      <div class="cal-row-text" style="opacity:.75; font-size:12px; margin-top:2px;">${esc(e.sub||'')}</div>
    </div>
    ${e.customId?`<button class="btn btn-danger btn-sm" data-caldel="${e.customId}">Remove</button>`:''}

}
function openAddEventSheet(defaultDate){
  openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button>
    <h2>Add an event</h2>
    <div class="field"><label>Title</label><input id="f-evtitle" placeholder="e.g. Vet visit, show entry deadline"></div>
    <div class="field"><label>Date</label><input type="date" id="f-evdate" value="${defaultDate||todayStr()}"></div>
    <div class="sheet-actions"><button class="btn btn-secondary" onclick="closeSheet()">Cancel</button><button class="btn btn-primary" id="f-save">Save</button></div>`);

}

function renderSearch(main){
  const q=searchQuery.trim().toLowerCase();
  const scored = rabbits.map(r=>{
    const n=r.name.toLowerCase();
    let s=99;
    if(n===q) s=0; else if(n.startsWith(q)) s=1; else if(n.includes(q)) s=2;
    else if(r.earNumber && r.earNumber.toLowerCase()===q) s=1;
    else if(r.earNumber && r.earNumber.toLowerCase().includes(q)) s=2.5;
    else if(r.color && r.color.toLowerCase().includes(q)) s=4;
    else if(r.breed && r.breed.toLowerCase().includes(q)) s=4.5;
    else { const d=levenshtein(n,q); if(d<=3) s=3+d; }
    return {r,s};
  }).filter(x=>x.s<99).sort((a,b)=>a.s-b.s||a.r.name.localeCompare(b.r.name)).slice(0,25);
  if(!scored.length){ main.innerHTML=`<div class="empty">No rabbit matches "${esc(searchQuery)}".</div>`; return; }
  main.innerHTML=`<div class="section-label">${scored.length} MATCH${scored.length===1?'':'ES'}</div>`+scored.map(({r})=>
    `<div class="card" data-openprofile="${r.id}"><div class="card-top"><div><div class="card-name">${esc(r.name)}</div><div class="card-sub">${subLine(r)}</div></div>${statusBadge(r)}</div></div>`).join('');
  attachCardEvents();
}

function attachSuggest(input, getOptions){
  const box = document.createElement('div');
  box.className = 'suggest-box';
  input.insertAdjacentElement('afterend', box);
  function render(){
    const q = input.value.trim().toLowerCase();
    const seen = new Set();
    const opts = getOptions().filter(Boolean).filter(o=>{
      const k=o.toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true;
    }).filter(o=>!q || o.toLowerCase().includes(q)).slice(0,6);
    if(!opts.length){ box.style.display='none'; box.innerHTML=''; return; }
    box.style.display='block';
    box.innerHTML = opts.map(o=>`<button type="button" class="suggest-item">${esc(o)}</button>`).join('');
    box.querySelectorAll('.suggest-item').forEach(btn=>{
      btn.addEventListener('mousedown', e=>e.preventDefault());
      btn.addEventListener('click', ()=>{
        input.value = btn.textContent; box.style.display='none'; box.innerHTML='';
        input.dispatchEvent(new Event('input', {bubbles:true}));
        input.dispatchEvent(new Event('change', {bubbles:true}));
      });
    });
  }
  input.addEventListener('input', render);
  input.addEventListener('focus', render);
  input.addEventListener('blur', ()=>setTimeout(()=>{ box.style.display='none'; },150));
}
function allRabbitNames(excludeId){ return rabbits.filter(r=>r.id!==excludeId).map(r=>r.name); }
function allKnownColors(){ return [...new Set(rabbits.map(r=>r.color).filter(Boolean))].sort(); }

function markLitterLost(r){
  if(r.activeBreedingId && r.breedingHistory){
    const e = r.breedingHistory.find(x=>x.id===r.activeBreedingId);
    if(e) e.outcome='lost';
  }
  r.activeBreedingId=null; r.status='open'; r.bredDate=r.dueDate=r.partner=null;
}
function armConfirm(btn, confirmText, onConfirm){
  if(btn.dataset.armed==='1'){ onConfirm(); return; }
  btn.dataset.armed='1'; btn.dataset.origText=btn.textContent;
  btn.textContent=confirmText;
  setTimeout(()=>{ if(btn.dataset.armed==='1'){ btn.dataset.armed='0'; btn.textContent=btn.dataset.origText; } }, 4000);
}
function attachCardEvents(){
  document.querySelectorAll('[data-openprofile]').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      if(ev.target.closest('button')) return; // let action buttons handle their own clicks
      const r=rabbits.find(x=>x.id===el.dataset.openprofile); if(r) openRabbitProfile(r);
    });
  });
  document.querySelectorAll('[data-act]').forEach(btn=>{
    btn.onclick=(ev)=>{
      ev.stopPropagation();
      const id=btn.dataset.id, act=btn.dataset.act;
      if(act==='executePlanned'||act==='deletePlanned'){
        const p=planned.find(x=>x.id===id); if(!p) return;
        if(act==='deletePlanned'){ planned=planned.filter(x=>x.id!==id); savePlanned(); render(); showToast('Planned breeding removed'); return; }
        const doe=rabbits.find(r=>r.id===p.doeId);
        if(doe) openBreedSheet(doe, p.buckName||(rabbits.find(r=>r.id===p.buckId)||{}).name, ()=>{ planned=planned.filter(x=>x.id!==id); savePlanned(); render(); });
        return;
      }
      const r=rabbits.find(x=>x.id===id); if(!r) return;
      if(act==='kindled') openKindledSheet(r);
      else if(act==='editlitter') openKindledSheet(r,true);
      else if(act==='litterpedigree') openLitterPedigreeSheet(r);
      else if(act==='lost'){ armConfirm(btn, 'Tap again to confirm', ()=>{ markLitterLost(r); saveData(); render(); showToast(r.name+' marked open'); }); }
      else if(act==='rebred'||act==='bred') openBreedSheet(r);
      else if(act==='plan') openAddPlannedSheet(r.id);
      else if(act==='wean'){ r.status='open'; saveData(); render(); showToast(r.name+' weaned'); }
      else if(act==='graduate'){ r.status = r.sex==='doe'?'open':'available'; saveData(); render(); showToast(r.name+' moved to the main roster'); }
      else if(act==='unarchive') openUnarchive(r);
      else if(act==='edit') openEditSheet(r);
      else if(act==='pedigree') openPedigreeSheet(r);
      else if(act==='history') openHistorySheet(r);
    };
  });
  document.querySelectorAll('[data-keepkit]').forEach(btn=>{
    btn.onclick=(ev)=>{ ev.stopPropagation(); const [damId,idx]=btn.dataset.keepkit.split(':'); keepKitForBreeding(damId,+idx); };
  });
  document.querySelectorAll('[data-salekit]').forEach(btn=>{
    btn.onclick=(ev)=>{ ev.stopPropagation(); const [damId,idx]=btn.dataset.salekit.split(':'); toggleKitForSale(damId,+idx); };
  });
  document.querySelectorAll('[data-openkit]').forEach(btn=>{
    btn.onclick=(ev)=>{ ev.stopPropagation(); const kr=rabbits.find(x=>x.id===btn.dataset.openkit); if(kr) openRabbitProfile(kr); };
  });
  document.querySelectorAll('[data-togglekits]').forEach(btn=>{
    btn.onclick=(ev)=>{
      ev.stopPropagation();
      const id=btn.dataset.togglekits;
      if(expandedLitters.has(id)) expandedLitters.delete(id); else expandedLitters.add(id);
      render(); if(profileRabbitId) renderProfile();
    };
  });
}

    <h2>${esc(r.name)} ${editing?'— edit litter':'kindled'}</h2>
    <div class="field"><label>Litter born</label><input type="date" id="f-born" value="${editing&&r.litterBornDate?r.litterBornDate:todayStr()}"></div>

    <button type="button" class="btn btn-secondary btn-sm" id="f-addkit" style="margin-bottom:14px;">+ Add another kit</button>

    <div class="sheet-actions"><button class="btn btn-secondary" onclick="closeSheet()">Cancel</button><button class="btn btn-primary" id="f-save">Save</button></div>`);
  renderKitRows();
  document.getElementById('f-addkit').onclick=()=>{ kitRows.push({id:uid(), sex:'doe', color:'', forSale:false, individualId:null}); renderKitRows(); };
  let weeks=r.rebreedWeeks||3;

    const born=document.getElementById('f-born').value||todayStr();
    const doa=+document.getElementById('f-doa').value||0, pea=+document.getElementById('f-peanut').value||0, pas=+document.getElementById('f-passed').value||0;
    const bA=kitRows.filter(k=>k.sex==='buck').length, dA=kitRows.filter(k=>k.sex==='doe').length;
    const wasEditing = editing;
    r.status='nursing'; r.litterBornDate=born; r.litterKits=kitRows.map(k=>({id:k.id, sex:k.sex, color:k.color||'', forSale:k.forSale, individualId:k.individualId}));
    r.litterDead={DOA:doa,peanut:pea,passed:pas}; r.weanDate=addDays(born,42); r.sellDate=addDays(born,56);
    r.rebreedWeeks=weeks; r.dueDate=null; r.flag='';
    r.lastLitterSummary=`${bA} buck, ${dA} doe, ${doa+pea+pas} dead (${doa} DOA, ${pea} peanut, ${pas} passed) — ${fmtDate(born)}`;
    r.breedingHistory = r.breedingHistory||[];
    let entry = r.breedingHistory.find(x=>x.id===r.activeBreedingId) || (wasEditing ? r.breedingHistory[r.breedingHistory.length-1] : null);
    if(!entry){ entry={id:uid(), bredDate:r.bredDate||born, partner:r.partner||'', dueDate:null}; r.breedingHistory.push(entry); }
    entry.outcome='litter'; entry.litterBornDate=born; entry.litterKits=r.litterKits; entry.litterDead=r.litterDead;

function openBreedSheet(r, presetBuck, onDone){
  const bucks = rabbits.filter(x=>x.sex==='buck'&&x.status!=='external').map(x=>x.name);
  openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button>
    <h2>${esc(r.name)} bred</h2>
    <div class="field"><label>Buck</label><input id="f-buck" placeholder="Type or pick a buck" value="${esc(presetBuck||'')}"></div>
    <div id="f-relate" class="relate-box">Pick a buck to check relatedness.</div>
    <div class="field" style="margin-top:12px;"><label>Bred date</label><input type="date" id="f-bred" value="${todayStr()}"></div>
    <div class="sheet-actions"><button class="btn btn-secondary" onclick="closeSheet()">Cancel</button><button class="btn btn-primary" id="f-save">Save</button></div>`);
  const buckInput=document.getElementById('f-buck'), box=document.getElementById('f-relate'), saveBtn=document.getElementById('f-save');
  attachSuggest(buckInput, ()=>bucks);
  function upd(){
    const b=buckInput.value.trim();
    if(!b){ box.className='relate-box'; box.textContent='Pick a buck to check relatedness.'; saveBtn.textContent='Save'; return; }
    const rel=relatednessSummary(r.name,b);
    box.className='relate-box'+(rel.close?' close':''); box.innerHTML=relateBoxHTML(rel);
    saveBtn.textContent = rel.any?'Save anyway':'Save';
  }
  buckInput.addEventListener('input',upd); upd();
  saveBtn.onclick=()=>{
    const buck=buckInput.value.trim(), bred=document.getElementById('f-bred').value||todayStr();
    if(buck && !rabbits.some(x=>x.name.trim().toLowerCase()===buck.toLowerCase())){
      const dupes=fuzzyMatches(buck);
      if(dupes.length){ openDuplicateSheet(buck, dupes, chosen=>{ commitBreed(r, chosen||buck, bred, onDone); }); return; }
    }
    commitBreed(r, buck, bred, onDone);
  };
}
function commitBreed(r, buck, bred, onDone){
  r.status='pregnant'; r.partner=buck||null; r.bredDate=bred; r.dueDate=addDays(bred,31);
  r.litterBornDate=null; r.litterKits=null; r.litterDead=null; r.flag='';
  r.breedingHistory = r.breedingHistory||[];
  const entry = {id:uid(), bredDate:bred, partner:buck||'', dueDate:r.dueDate, outcome:'pending', litterBornDate:null, litterKits:null, litterDead:null, weanDate:null, sellDate:null};
  r.breedingHistory.push(entry); r.activeBreedingId = entry.id;
  if(buck && !rabbits.some(x=>x.name.trim().toLowerCase()===buck.trim().toLowerCase())) rabbits.push(blankRabbit({name:buck,sex:'buck',status:'available'}));
  saveData(); closeSheet(); render(); if(profileRabbitId) renderProfile(); showToast(r.name+' marked bred');
  if(onDone) onDone();
}

function openMergeSheet(){
  const names = rabbits.slice().sort((a,b)=>a.name.localeCompare(b.name));
  openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button>
    <h2>Merge duplicates</h2>
    <div class="card-sub" style="margin-bottom:12px;">Combines two records into one. The keeper gains any details only the duplicate had, every sire/dam reference is repointed, and the duplicate is removed.</div>
    <div class="field"><label>Keep this rabbit</label><select id="f-keep"><option value="">Select</option>${names.map(x=>`<option value="${x.id}">${esc(x.name)} — ${x.status}</option>`).join('')}</select></div>
    <div class="field"><label>Merge this one into it</label><select id="f-drop"><option value="">Select</option>${names.map(x=>`<option value="${x.id}">${esc(x.name)} — ${x.status}</option>`).join('')}</select></div>
    <div id="f-mergewarn" class="dupe-box" style="display:none;"></div>
    <div class="sheet-actions"><button class="btn btn-secondary" onclick="closeSheet()">Cancel</button><button class="btn btn-primary" id="f-save">Merge</button></div>`);
  let armed=false;
  const warn=document.getElementById('f-mergewarn'), btn=document.getElementById('f-save');
  function check(){
    const k=rabbits.find(x=>x.id===document.getElementById('f-keep').value);
    const d=rabbits.find(x=>x.id===document.getElementById('f-drop').value);
    armed=false; btn.textContent='Merge';
    if(k&&d&&k.id!==d.id){ warn.style.display='block'; warn.innerHTML=`<b>${esc(d.name)}</b> will be removed and everything pointing at it will point to <b>${esc(k.name)}</b> instead. This can't be undone.`; }
    else warn.style.display='none';
  }
  document.getElementById('f-keep').onchange=check; document.getElementById('f-drop').onchange=check;
  btn.onclick=()=>{
    const k=rabbits.find(x=>x.id===document.getElementById('f-keep').value);
    const d=rabbits.find(x=>x.id===document.getElementById('f-drop').value);
    if(!k||!d||k.id===d.id){ showToast('Pick two different rabbits'); return; }
    if(!armed){ armed=true; btn.textContent='Tap again to confirm merge'; return; }
    ['breed','color','earNumber','weight','legsWins','sireName','damName','dob','notes','registrationNumber'].forEach(f=>{ if(!k[f]&&d[f]) k[f]=d[f]; });
    if(!k.alias && d.name!==k.name) k.alias=d.name;
    if((!k.weightLog||!k.weightLog.length) && d.weightLog && d.weightLog.length) k.weightLog=d.weightLog;
    if((!k.photos||!k.photos.length) && d.photos && d.photos.length) k.photos=d.photos;
    if(d.notesLog && d.notesLog.length) k.notesLog=(k.notesLog||[]).concat(d.notesLog);
    if(!k.litterKits && d.litterKits){ k.litterKits=d.litterKits; k.litterBornDate=d.litterBornDate; k.litterDead=d.litterDead; k.weanDate=d.weanDate; k.sellDate=d.sellDate; }
    if(!k.lastLitterSummary && d.lastLitterSummary) k.lastLitterSummary=d.lastLitterSummary;
    if(isActive(k) && k.status==='open' && d.status==='pregnant'){ k.status='pregnant'; k.partner=d.partner; k.bredDate=d.bredDate; k.dueDate=d.dueDate; }
    const dn=d.name.trim().toLowerCase();
    rabbits.forEach(x=>{
      if(x.sireName && x.sireName.trim().toLowerCase()===dn) x.sireName=k.name;
      if(x.damName && x.damName.trim().toLowerCase()===dn) x.damName=k.name;
      if(x.partner && x.partner.trim().toLowerCase()===dn) x.partner=k.name;
    });
    planned.forEach(p=>{ if(p.doeId===d.id) p.doeId=k.id; if(p.buckId===d.id) p.buckId=k.id; if(p.doeName===d.name) p.doeName=k.name; if(p.buckName===d.name) p.buckName=k.name; });
    k.flag='';
    rabbits=rabbits.filter(x=>x.id!==d.id);
    saveData(); savePlanned(); closeSheet(); render(); showToast('Merged into '+k.name);
  };
}

  attachSuggest(document.getElementById('f-sire'), ()=>rabbits.filter(x=>x.sex==='buck'&&x.id!==r.id).map(x=>x.name));
  attachSuggest(document.getElementById('f-dam'), ()=>rabbits.filter(x=>x.sex==='doe'&&x.id!==r.id).map(x=>x.name));
  document.getElementById('f-cancel-x').onclick=()=>done(origin);
  document.getElementById('f-cancel').onclick=()=>done(origin);
  let sex=r.sex;
  document.querySelectorAll('#f-sex button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#f-sex button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); sex=b.dataset.v; });
  document.getElementById('f-save').onclick=()=>{
    const sire=document.getElementById('f-sire').value.trim(), dam=document.getElementById('f-dam').value.trim();
    const check=(val, cb)=>{
      if(!val || rabbits.some(x=>x.name.trim().toLowerCase()===val.toLowerCase())) return cb(val);
      const m=fuzzyMatches(val, r.id);
      if(!m.length) return cb(val);
      openDuplicateSheet(val, m, chosen=>cb(chosen||val));
    };
    check(sire, finalSire=>check(dam, finalDam=>{
      r.name=document.getElementById('f-name').value.trim()||r.name;
      r.alias=document.getElementById('f-alias').value.trim();
      r.sex=sex; r.breed=document.getElementById('f-breed').value; r.color=document.getElementById('f-color').value;
      r.earNumber=document.getElementById('f-ear').value; r.weight=document.getElementById('f-weight').value;
      r.dob=document.getElementById('f-dob').value||null; r.legsWins=document.getElementById('f-legs').value;
      r.registrationNumber=document.getElementById('f-reg').value;
      r.sireName=finalSire; r.damName=finalDam; r.notes=document.getElementById('f-notes').value;
      if(finalSire) ensureAncestor(finalSire,'buck');
      if(finalDam) ensureAncestor(finalDam,'doe');
      if(r.status==='growing'&&r.dob) r.flag='';
      saveData(); done(origin);
    }));
  };
  const dec=document.getElementById('f-deceased');
  const sellBtn=document.getElementById('f-sell');
  if(sellBtn) sellBtn.onclick=()=>{ closeSheet(); openSaleSheet(r); };
  const forSaleBtn=document.getElementById('f-forsale');
  if(forSaleBtn) forSaleBtn.onclick=()=>{ r.forSale=!r.forSale; saveData(); closeSheet(); render(); if(profileRabbitId) renderProfile(); showToast(r.forSale?r.name+' marked for sale':r.name+' unmarked'); };
  if(dec) dec.onclick=()=>{
    r.status='deceased';
    if(r.damName&&r.dob){
      const dam=rabbits.find(x=>x.sex==='doe'&&x.name===r.damName&&x.litterBornDate===r.dob);
      if(dam){ dam.litterDead=dam.litterDead||{DOA:0,peanut:0,passed:0}; dam.litterDead.passed=(dam.litterDead.passed||0)+1;
        if(dam.litterKits){ const i=dam.litterKits.findIndex(k=>k.sex===r.sex&&(k.color||'')===(r.color||'')); if(i>=0) dam.litterKits.splice(i,1); } }
    }
    saveData(); closeSheet(); render(); if(profileRabbitId) renderProfile(); showToast(r.name+' marked deceased');
  };
  const ret=document.getElementById('f-retired');
  if(ret) ret.onclick=()=>{ r.status='retired'; saveData(); closeSheet(); render(); if(profileRabbitId) renderProfile(); showToast(r.name+' marked retired'); };
  document.getElementById('f-delete').onclick=(e)=>{ armConfirm(e.target, 'Tap again to confirm', ()=>{ rabbits=rabbits.filter(x=>x.id!==r.id); saveData(); closeSheet(); closeProfile(); render(); showToast(r.name+' deleted'); }); };
}

function pedBox(node,path,role){
  const label = role?`<div class="pc" style="opacity:.6; text-transform:uppercase; font-size:9px; letter-spacing:.04em;">${role}</div>`:'';
  if(!node||!node.name) return `<div class="ped-box unknown" data-pedpath="${path}">${label}<div class="pn">+ Add name</div></div>`;
  return `<div class="ped-box ${node.external?'unknown':''}" data-pedname="${esc(node.name)}">${label}<div class="pn">${esc(node.name)}</div>${node.color?`<div class="pc">${esc(node.color)}</div>`:''}</div>`;
}
function historyEntryHTML(damObj, e){
  const cls = e.outcome==='litter'?'took':e.outcome==='lost'?'lost':'pending';
  const label = e.outcome==='litter'?'Took — litter born':e.outcome==='lost'?'Did not take / litter lost':'Pending';
  let detail = `Bred to <b>${esc(e.partner||'?')}</b> on ${fmtDate(e.bredDate)}`;
  if(damObj) detail = `<b>${esc(damObj.name)}</b> &times; ${esc(e.partner||'?')} — bred ${fmtDate(e.bredDate)}`;
  if(e.outcome==='litter' && e.litterKits) detail += `<br>${e.litterKits.length} kits born ${fmtDate(e.litterBornDate)}`;
  return `<div class="history-entry ${cls}"><div class="card-detail" style="margin:0;"><b>${label}</b></div><div class="card-detail" style="margin-top:2px;">${detail}</div>
    ${damObj?`<div class="card-actions" style="margin-top:8px;"><button class="btn btn-secondary btn-sm" data-histedit="${damObj.id}:${e.id}">Edit this entry</button></div>`:''}</div>`;
}
function openHistorySheet(r){
  let html;
  if(r.sex==='doe'){
    const hist = (r.breedingHistory||[]).slice().sort((a,b)=>b.bredDate.localeCompare(a.bredDate));
    html = hist.length ? hist.map(e=>historyEntryHTML(r,e)).join('') : `<div class="empty">No breedings logged yet for ${esc(r.name)}.</div>`;
  } else {
    const rows=[];
    rabbits.forEach(d=>{ if(d.sex==='doe') (d.breedingHistory||[]).forEach(e=>{ if(e.partner && e.partner.trim().toLowerCase()===r.name.trim().toLowerCase()) rows.push({dam:d, e}); }); });
    rows.sort((a,b)=>b.e.bredDate.localeCompare(a.e.bredDate));
    html = rows.length ? rows.map(x=>historyEntryHTML(x.dam,x.e)).join('') : `<div class="empty">No breedings logged yet for ${esc(r.name)}.</div>`;
  }
  openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button>
    <h2>${esc(r.name)} — Breeding history</h2>${html}
    <div class="sheet-actions"><button class="btn btn-secondary" onclick="closeSheet()" style="flex:1;">Close</button></div>`);
  document.querySelectorAll('[data-histedit]').forEach(b=>b.onclick=()=>{
    const [damId,entryId]=b.dataset.histedit.split(':');
    const dam=rabbits.find(x=>x.id===damId); const entry=dam&&dam.breedingHistory.find(x=>x.id===entryId);
    if(dam&&entry) openHistoryEditSheet(dam, entry, ()=>openHistorySheet(r));
  });
}

function openQuickNameSheet(parent, rel, back){
  const label = rel==='s'?'Sire':'Dam';
  openSheet(`<button class="close-x" id="f-cancel-x">&times;</button>
    <h2>${esc(parent.name)}'s ${label.toLowerCase()}</h2>
    <div class="field"><label>${label}'s name</label><input id="f-qn" placeholder="Type a name"></div>
    <div class="row2">
      <div class="field"><label>Ear #</label><input id="f-qear"></div>
      <div class="field"><label>Weight (lbs)</label><input id="f-qweight"></div>
    </div>
    <div class="field"><label>Color / Variety</label><input id="f-qcolor"></div>
    <div class="field"><label>Legs / Wins</label><input id="f-qlegs"></div>
    <div class="field"><label>Registration #</label><input id="f-qreg"></div>
    <div class="card-sub" id="f-qnote" style="display:none;"></div>
    <div class="sheet-actions"><button class="btn btn-secondary" id="f-cancel">Cancel</button><button class="btn btn-primary" id="f-save">Save</button></div>`);
  document.getElementById('f-cancel-x').onclick=()=>done(back);
  document.getElementById('f-cancel').onclick=()=>done(back);
  const nameInput = document.getElementById('f-qn');
  attachSuggest(nameInput, ()=>rabbits.filter(x=>x.sex===(rel==='s'?'buck':'doe')).map(x=>x.name));
  attachSuggest(document.getElementById('f-qcolor'), allKnownColors);
  const note = document.getElementById('f-qnote');
  nameInput.addEventListener('input', ()=>{
    const existing = findByName(nameInput.value.trim());
    if(existing && !existing.external){
      note.style.display='block';
      note.textContent = `${existing.name} is already on your roster — this will link to that record instead of the details below.`;
    } else {
      note.style.display='none';
    }
  });
  document.getElementById('f-save').onclick=()=>{
    const name=document.getElementById('f-qn').value.trim();
    if(!name){ showToast('Enter a name'); return; }
    const fields = {
      earNumber: document.getElementById('f-qear').value,
      weight: document.getElementById('f-qweight').value,
      color: document.getElementById('f-qcolor').value,
      legsWins: document.getElementById('f-qlegs').value,
      registrationNumber: document.getElementById('f-qreg').value
    };
    const commit=(finalName)=>{
      if(rel==='s') parent.sireName=finalName; else parent.damName=finalName;
      let anc = findByName(finalName);
      if(!anc){
        anc = blankRabbit(Object.assign({name:finalName, sex:rel==='s'?'buck':'doe', status:'external', external:true}, fields));
        rabbits.push(anc);
      } else if(anc.external){
        // fill in any blanks on the existing pedigree-only record with what was just typed
        Object.keys(fields).forEach(k=>{ if(!anc[k] && fields[k]) anc[k]=fields[k]; });
      }
      saveData(); done(back);
    };
    if(rabbits.some(x=>x.name.trim().toLowerCase()===name.toLowerCase())) return commit(name);
    const m=fuzzyMatches(name);
    if(m.length){ openDuplicateSheet(name, m, chosen=>commit(chosen||name)); return; }
    commit(name);
  };
}

function ppBoxFieldsFull(n){
  return `<div class="pp-line"><b>Name:</b> ${esc(n.name||'')}</div>

    <div class="pp-line"><b>Legs (wins):</b> ${esc(n.legsWins||'')}</div>`;
}
function ppBoxFieldsCompact(n){
  return `<div class="pp-line-compact"><b>Name:</b> ${esc(n.name||'')} &nbsp; <b>Ear #:</b> ${esc(n.earNumber||'')}</div>
    <div class="pp-line-compact"><b>Color:</b> ${esc(n.color||'')} &nbsp; <b>Weight:</b> ${n.weight?esc(n.weight)+' lbs':''}</div>
    <div class="pp-line-compact"><b>Legs (wins):</b> ${esc(n.legsWins||'')}</div>`;

function ppBoxFieldsSimple(n){
  return `<div class="pp-simple-box-name">${esc(n.name||'')}</div>
    <div class="pp-simple-box-color">${esc(n.color||'')}</div>`;
}
function ppBoxMarkup(n, label, detail, compact, id){
  n = n||{};
  const inner = detail==='simple' ? ppBoxFieldsSimple(n) : (compact ? ppBoxFieldsCompact(n) : ppBoxFieldsFull(n));
  return `<div class="pp-box ${detail==='simple'?'pp-box-simple':''}" id="${id}">
    <div class="pp-pill">${esc(label)}</div>${inner}</div>`;
}
function ppBoxCell(n, label, gridColumn, rowStart, rowSpan, detail, compact, id){
  // Every box is sized to its own content and centered within the
  // vertical space its generation slot occupies — not stretched to
  // fill it. Because each tier's slot height already equals the
  // combined height of the two child slots below it, this alone is
  // enough to make every parent land exactly centered between its
  // own two children, matching a standard pedigree chart, without
  // any special-casing per generation.
  return `<div style="grid-column:${gridColumn}; grid-row:${rowStart} / span ${rowSpan}; display:flex; flex-direction:column; justify-content:center;">${ppBoxMarkup(n,label,detail,compact,id)}</div>`;
}
