<style>
  :root{
    --navy:#142440; --navy-deep:#0c1830;
    --gold:#c6a15b; --gold-light:#e5cd97; --gold-deep:#b08535;
    --cream:#f7f2e6; --ivory:#fffdf8;

    --green:#3d6b4a; --green-light:#dcead9;
    --page:#f7f2e6; --card:#fffdf8; --ink:#0c1830; --ink-soft:#142440;
    --line:#e7ddc6; --line-strong:#cabb95;
    --navbar:#142440; --navbar-dim:#9aa6bb; --viewer:#0c1830;
  }
  [data-theme="dark"]{
    --page:#0e141f; --card:#18202e; --ink:#e8e4d8; --ink-soft:#c9c4b4;
    --line:#2a3446; --line-strong:#3c4759;
    --cream:#0e141f; --ivory:#18202e; --navy:#e8e4d8; --navy-deep:#f2efe6;
    --rust-light:#3a2320; --rust-text:#e8907c; --green:#6fae82; --green-light:#1e2e22; --navbar:#080d16;
  }
  *{box-sizing:border-box;}
  button, .card, .stat, [data-openprofile]{ touch-action:manipulation; }
  body{
    margin:0; background:var(--page); color:var(--ink);
    font-family:'Public Sans',sans-serif; -webkit-tap-highlight-color:transparent;
    padding-bottom:92px;
  }
  header.top{ background:var(--navbar); color:#fffdf8; padding:16px 16px 14px; display:flex; justify-content:space-between; align-items:flex-start; }
  header.top .eyebrow{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.06em; color:var(--gold-light); margin-bottom:3px; }
  header.top h1{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:22px; margin:0; color:#fffdf8; }
  .wordmark{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:28px; margin:0; color:#fffdf8; }
  .wordmark .pro{ font-style:italic; color:var(--gold-light); margin-left:6px; }
  .auth-brand .wordmark{ font-size:32px; color:var(--navy); }
  .auth-brand .wordmark .pro{ color:var(--gold-deep); }
  .pal-opt{ display:flex; align-items:center; gap:10px; min-height:56px; padding:8px 10px; border-radius:12px; border:2px solid var(--line-strong); background:var(--card); color:var(--ink); font-family:'Public Sans',sans-serif; font-size:14px; font-weight:600; text-align:left; cursor:pointer; }

  .pal-opt:disabled{ opacity:.55; cursor:default; }
  .pal-sw{ display:flex; flex:0 0 auto; }
  .pal-sw span{ width:26px; height:26px; border-radius:50%; border:1px solid rgba(0,0,0,.18); }

  .pal-name{ flex:1; min-width:0; line-height:1.2; }
  .pal-check{ flex:0 0 auto; color:var(--navy); font-size:16px; }
  .rel-path{ margin-top:8px; font-size:12.5px; color:var(--ink-soft); background:var(--page); border-radius:7px; padding:6px 9px; line-height:1.35; }
  .rel-arrow{ color:var(--gold-deep); font-weight:700; }
  .searchrow{ display:flex; gap:8px; align-items:flex-start; }

  .add-btn{ flex:0 0 auto; width:50px; height:46px; border-radius:11px; border:none; background:var(--navy); color:var(--page); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
  .add-btn svg{ width:26px; height:26px; stroke:currentColor; fill:none; stroke-width:2.6; stroke-linecap:round; }
  [data-theme="dark"] .add-btn{ background:var(--gold-deep); color:#0c1830; }
  /* Keep the page the same width whether or not it is tall enough to scroll, so the search bar does not grow and shrink when you switch Herd / All. */
  html{ scrollbar-gutter:stable; }
  @supports not (scrollbar-gutter:stable){ html{ overflow-y:scroll; } }
  #searchModeSeg{ display:none !important; }

  .search-mode button{ display:flex; align-items:center; justify-content:center; flex:1 1 0; width:100%; height:auto; align-self:stretch; min-height:0 !important; padding:0 !important; font-size:11px !important; font-weight:700 !important; line-height:1; letter-spacing:.01em; border-radius:8px !important; border:0 !important; background:transparent !important; color:var(--ink-soft,#475569) !important; white-space:nowrap; transition:background .15s,color .15s; }
  .search-mode button.on{ background:var(--navy) !important; color:var(--page,#F7F2E6) !important; }
  [data-theme="dark"] .search-mode button.on{ background:var(--gold-deep) !important; color:#0c1830 !important; }
  .rel-btn{ flex:0 0 auto; display:flex; align-items:center; gap:6px; min-height:46px; padding:0 12px; border-radius:9px; border:2px solid var(--gold-deep); background:var(--card); color:var(--ink); font-family:'Jost',sans-serif; font-size:13px; font-weight:600; cursor:pointer; }
  .rel-btn svg{ width:18px; height:18px; stroke:var(--gold-deep); fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .st-block{ text-align:center; padding:6px 0 2px; }
  .st-title{ font-family:'Cormorant Garamond',serif; font-weight:700; font-size:18px; color:var(--navy); margin-bottom:8px; }
  .st-block .st-title{ text-align:center; }
  .st-lbl{ font-family:'Jost',sans-serif; font-size:14px; font-weight:600; color:var(--ink); }

  .st-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }

  .stepper button{ flex:0 0 auto; width:46px; height:46px; border-radius:11px; border:none; background:var(--navy); color:var(--page); font-size:24px; font-weight:700; line-height:1; cursor:pointer; touch-action:manipulation; display:flex; align-items:center; justify-content:center; padding:0; }
  .stepper .st-num{ min-width:38px; text-align:center; font-family:'Cormorant Garamond',serif; font-weight:700; font-size:24px; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:5px 4px; }

  .nn-tabs{ display:flex; gap:8px; margin-bottom:12px; overflow-x:auto; }

  .nn-tab.on{ background:var(--navy); color:var(--page); border-color:var(--navy); }
  .nn-top{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .nn-age{ font-weight:700; color:var(--navy); font-size:15px; white-space:nowrap; }
  .nn-count{ font-size:16px; margin:12px 0 4px; color:var(--ink); }
  .nn-big{ font-family:'Jost',system-ui,sans-serif; font-variant-numeric:lining-nums; font-weight:700; font-size:38px; line-height:1; margin-right:4px; color:var(--navy); }
  .nn-age{ display:flex; align-items:center; gap:8px; }
  .nn-chev{ font-size:30px; line-height:.8; color:var(--ink-soft,#6b7280); font-weight:400; }
  .rk-list{ margin:8px 0 2px; border-top:1px solid var(--line,#E7DDC6); }
  .rk-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line,#E7DDC6); font-size:14px; }
  .rk-row:last-child{ border-bottom:none; }
  .rk-n{ width:24px; height:24px; border-radius:50%; background:var(--card,#FFFDF8); border:1.5px solid var(--line-strong,#CABB95); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex:0 0 auto; }
  .rk-t{ flex:1; min-width:0; font-weight:600; }
  .rk-row .nn-tag{ margin:0; font-size:12px; padding:3px 10px; }
  .nn-actions{ display:flex; gap:8px; margin-top:12px; }
  .nn-drop{ display:flex; align-items:center; justify-content:space-between; width:100%; min-height:44px; margin-top:10px; padding:0 14px; border-radius:12px; border:1px solid var(--line-strong); background:var(--card); color:var(--ink); font-family:'Jost',sans-serif; font-weight:700; font-size:14px; cursor:pointer; }
  .nn-drop.on{ border-color:var(--navy); }
  body.look-ribbon .nn-drop{ border-radius:999px; font-family:'Manrope','Public Sans',sans-serif; font-weight:800; color:var(--rb-outline); border:1.5px solid var(--rb-outline); }
  .nn-actions .btn{ flex:1; }
  .nn-more{ width:48px; flex:none; font-size:22px; line-height:1; padding:0; }
  .nn-toggle{ display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 14px; margin-bottom:12px; grid-column:1/-1; }
  .nn-sw{ flex:none; width:52px; height:30px; border-radius:999px; border:none; background:#c9c2b0; position:relative; cursor:pointer; padding:0; transition:background .15s; }
  .nn-sw span{ position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .15s; }
  .nn-sw.on{ background:var(--navy); } .nn-sw.on span{ transform:translateX(22px); }

  .nn-tile{ display:flex; flex-direction:column; gap:2px; text-align:left; border:1px solid var(--line); background:var(--page); border-radius:12px; padding:8px 10px; cursor:pointer; color:var(--ink); font-size:13px; }
  .nn-tile b{ font-size:15px; color:var(--navy); }
  .lp-hero{ text-align:center; padding:18px 14px 16px; }
  .lp-count{ display:flex; flex-direction:column; align-items:center; gap:2px; }

  .lp-bar{ height:6px; border-radius:3px; background:var(--line,#E7DDC6); margin:10px 18px 4px; overflow:hidden; }
  .lp-bar div{ height:100%; border-radius:3px; background:var(--navy); }
  [data-theme="dark"] .lp-bar div{ background:var(--gold-deep); }
  .lp-agebar i{ width:4px; height:4px; border-radius:50%; background:var(--line-strong,#CABB95); }
  .lp-agebar b{ color:var(--ink); }
  .lp-dates{ display:block; width:100%; margin-top:12px; background:none; border:none; border-top:1px solid var(--line); padding:12px 0 0; color:var(--ink); font-size:14px; cursor:pointer; }
  .lp-dates > span:last-child{ color:var(--navy); font-weight:700; text-decoration:underline; margin-left:6px; }
  .lp-h{ font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted,#6b7280); margin:6px 2px 0; }
  .lp-tiles{ margin-bottom:12px; }
  .nn-add{ align-items:center; justify-content:center; border-style:dashed; color:var(--navy); }
  .nn-add b{ font-size:24px; line-height:1; }
  .lp-fold{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:0 14px; margin-bottom:8px; }
  .lp-fold summary{ list-style:none; cursor:pointer; padding:14px 0; font-weight:600; display:flex; justify-content:space-between; align-items:center; min-height:24px; }
  .lp-fold summary::-webkit-details-marker{ display:none; }
  .lp-fold summary span{ color:var(--muted,#6b7280); font-weight:500; font-size:14px; }
  .lp-fold[open]{ padding-bottom:14px; } .lp-fold[open] summary{ padding-bottom:8px; }
  .lp-fold textarea{ width:100%; box-sizing:border-box; }
  .lp-foot{ display:flex; gap:8px; margin-top:14px; } .lp-foot .btn{ flex:1; }
  .nn-tag.t-sale{ background:#dff3e3; color:#1d6b34; border-color:#b5dfc0; }
  .nn-tag.t-res{ background:#fdf0cf; color:#8a5a00; border-color:#f0d58a; }
  .nn-tag.t-sold{ background:#e3e6ee; color:#3b4560; border-color:#c6cbd9; }
  .nn-tag.t-keep{ background:var(--navy); color:#fff; border-color:var(--navy); }
  [data-theme="dark"] .nn-tag.t-keep{ background:var(--gold-deep); color:#0c1830; border-color:var(--gold-deep); }
  .lp-babies{ background:var(--card); border:1px solid var(--line); border-radius:16px; margin:6px 0 12px; overflow:hidden; }
  .lp-baby{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:none; border:none; border-top:1px solid var(--line); padding:12px 14px; min-height:56px; cursor:pointer; color:var(--ink); font-size:15px; }
  .lp-baby{ border-top:none; }
  .lp-bw + .lp-bw{ border-top:1px solid var(--line); }
  .lp-bw.open{ background:var(--page); }
  .lp-bed[hidden]{ display:none; }
  .lp-bed{ padding:2px 14px 16px; }
  .lp-bl{ font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted,#6b7280); margin:12px 0 6px; }
  .lp-bed .lp-color{ width:100%; box-sizing:border-box; }
  .lp-cchips{ margin-top:8px; } .lp-cchips .nn-chip{ padding:6px 12px; font-size:13px; }
  .lp-more{ display:block; width:100%; margin-top:14px; background:none; border:none; color:var(--navy); font-weight:700; font-size:14px; text-align:left; cursor:pointer; padding:6px 0; }
  .lp-num{ flex:none; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Jost',system-ui,sans-serif; font-weight:700; font-size:16px; background:var(--page); border:1.5px solid var(--line-strong,var(--line)); color:var(--navy); }
  .lp-num.bk{ background:#dbe6f7; border-color:#a9c0e6; } .lp-num.dn{ background:#f9e0e6; border-color:#e8b5c2; }
  .lp-bmid{ flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .lp-wt{ color:var(--ink-soft,#475569); font-size:14px; font-weight:600; white-space:nowrap; }
  .lp-bmid b{ font-weight:600; } .lp-bmid small{ color:var(--muted,#6b7280); font-size:13px; }
  .lp-muted{ color:var(--muted,#6b7280) !important; font-weight:500 !important; }
  .lp-chev{ color:var(--muted,#6b7280); font-size:22px; line-height:1; }
  .lp-addrow{ color:var(--navy); } .lp-addrow .lp-num{ border-style:dashed; font-size:20px; }
  .lp-edtags{ float:right; background:none; border:none; color:var(--navy); font-weight:700; font-size:13px; text-decoration:underline; cursor:pointer; padding:0; text-transform:none; letter-spacing:0; }
  .lp-weigh{ float:right; background:none; border:none; color:var(--navy); font-weight:700; font-size:13px; text-decoration:underline; cursor:pointer; padding:0; text-transform:none; letter-spacing:0; }
  .lp-baby .nn-tag{ align-self:center; margin:0; font-size:12px; padding:3px 10px; }
  .nn-row{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:10px 0 6px; }
  .nn-num{ font-family:'Jost',system-ui,sans-serif; font-weight:700; font-size:18px; color:var(--navy); margin-right:4px; }
  .nn-row .nn-tag{ align-self:center; margin:0; font-size:12px; padding:3px 10px; }

  .nn-chip{ border:1px solid var(--line); background:var(--card); border-radius:999px; padding:8px 14px; font-weight:600; font-size:14px; cursor:pointer; color:var(--ink); }

  /* Needs attention groups */

  /* every row: text on the left, one action in a fixed column, the snooze clock always at the far right */
  body.look-ribbon .rb-gb .todo-main{ display:grid; grid-template-columns:minmax(0,1fr) 108px 44px; align-items:center; gap:6px 8px; }
  body.look-ribbon .rb-gb .todo-top{ display:contents; }
  body.look-ribbon .rb-gb .todo-text{ grid-column:1; grid-row:1; min-width:0; }
  body.look-ribbon .rb-gb .todo-acts{ grid-column:2; grid-row:1; margin:0; display:flex; gap:8px; }
  body.look-ribbon .rb-gb .todo-clock{ grid-column:3; grid-row:1; width:44px; height:44px; justify-content:center; padding:0; }
  body.look-ribbon .rb-gb .todo-acts .btn{ flex:1 1 0; width:100%; min-width:0; padding-left:6px; padding-right:6px; }
  /* rows with two or three buttons: buttons get their own full-width line, clock stays at the far right of the first line */
  body.look-ribbon .rb-gb .todo-main:has(.todo-acts .btn:nth-child(2)){ grid-template-columns:minmax(0,1fr) 44px; }
  body.look-ribbon .rb-gb .todo-main:has(.todo-acts .btn:nth-child(2)) .todo-acts{ grid-column:1 / -1; grid-row:2; }
  body.look-ribbon .rb-gb .todo-main:has(.todo-acts .btn:nth-child(2)) .todo-clock{ grid-column:2; }
  /* rows with no buttons */
  body.look-ribbon .rb-gb .todo-main:not(:has(.todo-acts)){ grid-template-columns:minmax(0,1fr) 44px; }
  body.look-ribbon .rb-gb .todo-main:not(:has(.todo-acts)) .todo-clock{ grid-column:2; }
  body.look-ribbon .rb-gb .todo-text{ font-size:15px; }

  /* ===== RIBBON LOOK END ===== */
  @media print{
    /* display:none (not visibility:hidden) so the rest of the app
       contributes zero layout height during print — otherwise the
       normal screen content, though invisible, still occupies its
       full height and can push pagination to a spurious near-blank
       second page once it's taller than the printable page area. */
    body > *:not(#printPedigree){ display:none !important; }
    body{ padding-bottom:0 !important; margin:0 !important; }
    #printPedigree{ position:static; }
  }

<script>
if (window.pdfjsLib) { pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js'; }
const SUPABASE_URL = 'https://xzsclktdryieozfvtqkv.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_pSzehmsrfUstMmwI4zjX-w_4SsNkvdI';
// If a saved login exists on this device, show "Signing you in…" instead of flashing the login form.
try{
  let _saved=false;
  for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && /^sb-.*-auth-token$/.test(k)){ _saved=true; break; } }
  if(_saved){ document.body.classList.add('restoring'); setTimeout(()=>document.body.classList.remove('restoring'),8000); }
}catch(e){}
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
let currentUser = null;
let myProfile = null, isAdminUser = false, adminSelf = null, viewingAsCustomer = null;
let localSandboxMode = false;
// Which account the rabbit/planned/etc. data in memory belongs to. Writes are refused
// unless this matches the account being written to, so data from one account can never
// be saved into another during a sign-in, sign-out or admin "view as customer" switch.
let memoryOwner = null;
function accountMemoryId(){ return viewingAsCustomer ? viewingAsCustomer.id : (currentUser ? currentUser.id : null); }
let cloudDataCache = {};
let cloudDataReady = false;

// Keep a read-only path to the old browser storage so the first login can
// migrate an existing local HerdNerd Pro dataset on this device into the cloud.
const legacyStorage = {
  get: async (key)=>{ const v=localStorage.getItem('cjm_'+key); if(v===null) throw new Error('not found'); return {value:v}; },
  set: async (key,val)=>{ localStorage.setItem('cjm_'+key,val); return {ok:true}; }
};

// Bumped on every initCloudStorage call so an older, slower-to-resolve
// call can tell it's been superseded and discard its own result instead
// of clobbering cloudDataCache after a newer call already finished
// loading. Without this, two overlapping loads (e.g. the auth listener
// firing more than once during sign-in) could race: the fast one
// finishes with the real data, the slow one finishes after it and
// overwrites that with whatever it saw (possibly nothing yet) — and
// cloudDataReady being true the whole time meant a save could fire
// and permanently commit that half-loaded state. This was the likely
// mechanism behind a real account-wiping incident (see
// supabase_barn_data_atomic_save_migration.sql for the matching
// database-side fix, which is the half of this that actually matters
// most: even with this guard, a save should never be able to replace
// real data with nothing).
let cloudInitToken = 0;
async function initCloudStorage(user, opts){
  const myToken = ++cloudInitToken;
  clearAccountMemory();   // nothing from the previous account may stay in memory
  currentUser = user;
  cloudDataReady = false; // no save can go through until THIS load actually finishes
  const {data:row,error} = await sb.from('barn_data').select('data').eq('user_id',user.id).maybeSingle();
  if(myToken !== cloudInitToken) return; // a newer call superseded this one — discard, don't apply
  if(error) throw error;
  if(row && row.data){
    cloudDataCache = row.data || {};
  } else {
    cloudDataCache = {};
    // A brand-new account starts completely empty. It used to copy any old HerdNerd data found in this browser
    // into the new account; that is switched off so nothing left on a device (old or demo data) can ever land in a
    // new account. The old data is not touched; it simply stays where it is.
    const legacyKeys = [];
    for(const key of legacyKeys){
      try{ cloudDataCache[key] = JSON.parse((await legacyStorage.get(key)).value); }catch(e){
        try{ cloudDataCache[key] = (await legacyStorage.get(key)).value; }catch(ignore){}
      }
    }
  }
  if(myToken !== cloudInitToken) return; // re-check: a newer call could have started during the legacy-migration awaits above
  cloudDataReady = true;
  window.storage = {
    get: async (key)=>{
      if(!cloudDataReady) throw new Error('Cloud storage is not ready');
      if(!(key in cloudDataCache)) throw new Error('not found');
      const v=cloudDataCache[key];
      return {value:typeof v==='string'?v:JSON.stringify(v)};
    },
    // Saves go through the set_barn_data_key database function
    // (supabase_barn_data_atomic_save_migration.sql) instead of
    // reading cloudDataCache's full contents and upserting the whole
    // thing. That old approach meant any single save silently
    // overwrote EVERY key for the account with whatever the browser's
    // copy currently held — including, if the browser's copy was ever
    // incomplete, wiping out real data the browser just hadn't loaded
    // yet. The database function instead updates only the one key
    // being saved, atomically, and refuses to replace a populated
    // list with an empty one unless explicitly forced — so a stale or
    // half-loaded browser session can no longer destroy data it never
    // actually saw.
    set: async (key,val)=>{
      if(!cloudDataReady || !currentUser) throw new Error('Not signed in');
      if(memoryOwner !== accountMemoryId()) throw new Error('This account\u2019s data is still loading');
      let parsed;
      try{ parsed=JSON.parse(val); }catch(e){ parsed=val; }
      const oldVal = cloudDataCache[key];
      // Nothing changed since this list was loaded or last saved: skip the database call. The database already
      // holds exactly this, so nothing is lost, and it stops identical copies piling up in the save history.
      try{ if((key in cloudDataCache) && JSON.stringify(oldVal)===JSON.stringify(parsed)) return {ok:true, unchanged:true}; }catch(e){}
      cloudDataCache[key]=parsed;
      const rpcArgs = { p_key:key, p_value:parsed };
      // Admin "view as customer" writes to the customer's row, not the
      // signed-in admin's own — set_barn_data_key checks the caller is
      // actually an admin before honoring p_target_user.
      if(viewingAsCustomer && adminSelf) rpcArgs.p_target_user = viewingAsCustomer.id;
      const {error} = await sb.rpc('set_barn_data_key', rpcArgs);
      if(error){
        cloudDataCache[key] = oldVal; // roll the in-memory copy back — it was never actually saved
        if(/REFUSED_EMPTY_OVERWRITE/.test(error.message||'')){
          showToast("That change wasn't saved — it looked like it would erase existing data, so it was blocked to be safe. Try again, and let us know if this keeps happening.");
        }
        throw error;
      }
      if(viewingAsCustomer && adminSelf){
        sb.from('audit_log').insert({
          admin_id: adminSelf.id, customer_id: viewingAsCustomer.id,
          table_name: 'barn_data', row_id: key,
          // Only the basics are recorded: who (admin_id), which account (customer_id), which item (row_id) and when (created_at). No copy of the data itself.
          old_value: null, new_value: {changed:true}
        }).then(()=>{}, ()=>{});
      }
      return {ok:true};
    }
  };
}

async function loadMyProfile(){
  try{
    const {data} = await sb.from('profiles').select('*').eq('id',currentUser.id).maybeSingle();
    myProfile = data || null;
  }catch(e){ myProfile = null; }
  isAdminUser = !!(myProfile && myProfile.role==='admin');
  if(isAdminUser) adminSelf = { id: currentUser.id, email: currentUser.email };
}
async function checkMySupportAccess(){
  if(localSandboxMode) return null;
  try{
    const {data} = await sb.from('support_access').select('*').eq('customer_id',currentUser.id).gt('expires_at', new Date().toISOString()).order('expires_at',{ascending:false}).limit(1).maybeSingle();
    return data || null;
  }catch(e){ return null; }
}
async function adminViewCustomer(customerId, customerEmail){
  if(!isAdminUser) return;
  try{
    await saveChain.catch(()=>{});   // let any save in progress finish for the current account first
    await initCloudStorage({ id:customerId, email:customerEmail }, {noLegacy:true});
    viewingAsCustomer = { id:customerId, email:customerEmail };
    closeSheet();
    await loadData();
    showToast('Now viewing '+customerEmail);
  }catch(e){
    // Could not open it: go back to the admin's own account instead of leaving a half-switched screen.
    viewingAsCustomer = null;
    try{ await initCloudStorage(adminSelf, {noLegacy:true}); await loadData(); }catch(e2){ console.error(e2); }
    showToast('Could not load that account — check they granted support access.');
  }
}
async function adminExitCustomerView(){
  if(!adminSelf) return;
  await saveChain.catch(()=>{});
  viewingAsCustomer = null;
  await initCloudStorage(adminSelf, {noLegacy:true});
  await loadData();
  showToast('Back to your own account');
}

function moneyPeriodRange(period){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  if(period==='thismonth'){ const s=new Date(y,m,1), e=new Date(y,m+1,0); return [s.toISOString().slice(0,10), e.toISOString().slice(0,10)]; }
  if(period==='lastmonth'){ const s=new Date(y,m-1,1), e=new Date(y,m,0); return [s.toISOString().slice(0,10), e.toISOString().slice(0,10)]; }
  if(period==='thisyear'){ return [y+'-01-01', y+'-12-31']; }
  return [null,null];
}
function inMoneyPeriod(dateStr, period){
  if(!dateStr) return false;
  if(period==='alltime') return true;
  const [s,e] = moneyPeriodRange(period);

// as the same name. Only used for comparing; stored names are never rewritten.
function nameKey(s){

function repointName(oldName, newName){

    if(x.sireName && nameKey(x.sireName)===o) x.sireName=newName;
    if(x.damName && nameKey(x.damName)===o) x.damName=newName;
    if(x.partner && nameKey(x.partner)===o) x.partner=newName;

// Photos used to live inside the main rabbit record, so EVERY save (even a
// weight edit) re-sent every photo. Now each photo is kept in its own small
// record ("photo_v1_<id>") and is only written when that photo is new or
// changed. The main rabbit record keeps just each photo's id/category/date.
// In memory every photo still carries its dataUrl, so the rest of the app is
// unchanged. A photo is only left out of the main record once its own record
// is confirmed saved; if a photo's own record can't be saved, that photo stays
// inline exactly as before, so a problem here can never block other saves.
const PHOTO_KEY_PREFIX = 'photo_v1_';

async function hydratePhotos(){

          if(typeof v==='string' && v.indexOf('data:')===0){ p.dataUrl = v; photoSavedMap.set(p.id, v); }

function shrinkDataUrl(dataUrl){

    img.onload = ()=>{ try{ resolve(encodeToBudget(img, 0, 0, img.naturalWidth, img.naturalHeight)); }catch(e){ reject(e); } };

async function optimizeStoredPhotos(){

// One file with everything in the signed-in person's own account, saved to their own
// device. "Add back" only adds what is missing (matched by ID); it never changes or
// removes anything already in the account.
function backupAccountId(){ return (currentUser && currentUser.id) ? String(currentUser.id) : 'local'; }
function fullBackupObject(){
  return { app:'HerdNerd Pro', version:1, savedAt:new Date().toISOString(), accountId: backupAccountId(),
    rabbits, planned, events:customEvents, shows, expenses, pedigreeSettings, trash, waitlist, kitTags:customKitTags, projects, traits, quickPicks, alertPrefs, reminders:customReminders };
}
function downloadFullBackup(){
  const blob = new Blob([JSON.stringify(fullBackupObject())], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'herdnerd-backup-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function addBackFromBackup(text){
  let b; try{ b = JSON.parse(text); }catch(e){ return {error:'That file could not be read.'}; }
  if(!b || b.app!=='HerdNerd Pro' || !Array.isArray(b.rabbits)) return {error:'That does not look like a HerdNerd Pro backup file.'};
  if(!b.accountId || b.accountId !== backupAccountId()) return {error:'That backup is from a different account, so nothing was added. Backups can only be added back to the account they came from.'};
  const have = new Set(rabbits.map(r=>r.id)); let nr=0;
  b.rabbits.forEach(r=>{ if(r && r.id && !have.has(r.id)){ rabbits.push(r); have.add(r.id); nr++; } });
  const addMissing = (arr,list)=>{ const ids=new Set(list.map(x=>x.id)); let n=0; (Array.isArray(arr)?arr:[]).forEach(x=>{ if(x && x.id && !ids.has(x.id)){ list.push(x); ids.add(x.id); n++; } }); return n; };
  addMissing(b.waitlist,waitlist);
  // Projects, Carries, Quick picks, kit tags: add-only, never replace or remove what is here
  const nk0 = projects.length+traits.length+quickPicks.length+customKitTags.length+customReminders.length;
  addMissing(b.projects,projects); addMissing(b.traits,traits); addMissing(b.quickPicks,quickPicks); addMissing(b.reminders,customReminders);
  (Array.isArray(b.kitTags)?b.kitTags:[]).forEach(t=>{ if(typeof t==='string' && t && !customKitTags.includes(t)) customKitTags.push(t); });
  // Rabbits already here: fill in only what is blank (never overwrite)
  const bById = new Map(b.rabbits.filter(x=>x&&x.id).map(x=>[x.id,x]));
  rabbits.forEach(r=>{ const o=bById.get(r.id); if(!o||o===r) return;
    if(Array.isArray(o.projects)&&o.projects.length){ r.projects=Array.isArray(r.projects)?r.projects:[]; o.projects.forEach(id=>{ if(!r.projects.includes(id)) r.projects.push(id); }); }
    if(o.carries&&typeof o.carries==='object'){ r.carries=r.carries||{}; Object.keys(o.carries).forEach(k=>{ if(!(k in r.carries)) r.carries[k]=o.carries[k]; }); }
    if(Array.isArray(o.weightLog)&&o.weightLog.length){ r.weightLog=Array.isArray(r.weightLog)?r.weightLog:[]; const ids=new Set(r.weightLog.map(w=>w.id)); o.weightLog.forEach(w=>{ if(w&&w.id&&!ids.has(w.id)) r.weightLog.push(w); }); }
  });
  const nk = projects.length+traits.length+quickPicks.length+customKitTags.length+customReminders.length-nk0;
  const np=addMissing(b.planned,planned), ne=addMissing(b.events,customEvents), ns=addMissing(b.shows,shows), nx=addMissing(b.expenses,expenses);
  ensureRabbitFieldDefaults();
  return {nr,np,ne,ns,nx,nk};
}

// Phones and browsers keep old copies of the app. Every so often (and whenever the app
// comes back to the front) this quietly asks the website for the current version number.
// If a newer version exists it shows a small "Refresh" bar. It never reloads by itself,
// so nobody loses what they are typing, and it never touches anyone's data.
const APP_VERSION = '2026-10-22-tourlive';
let updateBannerShown = false;
async function checkForNewVersion(){
  if(updateBannerShown) return;
  try{
    const res = await fetch(location.pathname + (location.search ? location.search+'&' : '?') + 'v=' + Date.now(), {cache:'no-store'});
    if(!res.ok) return;
    const text = await res.text();
    const m = text.match(/const APP_VERSION\s*=\s*'([^']+)'/);
    if(!m || m[1] === APP_VERSION) return;
    updateBannerShown = true;
    const bar = document.createElement('div');
    bar.id = 'updateBar';
    bar.style.cssText = 'position:fixed;left:12px;right:12px;bottom:84px;z-index:60;background:var(--navy);color:var(--page);padding:10px 14px;border-radius:12px;display:flex;align-items:center;gap:10px;font-family:Jost,sans-serif;font-size:13.5px;box-shadow:0 4px 16px rgba(0,0,0,.25);';
    bar.innerHTML = '<span style="flex:1;">A new version of HerdNerd Pro is ready.</span><button id="updateRefresh" style="background:var(--gold);color:#0c1830;border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-family:Jost,sans-serif;cursor:pointer;">Refresh</button><button id="updateLater" aria-label="Later" style="background:none;border:none;color:inherit;font-size:20px;cursor:pointer;opacity:.7;">&times;</button>';
    document.body.appendChild(bar);
    document.getElementById('updateRefresh').onclick = ()=>location.reload();
    document.getElementById('updateLater').onclick = ()=>bar.remove();
  }catch(e){ /* offline or local file: nothing to do */ }
}
setTimeout(checkForNewVersion, 20000);
setInterval(checkForNewVersion, 30*60*1000);

function weightsOf(r){ return (r.weightLog||[]).filter(w=>w&&w.date&&isFinite(Number(w.oz))).slice().sort((a,b)=>b.date.localeCompare(a.date)); }
function carryKitHistory(dam, k, rabbit){
  if(!dam||!k||!rabbit) return false;
  let changed=false;
  rabbit.weightLog = rabbit.weightLog||[];
  (k.weights||[]).forEach(w=>{
    if(!w||!w.date||!isFinite(Number(w.oz))) return;
    if(rabbit.weightLog.some(x=>x.fromKit===k.id && x.date===w.date && Number(x.oz)===Number(w.oz))) return;
    rabbit.weightLog.push({id:uid(), date:w.date, oz:Number(w.oz), source:'litter', fromKit:k.id}); changed=true;
  });
  const kp=kitPhotoOf(dam,k);

  if(kp && kp.dataUrl && !rabbit.photos.some(x=>x.fromKit===k.id) && !rabbitMainPhoto(rabbit)){
    rabbit.photos.push({id:uid(), category:'Primary', dataUrl:kp.dataUrl, addedAt:kp.addedAt||todayStr(), fromKit:k.id}); changed=true;
  }

// one-time catch-up for kits that already became juniors before this existed; runs once per rabbit, then marks it done
function backfillKitHistory(){
  let any=false;
  rabbits.forEach(d=>(d.litterKits||[]).forEach(k=>{
    if(!k.individualId) return;
    const kr=rabbits.find(x=>x.id===k.individualId); if(!kr || kr.kitHistoryCopied) return;

// One typed weight field. A plain number is pounds ("3.4" = 3.4 lb). Units can be typed:
// "3 lb 4 oz", "3lb4oz", "14 oz", "3 lbs". Returns {oz} on success, {} when empty, {error} when it can't be read.
function parseWeightText(text){
  const t=String(text==null?'':text).trim().toLowerCase().replace(/,/g,'.');
  if(!t) return {};
  let m=t.match(/^(\d+(?:\.\d+)?|\.\d+)$/);
  if(m){ const v=parseFloat(m[1]); if(!(v>0)) return {error:'Enter a weight'}; if(v>20) return {error:'Add lb or oz, like 14 oz or 3 lb 4 oz'}; return {oz:Math.round(v*16*10)/10}; }
  m=t.match(/^(?:(\d+(?:\.\d+)?|\.\d+)\s*(?:lbs?|pounds?|#)\.?)?\s*(?:(\d+(?:\.\d+)?|\.\d+)\s*(?:oz|ounces?)\.?)?$/);
  if(m && (m[1]||m[2])){ const oz=(m[1]?parseFloat(m[1])*16:0)+(m[2]?parseFloat(m[2]):0); if(oz>0) return {oz:Math.round(oz*10)/10}; }
  return {error:'Try 3.4, 3 lb 4 oz, or 14 oz'};
}
function weightPreviewText(text){
  const w=parseWeightText(text); if(w.oz) return '= '+ozText(w.oz); return w.error&&String(text).trim()?w.error:'';
}

// A suggestion only: counts offspring whose typed color contains the trait's name. It never changes anything.
function offspringColors(r){
  const out=new Map();   // kitId or rabbitId -> color
  const add=(id,c)=>{ if(id && !out.has(id)) out.set(id,c||''); };
  const fromKits=(kits)=>(kits||[]).forEach(k=>{ const lk=k.individualId?rabbits.find(x=>x.id===k.individualId):null; add(lk?lk.id:(k.id||uid()), (lk&&lk.color)||k.color||''); });
  if(r.sex==='doe'){
    fromKits(r.litterKits); (r.breedingHistory||[]).forEach(e=>fromKits(e.litterKits));
    rabbits.forEach(x=>{ if(x.id!==r.id && x.damName && nameKey(x.damName)===nameKey(r.name)) add(x.id,x.color); });
  } else {
    rabbits.forEach(d=>{
      if(d.sex!=='doe') return;
      (d.breedingHistory||[]).forEach(e=>{ if(e.partner && nameKey(e.partner)===nameKey(r.name)) fromKits(e.litterKits); });
      if(d.litterKits && d.partner && nameKey(d.partner)===nameKey(r.name) && !(d.breedingHistory||[]).some(e=>e.litterKits===d.litterKits)) fromKits(d.litterKits);
    });
    rabbits.forEach(x=>{ if(x.id!==r.id && x.sireName && nameKey(x.sireName)===nameKey(r.name)) add(x.id,x.color); });
  }
  return [...out.values()];
}
function carriesHint(r, trait){
  const cols=offspringColors(r).filter(c=>String(c).trim());
  const key=trait.name.trim().toLowerCase(); if(!key||!cols.length) return '';
  const n=cols.filter(c=>String(c).toLowerCase().includes(key)).length;
  if(!n) return '';
  return `Hint: ${n} of ${cols.length} kit${cols.length===1?'':'s'} with a color listed ${n===1?'was':'were'} listed as ${esc(trait.name)}. Only you can mark Carries.`;
}

function palpateKey(r){ return r.activeBreedingId || r.bredDate || ''; }

function ymdLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function nextRemDate(date,repeat){
  if(repeat==='weekly') return addDays(date,7);
  const d=new Date(date+'T00:00:00'), day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+1);
  d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate())); return ymdLocal(d);
}
function remEffDate(x){ return (x.snoozeUntil && x.snoozeUntil>x.date) ? x.snoozeUntil : x.date; }
function remActive(x){ return !x.removed && !x.done; }
function remRepeatLabel(x){ return x.repeat==='weekly'?'Repeats weekly':x.repeat==='monthly'?'Repeats monthly':''; }
function completeReminder(x){
  const snap={date:x.date,done:x.done,doneDate:x.doneDate,snoozeUntil:x.snoozeUntil};
  if(x.repeat==='weekly'||x.repeat==='monthly'){ let n=nextRemDate(x.date,x.repeat); const t=todayStr(); while(n<=t) n=nextRemDate(n,x.repeat); x.date=n; x.snoozeUntil=null; }
  else { x.done=true; x.doneDate=todayStr(); }
  return ()=>{ x.date=snap.date; x.done=snap.done; x.doneDate=snap.doneDate; x.snoozeUntil=snap.snoozeUntil; };
}

function watchProjectsFor(r,traitId){ return projOf(r).filter(p=>(p.warn||[]).includes(traitId)); }
function warnBoxHTML(doe, buck){
  if(!doe||!buck||!projects.length||!traits.length) return '';
  const out=[];
  projects.forEach(p=>{
    const watch=(p.warn||[]).map(id=>traits.find(t=>t.id===id)).filter(Boolean);
    if(!watch.length) return;
    if(!inProject(doe,p.id) && !inProject(buck,p.id)) return;
    watch.forEach(t=>{
      const a=carryState(doe,t.id), b=carryState(buck,t.id);
      if(a==='no'&&b==='no') return;
      const w=x=>x==='yes'?'carries':x==='no'?"doesn't carry":'unknown';
      out.push(`${esc(p.name)} &mdash; ${esc(t.name)}: ${esc(doe.name)} ${w(a)}, ${esc(buck.name)} ${w(b)}`);
    });
  });
  return out.length?`<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line,#E7DDC6);"><b>Project notes:</b><br>${out.map(l=>'&bull; '+l).join('<br>')}</div>`:'';
}

// ===== SAVE GUARD START =====
// Protects every account from a save that would suddenly shrink its data a lot
// (a bug, a half-loaded screen, an old copy of the app). It only compares counts
// with what this screen loaded or last saved; it never reads, copies or sends
// anything anywhere. A deliberate big cleanup can still go through with "Save anyway".
let saveBaseline = null;          // counts when this account was loaded / last saved
let guardOverrideOnce = false;    // set by the "Save anyway" button for one save
function dataFootprint(){
  let kits=0, hist=0;
  (rabbits||[]).forEach(r=>{ kits += (r.litterKits||[]).length; hist += (r.breedingHistory||[]).length; });
  return { n:(rabbits||[]).length, kits, hist };
}
function saveGuardReason(){
  if(!saveBaseline) return '';
  const now = dataFootprint(), b = saveBaseline;
  const drop = (before, after, min, label)=> (before>=min && after < before*0.5) ? (label+' would go from '+before+' down to '+after+'.') : '';
  if(b.n>=1 && now.n===0) return 'This would leave your account with no rabbits (it had '+b.n+').';
  return drop(b.n, now.n, 4, 'Your rabbit list')
      || drop(b.hist, now.hist, 6, 'Your breeding history')
      || drop(b.kits, now.kits, 6, 'The kits saved in your litters')
      || '';
}

// --- Two-device check ---
// Every real save leaves a small random "version stamp" on the account. Before saving,
// this screen asks the server for the current stamp (just that one tiny value). If it
// is not the stamp this screen last saw, another phone/tablet/tab saved in between, so
// this screen is out of date: it refuses to save (so it can't overwrite the newer
// data) and asks the person to refresh. If the server can't be asked, saving proceeds
// as it always did. Old copies of the app that don't know about stamps keep working.
const REV_KEY = 'rev_v1';
let lastRev = null;               // the stamp this screen last loaded or wrote
let revCheckBroken = false;       // set if the stamp can't be read back reliably; the check then stands down instead of blocking saves
async function fetchServerRev(){
  try{
    if(localSandboxMode || !currentUser || typeof sb==='undefined' || !sb) return {ok:false};
    const uid = viewingAsCustomer ? viewingAsCustomer.id : currentUser.id;
    const {data,error} = await sb.from('barn_data').select('rev:data->>'+REV_KEY).eq('user_id',uid).maybeSingle();
    if(error) return {ok:false};
    return {ok:true, rev:(data && data.rev) || null};
  }catch(e){ return {ok:false}; }
}
function showStaleBanner(){
  const el = document.getElementById('saveErrorBanner');
  el.innerHTML = `<div class="seb-text"><b>Your account changed on another device</b>This screen is out of date, so your last change was not saved (nothing was overwritten or lost). Tap Refresh to see the latest, then make the change again.</div><button id="sebRefresh">Refresh</button>`;
  el.classList.add('on');
  document.getElementById('sebRefresh').onclick = ()=>location.reload();
}
// ===== SAVE GUARD END =====
async function doSaveData(opts){
  try{
    const guardWhy = saveGuardReason();
    if(guardWhy && !guardOverrideOnce){ showSaveGuardBanner(guardWhy); return false; }
    guardOverrideOnce = false;
    if(!(opts && opts.quick)){
      if(!revCheckBroken){
        const rv = await fetchServerRev();
        if(rv.ok && rv.rev && rv.rev !== lastRev){ showStaleBanner(); return false; }   // someone else saved since this screen loaded
        if(rv.ok && !rv.rev && lastRev){ revCheckBroken = true; }                          // we stamped before but the server shows none: the check can't be trusted here, so stand down
        else if(rv.ok){
          const newRev = uid();
          try{ await window.storage.set(REV_KEY, newRev, false); lastRev = newRev; }
          catch(re){ revCheckBroken = true; console.warn('Version stamp could not be written; the stale-screen check is standing down so your save still goes through.', re); }
        }
      }
    }
    if(!(opts && opts.quick) && !photoSplitOff){
      for(const r of rabbits){
        for(const p of (r.photos||[])){
          if(!p.dataUrl || photoSavedMap.get(p.id)===p.dataUrl) continue;
          try{ await window.storage.set(PHOTO_KEY_PREFIX+p.id, p.dataUrl, false); photoSavedMap.set(p.id, p.dataUrl); }
          catch(pe){
            console.warn('Photo record could not be saved separately; keeping photos inline for now.', pe);
            photoSplitOff = true; break;
          }
        }
        if(photoSplitOff) break;
      }
    }
    await window.storage.set(RABBITS_KEY, JSON.stringify(rabbitsForStorage()), false);
    saveBaseline = dataFootprint();
    hideSaveError();
    // Free the space of photos that no longer exist (deleted photos or rabbits).
    // Only photos this session actually loaded or saved are ever considered.
    if(!photoSplitOff && rabbits.length && photoSavedMap.size){
      const live = new Set(); rabbits.forEach(r=>(r.photos||[]).forEach(p=>live.add(p.id)));
      trash.forEach(t=>((t.rabbit&&t.rabbit.photos)||[]).forEach(p=>live.add(p.id)));
      for(const id of Array.from(photoSavedMap.keys())){
        if(live.has(id)) continue;
        try{ await window.storage.set(PHOTO_KEY_PREFIX+id, '-', false); photoSavedMap.delete(id); }catch(e){ /* harmless; retried next save */ }
      }
    }
    return true;
  }catch(e){
    console.error(e);
    let why = (e && (e.message||e.details||e.hint)) ? ' Technical detail: '+String(e.message||e.details||e.hint).slice(0,300) : '';
    try{ why += ' (Your rabbit data is currently about '+(JSON.stringify(rabbitsForStorage()).length/1048576).toFixed(1)+' MB.)'; }catch(_){}
    showSaveError("Your last change didn't save, so the editor was left open. This usually means a connection hiccup or a temporary issue reaching your HerdNerd Pro account — check your internet connection and try Save again."+why);
    return false;
  }
}

// Photos live inside the account's data record, so every photo adds to what
// each save has to send. Every stored photo is therefore held to a hard size
// budget: it's resized, then re-encoded at lower quality (and, if still too
// big, smaller dimensions) until it fits. To change the limits, edit the two
// numbers below.
const PHOTO_MAX_DIM = 1400;            // longest side, in pixels
const PHOTO_MAX_BYTES = 200 * 1024;    // about 200 KB per photo
function dataUrlBytes(url){ const c=url.indexOf(','); return Math.ceil((url.length-c-1)*0.75); }
// Draws the chosen part of an image (sx,sy,sw,sh) and returns a JPEG data URL
// that fits PHOTO_MAX_BYTES.
function encodeToBudget(img, sx, sy, sw, sh){
  let scale = Math.min(1, PHOTO_MAX_DIM/Math.max(sw,sh));
  let best = null;
  for(let pass=0; pass<8; pass++){
    const w = Math.max(1,Math.round(sw*scale)), h = Math.max(1,Math.round(sh*scale));
    const c = document.createElement('canvas'); c.width=w; c.height=h;
    const ctx = c.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);   // transparent PNGs become white, not black
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
    for(const q of [0.82,0.72,0.62,0.52]){
      best = c.toDataURL('image/jpeg', q);
      if(dataUrlBytes(best) <= PHOTO_MAX_BYTES) return best;
    }
    scale *= 0.8;   // still too big at the lowest quality: shrink the picture and try again
  }
  return best;      // smallest attempt (only reached for extreme images)
}
function shrinkImageFile(file){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      try{
        if(!img.naturalWidth || !img.naturalHeight) throw new Error('empty image');
        resolve(encodeToBudget(img, 0, 0, img.naturalWidth, img.naturalHeight));
      }catch(e){ reject(e); }
      finally{ URL.revokeObjectURL(url); }
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('unreadable image')); };
    img.src = url;
  });
}
// Adds a photo and only reports success if it actually saved. If the save
// fails the photo is taken back out, so it never looks added when it isn't.
async function addPhotoToRabbit(r, file, category, opts){
  const replaceId = opts && opts.replaceId;
  // One photo per rabbit for now: adding is only allowed when there isn't one
  // yet; otherwise the existing photo has to be replaced.
  if(!replaceId && rabbitMainPhoto(r)){
    showToast('Each rabbit can have one photo for now. Use Replace photo.');
    return false;
  }
  showToast('Adding photo\u2026');
  let dataUrl;
  try{
    dataUrl = (category===PHOTO_KEEP_ORIGINAL)
      ? await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(fr.error); fr.readAsDataURL(file); })
      : await shrinkImageFile(file);
  }catch(e){ console.error(e); showToast("Couldn't read that photo. Try a JPG or PNG."); return false; }
  const prior = r.photos||[];
  const photo = {id:uid(), category, dataUrl, addedAt:todayStr()};
  if(replaceId) archivePhoto(r, prior.find(p=>p.id===replaceId));
  r.photos = (replaceId ? prior.filter(p=>p.id!==replaceId) : prior.slice()).concat([photo]);
  const ok = await saveData();
  if(!ok){
    r.photos = prior;   // nothing was saved: put things back exactly as they were
    if(replaceId && r.removedPhotos) r.removedPhotos.pop();
    showToast("The photo wasn't saved, so it wasn't added. See the red message for details.");
    return false;
  }
  showToast(replaceId ? 'Photo replaced' : 'Photo added');
  return true;
}

function paletteMix(a,b,t){

  let main = p.main;
  for(let i=0;i<12 && paletteContrast(main,page)<4.6;i++) main = paletteMix(main,K,0.08);
  // accent text on the main color (nav, "Pro", banners) must stay readable too
  let accentLight = paletteMix(p.accent,W,0.4);
  for(let i=0;i<10 && paletteContrast(accentLight,main)<4.6;i++) accentLight = paletteMix(accentLight,W,0.15);
  let navDim = paletteMix(main,W,0.6);
  for(let i=0;i<10 && paletteContrast(navDim,main)<5.2;i++) navDim = paletteMix(navDim,W,0.12);
  // the warning red is a fixed status color; only deepen it if a tinted page makes it hard to read
  let rust = '#a34632';

  // the "deep accent" is used as text and as a badge color, so keep it readable
  let deep = paletteMix(p.accent,main,0.6);
  for(let i=0;i<12 && (paletteContrast(deep,W)<4.6 || paletteContrast(deep,page)<4.5);i++) deep = paletteMix(deep,K,0.12);

    '--green':dgreen, '--rust-text':drust,

const ARCHIVED = ['deceased','retired','sold'];
function isArchived(r){ return ARCHIVED.includes(r.status); }
function isActive(r){ return !isArchived(r) && r.status!=='external'; }
function findByName(name){ if(!name) return null; const k=nameKey(name); return rabbits.find(r=>nameKey(r.name)===k || (r.alias&&nameKey(r.alias)===k)); }
function litterAgeDays(r){ return daysBetween(r.litterBornDate, todayStr()); }
function isRebreedReady(r){ return r.status==='nursing' && !!r.rebreedDate && todayStr() >= r.rebreedDate; }
function canRebred(r){ return r.status==='nursing' && (isRebreedReady(r) || !r.litterKits || r.litterKits.length===0); }
function daysToDue(r){ return r.dueDate ? daysBetween(todayStr(), r.dueDate) : null; }
// Once the nest box is marked done for this breeding, it stays done (a later breeding starts fresh).
function nestBoxDone(r){ return !!r.nestBoxAckDate && (!r.bredDate || r.nestBoxAckDate>=r.bredDate); }
function needsNestBox(r){ const d=daysToDue(r); return r.status==='pregnant' && d!==null && d<=nestDays() && !nestBoxDone(r); }
function isOverdue(r){ const d=daysToDue(r); return r.status==='pregnant' && d!==null && d<0; }
function ageDays(r){ return r.dob ? daysBetween(r.dob, todayStr()) : null; }
// Friendly age: "5 days", "6 weeks 2 days", "6 months 3 days", "1 yr 2 mo".
function ageText(born, on){
  if(!born) return '';
  const a=new Date(born+'T00:00:00'), b=new Date((on||todayStr())+'T00:00:00');
  if(isNaN(a)||isNaN(b)||b<a) return '';
  const pl=(n,w)=>n+' '+w+(n===1?'':'s');
  let months=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
  let anchor=new Date(a.getFullYear(), a.getMonth()+months, a.getDate());
  if(anchor>b){ months--; anchor=new Date(a.getFullYear(), a.getMonth()+months, a.getDate()); }
  const n=Math.round((b-a)/86400000);
  if(months<3){
    const w=Math.floor(n/7), d=n%7;
    if(!w) return pl(d,'day');
    return pl(w,'week')+(d?' '+pl(d,'day'):'');
  }
  const rest=Math.round((b-anchor)/86400000);
  if(months>=12){ const y=Math.floor(months/12), m=months%12; return y+' yr'+(m?' '+m+' mo':''); }
  return pl(months,'month')+(rest?' '+pl(rest,'day'):'');
}
// A rabbit is a junior until its 6-month birthday (calendar months, not a day count).
function sixMonthDate(dob){
  const b=new Date(dob+'T00:00:00'); if(isNaN(b)) return null;
  const y=b.getFullYear(), m=b.getMonth()+6, dim=new Date(y,m+1,0).getDate();
  const d=new Date(y,m,Math.min(b.getDate(),dim));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function isUnderSixMonths(r){ const s=r.dob?sixMonthDate(r.dob):null; return !!s && todayStr()<s; }
function inJuniors(r){ return isUnderSixMonths(r) && !['pregnant','nursing'].includes(r.status); }
function isJuniorReady(r){ return r.status==='growing' && r.dob && !isUnderSixMonths(r); }
function bucksCoverage(n){ return rabbits.filter(r=>r.sex==='doe' && r.partner===n && ['pregnant','nursing'].includes(r.status)); }

function levenshtein(a,b){
  a=nameKey(a); b=nameKey(b);
  if(a===b) return 0;
  const m=[]; for(let i=0;i<=b.length;i++) m[i]=[i];
  for(let j=0;j<=a.length;j++) m[0][j]=j;
  for(let i=1;i<=b.length;i++) for(let j=1;j<=a.length;j++)
    m[i][j] = b[i-1]===a[j-1] ? m[i-1][j-1] : Math.min(m[i-1][j-1]+1, m[i][j-1]+1, m[i-1][j]+1);
  return m[b.length][a.length];
}
function fuzzyMatches(name, excludeId){
  const q = nameKey(name);
  if(!q) return [];
  return rabbits.filter(r=>{
    if(r.id===excludeId) return false;
    const n = nameKey(r.name);
    if(n===q) return true;
    // Only flag names close enough in length to plausibly be the same
    // word with a typo — a name that's simply a substring of a much
    // longer one (e.g. "Rose" inside "Roseanna") is a different name,
    // not a typo, so that case no longer counts on its own.
    if(Math.abs(n.length-q.length)>2) return false;
    const maxLen = Math.max(n.length,q.length);
    const tol = maxLen<=7 ? 1 : maxLen<=11 ? 2 : 3;
    if(levenshtein(n,q)<=tol) return true;
    return false;
  }).slice(0,4);
}

function ancestorByPath(startName, path){
  let cur = findByName(startName);
  for(const ch of path){
    if(!cur) return null;
    const nx = ch==='s' ? cur.sireName : cur.damName;
    if(!nx) return null;
    cur = findByName(nx) || {name:nx, external:true};
  }
  return cur;
}
function getAncestorMap(name, maxD){
  const map = new Map();
  (function walk(n,d){
    if(!n||d>maxD) return;
    const k=nameKey(n);
    if(!map.has(k)||map.get(k).depth>d) map.set(k,{depth:d,name:n});
    const r=findByName(n); if(r){ walk(r.sireName,d+1); walk(r.damName,d+1); }
  })(name,0);
  return map;
}
function genWord(n){ return n===1?'parent':n===2?'grandparent':n===3?'great-grandparent':'great-great-grandparent'; }
function relatednessSummary(doeName, buckName){
  if(!doeName||!buckName) return {close:false, any:false, closeness:'', lines:[], text:'Select both a doe and a buck to check relatedness.'};
  const dm=getAncestorMap(doeName,4), bm=getAncestorMap(buckName,4);
  const lines=[];
  // direct line: one is on the other's pedigree
  if(dm.has(nameKey(buckName))) lines.push(`${buckName} is ${genWord(dm.get(nameKey(buckName)).depth)} of ${doeName}`);
  if(bm.has(nameKey(doeName))) lines.push(`${doeName} is ${genWord(bm.get(nameKey(doeName)).depth)} of ${buckName}`);
  dm.delete(nameKey(doeName)); bm.delete(nameKey(buckName));
  const shared=[];
  dm.forEach((info,k)=>{ if(bm.has(k)) shared.push({name:info.name, dd:info.depth, bd:bm.get(k).depth}); });
  if(!shared.length && !lines.length) return {close:false, any:false, closeness:'', lines:[], text:'No shared ancestors found within 4 generations on file. (Pedigree data may be incomplete.)'};
  // same sire / same dam / both
  const dr=findByName(doeName), br=findByName(buckName);
  const same=(a,b)=>a&&b&&nameKey(a)===nameKey(b);
  if(dr&&br){
    const ss=same(dr.sireName,br.sireName), sd=same(dr.damName,br.damName);
    if(ss&&sd) lines.push(`Same sire and dam (${dr.sireName} and ${dr.damName})`);
    else if(ss) lines.push(`Same sire (${dr.sireName})`);
    else if(sd) lines.push(`Same dam (${dr.damName})`);
  }
  shared.sort((a,b)=>(a.dd+a.bd)-(b.dd+b.bd)).forEach(s2=>{
    if(s2.dd===1&&s2.bd===1) return;   // already stated above as same sire / same dam
    lines.push(`${s2.name} is ${genWord(s2.dd)} of ${doeName} and ${genWord(s2.bd)} of ${buckName}`);
  });
  return {close:false, any:true, closeness:'', lines, text:'Shared ancestry on file: '+lines.join('; ')};
}
function relateBoxHTML(rel){
  if(!rel.any) return esc(rel.text);
  return `<b>On file:</b><br>`+rel.lines.map(l=>`&bull; ${esc(l)}`).join('<br>');
}

/* ---------------- RELATIVES ----------------
   Pick one rabbit (or ancestor) and see everyone in your records who is related
   to it, and how. Nothing is worked out until a rabbit is picked, and only that
   rabbit's family is walked. Rabbits link by sire/dam NAME, same as pedigrees. */
let relativesLine = 'direct';   // 'direct' (parents/grandparents up, kids down) | 'all' (adds siblings, aunts, cousins...)
let relativesScope = 'everyone';   // 'everyone' | 'herd'
const REL_NO_NAME = new Set(['','?','unknown','n/a','na','none','-']);
function relKey(n){ const k=nameKey(n); return REL_NO_NAME.has(k)?'':k; }
function relBuildIndex(){
  const idx=new Map();
  rabbits.forEach(r=>{ const k=relKey(r.name); if(k && !idx.has(k)) idx.set(k,r); });
  rabbits.forEach(r=>{ const k=relKey(r.alias); if(k && !idx.has(k)) idx.set(k,r); });
  return idx;
}
// Everything above one name, nearest first: Map(key -> {depth, name, child}) where child is the
// name one step down toward the starting rabbit (used to draw the path).
function relAncestors(startName, idx, maxD){
  const start=relKey(startName), out=new Map();
  if(!start) return out;
  out.set(start,{depth:0,name:startName,child:null});
  let frontier=[start];
  for(let d=1; d<=maxD && frontier.length; d++){
    const next=[];
    frontier.forEach(k=>{
      const r=idx.get(k); if(!r) return;
      [r.sireName, r.damName].forEach(pn=>{
        const pk=relKey(pn);
        if(pk && !out.has(pk)){ out.set(pk,{depth:d,name:idx.get(pk)?idx.get(pk).name:pn,child:k}); next.push(pk); }
      });
    });
    frontier=next;
  }
  return out;
}
function relPathDown(map, fromKey){   // names from an ancestor down to the starting rabbit
  const names=[]; let k=fromKey, guard=0;
  while(k && guard++<20){ const e=map.get(k); if(!e) break; names.push(e.name); k=e.child; }
  return names;
}
function relArrow(names){ return names.map(esc).join(' &rarr; '); }
function relOrdinal(depth, isMale, kind){   // kind 'up' or 'down'
  const up = kind==='up';
  if(depth===1) return up ? (isMale?'Father':'Mother') : (isMale?'Son':'Daughter');
  const base = up ? (isMale?'grandfather':'grandmother') : (isMale?'grandson':'granddaughter');
  if(depth===2) return base.charAt(0).toUpperCase()+base.slice(1);
  return 'Great-'.repeat(depth-2)+base;
}
function relativesOf(target, scope){
  const idx=relBuildIndex();
  const tKey=relKey(target.name);
  const mT=relAncestors(target.name, idx, 6);
  const MAXD=6, MAXSUM=7;
  const groups={anc:[],sib:[],kid:[],aunt:[],other:[]};
  const targetMale = target.sex==='buck';
  rabbits.forEach(r=>{
    if(r===target || r.id===target.id) return;
    const rk=relKey(r.name); if(!rk || rk===tKey) return;
    if(scope==='herd' && !isActive(r)) return;
    const male=r.sex==='buck';
    // R is above the target
    if(mT.has(rk)){
      const d=mT.get(rk).depth;
      const path=relPathDown(mT, rk);
      groups.anc.push({r, dist:d, label: d===1 ? relOrdinal(1,male,'up') : relOrdinal(d,male,'up')+' &middot; '+relArrow(path)});
      return;
    }
    const mR=relAncestors(r.name, idx, MAXD);
    // R is below the target
    if(mR.has(tKey)){
      const d=mR.get(tKey).depth;
      const path=relPathDown(mR, tKey);
      groups.kid.push({r, dist:d, label: relOrdinal(d,male,'down')+(d===1?'':' &middot; '+relArrow(path))});
      return;
    }
    // otherwise find the closest shared ancestor
    let best=null;
    mT.forEach((eT,k)=>{
      if(k===tKey) return;
      const eR=mR.get(k); if(!eR || k===rk) return;
      const sum=eT.depth+eR.depth;
      if(sum>MAXSUM) return;
      if(!best || sum<best.sum || (sum===best.sum && Math.max(eT.depth,eR.depth)<Math.max(best.dT,best.dR))) best={k,dT:eT.depth,dR:eR.depth,sum};
    });
    if(!best) return;
    const {dT,dR,k}=best;
    if(dT===1 && dR===1){
      const tS=relKey(target.sireName), tD=relKey(target.damName), rS=relKey(r.sireName), rD=relKey(r.damName);
      const sameSire = !!tS && tS===rS, sameDam = !!tD && tD===rD;
      let label;
      if(sameSire && sameDam) label='Full '+(male?'brother':'sister')+' (same sire and dam)';
      else if(sameSire) label='Half-'+(male?'brother':'sister')+', through sire '+esc(target.sireName);
      else label='Half-'+(male?'brother':'sister')+', through dam '+esc(target.damName);
      groups.sib.push({r,dist:1,label});
    } else if(dT===2 && dR===1){
      groups.aunt.push({r,dist:3,label:(male?'Uncle':'Aunt')+' &middot; '+relArrow(relPathDown(mR,k))});
    } else if(dT===1 && dR===2){
      groups.aunt.push({r,dist:3,label:(male?'Nephew':'Niece')+' &middot; '+relArrow(relPathDown(mR,k))});
    } else {
      groups.other.push({r,dist:best.sum,label:relArrow(relPathDown(mR,k))});
    }
  });
  const byName=(a,b)=>a.dist-b.dist || a.r.name.localeCompare(b.r.name);
  Object.values(groups).forEach(g=>g.sort(byName));
  return groups;
}
function relRowHTML(it){
  const r=it.r, tappable = r.status!=='external';
  const dim = !(isActive(r)||r.status==='external');
  return `<div class="card no-tap" ${tappable?`data-relopen="${r.id}"`:''} style="margin-bottom:8px; ${dim?'opacity:.8;':''} ${tappable?'cursor:pointer;':''}">
    <div class="card-top"><div><div class="card-name">${esc(r.name)}</div><div class="card-sub">${subLine(r)}</div></div>${r.status==='external'?'<span class="badge b-gone">ANCESTOR</span>':statusBadge(r)}</div>
    <div class="rel-path"><span class="rel-arrow">&#8627;</span> ${it.label}</div>
  </div>`;
}
function openRelativesSheet(target){

  add('PARENTS & GRANDPARENTS', g.anc);

  const extra=g.sib.length+g.aunt.length+g.other.length;
  const total=g.anc.length+g.kid.length+(direct?0:extra);
  openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button>
    <h2>Relatives</h2>

    <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:4px;">
      <div class="card-sub" style="margin:0;">${total} ${total===1?'relative':'relatives'}<br>${relativesScope==='herd'?'in your herd':'in your records'}</div>
      <div class="seg" style="flex:none; width:230px;"><button type="button" data-relscope="everyone" class="${relativesScope==='everyone'?'on':''}">Everyone</button><button type="button" data-relscope="herd" class="${relativesScope==='herd'?'on':''}">Herd only</button></div>
    </div>
    <div class="seg" style="margin:6px 0 8px;"><button type="button" data-relline="direct" class="${direct?'on':''}">Direct line</button><button type="button" data-relline="all" class="${direct?'':'on'}">All relatives${direct&&extra?' (+'+extra+')':''}</button></div>
    ${total ? parts.join('') : `<div class="empty">${direct&&extra?'No direct-line relatives found. Tap All relatives to see siblings, aunts and cousins.<br><br>':''}No relatives found for ${esc(target.name)}${relativesScope==='herd'?' in your herd':''}.<br>${(target.sireName||target.damName)?'':'This rabbit has no sire or dam on file, so there is nothing to connect.'}</div>`}`);

    const hits=rabbits.filter(r=>nameKey(r.name).includes(k) || (r.alias&&nameKey(r.alias).includes(k)) || (r.earNumber&&nameKey(r.earNumber)===k))
      .sort((a,b)=>{ const as=nameKey(a.name).startsWith(k)?0:1, bs=nameKey(b.name).startsWith(k)?0:1; return as-bs || a.name.localeCompare(b.name); }).slice(0,8);

}

  // already bred or nursing, who stay visible with the breeding does).

function statusBadge(r){
  const s=r.status;
  if(s==='pregnant') return isOverdue(r)?`<span class="badge b-urgent">OVERDUE</span>`:needsNestBox(r)?`<span class="badge b-urgent">NEST BOX &middot; ${daysToDue(r)===0?'TODAY':daysToDue(r)+'D'}</span>`:`<span class="badge b-preg">BRED</span>`;
  if(s==='nursing') return isRebreedReady(r)?`<span class="badge b-urgent">READY TO REBREED</span>`:`<span class="badge b-nurse">ON A LITTER</span>`;
  if(s==='reserved') return `<span class="badge b-reserved">RESERVED</span>`;
  if(s==='sold') return `<span class="badge b-sold">SOLD</span>`;
  if(s==='deceased') return `<span class="badge b-gone">DECEASED</span>`;
  if(s==='retired') return `<span class="badge b-gone">RETIRED</span>`;
  if(s==='resting') return `<span class="badge b-rest">RESTING</span>`;
  if(s==='growing') return `<span class="badge b-grow">GROWING</span>`;

}
function subLine(r){

  } else if(r.status==='nursing'){
    const rem=r.rebreedDate?daysBetween(todayStr(),r.rebreedDate):null;

function allLittersList(){
  const out=[];
  rabbits.filter(r=>r.sex==='doe').forEach(r=>{
    const seen=new Set();
    (r.breedingHistory||[]).forEach(e=>{ if(e.outcome==='litter' && e.litterBornDate){ seen.add(e.litterBornDate); out.push({doe:r, born:e.litterBornDate, n:(e.litterKits||[]).length, current:r.status==='nursing'&&r.litterBornDate===e.litterBornDate}); } });
    if(r.litterBornDate && !seen.has(r.litterBornDate)) out.push({doe:r, born:r.litterBornDate, n:(r.litterKits||[]).length, current:r.status==='nursing'});
  });
  return out.sort((a,b)=>b.born.localeCompare(a.born));
}
function renderNewNursery(main){
  const nursing=rabbits.filter(r=>r.sex==='doe'&&r.status==='nursing').sort((a,b)=>(a.litterBornDate||'').localeCompare(b.litterBornDate||''));

  main.querySelectorAll('[data-nnwean]').forEach(b=>b.onclick=(ev)=>{ ev.stopPropagation(); const r=rabbits.find(x=>x.id===b.dataset.nnwean); if(r) openWeanPlanSheet(r); });

  bindLitterToggle(main);

// ----- litter page, loss records (new litter view) -----
const LOSS_TAGS = ['Fader','Peanut','DOA','Unknown'];
function lossBucket(tag){ return tag==='DOA'?'DOA':tag==='Peanut'?'peanut':'passed'; }
function syncLitterEntry(r){
  const e=(r.breedingHistory||[]).find(x=>x.outcome==='litter' && x.litterBornDate===r.litterBornDate);
  if(e){ e.litterKits=r.litterKits; e.litterDead=r.litterDead; e.weanDate=r.weanDate; e.sellDate=r.sellDate; e.litterLosses=r.litterLosses; e.litterNotes=r.litterNotes; }
}
function bumpDead(r, tag, by){
  r.litterDead = r.litterDead || {DOA:0,peanut:0,passed:0};
  const b=lossBucket(tag); r.litterDead[b] = Math.max(0,(r.litterDead[b]||0)+by);
}
function litterChanged(r){ r.lastLitterSummary=litterSummaryText(r); syncLitterEntry(r); saveData(); render(); }
function openLossSheet(r, lossId, after){
  const losses = r.litterLosses = r.litterLosses || [];
  const existing = lossId ? losses.find(x=>x.id===lossId) : null;
  const kits = r.litterKits||[];
  const free = kits.map((k,i)=>({k,i})).filter(x=>!x.k.individualId);
  let tag = existing ? existing.tag : '';
  openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button>
    <h2>${existing?'Edit loss':'Record a loss'}</h2>
    <div class="field"><label>Date</label><input type="date" id="ls-date" value="${esc(existing?existing.date:todayStr())}"></div>
    <div class="field"><label>What happened</label>
      <div class="nn-chips" id="ls-tags">${LOSS_TAGS.map(t=>`<button type="button" class="nn-chip" data-tag="${t}">${t}</button>`).join('')}</div>
      <input id="ls-custom" placeholder="Or write your own" autocomplete="off" value="${esc(existing && !LOSS_TAGS.includes(existing.tag)?existing.tag:'')}" style="margin-top:8px;"></div>
    ${!existing && free.length?`<div class="field"><label>Which kit</label><select id="ls-kit">${free.map(x=>`<option value="${x.i}">#${x.k.num||x.i+1}${x.k.sex?' · '+(x.k.sex==='buck'?'Buck':'Doe'):''}${x.k.color?' · '+esc(x.k.color):''}</option>`).join('')}</select></div>`:''}
    <div class="field"><label>Notes</label><textarea id="ls-notes" rows="2" placeholder="Optional">${esc(existing?existing.notes||'':'')}</textarea></div>
    <div class="sheet-actions"><button class="btn btn-secondary" onclick="closeSheet()">Cancel</button><button class="btn btn-primary" id="ls-save">Save</button></div>
    ${existing?'<button class="lit-delete" id="ls-remove">Remove this loss</button>':''}`);
  const paint=()=>document.querySelectorAll('#ls-tags .nn-chip').forEach(b=>b.classList.toggle('on', b.dataset.tag===tag));
  document.querySelectorAll('#ls-tags .nn-chip').forEach(b=>b.onclick=()=>{ tag=(tag===b.dataset.tag?'':b.dataset.tag); document.getElementById('ls-custom').value=''; paint(); });
  document.getElementById('ls-custom').oninput=()=>{ tag=''; paint(); };
  paint();
  const finish=()=>{ closeSheet(); litterChanged(r); if(after) after(); };
  document.getElementById('ls-save').onclick=()=>{
    const date=csvParseDate(document.getElementById('ls-date').value)||todayStr();
    const custom=document.getElementById('ls-custom').value.trim();
    const useTag = custom || tag || 'Unknown';
    const notes=document.getElementById('ls-notes').value.trim();
    if(existing){
      if(lossBucket(existing.tag)!==lossBucket(useTag)){ bumpDead(r,existing.tag,-1); bumpDead(r,useTag,1); }
      existing.date=date; existing.tag=useTag; existing.notes=notes;
    } else {
      kits.forEach((k,i)=>{ if(!k.num) k.num=i+1; });   // keep each kit's original number
      let removed=null;
      const sel=document.getElementById('ls-kit');
      if(sel){ const idx=+sel.value; if(kits[idx] && !kits[idx].individualId) removed=kits.splice(idx,1)[0]; }
      losses.push({id:uid(), date, tag:useTag, notes, kit:removed});
      bumpDead(r,useTag,1);
    }
    finish();
  };
  const rm=document.getElementById('ls-remove');
  if(rm) rm.onclick=()=>armConfirm(rm,'Tap again to confirm',()=>{
    if(existing.kit){ (r.litterKits=r.litterKits||[]).push(existing.kit); r.litterKits.sort((a,b)=>(a.num||99)-(b.num||99)); }
    bumpDead(r,existing.tag,-1);
    r.litterLosses=losses.filter(x=>x.id!==existing.id);
    finish();
  });
}
function litterDateRows(r){
  const rows=[['wean','Wean (6 weeks)',r.weanDate],['sell','Ready to go (8 weeks)',r.sellDate],['rebreed','Rebreed',r.rebreedDate]].filter(x=>x[2]);
  return rows.sort((a,b)=>a[2].localeCompare(b[2]));
}
function tagClass(t){ return t==='For sale'?'t-sale':t==='Reserved'?'t-res':t==='Sold'?'t-sold':t==='Keeping'?'t-keep':'t-other'; }
function addKitToLitter(r){
  const kits=r.litterKits=r.litterKits||[];
  kits.forEach((k,i)=>{ if(!k.num) k.num=i+1; });
  const nk=blankKit(); nk.num=kits.reduce((m,k)=>Math.max(m,k.num||0),0)+1;
  kits.push(nk); litterChanged(r);
  return nk;
}
function changeBornDate(r, v){
  const yr=+String(v).slice(0,4), ty=new Date().getFullYear();
  if(!v || yr<ty-15 || yr>ty+1){ showToast('Check the born date — it says '+(v?fmtDate(v):'nothing')); return false; }
  const old=r.litterBornDate; if(!old || old===v) return false;
  const he=(r.breedingHistory||[]).find(x=>x.outcome==='litter' && x.litterBornDate===old);
  if(r.weanDate===addDays(old,42)) r.weanDate=addDays(v,42);       // dates you set by hand are left alone
  if(r.sellDate===addDays(old,56)) r.sellDate=addDays(v,56);
  if(r.rebreedDate===addDays(old,28)) r.rebreedDate=addDays(v,28);
  r.litterBornDate=v; if(he) he.litterBornDate=v;
  (r.removedKits||[]).forEach(x=>{ if(x.litterBorn===old) x.litterBorn=v; });
  (r.litterKits||[]).forEach(k=>{ if(k.individualId){ const kr=rabbits.find(z=>z.id===k.individualId); if(kr) kr.dob=v; } });
  syncLitterEntry(r); r.lastLitterSummary=litterSummaryText(r); saveData(); render(); return true;
}
function openLitterDatesSheet(r, after){
  const rows=[['born','Born',r.litterBornDate],['wean','Wean (6 weeks)',r.weanDate],['sell','Ready to go (8 weeks)',r.sellDate],['rebreed','Rebreed',r.rebreedDate]].filter(x=>x[2]);
  openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button><h2>Litter dates</h2>
    <div class="card-sub" style="margin-bottom:10px;">Change a date and it saves right away. Changing the born date moves the wean and ready-to-go dates with it.</div>
    <div class="lit-card">${rows.map(([k,l,d])=>`<div class="st-row" style="padding:8px 0;"><div class="st-lbl" style="font-weight:600;">${l}</div><input type="date" data-lpdate="${k}" value="${esc(d)}" style="max-width:170px;"></div>`).join('')}</div>
    <div class="sheet-actions"><button class="btn btn-primary" id="ld-done">Done</button></div>`);
  document.querySelectorAll('[data-lpdate]').forEach(inp=>inp.onchange=()=>{
    const v=csvParseDate(inp.value); if(!v) return;
    const k=inp.dataset.lpdate;
    if(k==='born'){ if(changeBornDate(r,v)) openLitterDatesSheet(r,after); else inp.value=r.litterBornDate; return; }
    if(k==='wean') r.weanDate=v; else if(k==='sell') r.sellDate=v; else r.rebreedDate=v;
    syncLitterEntry(r); saveData(); render();
  });
  document.getElementById('ld-done').onclick=()=>{ closeSheet(); if(after) after(); };
}
function babyRowInner(k,i){

function openLitterPage(damId){
  const r=rabbits.find(x=>x.id===damId); if(!r) return;
  const kits=r.litterKits||[], losses=r.litterLosses||[];
  const sireN=litterSireName(r); const sire=sireN?findByName(sireN):null;

    <div class="lit-card lp-hero">

      <div class="lp-agebar"><span>Born ${nb(esc(fmtShort(r.litterBornDate)))}</span><i></i><b>${esc(litterAgeText(r.litterBornDate))} old</b></div>

  const dt=document.getElementById('lp-dates'); if(dt) dt.onclick=()=>openLitterDatesSheet(r,again);
  document.getElementById('lp-notes').onblur=()=>{ const v=document.getElementById('lp-notes').value; if(v!==(r.litterNotes||'')){ r.litterNotes=v; syncLitterEntry(r); saveData(); } };
  document.getElementById('lp-edit').onclick=()=>openKindledSheet(r,true);
  document.getElementById('lp-ped').onclick=()=>openLitterPedigreeSheet(r);

// ----- kit tags + weaning plan (new litter view) -----
const KIT_TAGS_KEY='kitTags_v1';
const BUILTIN_KIT_TAGS=['For sale','Reserved','Sold'];
const DEFAULT_CUSTOM_KIT_TAGS=['Keeping','Pet','Cull','Hold'];
let customKitTags = DEFAULT_CUSTOM_KIT_TAGS.slice();
function allKitTags(){ return BUILTIN_KIT_TAGS.concat(customKitTags); }
function setKitTag(k, tag){ k.tag = tag||''; k.forSale = (tag==='For sale'); }
async function saveKitTags(){
  if(!kitTagsSafe){ showToast("Your kit tags didn't load, so they can't be changed right now. Refresh and try again."); return false; }
  try{ await window.storage.set(KIT_TAGS_KEY, JSON.stringify(customKitTags), false); return true; }
  catch(e){ showToast("Couldn't save — check your connection and try again."); return false; }
}
const MAX_CUSTOM_KIT_TAGS = 8;

      ${full?`<div class="card-sub" style="margin-bottom:10px;">You have ${MAX_CUSTOM_KIT_TAGS} tags. Remove one to add another.</div>`:`<div class="field"><label>Add a tag</label><input id="kt-new" placeholder="e.g. Show prospect" maxlength="24" autocomplete="off"></div>`}

    document.getElementById('kt-done').onclick=()=>{ closeSheet(); if(typeof after==='function') after(); };
    document.querySelectorAll('[data-rmtag]').forEach(b=>b.onclick=async()=>{ customKitTags.splice(+b.dataset.rmtag,1); await saveKitTags(); draw(); });
    const add=document.getElementById('kt-add');
    if(add) add.onclick=async()=>{
      const v=document.getElementById('kt-new').value.trim(); if(!v) return;
      if(customKitTags.length>=MAX_CUSTOM_KIT_TAGS){ showToast('Up to '+MAX_CUSTOM_KIT_TAGS+' of your own tags'); return; }
      if(allKitTags().some(t=>t.toLowerCase()===v.toLowerCase())){ showToast('That tag already exists'); return; }
      customKitTags.push(v); await saveKitTags(); draw();
    };
  };
  draw();
}

    openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button><h2>Wean ${esc(shortName(r.name))}’s litter</h2>

          ${x.k.sex==='buck'||x.k.sex==='doe'?'':`<div class="field"><label>Sex</label><select data-wpsex="${x.i}"><option value="">Pick…</option><option value="doe" ${x.sex==='doe'?'selected':''}>Doe</option><option value="buck" ${x.sex==='buck'?'selected':''}>Buck</option></select></div>`}
          <div class="field" style="margin-top:8px;"><label>Name</label><input data-wpname="${x.i}" value="${esc(x.name)}" placeholder="${esc(autoName(x))}" autocomplete="off"></div>
          <div class="nn-chips" style="margin-top:8px;">${['For sale','Reserved'].map(c=>`<button type="button" class="nn-chip ${x.tag===c?'on':''}" data-wp="${x.i}" data-c="${c}">${c}</button>`).join('')}</div></div>`).join('')}

    document.querySelectorAll('[data-wp]').forEach(b=>b.onclick=()=>{ const x=plan[+b.dataset.wp]; x.tag=(x.tag===b.dataset.c?'':b.dataset.c); draw(); });
    document.querySelectorAll('[data-wpname]').forEach(i=>i.oninput=()=>{ plan[+i.dataset.wpname].name=i.value; });
    document.querySelectorAll('[data-wpsex]').forEach(i=>i.onchange=()=>{ plan[+i.dataset.wpsex].sex=i.value; });
    document.getElementById('wp-go').onclick=()=>{
      for(const x of open){
        if(x.sex!=='buck' && x.sex!=='doe'){ showToast('Pick a sex for kit #'+(x.k.num||x.i+1)); return; }
        const nm=(x.name||'').trim();
        if(nm && rabbits.some(z=>nameKey(z.name)===nameKey(nm))){ showToast('A rabbit named “'+nm+'” already exists — pick another name'); return; }
      }
      const names=new Set();
      for(const x of open){ const nm=(x.name||'').trim(); if(nm){ const nk=nameKey(nm); if(names.has(nk)){ showToast('Two kits have the same name'); return; } names.add(nk); } }
      open.forEach(x=>{
        x.k.sex=x.sex;
        let nm=(x.name||'').trim() || autoName(x);
        if(!(x.name||'').trim() && rabbits.some(z=>nameKey(z.name)===nameKey(nm))) nm+=` (${r.litterBornDate})`;
        const kit=blankRabbit({ name:nm, sex:x.sex, breed:r.breed, color:x.k.color||'', dob:r.litterBornDate, sireName:litterSireName(r), damName:r.name, status:'growing', forSale:(x.tag==='For sale') });

  draw();
}

// When a doe has a new litter, kits from her previous litter that were never placed become juniors.
function unplacedKits(r){ return (r.litterKits||[]).map((k,i)=>({k,i})).filter(x=>!x.k.individualId && x.k.tag!=='Sold' && x.k.tag!=='Cull'); }
function convertOldKitsToJuniors(r, sexes){
  const pend=unplacedKits(r); let made=0;
  pend.forEach(x=>{
    const sx=(x.k.sex==='buck'||x.k.sex==='doe')?x.k.sex:(sexes[x.i]||'doe');
    let name=`${r.name} x ${litterSireName(r)||'?'} — ${sx==='buck'?'Buck':'Doe'} ${x.k.num||x.i+1}`;
    if(rabbits.some(z=>nameKey(z.name)===nameKey(name))) name+=` (${r.litterBornDate})`;
    x.k.sex=sx;
    const kit=blankRabbit({ name, sex:sx, breed:r.breed, color:x.k.color||'', dob:r.litterBornDate, sireName:litterSireName(r), damName:r.name, status:'growing', forSale:(x.k.tag==='For sale') });
    rabbits.push(kit); x.k.individualId=kit.id; carryKitHistory(r,x.k,kit); kit.kitHistoryCopied=true; made++;
  });
  if(made){ syncLitterEntry(r); showToast(made+' kit'+(made===1?'':'s')+' from the last litter became juniors'); }
}
function oldKitsNoticeHTML(r){
  const pend=unplacedKits(r); if(!pend.length) return '';
  const need=pend.filter(x=>x.k.sex!=='buck'&&x.k.sex!=='doe');
  return `<div class="lit-card"><span class="lit-label">Her last litter</span>
    <div class="card-sub">${pend.length} kit${pend.length===1?'':'s'} from her last litter ${pend.length===1?'isn’t':'aren’t'} placed yet. They’ll become juniors when you save this litter.</div>
    ${need.map(x=>`<div class="field" style="margin-top:8px;"><label>Kit #${x.k.num||x.i+1} &middot; ${esc(x.k.color||'color?')} — sex</label><select data-pjs="${x.i}"><option value="">Pick…</option><option value="doe">Doe</option><option value="buck">Buck</option></select></div>`).join('')}</div>`;
}

// ----- kit sales into Financials, and the waitlist (new litter view) -----
function findKitById(kitId){
  for(const d of rabbits){
    for(const k of (d.litterKits||[])) if(k.id===kitId) return {dam:d,kit:k};
    for(const e of (d.breedingHistory||[])) for(const k of (e.litterKits||[])) if(k.id===kitId) return {dam:d,kit:k,entry:e};
  }
  return null;
}
// every unplaced kit with a sale on record, from current litters and past litters, each counted once
function soldKitPseudoRabbits(){
  const seen=new Set(), out=[];
  rabbits.forEach(d=>{
    const lists=[d.litterKits||[]].concat((d.breedingHistory||[]).map(e=>e.litterKits||[]));
    lists.forEach(list=>list.forEach((k,ki)=>{
      if(!k || !k.id || seen.has(k.id) || k.individualId || !k.sale || k.tag!=='Sold') return;
      seen.add(k.id);
      out.push({ id:'kit:'+k.id, name:`${d.name}'s litter — kit #${k.num||ki+1}`, status:'sold', sale:k.sale, _kit:true });
    }));
  });
  return out;
}
