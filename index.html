      <div class="card-actions"><button class="btn btn-secondary" id="bk-full-add" ${lockedBk?'disabled':''}>Add back what is missing</button></div></div>
    <div class="section-label">DOWNLOAD YOUR DATA (CSV)</div>
    <div class="card no-tap"><div class="card-detail">Downloads plain spreadsheet files you can open in Excel, Numbers, or Google Sheets — one for your rabbits, and separate ones for breeding history, planned breedings, calendar events, shows, and expenses. Photos, weight logs, and note logs aren't included in CSV, since spreadsheets can't hold that kind of detail.</div>
      <div class="card-actions"><button class="btn btn-primary" id="bk-download-all">Download all as CSV</button></div></div>
    <div class="section-label">RESTORE FROM CSV</div>
    <div class="card no-tap"><div class="card-detail">Upload the <b>rabbits.csv</b> file from a previous download to restore your rabbit list. This matches by ID where possible, so restoring won't duplicate rabbits you already have. Optionally add the other CSV files too, including expenses. <b>Photos, weight logs, and note logs can't be restored this way.</b></div>
      <div class="field" style="margin-top:10px;"><label>rabbits.csv (required)</label><input type="file" id="bk-in-rabbits" accept=".csv"></div>
      <div class="field"><label>breeding_history.csv (optional)</label><input type="file" id="bk-in-breeding" accept=".csv"></div>
      <div class="field"><label>planned.csv (optional)</label><input type="file" id="bk-in-planned" accept=".csv"></div>
      <div class="field"><label>events.csv (optional)</label><input type="file" id="bk-in-events" accept=".csv"></div>
      <div class="field"><label>shows.csv (optional)</label><input type="file" id="bk-in-shows" accept=".csv"></div>
      <div class="field"><label>expenses.csv (optional)</label><input type="file" id="bk-in-expenses" accept=".csv"></div>
      <div class="card-actions"><button class="btn btn-danger" id="bk-restore">Restore from these files</button></div></div>`;

  if(!lockedBk){
    document.getElementById('bk-full-dl').onclick = ()=>{ downloadFullBackup(); showToast('Backup downloaded'); };
    document.getElementById('bk-full-add').onclick = async ()=>{
      const f = document.getElementById('bk-full-in').files[0];
      if(!f){ showToast('Choose a backup file first'); return; }
      const text = await new Promise(res=>{ const rd=new FileReader(); rd.onload=()=>res(rd.result); rd.onerror=()=>res(null); rd.readAsText(f); });
      const out = text ? addBackFromBackup(text) : {error:'That file could not be read.'};
      if(out.error){ showToast(out.error); return; }
      await saveData(); await savePlanned(); await saveEvents(); await saveShows(); await saveExpenses();
      await saveWaitlist(); await saveProjects(); await saveTraits(); await saveQuickPicks(); await saveKitTags(); await saveReminders();
      render();
      const total = out.nr+out.np+out.ne+out.ns+out.nx+(out.nk||0);
      showToast(total ? ('Added back '+out.nr+' rabbit'+(out.nr===1?'':'s')+(total-out.nr?' and '+(total-out.nr)+' other item'+((total-out.nr)===1?'':'s'):'')) : 'Nothing was missing — everything in that file is already here');
    };
  }
  document.getElementById('bk-download-all').onclick = ()=>{
    downloadCSV('rabbits.csv', toCSV(rabbits.map(rabbitToCsvRow), RABBIT_CSV_COLUMNS));
    const breedingRows=[];
    rabbits.forEach(r=>{ if(r.sex==='doe') (r.breedingHistory||[]).forEach(e=>{
      breedingRows.push({ doeName:r.name, partner:e.partner||'', bredDate:e.bredDate||'', outcome:e.outcome||'',
        litterBornDate:e.litterBornDate||'', numKits:(e.litterKits||[]).length||'' });
    }); });
    downloadCSV('breeding_history.csv', toCSV(breedingRows, BREEDING_CSV_COLUMNS));
    downloadCSV('planned.csv', toCSV(planned.map(p=>({doeName:p.doeName||'', buckName:p.buckName||'', targetDate:p.targetDate||'', notes:p.notes||''})), PLANNED_CSV_COLUMNS));
    downloadCSV('events.csv', toCSV(customEvents.map(e=>({title:e.title||'', date:e.date||''})), EVENTS_CSV_COLUMNS));
    downloadCSV('shows.csv', toCSV(shows.map(s=>({name:s.name||'', entryDeadline:s.entryDeadline||'', showDate:s.showDate||''})), SHOWS_CSV_COLUMNS));
    downloadCSV('expenses.csv', toCSV(expenses.map(e=>({date:e.date||'', category:e.category||'', amount:e.amount||'', note:e.note||''})), EXPENSES_CSV_COLUMNS));
    showToast('Downloading 6 CSV files');
  };

  function readFile(input){
    return new Promise((resolve)=>{
      const f = input.files[0];
      if(!f){ resolve(null); return; }
      const reader = new FileReader();
      reader.onload = ()=>resolve(reader.result);
      reader.readAsText(f);
    });
  }

  let armed=false; const rb=document.getElementById('bk-restore');
  rb.onclick=async ()=>{
    if(!armed){ armed=true; rb.textContent='Tap again to confirm — this adds/updates rabbits from the file'; return; }
    const rabbitsText = await readFile(document.getElementById('bk-in-rabbits'));
    if(!rabbitsText){ showToast('Choose a rabbits.csv file first'); armed=false; rb.textContent='Restore from these files'; return; }
    try{
      const rows = parseCSV(rabbitsText);
      rows.forEach(row=>{
        let existing = row.id ? rabbits.find(x=>x.id===row.id) : null;
        if(!existing) existing = findByName(row.name);
        if(existing) csvRowToRabbit(row, existing);
        else rabbits.push(csvRowToRabbit(row, null));
      });

      const breedingText = await readFile(document.getElementById('bk-in-breeding'));
      if(breedingText){
        parseCSV(breedingText).forEach(row=>{
          const dam = findByName(row.doeName);
          if(dam){
            dam.breedingHistory = dam.breedingHistory || [];
            dam.breedingHistory.push({ id:uid(), partner:row.partner||'', bredDate:row.bredDate||todayStr(),
              outcome:row.outcome||'pending', litterBornDate:row.litterBornDate||null, litterKits:null });
          }
        });
      }
      const plannedText = await readFile(document.getElementById('bk-in-planned'));
      if(plannedText){
        parseCSV(plannedText).forEach(row=>{
          const doe=findByName(row.doeName), buck=findByName(row.buckName);
          planned.push({ id:uid(), doeId:doe?doe.id:null, buckId:buck?buck.id:null, doeName:row.doeName||'', buckName:row.buckName||'',
            targetDate:row.targetDate||todayStr(), notes:row.notes||'' });
        });
      }
      const eventsText = await readFile(document.getElementById('bk-in-events'));
      if(eventsText){
        parseCSV(eventsText).forEach(row=>{ customEvents.push({ id:uid(), title:row.title||'', date:row.date||todayStr() }); });
      }
      const showsText = await readFile(document.getElementById('bk-in-shows'));
      if(showsText){
        parseCSV(showsText).forEach(row=>{ shows.push({ id:uid(), name:row.name||'', entryDeadline:row.entryDeadline||todayStr(), showDate:row.showDate||'' }); });
      }
      const expensesText = await readFile(document.getElementById('bk-in-expenses'));
      if(expensesText){
        parseCSV(expensesText).forEach(row=>{
          const amt = Number(row.amount)||0;
          const isDup = expenses.some(x=>x.date===row.date && x.category===row.category && Number(x.amount)===amt && (x.note||'')===(row.note||''));
          if(!isDup) expenses.push({ id:uid(), date:row.date||todayStr(), category:row.category||'Other', amount:amt, note:row.note||'' });
        });
      }

      ensureRabbitFieldDefaults();
      saveData(); savePlanned(); saveEvents(); saveShows(); saveExpenses();
      currentTab='home'; render(); showToast('Restored from CSV');
    }catch(e){ console.error(e); showToast("Couldn't read that file — check it's a CSV exported from here."); }
  };
}

function contextualActions(r){
  const acts=[];
  if(r.status==='pregnant'){ acts.push(['kindled','Kindled'],['lost','Not bred']); }
  else if(r.status==='nursing'){ if(canRebred(r)) acts.push(['rebred','Rebred']); acts.push(['wean','Weaned'],['editlitter','Edit litter']); }
  else if(isArchived(r)){ acts.push(['unarchive','Return to roster']); }
  else if(r.status==='growing'){ acts.push(['graduate','Move to '+(r.sex==='doe'?'Does':'Bucks')]); }
  else if(r.sex==='doe'){ acts.push(['bred','Record breeding'],['plan','Plan a breeding']); if(r.status==='open'||r.status==='resting') acts.push(['kindled','Kindled']); }
  acts.push(['win','Add win']);
  acts.push(['relatives','Relatives']);
  return acts;
}

function wireProfileTab(r){
  document.querySelectorAll('[data-pa]').forEach(b=>{
    b.onclick=()=>{
      const a=b.dataset.pa;
      if(a==='kindled') openKindledSheet(r);
      else if(a==='editlitter') openKindledSheet(r,true);
      else if(a==='editbreed') openEditBreedingSheet(r);
      else if(a==='lost') armConfirm(b,'Tap again to confirm',()=>{ markLitterLost(r); saveData(); renderProfile(); render(); showToast(r.name+' marked open'); });
      else if(a==='rebred'||a==='bred') openBreedSheet(r);
      else if(a==='plan'){ openAddPlannedSheet(r.id); }
      else if(a==='wean'){ if(litterUiOn){ openWeanPlanSheet(r); } else { r.status='open'; saveData(); renderProfile(); render(); showToast(r.name+' weaned'); } }
      else if(a==='graduate'){ if(isUnderSixMonths(r)){ showToast(r.name+' stays in Juniors until '+fmtDate(sixMonthDate(r.dob))); return; } r.status=r.sex==='doe'?'open':'available'; saveData(); renderProfile(); render(); showToast(r.name+' moved to '+(r.sex==='doe'?'Does':'Bucks')); }
      else if(a==='unarchive') openUnarchive(r);
      else if(a==='edit') openEditSheet(r, renderProfile);
      else if(a==='pedigree'){ profileTab='pedigree'; renderProfile(); }
      else if(a==='addweight'){ openAddWeightSheet(r); }
      else if(a==='addphoto'){ profileTab='photos'; renderProfile(); }
      else if(a==='addnote'){ profileTab='notes'; renderProfile(); }
      else if(a==='litters'){ profileTab='breeding'; renderProfile(); }
      else if(a==='openlitter'){ openLitterPage(r.id); }
      else if(a==='win'){ openWinsSheet(r); }
      else if(a==='relatives'){ openRelativesSheet(r); }

    };
  });
  document.querySelectorAll('[data-premedit]').forEach(b=>b.onclick=()=>{ const x=customReminders.find(q=>q.id===b.dataset.premedit); if(x) openReminderSheet(x, renderProfile); });

/* ============================================================
   PHOTO VIEWER — full-size view with pinch/wheel zoom + pan,
   plus a crop tool that writes the cropped result back in place.

let pvState = null; // { rabbitId, photoId, mode:'view'|'crop', scale, tx, ty }

function openPhotoViewer(r, photo){
  pvState = { rabbitId:r.id, photoId:photo.id, mode:'view', scale:1, tx:0, ty:0 };
  renderPhotoViewer();
  document.getElementById('photoViewer').classList.add('on');
}
function closePhotoViewer(){
  document.getElementById('photoViewer').classList.remove('on');
  document.getElementById('photoViewer').innerHTML='';
  pvState=null;
}
function renderPhotoViewer(){
  if(!pvState) return;
  const r = rabbits.find(x=>x.id===pvState.rabbitId);
  const photo = r && (r.photos||[]).find(p=>p.id===pvState.photoId);
  const el = document.getElementById('photoViewer');
  if(!r || !photo){ closePhotoViewer(); return; }
  const cropping = pvState.mode==='crop';
  el.innerHTML = `
    <div class="pv-topbar">
      <button class="pv-icon-btn" id="pvClose" aria-label="Close">&times;</button>
      <div class="pv-title">Photo</div>
      <button class="pv-icon-btn" id="pvDelete" aria-label="Delete">&#128465;</button>
    </div>
    <div class="pv-stage" id="pvStage">
      <img id="pvImg" src="${photo.dataUrl}" draggable="false">
      ${cropping ? `<div class="pv-crop-mask"></div><div class="pv-crop-box" id="pvCropBox">
        <div class="pv-crop-handle" data-h="nw"></div><div class="pv-crop-handle" data-h="ne"></div>
        <div class="pv-crop-handle" data-h="sw"></div><div class="pv-crop-handle" data-h="se"></div>
      </div>` : `<div class="pv-hint">Pinch or scroll to zoom &middot; drag to pan</div>`}
    </div>
    <div class="pv-bottombar">
      ${cropping
        ? `<button class="btn btn-secondary" id="pvCropCancel">Cancel</button><button class="btn btn-primary" id="pvCropApply">Apply crop</button>`
        : `<button class="btn btn-secondary" id="pvCropBtn">Crop</button>`}
    </div>`;
  wirePhotoViewer(r, photo);
}
function pvApplyTransform(){
  const img=document.getElementById('pvImg'); if(!img) return;
  img.style.transform = `translate(${pvState.tx}px, ${pvState.ty}px) scale(${pvState.scale})`;
}
function wirePhotoViewer(r, photo){
  document.getElementById('pvClose').onclick = closePhotoViewer;
  const delBtn = document.getElementById('pvDelete');
  delBtn.onclick = ()=>{
    armConfirm(delBtn, 'Tap again to delete', ()=>{
      archivePhoto(r,photo); r.photos = (r.photos||[]).filter(p=>p.id!==photo.id);
      saveData(); closePhotoViewer(); renderProfile(); showToast('Photo deleted');
    });
  };

  if(pvState.mode==='view'){
    const stage = document.getElementById('pvStage');
    const img = document.getElementById('pvImg');
    pvApplyTransform();
    const pointers = new Map();
    let lastDist = null, lastMid = null;

    function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
    function mid(a,b){ return {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; }
    function clampPan(){
      const maxPan = Math.max(0, (pvState.scale-1)) * (stage.clientWidth/2) + 40;
      pvState.tx = Math.max(-maxPan, Math.min(maxPan, pvState.tx));
      pvState.ty = Math.max(-maxPan, Math.min(maxPan, pvState.ty));
    }

    stage.onpointerdown = (e)=>{
      stage.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if(pointers.size===2){
        const [a,b] = [...pointers.values()];
        lastDist = dist(a,b); lastMid = mid(a,b);
      }
    };
    stage.onpointermove = (e)=>{
      if(!pointers.has(e.pointerId)) return;
      const prev = pointers.get(e.pointerId);
      const cur = {x:e.clientX, y:e.clientY};
      pointers.set(e.pointerId, cur);
      if(pointers.size===2){
        const [a,b] = [...pointers.values()];
        const d = dist(a,b), m = mid(a,b);
        if(lastDist){
          const factor = d/lastDist;
          pvState.scale = Math.max(1, Math.min(5, pvState.scale*factor));
        }
        if(lastMid){ pvState.tx += m.x-lastMid.x; pvState.ty += m.y-lastMid.y; }
        lastDist = d; lastMid = m;
        clampPan(); pvApplyTransform();
      } else if(pointers.size===1 && pvState.scale>1){
        pvState.tx += cur.x-prev.x; pvState.ty += cur.y-prev.y;
        clampPan(); pvApplyTransform();
      }
    };
    function endPointer(e){
      pointers.delete(e.pointerId);
      if(pointers.size<2){ lastDist=null; lastMid=null; }
    }
    stage.onpointerup = endPointer;
    stage.onpointercancel = endPointer;
    stage.onwheel = (e)=>{
      e.preventDefault();
      const factor = e.deltaY<0 ? 1.12 : 1/1.12;
      pvState.scale = Math.max(1, Math.min(5, pvState.scale*factor));
      clampPan(); pvApplyTransform();
    };
    stage.ondblclick = ()=>{
      pvState.scale = pvState.scale>1 ? 1 : 2.5;
      pvState.tx=0; pvState.ty=0;
      pvApplyTransform();
    };
    document.getElementById('pvCropBtn').onclick = ()=>{
      pvState.mode='crop'; pvState.scale=1; pvState.tx=0; pvState.ty=0;
      renderPhotoViewer();
    };
  } else {
    wireCropMode(r, photo);
  }
}
function wireCropMode(r, photo){
  const img = document.getElementById('pvImg');
  const box = document.getElementById('pvCropBox');
  document.getElementById('pvCropCancel').onclick = ()=>{ pvState.mode='view'; renderPhotoViewer(); };

  function initBox(){
    const ir = img.getBoundingClientRect();
    const w = ir.width*0.8, h = ir.height*0.8;
    box.dataset.x = ir.left + (ir.width-w)/2;
    box.dataset.y = ir.top + (ir.height-h)/2;
    box.dataset.w = w; box.dataset.h = h;
    paintBox();
  }
  function paintBox(){
    const stage = document.getElementById('pvStage').getBoundingClientRect();
    box.style.left = (parseFloat(box.dataset.x)-stage.left)+'px';
    box.style.top = (parseFloat(box.dataset.y)-stage.top)+'px';
    box.style.width = box.dataset.w+'px';
    box.style.height = box.dataset.h+'px';
  }
  // Wait a frame so the image has its natural rendered size before measuring.
  requestAnimationFrame(()=>requestAnimationFrame(initBox));

  const MIN=40;
  function imgBounds(){ return img.getBoundingClientRect(); }

  box.onpointerdown = (e)=>{
    if(e.target.closest('.pv-crop-handle')) return;
    e.preventDefault();
    box.setPointerCapture(e.pointerId);
    const startX=e.clientX, startY=e.clientY;
    const ox=parseFloat(box.dataset.x), oy=parseFloat(box.dataset.y);
    box.onpointermove = (ev)=>{
      const ib = imgBounds();
      const w=parseFloat(box.dataset.w), h=parseFloat(box.dataset.h);
      let nx = ox + (ev.clientX-startX), ny = oy + (ev.clientY-startY);
      nx = Math.max(ib.left, Math.min(ib.left+ib.width-w, nx));
      ny = Math.max(ib.top, Math.min(ib.top+ib.height-h, ny));
      box.dataset.x=nx; box.dataset.y=ny; paintBox();
    };
    box.onpointerup = ()=>{ box.onpointermove=null; box.onpointerup=null; };
  };

  box.querySelectorAll('.pv-crop-handle').forEach(h=>{
    h.onpointerdown = (e)=>{
      e.stopPropagation(); e.preventDefault();
      h.setPointerCapture(e.pointerId);
      const corner = h.dataset.h;
      const startX=e.clientX, startY=e.clientY;
      const ox=parseFloat(box.dataset.x), oy=parseFloat(box.dataset.y);
      const ow=parseFloat(box.dataset.w), oh=parseFloat(box.dataset.h);
      h.onpointermove = (ev)=>{
        const ib = imgBounds();
        const dx = ev.clientX-startX, dy = ev.clientY-startY;
        let x=ox,y=oy,w=ow,hh=oh;
        if(corner==='se'){ w=ow+dx; hh=oh+dy; }
        else if(corner==='sw'){ x=ox+dx; w=ow-dx; hh=oh+dy; }
        else if(corner==='ne'){ y=oy+dy; w=ow+dx; hh=oh-dy; }
        else if(corner==='nw'){ x=ox+dx; y=oy+dy; w=ow-dx; hh=oh-dy; }
        w=Math.max(MIN,w); hh=Math.max(MIN,hh);
        x=Math.max(ib.left, Math.min(ib.left+ib.width-w, x));
        y=Math.max(ib.top, Math.min(ib.top+ib.height-hh, y));
        // Prevent the box's far edge from being pushed past the image edge as it grows.
        w=Math.min(w, ib.left+ib.width-x); hh=Math.min(hh, ib.top+ib.height-y);
        box.dataset.x=x; box.dataset.y=y; box.dataset.w=w; box.dataset.h=hh;
        paintBox();
      };
      h.onpointerup = ()=>{ h.onpointermove=null; h.onpointerup=null; };
    };
  });

  document.getElementById('pvCropApply').onclick = async ()=>{
    const ib = imgBounds();
    const scaleX = img.naturalWidth/ib.width, scaleY = img.naturalHeight/ib.height;
    const sx = (parseFloat(box.dataset.x)-ib.left)*scaleX;
    const sy = (parseFloat(box.dataset.y)-ib.top)*scaleY;
    const sw = parseFloat(box.dataset.w)*scaleX;
    const sh = parseFloat(box.dataset.h)*scaleY;
    const prevDataUrl = photo.dataUrl;
    photo.dataUrl = encodeToBudget(img, sx, sy, sw, sh);
    const cropSaved = await saveData();
    if(!cropSaved){
      photo.dataUrl = prevDataUrl;
      showToast("The crop wasn't saved, so the original photo was kept.");
      renderPhotoViewer(); renderProfile();
      return;
    }
    pvState.mode='view'; pvState.scale=1; pvState.tx=0; pvState.ty=0;
    renderPhotoViewer(); renderProfile();
    showToast('Photo cropped');
  };
}

/* ============================================================
   CSV IMPORT — parses a CSV, auto-matches columns to fields,
   and asks how to handle any name collisions before committing.
   ============================================================ */
function parseCsvRawRows(text){
  if(text.charCodeAt(0)===0xFEFF) text = text.slice(1); // strip BOM from Excel exports
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"'){ if(next === '"'){ field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\r'){ /* handled by \n */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length===1 && r[0].trim()===''));
}
const CSV_FIELD_ALIASES = {
  name: ['name','rabbit name','rabbit'],
  sex: ['sex','gender'],
  breed: ['breed'],
  color: ['color','colour','color variety','variety','color / variety'],
  earNumber: ['ear #','ear#','ear number','ear tag','eartag'],
  dob: ['dob','date of birth','birthdate','birth date'],
  weight: ['weight','weight lbs','weight (lbs)'],
  legsWins: ['legs wins','legs (wins)','legs','wins'],
  registrationNumber: ['registration #','registration number','reg #','reg number','registration'],
  sireName: ['sire','sire name','father'],
  damName: ['dam','dam name','mother'],
  status: ['status'],
  notes: ['notes','note'],
};
function csvNormalizeHeader(s){ return s.toLowerCase().trim().replace(/[_\-]/g,' ').replace(/\s+/g,' '); }
function mapCsvHeaders(headerRow){
  const map = {};
  headerRow.forEach((h,i)=>{
    const norm = csvNormalizeHeader(h);
    for(const [field,aliases] of Object.entries(CSV_FIELD_ALIASES)){
      if(map[field]===undefined && aliases.includes(norm)) map[field]=i;
    }
  });
  return map;
}
function csvNormalizeSex(s){
  if(!s) return 'doe';
  const v = s.trim().toLowerCase();
  return ['buck','male','m','b'].includes(v) ? 'buck' : 'doe';
}
function isoToSlash(iso){
  const m = (iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${parseInt(m[2])}/${parseInt(m[3])}/${m[1]}` : '';
}
function csvParseDate(s){
  if(!s) return null;
  s = s.trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m){ return `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`; }
  m = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
  if(m){ return `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`; }
  return null; // unrecognized format — left blank rather than guessed wrong
}
let csvImportRows = [];
function openImportCsvSheet(){
  openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button>
    <h2>Import from CSV</h2>
    <div class="card-sub" style="margin-bottom:12px;">Upload a CSV with a header row. Columns like Name, Sex, Breed, Color, Ear #, DOB, Weight, Legs, Sire, Dam, Notes are matched automatically — you don't need exact column names or a particular order. Only Name is required.</div>

}
function handleCsvParsed(text){
  const rows = parseCsvRawRows(text);
  const area = document.getElementById('csvPreviewArea');
  if(rows.length < 2){ area.innerHTML = `<div class="empty">No data rows found in that file.</div>`; return; }
  const headerMap = mapCsvHeaders(rows[0]);
  if(headerMap.name===undefined){
    area.innerHTML = `<div class="dupe-box">Couldn't find a "Name" column in the header row. Rename the column to "Name" and try again.</div>`;
    return;
  }
  const dataRows = rows.slice(1).filter(r=>r.some(c=>c.trim()!==''));
  csvImportRows = dataRows.map(cols=>{
    const get = (field)=> headerMap[field]!==undefined ? (cols[headerMap[field]]||'').trim() : '';
    const name = get('name');
    const data = {
      name, sex: csvNormalizeSex(get('sex')), breed: get('breed'), color: get('color'),
      earNumber: get('earNumber'), dob: csvParseDate(get('dob')), weight: get('weight'),
      legsWins: get('legsWins'), registrationNumber: get('registrationNumber'),
      sireName: get('sireName'), damName: get('damName'), notes: get('notes'),
    };
    const statusRaw = get('status').trim().toLowerCase();
    if(statusRaw) data.status = statusRaw;
    else data.status = data.sex==='doe' ? 'open' : 'available';
    const existing = name ? findByName(name) : null;
    return { data, existing, action: existing ? 'skip' : 'new' };
  }).filter(row=>row.data.name);
  renderCsvPreview();
}
function renderCsvPreview(){

  document.querySelectorAll('[data-csvrow]').forEach(seg=>{

  const skipAll = document.getElementById('csvSkipAll');
  if(skipAll) skipAll.onclick = ()=>{ csvImportRows.forEach(r=>{ if(r.existing) r.action='skip'; }); renderCsvPreview(); };
  const updateAll = document.getElementById('csvUpdateAll');
  if(updateAll) updateAll.onclick = ()=>{ csvImportRows.forEach(r=>{ if(r.existing) r.action='update'; }); renderCsvPreview(); };
  document.getElementById('csvImportBtn').onclick = commitCsvImport;

async function commitCsvImport(){
  let imported=0, updated=0, skipped=0;
  // Two passes, deliberately: if pass 1 also linked sire/dam as it went,
  // an ancestor listed by name in one row (e.g. as a Sire) but given its
  // own full row later in the same file would get created twice — once
  // as an empty stub when first referenced, once as its real row. Doing
  // every row's own create/update first, then linking ancestry only
  // after all rows exist, makes the row order in the CSV irrelevant.
  csvImportRows.forEach(row=>{
    if(row.existing && row.action==='skip'){ skipped++; return; }
    if(row.existing && row.action==='update'){
      const ex = row.existing;
      Object.keys(row.data).forEach(k=>{
        if(!row.data[k]) return;
        // Pedigree imports guess a herd status for every row; never let that overwrite an existing rabbit's real status.
        if(k==='status' && row.isSelf!==undefined) return;
        // An assumed breed (PDF left it blank) never replaces a breed the rabbit already has.
        if(k==='breed' && row.breedAssumed && ex.breed) return;
        if(k==='notes'){
          // Import "notes" is really just an auto-generated tag (e.g.
          // "GC #: 12345"), not free text the person wrote themselves
          // — overwriting outright would silently wipe out real notes
          // they'd typed on this rabbit. Append instead, and skip the
          // append entirely if it's already there, so re-importing the
          // same pedigree twice doesn't pile up duplicate lines.
          if(ex.notes && ex.notes.trim()){
            if(!ex.notes.includes(row.data.notes)) ex.notes = ex.notes.trim()+'\n'+row.data.notes;
          } else {
            ex.notes = row.data.notes;
          }
          return;
        }
        if(k==='wins'){
          // Same idea as notes: a win history is something to add to,
          // never to replace outright — the rabbit may already have
          // wins logged by hand, or from a different pedigree file in
          // this same batch. Merge by (award, date, show) so
          // re-importing the same pedigree later doesn't duplicate
          // entries already on the record.
          const existingWins = ex.wins||[];
          const seenWins = new Set(existingWins.map(w=>`${w.award}|${w.date}|${w.show}`.toLowerCase()));
          const toAdd = (row.data.wins||[]).filter(w=>!seenWins.has(`${w.award}|${w.date}|${w.show}`.toLowerCase()));
          if(toAdd.length) ex.wins = existingWins.concat(toAdd);
          return;
        }
        ex[k]=row.data[k];
      });
      if(ex.external && row.isSelf===true){ ex.external=false; ex.status=row.data.status; }
      updated++;
    } else {
      const nr = blankRabbit(row.data);
      if(row.isSelf===false){ nr.status='external'; nr.external=true; }
      rabbits.push(nr);
      imported++;
    }
  });
  csvImportRows.forEach(row=>{
    if(row.existing && row.action==='skip') return;
    if(row.data.sireName) ensureAncestor(row.data.sireName,'buck');
    if(row.data.damName) ensureAncestor(row.data.damName,'doe');
  });
  const saved = await saveData();
  closeSheet(); render();
  if(saved){
    const parts=[]; if(imported) parts.push(imported+' imported'); if(updated) parts.push(updated+' updated'); if(skipped) parts.push(skipped+' skipped');
    showToast(parts.join(', ')||'Nothing to import');
  } else {
    showSaveError(`The import ran, but ${imported+updated} record${imported+updated===1?'':'s'} couldn't be saved to your account. Check your internet connection and try the import again.`);
  }
  csvImportRows = [];
}

/* ============================================================
   PEDIGREE PDF IMPORT — reads a 4-generation pedigree exported
   from "Rabbit Register" (Evans Software), matches the rabbit,
   its parents, grandparents, and great-grandparents by their
   fixed positions on the page, and feeds the results into the
   exact same review-and-commit flow as the CSV importer above
   (csvImportRows / renderCsvPreview / commitCsvImport) — so
   duplicate handling, the two-pass ancestor linking, and the
   review UI are all identical and already tested.
   ============================================================ */
// Box positions are fixed for this template on landscape Letter
// (792x612pt) — verified against the software's own drawn borders.
const PEDIGREE_PDF_BOXES = [
  ['SELF', 30, 271, 202, 353],
  ['SIRE', 216, 138, 387, 209],
  ['DAM', 216, 414, 387, 485],
  ['PGS', 402, 70, 573, 140],
  ['PGD', 402, 207, 573, 278],
  ['MGS', 402, 346, 573, 416],
  ['MGD', 402, 483, 573, 554],
  ['GGSIRE1', 588, 39, 760, 102],
  ['GGDAM1', 588, 108, 760, 171],
  ['GGSIRE2', 588, 177, 760, 240],
  ['GGDAM2', 588, 246, 760, 309],
  ['GGSIRE3', 588, 315, 760, 378],
  ['GGDAM3', 588, 384, 760, 447],
  ['GGSIRE4', 588, 453, 760, 516],
  ['GGDAM4', 588, 521, 760, 585],
];
const PEDIGREE_MALE_ROLES = new Set(['SIRE','PGS','MGS','GGSIRE1','GGSIRE2','GGSIRE3','GGSIRE4']);
const PEDIGREE_PARENT_OF = {
  SELF: ['SIRE','DAM'], SIRE: ['PGS','PGD'], DAM: ['MGS','MGD'],
  PGS: ['GGSIRE1','GGDAM1'], PGD: ['GGSIRE2','GGDAM2'],
  MGS: ['GGSIRE3','GGDAM3'], MGD: ['GGSIRE4','GGDAM4'],
};
function pdfLinesFromItems(items){
  const lines = [];
  const sorted = items.slice().sort((a,b)=>a.top-b.top||a.x-b.x);
  for(const it of sorted){
    if(!it.str.trim()) continue;
    let line = lines.find(l=>Math.abs(l.top-it.top)<3);
    if(!line){ line={top:it.top, parts:[]}; lines.push(line); }
    line.parts.push(it);
  }
  lines.sort((a,b)=>a.top-b.top);
  return lines.map(l=>l.parts.sort((a,b)=>a.x-b.x).map(p=>p.str).join(' ').replace(/\s+/g,' ').trim());
}
// like pdfLinesFromItems, but each line also carries its text size (h) so a name can be told apart from the details under it
function pdfLinesWithSize(items){
  const lines = [];
  const sorted = items.slice().sort((a,b)=>a.top-b.top||a.x-b.x);
  for(const it of sorted){
    if(!it.str.trim()) continue;
    let line = lines.find(l=>Math.abs(l.top-it.top)<3);
    if(!line){ line={top:it.top, parts:[], h:0}; lines.push(line); }
    line.parts.push(it); line.h = Math.max(line.h, it.h||0);
  }
  lines.sort((a,b)=>a.top-b.top);
  return lines.map(l=>({ t:l.parts.sort((a,b)=>a.x-b.x).map(p=>p.str).join(' ').replace(/\s+/g,' ').trim(), h:l.h }));
}
function pdfParseWeight(s){
  if(!s) return '';
  const m = s.match(/(\d+)\s*#(?:\s*(\d+)\s*oz)?/);
  if(!m) return '';
  const lbs = parseInt(m[1],10) + (m[2]?parseInt(m[2],10)/16:0);
  return (Math.round(lbs*100)/100).toString();
}
function pdfParseDob(s){
  if(!s) return null;
  const m = s.match(/([A-Za-z]+)\s+(\d{1,2}),\s+(\d{4})/);
  if(!m) return null;
  const d = new Date(`${m[1]} ${m[2]}, ${m[3]}`);
  if(isNaN(d)) return null;
  return d.toISOString().slice(0,10);
}
// Evans/Rabbit Register win lines look like "BOS, on 11/29/25 @
// CHLCGSS" or "Placed: 1/10, on 09/28/25 @ CPARBAO" — and, seen in
// real exports, occasionally just "01/01/19 @ 2018TLO" with the
// award omitted entirely. The "MM/DD/YY @ SHOW" half is always
// identifiable, so it's located first and whatever text comes
// before it (if any) is read as the award — safer than trying to
// enumerate every award abbreviation Evans might print.
function pdfParseWinLine(line){
  const m = (line||'').trim().match(/^(.*?)(?:,\s*)?(?:on\s+)?(\d{1,2}\/\d{1,2}\/\d{2,4})\s*@\s*(.+)$/i);
  if(!m) return null;
  let [, prefix, dateStr, show] = m;
  prefix = (prefix||'').trim().replace(/,\s*$/,'').trim();
  let award = prefix;
  const placedMatch = prefix.match(/^Placed:?\s*(\d+\s*\/\s*\d+)$/i);
  if(placedMatch) award = `Placed ${placedMatch[1].replace(/\s+/g,'')}`;
  return { id: uid(), award, date: pdfParseSlashDate(dateStr), show: (show||'').trim() };
}
// MM/DD/YY or MM/DD/YYYY, as used in Evans win-history lines —
// two-digit years are all recent show history, so 00-49 reads as
// 2000-2049 and 50-99 as 1950-1999 (the standard pivot).
function pdfParseSlashDate(s){
  const m = (s||'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(!m) return null;
  let [, mo, day, yr] = m;
  if(yr.length===2){ const yy=parseInt(yr,10); yr = String(yy<50?2000+yy:1900+yy); }
  const iso = `${yr}-${mo.padStart(2,'0')}-${day.padStart(2,'0')}`;
  return isNaN(new Date(iso+'T00:00:00')) ? null : iso;
}
function pdfParseBoxLines(lines, role){
  if(!lines.length) return null;
  const data = { name: lines[0], color:'', earNumber:'', registrationNumber:'', weight:'', legsWins:'', dob:null, gc:'', sex:null, wins:[] };
  for(const line of lines.slice(1)){
    let m;
    if((m=line.match(/Ear\s*#:\s*(\S*)\s*Reg\s*#:\s*(\S*)/i))){ data.earNumber=m[1]||''; data.registrationNumber=m[2]||''; continue; }
    if((m=line.match(/Weight:\s*(.+)/i))){ data.weight=pdfParseWeight(m[1]); continue; }
    if((m=line.match(/GC\s*#:\s*(\S*)\s*Legs:\s*(\d*)/i))){ data.gc=m[1]||''; data.legsWins=m[2]||''; continue; }
    if((m=line.match(/DOB:\s*(.+)/i))){ data.dob=pdfParseDob(m[1]); continue; }
    if((m=line.match(/Sex:\s*(Buck|Doe)/i))){ data.sex = m[1].toLowerCase()==='buck'?'buck':'doe'; continue; }
    if(!data.color && !/^(BOS|BOB|BOV|BOSV|RBIS|BIS|Placed|\d)/i.test(line)){ data.color=line; continue; }
    // Everything left, once name/color/the fixed fields are accounted
    // for, is a show-win entry on this rabbit's record — read every
    // one rather than discarding it. A line that still doesn't fit
    // the win-line shape (pdfParseWinLine returns null) is skipped
    // rather than guessed at.
    const win = pdfParseWinLine(line);
    if(win) data.wins.push(win);
  }
  if(role!=='SELF') data.sex = PEDIGREE_MALE_ROLES.has(role) ? 'buck' : 'doe';
  return data;
}

// Everbreed draws every box with a colored border — blue for a buck,
// pink for a doe. For every ancestor slot that color is exactly
// PEDIGREE_MALE_ROLES (sire-side roles are always the male half of a
// breeding by definition, generation after generation, so it's
// reused as-is rather than duplicated). The one box whose sex isn't
// fixed by tree position is SELF — the featured rabbit could be
// either — so its sex is instead read straight off the "BUCK"/"DOE"
// badge printed in that box, which is the text-layer equivalent of
// reading its border color.

// pdf.js text items include small Font-Awesome glyph icons (paw/
// gender symbols) as Private-Use-Area characters. They carry no
// name/field text but their vertical position doesn't line up with
// the real text baseline, which throws off line-grouping — so they're
// filtered out before grouping rather than after.
function pdfIsIconGlyph(s){
  const t = (s||'').trim();
  if(!t) return true;
  for(const ch of t){ const c=ch.codePointAt(0); if(c<0xE000||c>0xF8FF) return false; }
  return true;
}
function pdfDashClean(v){ v=(v||'').trim(); return (!v||v==='-') ? '' : v; }

// Some Everbreed exports bake tiny extra gaps into certain words'
// glyph positioning — "COLOR:" can come through as "CO LO R:", "BUCK"
// as "BU CK". Matching a label letter-by-letter with optional
// whitespace between each character handles both the normal and the
// fragmented case, instead of requiring an exact contiguous match.
function pdfFuzzyLabel(label){
  return label.split('').map(ch=>{
    if(ch===' ') return '\\s*';
    if(ch==='#') return '\\#';
    return ch.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  }).join('\\s*');
}

// Everbreed's box layout isn't fixed: on the big SELF box each label
// ("ID:", "DOB:", "COLOR:", "BREED:"...) gets its own line, but on the
// smaller ancestor boxes two labels share a line ("ID: ABU DOB:
// 03/23/2024"). Rather than pattern-match a specific line shape, every
// field line in the box is joined into one string and each label's
// value is sliced out from right after that label up to wherever the
// next known label starts — so it works the same either way.
function pdfEverbreedExtractFields(text){
  const labels = ['ID','DOB','ACQ','COLOR','BREED','WEIGHT','LEGS','GC #','REG #','GEN'];
  const positions=[];
  labels.forEach(label=>{
    const re = new RegExp('\\b'+pdfFuzzyLabel(label)+'\\s*:','i');
    const m = text.match(re);
    if(m) positions.push({label, idx:m.index, len:m[0].length});
  });
  positions.sort((a,b)=>a.idx-b.idx);
  const out={};
  positions.forEach((p,i)=>{
    const start=p.idx+p.len;
    const end = i+1<positions.length?positions[i+1].idx:text.length;
    out[p.label]=text.slice(start,end).trim();
  });
  return out;
}
// Collapses a stray space Everbreed sometimes bakes mid-word into its
// PDF text (a kerning artifact between certain letter pairs). This
// used to assume a lowercase letter on both sides of a space always
// meant the same word continuing — but that's not true: plenty of
// real rabbit names have a lowercase connector word next to another
// lowercase word ("Mary the Magpie", "Best of the Best"), and this
// blanket rule silently mangled every one of them into a jammed-
// together mess ("Marythe Magpie"). There's no reliable way to tell
// a fragmented word from a real word boundary by shape alone — even
// the x-position gap between the pieces turns out to be the same
// size either way in Everbreed's own PDFs — so this is now used only
// on fields with a bounded, known set of legitimate values (breed,
// via canonicalizeBreed below) rather than on free-text like names.
function pdfDefragmentText(s){
  return (s||'').replace(/([a-z])\s+(?=[a-z])/g, '$1');
}
// Reconstructs a breed name regardless of Everbreed's mid-word space
// artifacts by comparing against the app's own known breed list with
// all whitespace stripped from both sides — deterministic and safe,
// since breed (unlike a rabbit's name) is drawn from a fixed
// vocabulary. Falls back to the best-effort defragmenter for breed
// values outside that list (a mixed breed, a typo, a newer breed).
function canonicalizeBreed(raw){
  const s = (raw||'').trim();
  if(!s) return s;
  const stripped = s.replace(/\s+/g,'').toLowerCase();
  const hit = RABBIT_BREEDS.find(b=>b.replace(/\s+/g,'').toLowerCase()===stripped);
  if(hit) return hit;
  // Everbreed truncates long breed names with "…" ("American Fuzz…")
  if(/[…]|\.\.\.$/.test(s)){
    const pre = stripped.replace(/[….]+$/,'');
    const hits = pre.length>=4 ? RABBIT_BREEDS.filter(b=>b.replace(/\s+/g,'').toLowerCase().startsWith(pre)) : [];
    if(hits.length===1) return hits[0];
  }
  return pdfDefragmentText(s);
}
// Shared row-builder for any pedigree source that already produces the
// standard slots{role:{name,color,breed,earNumber,registrationNumber,
// weight,legsWins,dob,gc,sex}} shape keyed by the 15 tree roles (SELF,
// SIRE, DAM, PGS, PGD, MGS, MGD, GGSIRE1-4, GGDAM1-4). Currently used
// by the AI image reader only — each text-position PDF parser above
// has its own small format quirks (Who's Due shares one breed across
// every row, etc.) and isn't worth risking a refactor on when it's
// already tested and working. Same collapse-duplicates-by-name +
// parent-linking rule as those parsers.
function buildPedigreeRowsFromSlots(slots, roleOrder){
  const rows = [];
  const seen = new Set();
  for(const role of roleOrder){
    const data = slots[role];
    if(!data || !data.name || /^-+$/.test(data.name.trim())) continue;
    const key = nameKey(data.name);
    if(seen.has(key)) continue;
    seen.add(key);
    const [sireRole, damRole] = PEDIGREE_PARENT_OF[role] || [];
    const sireData = sireRole ? slots[sireRole] : null;
    const damData = damRole ? slots[damRole] : null;
    const rowData = {
      name: data.name.trim(), sex: data.sex||null, breed: canonicalizeBreed(data.breed||''), color: (data.color||'').trim(),
      earNumber: data.earNumber||'', dob: data.dob||null, weight: data.weight||'',
      legsWins: data.legsWins||'', registrationNumber: data.registrationNumber||'',
      sireName: (sireData && sireData.name && !/^-+$/.test(sireData.name.trim())) ? sireData.name.trim() : '',
      damName: (damData && damData.name && !/^-+$/.test(damData.name.trim())) ? damData.name.trim() : '',
      notes: '', gcNumber: data.gc || '',
      status: data.sex==='doe' ? 'open' : 'available',
    };
    const existing = findByName(rowData.name);
    rows.push({ data: rowData, existing, action: existing ? 'skip' : 'new', role });
  }
  return rows;
}
function pdfParseEverbreedBoxLines(lines, role){
  if(!lines.length) return null;
  const EVERBREED_FIELD_LABELS = ['ID','DOB','ACQ','COLOR','BREED','WEIGHT','LEGS','GC #','REG #','GEN'];   // ACQ (date acquired) is recognised so it never ends up inside a name; it is not imported
  const buckPat = pdfFuzzyLabel('BUCK'), doePat = pdfFuzzyLabel('DOE');
  const buckInlineRe = new RegExp('(^|\\s)'+buckPat+'($|\\s)','i');
  const doeInlineRe = new RegExp('(^|\\s)'+doePat+'($|\\s)','i');
  const fieldLineRe = new RegExp('\\b(?:'+EVERBREED_FIELD_LABELS.map(pdfFuzzyLabel).join('|')+')\\s*:','i');
  const nameParts=[]; const fieldLines=[]; let sex=null;
  lines.forEach(line=>{
    let t=line.trim(); if(!t) return;
    // The BUCK/DOE badge sometimes shares a line with the name rather
    // than standing alone, so it's stripped out wherever it appears
    // instead of only matching a line that's just the badge.
    let m = t.match(buckInlineRe);
    if(m){ sex='buck'; t=t.replace(m[0],' ').replace(/\s+/g,' ').trim(); }
    else{
      m = t.match(doeInlineRe);
      if(m){ sex='doe'; t=t.replace(m[0],' ').replace(/\s+/g,' ').trim(); }
    }
    if(!t) return;
    if(fieldLineRe.test(t)) fieldLines.push(t);
    else if(fieldLines.length) fieldLines.push(t);   // a value that wrapped onto its own line after the labels (long colors make the box wrap); never part of the name
    else nameParts.push(t); // cattery prefix and/or given name, in reading order
  });
  const f = pdfEverbreedExtractFields(fieldLines.join(' '));
  const weightRaw = pdfDashClean(f['WEIGHT']);
  const weightMatch = weightRaw.match(/[\d.]+/); // strips a trailing " lbs"
  if(!sex) sex = role==='SELF' ? null : (PEDIGREE_MALE_ROLES.has(role) ? 'buck' : 'doe');
  const rawName = nameParts.join(' ').replace(/\s+/g,' ').trim();
  return {
    // Everbreed prints a literal "-" placeholder for an ancestor box with
    // no data entered at all; without this check that dash gets read as
    // a rabbit literally named "-", and every blank ancestor box collapses
    // into one phantom row (since they'd all share that same "name").
    name: /^-+$/.test(rawName) ? '' : rawName,
    color: pdfDashClean(f['COLOR']),
    breed: canonicalizeBreed(pdfDashClean(f['BREED'])), // read per-box (mixed-breed pedigrees are possible)
    earNumber: pdfDefragmentText(pdfDashClean(f['ID'])),
    registrationNumber: pdfDashClean(f['REG #']),
    weight: weightMatch ? weightMatch[0] : '',
    legsWins: pdfDashClean(f['LEGS']),
    dob: csvParseDate(pdfDashClean(f['DOB'])),
    gc: pdfDashClean(f['GC #']), // Grand Champion # — carried into notes, same as Rabbit Register's GC #
    sex,
  };
}
function parseEverbreedPedigreePdf(items, viewport){
  if(Math.abs(viewport.width-792)>15 || Math.abs(viewport.height-612)>15){
    return { ok:false, error:"This PDF's page size doesn't match the expected Everbreed layout, so the positions couldn't be read reliably." };
  }
  const cleanItems = items.filter(it=>!pdfIsIconGlyph(it.str));
  const slots = {};
  for(const [role,x0,top,x1,bottom] of EVERBREED_PDF_BOXES){
    const boxItems = cleanItems.filter(it=>it.x>=x0-2 && it.x<=x1+2 && it.top>=top-2 && it.top<=bottom+2);
    slots[role] = pdfParseEverbreedBoxLines(pdfLinesFromItems(boxItems), role);
  }
  if(!slots.SELF || !slots.SELF.name){
    return { ok:false, error:"Couldn't find the main rabbit's details on this pedigree — the file may not match the expected Everbreed layout." };
  }
  if(!slots.SELF.sex) slots.SELF.sex = 'doe'; // badge text wasn't read — harmless fallback, reviewed before import anyway

  // Same collapse-duplicates + two-pass ancestor linking as the
  // Rabbit Register parser: a real ancestor can legitimately occupy
  // more than one tree position (line-breeding), so each unique name
  // becomes exactly one row.
  const rows = [];
  const seen = new Set();
  for(const [role] of EVERBREED_PDF_BOXES){
    const data = slots[role];
    if(!data || !data.name) continue;
    const key = nameKey(data.name);
    if(seen.has(key)) continue;
    seen.add(key);
    const [sireRole, damRole] = PEDIGREE_PARENT_OF[role] || [];
    const sireData = sireRole ? slots[sireRole] : null;
    const damData = damRole ? slots[damRole] : null;
    const rowData = {
      name: data.name, sex: data.sex, breed: data.breed || '', color: data.color,
      earNumber: data.earNumber, dob: data.dob, weight: data.weight,
      legsWins: data.legsWins, registrationNumber: data.registrationNumber,
      sireName: sireData ? sireData.name : '', damName: damData ? damData.name : '',
      notes: '', gcNumber: data.gc || '',
      status: data.sex==='doe' ? 'open' : 'available',
    };
    const existing = findByName(rowData.name);
    rows.push({ data: rowData, existing, action: existing ? 'skip' : 'new' });
  }
  return { ok:true, rows };
}

function pdfWhosDueParseDate(s){
  s = (s||'').trim();
  const m = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
  if(m) return `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  return csvParseDate(s);
}
function pdfWhosDueExtractFields(text){
  const labels = ['Gender','Ear #','Variety','Weight','Legs','Reg #','G.C. #','Born','Breed'];
  const positions=[];
  labels.forEach(label=>{
    const re = new RegExp('\\b'+label.replace('#','\\#')+'\\s*:','i');
    const m = text.match(re);
    if(m) positions.push({label, idx:m.index, len:m[0].length});
  });
  positions.sort((a,b)=>a.idx-b.idx);
  const out={};

    const end = i+1<positions.length?positions[i+1].idx:text.length;

}
function pdfParseWhosDueBoxLines(lines, role){
  if(!lines.length) return null;
  const joined = lines.join(' ').replace(/\s+/g,' ').trim();

  const headMatch = (f._head||'').match(/^(Sire|Dam|Name)\s*:\s*(.*)$/i);

    name = headMatch[2].trim();

  }
  if(!sex) sex = role==='SELF' ? null : (PEDIGREE_MALE_ROLES.has(role) ? 'buck' : 'doe');
  return {
    name, sex,
    color: pdfDashClean(f['Variety']),
    earNumber: pdfDashClean(f['Ear #']),
    registrationNumber: pdfDashClean(f['Reg #']),
    weight: pdfDashClean(f['Weight']), // kept as-is, e.g. "3 lb 7 oz" — not a decimal format
    legsWins: pdfDashClean(f['Legs']),
    dob: pdfWhosDueParseDate(f['Born']),
    gc: pdfDashClean(f['G.C. #']),
  };
}
function parseWhosDuePedigreePdf(items, viewport){
  if(Math.abs(viewport.width-792)>15 || Math.abs(viewport.height-612)>15){
    return { ok:false, error:"This PDF's page size doesn't match the expected Who's Due layout, so the positions couldn't be read reliably." };
  }

  }
  if(!slots.SELF.sex) slots.SELF.sex = selfSex || 'doe';

  const rows = [];
  const seen = new Set();
  for(const [role] of WHOSDUE_PDF_BOXES){
    const data = slots[role];
    if(!data || !data.name) continue;
    const key = nameKey(data.name);
    if(seen.has(key)) continue;
    seen.add(key);
    const [sireRole, damRole] = PEDIGREE_PARENT_OF[role] || [];
    const sireData = sireRole ? slots[sireRole] : null;
    const damData = damRole ? slots[damRole] : null;
    const rowData = {
      name: data.name, sex: data.sex, breed, color: data.color,

      legsWins: data.legsWins, registrationNumber: data.registrationNumber,

    };
    const existing = findByName(rowData.name);
    rows.push({ data: rowData, existing, action: existing ? 'skip' : 'new' });

function parseWhosDueVariant2PedigreePdf(items, viewport){

  const headerItems = cleanItems.filter(it=>it.top<100);
  const headerLines = pdfLinesFromItems(headerItems);
  const nameLine = headerLines.find(l=>/^\S+\s*-\s*.+/.test(l) && !/Pedigree/i.test(l));
  let selfName='', selfEar='';
  if(nameLine){
    const m = nameLine.match(/^(\S+)\s*-\s*(.+)$/);
    if(m){ selfEar=m[1].trim(); selfName=m[2].trim(); }
  }
  const infoText = headerLines.join(' ');
  const f = pdfWhosDueExtractFields(infoText);
  const selfSlot = {
    name: selfName, sex: /buck/i.test(f['Gender']||'') ? 'buck' : 'doe',
    color: pdfDashClean(f['Variety']), earNumber: selfEar,
    registrationNumber: pdfDashClean(f['Reg #']), weight: pdfDashClean(f['Weight']),
    legsWins: pdfDashClean(f['Legs']), dob: pdfWhosDueParseDate(f['Born']), gc: pdfDashClean(f['G.C. #']),
  };
  const breed = pdfDashClean(f['Breed']);
  if(!selfSlot.name){
    return { ok:false, error:"Couldn't find the main rabbit's details on this pedigree — the file may not match the expected Who's Due layout." };
  }

  const slots = { SELF: selfSlot };
  for(const [role,x0,top,x1,bottom] of WHOSDUE2_PDF_BOXES){
    const boxItems = cleanItems.filter(it=>it.x>=x0-2 && it.x<=x1+2 && it.top>=top-2 && it.top<=bottom+2);
    slots[role] = pdfParseWhosDueBoxLines(pdfLinesFromItems(boxItems), role);
  }

  const rows = [];
  const seen = new Set();
  const roleOrder = ['SELF', ...WHOSDUE2_PDF_BOXES.map(b=>b[0])];
  for(const role of roleOrder){
    const data = slots[role];
    if(!data || !data.name) continue;
    const key = nameKey(data.name);
    if(seen.has(key)) continue;
    seen.add(key);
    const [sireRole, damRole] = PEDIGREE_PARENT_OF[role] || [];
    const sireData = sireRole ? slots[sireRole] : null;
    const damData = damRole ? slots[damRole] : null;
    const rowData = {
      name: data.name, sex: data.sex, breed, color: data.color,
      earNumber: data.earNumber, dob: data.dob, weight: data.weight,
      legsWins: data.legsWins, registrationNumber: data.registrationNumber,
      sireName: sireData ? sireData.name : '', damName: damData ? damData.name : '',
      notes: '', gcNumber: data.gc || '',
      status: data.sex==='doe' ? 'open' : 'available',
    };
    const existing = findByName(rowData.name);
    rows.push({ data: rowData, existing, action: existing ? 'skip' : 'new' });
  }
  return { ok:true, rows, breed };
}

// Rebuilds text items straight from the PDF's drawing operators so that
// only REAL space characters become spaces (pdf.js's own text items add
// fake spaces at kerning gaps in some Everbreed exports).
async function pdfGlyphItems(page){
  const OPS = pdfjsLib.OPS, U = pdfjsLib.Util;
  const ol = await page.getOperatorList();
  const items = [];
  let ctm=[1,0,0,1,0,0]; const stack=[];
  let tm=[1,0,0,1,0,0], tlm=[1,0,0,1,0,0], fontSize=1, leading=0;
  let cur=null;
  const flush=()=>{ if(cur&&cur.str.trim()) items.push({str:cur.str,x:cur.x,top:cur.y}); cur=null; };
  for(let i=0;i<ol.fnArray.length;i++){
    const f=ol.fnArray[i], a=ol.argsArray[i];
    if(f===OPS.save){ stack.push(ctm.slice()); }
    else if(f===OPS.restore){ if(stack.length) ctm=stack.pop(); }
    else if(f===OPS.transform){ ctm=U.transform(ctm,a); }
    else if(f===OPS.beginText){ flush(); tm=[1,0,0,1,0,0]; tlm=tm.slice(); }
    else if(f===OPS.setFont){ fontSize=a[1]; }
    else if(f===OPS.setLeading){ leading=a[0]; }
    else if(f===OPS.setTextMatrix){ flush(); tm=a.slice(); tlm=a.slice(); }
    else if(f===OPS.moveText){ tlm=U.transform(tlm,[1,0,0,1,a[0],a[1]]); tm=tlm.slice(); }
    else if(f===OPS.nextLine){ tlm=U.transform(tlm,[1,0,0,1,0,-leading]); tm=tlm.slice(); }
    else if(f===OPS.showText || f===OPS.showSpacedText){
      const glyphs=(a[0]||[]).filter(g=>typeof g==='object' && g);
      const full=U.transform(ctm,tm);
      let s=''; let adv=0;
      glyphs.forEach(g=>{ s+= (g.unicode==null?'':g.unicode); adv += (g.width||0)*fontSize/1000; });
      if(s){
        if(!cur) cur={str:'',x:full[4],y:full[5],lastX:full[4],lastW:0};
        // a visible jump from the end of the previous glyph run starts a new item
        const gap = full[4]-(cur.lastX+cur.lastW);
        if(cur.str && gap>3){ const keep={x:full[4],y:full[5]}; flush(); cur={str:'',x:keep.x,y:keep.y,lastX:keep.x,lastW:0}; }
        cur.str+=s; cur.lastX=full[4]; cur.lastW=adv*Math.abs(ctm[0]*tm[0]||1);
      }
      // advance the text matrix by the shown text width
      tm=U.transform(tm,[1,0,0,1,adv,0]);
    }
  }
  flush();
  return items;
}

// HerdNerd's own pedigree PDF (what the pedigree maker here produces): lets a rabbit that was sold with a HerdNerd pedigree
// be imported into another HerdNerd account. The layout is our own, so each box is found from its ribbon label.
// Anything the breeder left out of the pedigree stays blank; lines the pedigree itself cut off with "..." lose the cut-off end.
function parseHerdNerdPedigreePdf(items, viewport){
  const T = s => String(s||'').replace(/\s+/g,' ').trim();
  const all = items.filter(it=>it.str && it.str.trim());
  // ribbon labels -> roles
  const anchors = [];
  const byTop = all.slice().sort((a,b)=>a.top-b.top||a.x-b.x);
  byTop.forEach((it,i)=>{
    const s=T(it.str); let role=null;
    if(/^GENERATION(\s*1)?$/i.test(s)) role='SELF';
    else if(/^SIRE\s*\(FATHER\)$/i.test(s)) role='SIRE';
    else if(/^DAM\s*\(MOTHER\)$/i.test(s)) role='DAM';
    else if(/^(PATERNAL|MATERNAL)$/i.test(s)){
      const nx = all.find(o=>o!==it && Math.abs(o.top-it.top)<2 && o.x>it.x && o.x-it.x<60 && /^GRAND(SIRE|DAM)$/i.test(T(o.str)));
      if(nx) role = (/^PAT/i.test(s)?'P':'M')+'G'+(/SIRE/i.test(nx.str)?'S':'D');
    } else if(/^(PATERNAL|MATERNAL)\s+GRAND(SIRE|DAM)$/i.test(s)){
      const m2=s.match(/^(PATERNAL|MATERNAL)\s+GRAND(SIRE|DAM)$/i); role = (/^PAT/i.test(m2[1])?'P':'M')+'G'+(/SIRE/i.test(m2[2])?'S':'D');
    } else { const m=s.match(/^GG\s*(SIRE|DAM)\s*(\d)$/i); if(m) role='GG'+m[1].toUpperCase()+m[2]; }
    if(role) anchors.push({role, x:it.x, top:it.top});
  });
  // lowest point a card can reach: higher when the signature footer is on the page, lower when it isn't
  const capTop = all.some(it=>/hereby certify/i.test(it.str)) ? 515 : 565;
  // the main rabbit's card has no label any more: its first line of text (below the page header) marks where it starts
  if(!anchors.some(a=>a.role==='SELF')){
    const firstSelf = all.filter(it=>it.x<200 && it.top>100 && it.top<capTop).sort((a,b)=>a.top-b.top||a.x-b.x)[0];
    if(firstSelf) anchors.push({role:'SELF', x:firstSelf.x, top:firstSelf.top-8});
  }
  const colOf = r => r==='SELF'?0 : (r==='SIRE'||r==='DAM')?1 : /^[PM]G[SD]$/.test(r)?2 : 3;
  const colX = x => x<200?0 : x<400?1 : x<590?2 : 3;
  const slots = {};
  anchors.forEach(a=>{
    const col=colOf(a.role);
    const below = anchors.filter(b=>colOf(b.role)===col && b.top>a.top+4).map(b=>b.top);
    // boxes in the grandparent column have a two-word ribbon, so the next ribbon in the column ends this box
    const limit = Math.min(below.length?Math.min.apply(null,below)-2:capTop, capTop);
    const boxItems = all.filter(it=>colX(it.x)===col && it.top>a.top+4 && it.top<limit);
    slots[a.role] = hnParseBox(pdfLinesWithSize(boxItems), a.role);
    // newer pedigrees print "EAR <number>" in the card's top-right corner, on the same row as the label
    if(slots[a.role] && !slots[a.role].earNumber){
      const row = all.filter(it=>colX(it.x)===col && Math.abs(it.top-a.top)<3 && it.x>a.x+2).sort((p,q)=>p.x-q.x);
      const mi = row.findIndex(it=>/^EAR(\s|$)/.test(T(it.str)));
      if(mi>=0){
        const first = T(row[mi].str).replace(/^EAR\s*/,'');
        const ear = [first].concat(row.slice(mi+1).map(it=>T(it.str))).join(' ').trim();
        if(ear && ear!=='-' ) slots[a.role].earNumber = ear;
      }
    }
  });
  if(!slots.SELF || !slots.SELF.name) return { ok:false, error:"Couldn't find the main rabbit's details on this HerdNerd pedigree." };
  // header: sex, birth date, breed
  const head = all.filter(it=>it.top<110).map(it=>T(it.str));
  const sexH = head.map(h=>h.match(/^Sex:\s*(Buck|Doe)/i)).find(Boolean);
  slots.SELF.sex = sexH ? sexH[1].toLowerCase() : (slots.SELF.sex||'doe');
  const earH = head.map(h=>h.match(/^Ear\s*#:\s*(.+)$/i)).find(Boolean);
  if(earH && !slots.SELF.earNumber) slots.SELF.earNumber = earH[1].trim();
  const dobH = head.map(h=>h.match(/^Date of Birth:\s*(.+)$/i)).find(Boolean);
  if(dobH && !slots.SELF.dob) slots.SELF.dob = csvParseDate(dobH[1]) || pdfParseDob(dobH[1]);
  const brH = head.map(h=>h.match(/^Breed:\s*(.+)$/i)).find(Boolean);
  if(brH && !slots.SELF.breed) slots.SELF.breed = canonicalizeBreed(brH[1]);
  const ORDER = ['SELF','SIRE','DAM','PGS','PGD','MGS','MGD','GGSIRE1','GGDAM1','GGSIRE2','GGDAM2','GGSIRE3','GGDAM3','GGSIRE4','GGDAM4'];
  const rows=[]; const seen=new Set();
  for(const role of ORDER){
    const data=slots[role]; if(!data || !data.name) continue;
    const key=nameKey(data.name); if(seen.has(key)) continue; seen.add(key);
    const [sr,dr]=PEDIGREE_PARENT_OF[role]||[];
    const sd=sr?slots[sr]:null, dd=dr?slots[dr]:null;
    const sex = role==='SELF' ? data.sex : (PEDIGREE_MALE_ROLES.has(role)||/SIRE|^PGS$|^MGS$/.test(role) ? 'buck' : 'doe');
    rows.push({ data:{ name:data.name, sex, breed:data.breed||'', color:data.color, earNumber:data.earNumber, dob:data.dob, weight:data.weight,
      legsWins:data.legsWins, registrationNumber:data.registrationNumber, sireName:sd?sd.name:'', damName:dd?dd.name:'', notes:'', gcNumber:data.gc||'',
      status: sex==='doe'?'open':'available' }, existing:findByName(data.name), action: findByName(data.name)?'skip':'new' });
  }
  return { ok:true, rows };
}
function hnParseBox(lines, role){
  const L = lines.map(l=> typeof l==='string' ? {t:l,h:0} : l);
  lines = L.map(l=>l.t);
  if(!lines.length) return null;
  const d = { name:'', color:'', earNumber:'', registrationNumber:'', weight:'', legsWins:'', dob:null, gc:'', breed:'' };
  const date = s => csvParseDate(s) || pdfParseDob(s);
  const wt = s => { const m=String(s||'').match(/[\d.]+/); return m?m[0]:''; };
  const dash = s => { s=String(s||'').trim(); return (s==='-'||s==='—')?'':s; };
  // newer pedigrees: the name is set in larger type, then the color, then "Ear # x", "DOB x" ... (smaller lines under show wins are skipped)
  const nameH = L[0].h;
  if(nameH>0 && !/^Name:/i.test(lines[0]) && L.some(l=>l.h>0 && l.h < nameH-0.9)){
    let i=0; const nameParts=[];
    while(i<L.length && L[i].h >= nameH-0.3){ nameParts.push(L[i].t); i++; }
    d.name = nameParts.join(' ').replace(/…$/,'').trim();
    if(/^[\u2014-]+$/.test(d.name)) return null;
    const rest = L.slice(i);
    const bodyH = rest.length ? rest[0].h : 0;
    const raw = {}; let last='color';
    const fieldRe = /^(Ear\s*#|Weight|DOB|Reg\s*#|GC\s*#|Legs)\s*:?\s*(.*)$/i;
    rest.forEach(l=>{
      if(l.h < bodyH-0.25) return;
      l.t.split(/\s+\u00b7\s+/).forEach(seg=>{
        const m = seg.match(fieldRe);
        if(m){ last=m[1].toLowerCase().replace(/[\s#]/g,''); raw[last]=(raw[last]?raw[last]+' ':'')+m[2]; }
        else raw[last]=(raw[last]?raw[last]+' ':'')+seg;
      });
    });
    d.color=dash(raw.color); d.earNumber=dash(raw.ear); d.weight=wt(dash(raw.weight)); d.dob=raw.dob?date(raw.dob):null;
    d.registrationNumber=dash(raw.reg); d.gc=dash(raw.gc); d.legsWins=dash(raw.legs);
    return d;
  }
  if(/^Name:/i.test(lines[0])){
    // parents and the main rabbit: one labelled field per line; a long name or color can wrap onto the next line
    let last=null;
    for(const line of lines){
      const m=line.match(/^(Name|Ear\s*#|Weight|Color|DOB|Reg\s*#|GC\s*#|Legs|Breed):\s*(.*)$/i);
      if(m){
        last=m[1].toLowerCase().replace(/\s|#/g,''); const v=m[2];
        if(last==='name') d.name=v; else if(last==='ear') d.earNumber=dash(v); else if(last==='weight') d.weight=wt(dash(v));
        else if(last==='color') d.color=dash(v); else if(last==='dob') d.dob=date(v); else if(last==='reg') d.registrationNumber=dash(v);
        else if(last==='gc') d.gc=dash(v); else if(last==='legs') d.legsWins=dash(v); else if(last==='breed') d.breed=canonicalizeBreed(dash(v));
      } else if((last==='name'||last==='color') && !/·|SHOW WINS/i.test(line)){
        if(last==='name') d.name=(d.name+' '+line).trim(); else d.color=(d.color+' '+line).trim();
      } else if(/SHOW WINS/i.test(line)) last=null;
    }
    d.name=d.name.replace(/…$/,'').trim();
    if(/^[\u2014-]+$/.test(d.name)) return null;
    return d;
  }
  // grandparents and great-grandparents: a name line, then "EAR · weight · color · date · Reg x · GC x · Legs: x"
  d.name = lines[0].replace(/…$/,'').trim();
  if(/^[—-]+$/.test(d.name)) return null;
  const rest = lines.slice(1);
  const parts = [];
  rest.forEach(l=>{ const m=l.match(/^Legs:\s*(.*)$/i); if(m && !/·/.test(l)) d.legsWins=dash(m[1].replace(/…$/,'')); else l.split(/\s*·\s*/).forEach(p=>parts.push(p.trim())); });
  const left=[]; let wi=-1;
  parts.forEach(p=>{
    if(!p || p==='…') return;
    let m;
    if((m=p.match(/^Legs:\s*(.+)$/i))){ d.legsWins=m[1].replace(/…$/,'').trim(); }
    else if((m=p.match(/^Reg\s+(.+)$/i))){ if(!/…$/.test(p)) d.registrationNumber=m[1].trim(); }
    else if((m=p.match(/^GC\s+(.+)$/i))){ if(!/…$/.test(p)) d.gc=m[1].trim(); }
    else if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(p)) d.dob=csvParseDate(p);
    else if(/^[\d.]+\s*(lbs?|oz|kg|#)\b/i.test(p)){ d.weight=wt(p); wi=left.length; }
    else if(!/…$/.test(p)) left.push(p);
  });
  // what is left is the ear number (before the weight) and the color (after it); with no weight, a short all-capitals word is the ear number
  if(wi>=0){ if(wi>0) d.earNumber=left[0]; const c=left.slice(wi); if(c.length) d.color=c[0]; }
  else if(left.length>=2){ d.earNumber=left[0]; d.color=left[1]; }
  else if(left.length===1){ if(/^[A-Z0-9&\-.]{1,14}$/.test(left[0]) && !/^[A-Za-z]+$/.test(left[0]) ) d.earNumber=left[0]; else if(/^[A-Z0-9]{1,6}$/.test(left[0])) d.earNumber=left[0]; else d.color=left[0]; }
  return d;
}

async function parsePedigreePdf(arrayBuffer){
  if(!window.pdfjsLib) return { ok:false, error:"The PDF reader didn't load — refresh the page and try again." };
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer) }).promise;
  const page = await pdf.getPage(1);
  const viewport = page.getViewport({ scale: 1 });
  const textContent = await page.getTextContent();
  const items = textContent.items
    .map(it => ({ str: it.str, x: it.transform[4], top: viewport.height - it.transform[5], h: Math.abs(it.transform[3]) || it.height || 0 }))
    .filter(it => it.str.trim());

  const fullText = items.map(i=>i.str).join(' ');

  if(/everbreed/i.test(fullText)){
    // Everbreed's PDFs make pdf.js invent spaces mid-word ("Co rbin",
    // "Ameri can Fu z z"), so read the real glyphs instead; fall back
    // to the normal items if that ever fails.
    let ebItems = items;
    try{
      const g = (await pdfGlyphItems(page)).map(it=>({ str:it.str, x:it.x, top:viewport.height - it.top })).filter(it=>it.str.trim());
      if(g.length > 20) ebItems = g;
    }catch(e){ console.error('glyph read failed, using standard text items', e); }
    return parseEverbreedPedigreePdf(ebItems, viewport);
  }
  if(/Printed by Who'?s Due/i.test(fullText)){
    if(Math.abs(viewport.width-612)<15 && Math.abs(viewport.height-792)<15) return parseWhosDueVariant2PedigreePdf(items, viewport);
    return parseWhosDuePedigreePdf(items, viewport);
  }
  if(/GG\s*SIRE\s*1/.test(fullText) && /SIRE\s*\(FATHER\)/.test(fullText) && /PEDIGREE/i.test(fullText)) return parseHerdNerdPedigreePdf(items, viewport);
  if(!/Rabbit Register/i.test(fullText)){
    return { ok:false, error:"This doesn't look like a supported pedigree PDF — this importer currently understands Rabbit Register (Evans Software), Everbreed, Who's Due and HerdNerd pedigree exports." };
  }
  if(Math.abs(viewport.width-792)>15 || Math.abs(viewport.height-612)>15){
    return { ok:false, error:"This PDF's page size doesn't match the expected Rabbit Register layout, so the positions couldn't be read reliably." };
  }

  const headerItems = items.filter(it => it.top<65 && it.x<580);
  const headerLines = pdfLinesFromItems(headerItems);
  const breedLine = headerLines.find(l=>/Pedigree\s*$/i.test(l));
  const breed = breedLine ? breedLine.replace(/\s*Pedigree\s*$/i,'').trim() : '';

  const slots = {};
  for(const [role,x0,top,x1,bottom] of PEDIGREE_PDF_BOXES){
    const boxItems = items.filter(it=>it.x>=x0-2 && it.x<=x1+2 && it.top>=top-2 && it.top<=bottom+2);
    slots[role] = pdfParseBoxLines(pdfLinesFromItems(boxItems), role);
  }
  if(!slots.SELF || !slots.SELF.name){
    return { ok:false, error:"Couldn't find the main rabbit's details on this pedigree — the file may not match the expected layout." };
  }

  // Collapse duplicate individuals — the same real ancestor can
  // legitimately occupy more than one tree position (line-breeding) —
  // down to exactly one row each, keeping every role's sire/dam link
  // pointed at the correct (already-collapsed) name.
  const rows = [];
  const seen = new Set();
  for(const [role] of PEDIGREE_PDF_BOXES){
    const data = slots[role];
    if(!data || !data.name) continue;
    const key = nameKey(data.name);
    if(seen.has(key)) continue;
    seen.add(key);
    const [sireRole, damRole] = PEDIGREE_PARENT_OF[role] || [];
    const sireData = sireRole ? slots[sireRole] : null;
    const damData = damRole ? slots[damRole] : null;
    const rowData = {
      name: data.name, sex: data.sex, breed, color: data.color,
      earNumber: data.earNumber, dob: data.dob, weight: data.weight,
      legsWins: data.legsWins, registrationNumber: data.registrationNumber,
      sireName: sireData ? sireData.name : '', damName: damData ? damData.name : '',
      notes: '', gcNumber: data.gc || '', wins: data.wins||[],
      status: data.sex==='doe' ? 'open' : 'available',
    };
    const existing = findByName(rowData.name);
    rows.push({ data: rowData, existing, action: existing ? 'skip' : 'new' });
  }
  return { ok:true, rows, breed };
}
// Renders either the "Scan with AI" button (account already unlocked)
// or a beta-code redemption box (not yet unlocked). myProfile is kept
// current by loadMyProfile() and already includes pedigree_ai_access
// since it selects '*' — no extra fetch needed here.
function pedigreeAiGateHTML(){
  const p = myProfile || {};
  if(p.pedigree_ai_access){
    return `<button class="btn btn-secondary" style="width:100%;" id="aiPickBtn">Scan pedigree with AI (beta)</button>`;
  }
  const credits = p.pedigree_ai_credits||0;
  if(credits > 0){
    return `<button class="btn btn-secondary" style="width:100%;" id="aiPickBtn">Scan pedigree with AI (beta) — ${credits} scan${credits===1?'':'s'} left</button>`;
  }
  return `<div class="card" style="padding:12px;">
    <div class="card-sub" style="margin-bottom:8px;">AI scanning isn't unlocked on your account yet. Have a beta or scan-pack code? Enter it below.</div>
    <div style="display:flex; gap:8px;">
      <input type="text" id="pedAiCouponInput" placeholder="Code" style="flex:1;" autocapitalize="characters">
      <button class="btn btn-secondary" id="pedAiCouponBtn">Unlock</button>
    </div>
    <div id="pedAiCouponMsg" style="font-size:12px; margin-top:6px;"></div>
  </div>`;
}
// Wires whichever state pedigreeAiGateHTML() just rendered. Called
// once up front and again after a successful redemption, since that
// swaps the locked box out for the real button.
function wirePedigreeAiGate(){
  const pickBtn = document.getElementById('aiPickBtn');
  if(pickBtn){ pickBtn.onclick = ()=>document.getElementById('pedigreeAiFileInput').click(); return; }
  const redeemBtn = document.getElementById('pedAiCouponBtn');
  if(!redeemBtn) return;
  redeemBtn.onclick = async ()=>{
    const input = document.getElementById('pedAiCouponInput');
    const msg = document.getElementById('pedAiCouponMsg');
    const code = (input.value||'').trim();
    if(!code) return;
    redeemBtn.disabled = true; msg.textContent = 'Checking…'; msg.style.color = '';
    try{
      const { data, error } = await sb.rpc('redeem_pedigree_ai_coupon', { p_code: code });
      const result = Array.isArray(data) ? data[0] : data;
      if(error || !result || !result.ok){
        msg.textContent = (result && result.message) || (error && error.message) || "Couldn't redeem that code.";
        msg.style.color = '#b42318';
        redeemBtn.disabled = false;
        return;

// Renders a PDF's first page to a PNG data URL for the AI reader (a
// photo file already IS an image, so it skips straight to FileReader).
// Capped at 1568px on the long edge — past that, Anthropic's vision
// models downscale server-side anyway, so sending more just wastes
// upload time and tokens without adding any reading accuracy.
async function fileToImageDataUrl(file){
  if(file.type==='application/pdf' || /\.pdf$/i.test(file.name)){
    if(!window.pdfjsLib) throw new Error("The PDF reader didn't load — refresh the page and try again.");
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
    const page = await pdf.getPage(1);
    const base = page.getViewport({ scale: 1 });
    const scale = Math.min(1568/base.width, 1568/base.height, 3);
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    return canvas.toDataURL('image/png');
  }
  return await new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(reader.error);
    reader.readAsDataURL(file);
  });
}
// Sends one pedigree image (or the first page of a pedigree PDF) to
// the read-pedigree-image Edge Function, which has an AI vision model
// read it directly — sidestepping the text-extraction spacing
// artifacts the PDF parsers above are prone to on some exports, and
// the only way to read a photographed paper pedigree at all, since a
// photo has no embedded text layer to extract in the first place.
async function aiReadPedigreeFile(file){
  const dataUrl = await fileToImageDataUrl(file);
  const comma = dataUrl.indexOf(',');
  const mimeType = dataUrl.slice(5, dataUrl.indexOf(';'));
  const base64 = dataUrl.slice(comma+1);
  const { data: { session } } = await sb.auth.getSession();
  if(!session) return { ok:false, error:"You're signed out — sign back in and try again." };
  const resp = await fetch(`${SUPABASE_URL}/functions/v1/read-pedigree-image`, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization': `Bearer ${session.access_token}` },
    body: JSON.stringify({ image: base64, mimeType }),
  });
  let body;
  try{ body = await resp.json(); }
  catch(_){ return { ok:false, error:`Unexpected response from the AI reader (status ${resp.status}).` }; }
  if(!resp.ok || !body.ok) return { ok:false, error: body.error || `The AI reader failed (status ${resp.status}).` };
  return { ok:true, slots: body.slots };
}
function pedigreeBatchFileReportHTML(fileReports){
  const failed = fileReports.filter(f=>!f.ok);
  if(!failed.length) return '';
  return `<div class="dupe-box" style="margin-top:10px;"><b>${failed.length} file${failed.length===1?'':'s'} couldn't be read:</b><br>${failed.map(f=>`${esc(f.name)} — ${esc(f.error)}`).join('<br>')}</div>`;
}
// Combines the rows parsed from however many pedigree PDFs were
// selected into one deduplicated list. The same real rabbit
// (typically a shared ancestor a few generations back) very often
// shows up in more than one of these pedigrees, and each file's
// parser only knows about names already saved to the account — not
// about a name it just saw two files ago in this same batch — so
// without this pass every repeat would queue up as its own separate
// "new" row instead of one row updated from whichever file had the
// most complete details for it.
// The first row of each pedigree is the rabbit the pedigree is FOR; every
// other row is an ancestor, which should be saved as a pedigree-only
// record (More > Ancestors), not as a rabbit in the herd.
function markSelfRow(rows){ rows.forEach((r,i)=>{ r.isSelf = (i===0); }); return rows; }
function mergePedigreeBatchRows(allRows){
  const byName = new Map();
  allRows.forEach(row=>{
    const key = nameKey(row.data.name);
    if(!key) return;
    const prior = byName.get(key);
    if(!prior){ row.seenIn=1; byName.set(key, row); return; }
    // Fill in anything the earlier occurrence was missing; first file
    // to have a value for a field wins if two files ever disagree.
    // Win history is the one exception — it's additive by nature (a
    // later pedigree export of the same rabbit often just has more
    // wins logged since the earlier one), so it's unioned by
    // (award, date, show) instead of first-file-wins.
    Object.keys(row.data).forEach(k=>{
      if(k==='wins'){
        const seenWins = new Set((prior.data.wins||[]).map(w=>`${w.award}|${w.date}|${w.show}`.toLowerCase()));
        const toAdd = (row.data.wins||[]).filter(w=>!seenWins.has(`${w.award}|${w.date}|${w.show}`.toLowerCase()));
        if(toAdd.length) prior.data.wins = (prior.data.wins||[]).concat(toAdd);
        return;
      }
      if(!prior.data[k] && row.data[k]) prior.data[k]=row.data[k];
    });
    if(row.isSelf) prior.isSelf = true;
    prior.seenIn = (prior.seenIn||1)+1;
  });
  return Array.from(byName.values());
}

        <button data-v="skip" class="${row.action==='skip'?'on':''}">Skip</button>

    </div>`;
  };
  area.innerHTML = `
    <div class="section-label">${total} UNIQUE ROW${total===1?'':'S'} FOUND${fileReports.length>1?` &middot; from ${fileReports.length} file${fileReports.length===1?'':'s'}`:''}</div>
    <div class="card-sub" style="margin-bottom:10px;">${newCount} new &middot; ${matches.length} match${matches.length===1?'es':''} an existing rabbit by name</div>
    ${pedigreeBatchFileReportHTML(fileReports)}
    <div class="row2" style="margin:10px 0;">
      <button class="btn btn-secondary btn-sm" id="pedBatchSkipAll">Skip all matches</button>
      <button class="btn btn-secondary btn-sm" id="pedBatchUpdateAll">Update all matches</button>
    </div>
    <div class="field"><label>Breed for every rabbit the PDF left blank (you can change any one below)</label><input type="text" id="pedBatchBreed" value="${esc(csvImportRows._defaultBreed||'')}" placeholder="e.g. Holland Lop"></div>
    <div class="field"><input type="text" id="pedBatchFilter" placeholder="Filter by name…"></div>
    <div id="pedBatchRows" style="max-height:50vh; overflow-y:auto; margin-top:8px;">${csvImportRows.map(rowHTML).join('')}</div>
    <div class="sheet-actions"><button class="btn btn-secondary" onclick="closeSheet()">Cancel</button><button class="btn btn-primary" id="pedBatchImportBtn">Import ${total}</button></div>`;
  document.querySelectorAll('[data-pedbatchrow]').forEach(seg=>{
    seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      csvImportRows[+seg.dataset.pedbatchrow].action = b.dataset.v;

  document.getElementById('pedBatchBreed').onchange = (e)=>{
