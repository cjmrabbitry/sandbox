// ----- Stage 3: kit weights, markings, photos, pairing results, weigh-in reminders -----
const WEIGH_MILESTONES=[[21,'3 weeks'],[42,'6 weeks'],[56,'8 weeks']];
function ozText(oz){
  const n=Number(oz); if(!isFinite(n)) return '';
  if(n<16) return (Math.round(n*10)/10)+' oz';
  const lb=Math.floor(n/16), o=Math.round((n-lb*16)*10)/10;
  return lb+' lb'+(o?' '+o+' oz':'');
}
function kitLastWeight(k){ const w=(k.weights||[]).slice().sort((a,b)=>b.date.localeCompare(a.date))[0]; return w||null; }
function litterWeighDue(r){
  if(!litterUiOn || r.sex!=='doe' || r.status!=='nursing' || !r.litterBornDate) return null;
  const age=litterAgeDays(r); if(age===null||isNaN(age)) return null;
  const kits=(r.litterKits||[]).filter(k=>!k.individualId); if(!kits.length) return null;
  for(const [m,label] of WEIGH_MILESTONES){
    if(age>=m && age<=m+7){
      const since=addDays(r.litterBornDate,m-3);
      const done=kits.some(k=>(k.weights||[]).some(w=>w.date>=since));
      if(!done) return {m,label};
    }
  }
  return null;
}
function openWeighSheet(r, after){
  const kits=(r.litterKits||[]).map((k,i)=>({k,i})).filter(x=>!x.k.individualId);
  openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button><h2>Weigh ${esc(r.name)}'s litter</h2>
    <div class="card-sub" style="margin-bottom:10px;">Weights in ounces. Leave a kit blank to skip it.</div>
    <div class="field"><label>Date</label><input type="date" id="wg-date" value="${todayStr()}"></div>
    ${kits.map(x=>{ const lw=kitLastWeight(x.k); return `<div class="st-row" style="padding:6px 0;"><div class="st-lbl">#${x.k.num||x.i+1} <span class="card-sub">${x.k.sex==='buck'?'Buck':x.k.sex==='doe'?'Doe':''} ${esc(x.k.color||'')}${lw?' · last '+ozText(lw.oz):''}</span></div><input type="number" step="0.1" min="0" inputmode="decimal" data-wg="${x.i}" placeholder="oz" style="max-width:90px;"></div>`; }).join('')}
    <div class="sheet-actions"><button class="btn btn-secondary" onclick="closeSheet()">Cancel</button><button class="btn btn-primary" id="wg-save">Save weights</button></div>`);
  document.getElementById('wg-save').onclick=()=>{
    const date=csvParseDate(document.getElementById('wg-date').value)||todayStr(); let n=0;

function pairingResults(dam){
  const sn=litterSireName(dam); if(!sn) return null;
  const key=nameKey(sn);
  const lit=(dam.breedingHistory||[]).filter(e=>e.outcome==='litter' && e.litterBornDate && nameKey(e.partner||'')===key);
  if(!lit.length) return null;
  const born=lit.reduce((n,e)=>n+((e.litterKits||[]).length+((e.litterDead&&((e.litterDead.DOA||0)+(e.litterDead.peanut||0)+(e.litterDead.passed||0))||0))),0);
  const alive=lit.reduce((n,e)=>n+(e.litterKits||[]).length,0);
  return {litters:lit.length, born, alive, avg:Math.round(born/lit.length*10)/10};
}

// Dismiss hides just this one alert. Nothing is deleted: a rabbit alert comes back for her next breeding/litter, a reminder can be restored from My reminders.
function attnDismissFor(id,type){
  if(type==='rem'){
    const x=customReminders.find(q=>q.id===id); if(!x) return;
    const snap={date:x.date,removed:x.removed,snoozeUntil:x.snoozeUntil};
    if(x.repeat==='weekly'||x.repeat==='monthly'){ let n=nextRemDate(x.date,x.repeat); const t=todayStr(); while(n<=t) n=nextRemDate(n,x.repeat); x.date=n; x.snoozeUntil=null; } else { x.removed=true; }
    const undo=()=>{ x.date=snap.date; x.removed=snap.removed; x.snoozeUntil=snap.snoozeUntil; };
    saveReminders().then(ok=>{ if(!ok){ undo(); return; } render(); showUndoToast('Dismissed', ()=>{ undo(); saveReminders(); }, 6000); });
    return;
  }
  const r=rabbits.find(x=>x.id===id); if(!r) return;
  const had=r.attnDismiss&&r.attnDismiss[type];
  r.attnDismiss=r.attnDismiss||{}; r.attnDismiss[type]=dismissKey(r);
  saveData(); render();
  showUndoToast('Dismissed', ()=>{ if(had) r.attnDismiss[type]=had; else delete r.attnDismiss[type]; }, 6000);
}
let swipeOpen=null;
function closeSwipe(){ if(swipeOpen){ const row=swipeOpen.querySelector('.todo-row'); if(row) row.style.transform=''; swipeOpen=null; } }
function wireSwipeRows(root){
  root.querySelectorAll('.swipe-wrap').forEach(w=>{
    const row=w.querySelector('.todo-row'), canDone=w.dataset.swdone==='1', OPEN=160;
    let x0=0,y0=0,dx=0,active=false,engaged=false,base=0;
    w.addEventListener('pointerdown',e=>{
      if(e.target.closest('.sw-acts')) return;
      if(e.target.closest('button,.todo-circle,[data-nesttoggle]')) return;
      if(swipeOpen && swipeOpen!==w) closeSwipe();
      active=true; engaged=false; x0=e.clientX; y0=e.clientY; dx=0; base=(swipeOpen===w)?-OPEN:0;
    });
    w.addEventListener('pointermove',e=>{
      if(!active) return;
      const mx=e.clientX-x0, my=e.clientY-y0;
      if(!engaged){ if(Math.abs(mx)>10 && Math.abs(mx)>Math.abs(my)*1.5){ engaged=true; w.classList.add('dragging'); try{ w.setPointerCapture(e.pointerId); }catch(_){} } else return; }
      dx=Math.max(-OPEN, Math.min(canDone?120:0, base+mx));
      row.style.transform='translateX('+dx+'px)';
    });
    const end=()=>{
      if(!active) return; active=false;
      if(!engaged) return;
      w.classList.remove('dragging'); w._dragged=true; setTimeout(()=>{ w._dragged=false; },60);
      if(canDone && dx>90){ w._dragged=false; row.style.transform=''; swipeOpen=null; const c=w.querySelector('[data-circledone]')||w.querySelector('[data-remdone]'); if(c) c.click(); return; }
      if(dx<-60){ row.style.transform='translateX(-'+OPEN+'px)'; swipeOpen=w; }
      else { row.style.transform=''; if(swipeOpen===w) swipeOpen=null; }
    };
    w.addEventListener('pointerup',end); w.addEventListener('pointercancel',end);
    w.addEventListener('click',e=>{ if(w._dragged){ e.stopPropagation(); e.preventDefault(); return; } if(swipeOpen===w && !e.target.closest('.sw-acts')){ closeSwipe(); e.stopPropagation(); } },true);

// Steps through the "Kindled all in order" list: when a Kindled sheet closes and that doe is no longer bred, open the next one.
// Closing a sheet without saving (still bred) ends the run, so it never pushes a sheet on you.
(function(){
  const base = closeSheet;
  closeSheet = function(){
    base.apply(this, arguments);
    if(!kq) return;
    setTimeout(()=>{
      if(!kq) return;
      if(document.getElementById('sheetBackdrop').classList.contains('on')){ kq=null; return; }
      const cur = rabbits.find(r=>r.id===kq.ids[kq.i]);
      if(cur && cur.status==='pregnant'){ kq=null; return; }
      let next=null;
      while(++kq.i < kq.ids.length){ const r=rabbits.find(x=>x.id===kq.ids[kq.i]); if(r && r.status==='pregnant'){ next=r; break; } }
      if(next) openKindledSheet(next); else { kq=null; showToast('All of them are done'); }
    }, 250);
  };
})();

    + rabbits.reduce((n,d)=>n+((d.sex==='doe'&&d.litterKits)?d.litterKits.filter(k=>k.forSale&&!k.individualId).length:0),0);

  const tiles = [['pregnant','Bred',cnt('pregnant')],['nursing','On a litter',cnt('nursing')],['open','Open does',cnt('open')],['sale','For sale',forSaleN]];
  const emptyHomeHTML = (!rabbits.length && !viewingAsCustomer) ? `<div class="empty-home"><h3>You're all set</h3><div class="card-sub" style="margin:8px 0 14px;">Add your first rabbit to start your herd. Just a name and sex to begin.</div><button class="btn btn-primary" style="width:100%;" id="emptyAddRabbit">Add your first rabbit</button><button class="btn btn-secondary" style="width:100%;margin-top:8px;" id="emptyTour">Take the tour</button></div>` : '';
  let h = emptyHomeHTML + (lookRibbonOn()?ribbonHomeHTML(t,attnTotal):'') + `<div class="home-sum"><b>${attnTotal}</b> ${attnTotal===1?'needs':'need'} attention · <b>${thisWeekN}</b> coming up this week · <b>${nursingDoes.length}</b> litter${nursingDoes.length===1?'':'s'} nursing</div>
  <div class="stats home-tiles">${tiles.map(([k,l,n])=>`<div class="stat" data-hometile="${k}" role="button" tabindex="0"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('')}</div>
  <div class="quick-actions">
    <button class="qa-btn qa-primary" id="qaAddBreeding"><span class="qa-icon">${QA_PLUS_SVG}</span><span>Record breeding</span></button>
    <button class="qa-btn" id="qaKindled"><span class="qa-icon">${QA_BUNNY_SVG}</span><span>Kindled</span></button>
    <button class="qa-btn" id="qaWeight"><span class="qa-icon">${QA_SCALE_SVG}</span><span>Add weight</span></button>
    <button class="qa-btn" id="qaAddRabbit"><span class="qa-icon">${QA_PLUS_SVG}</span><span>Add rabbit</span></button>
  </div>`;

  if(show){
    const daysLeft = daysBetween(t, show.entryDeadline);
    h += `<div class="show-banner" id="showBannerCard">
      <div><div class="show-banner-name">${esc(show.name)}</div><div class="show-banner-sub">Entries close ${fmtDate(show.entryDeadline)}</div></div>
      <div class="show-banner-days"><div class="n">${daysLeft}</div><div class="l">day${daysLeft===1?'':'s'}</div></div>
    </div>`;
  }

  h += `<div class="section-label" style="display:flex; align-items:center; justify-content:space-between; margin-top:0;">
    <span>NEEDS ATTENTION</span>
    ${attnTotal ? `<span style="font-size:11px; font-weight:600; color:#fffdf8; background:var(--rust); padding:2px 9px; border-radius:10px;">${attnTotal}</span>` : ''}
  </div>`;
  if(!attnTotal){
    h += `<div class="card no-tap"><div class="card-detail">Nothing needs attention right now.</div></div>`;
  } else if(lookRibbonOn()){
    h += ribbonAttnHTML(rows);
  } else {
    h += visibleRows.map(r=>r.html).join('');
    if(hiddenCount>0) h += `<button class="attn-viewall" id="attnViewAll">View all (${attnTotal}) &rarr;</button>`;
  }
  doneToday = doneToday.filter(d=>d.date===t);
  if(doneToday.length){
    h += `<button class="attn-viewall" id="doneTodayBtn" style="text-align:left;">Done today (${doneToday.length}) <span id="doneChev">&rsaquo;</span></button>
      <div id="doneTodayList" style="display:none;">${doneToday.map((d,i)=>`<div class="done-row"><div class="t">${esc(d.label)}</div><button data-doneundo="${i}">Undo</button></div>`).join('')}</div>`;
  }

  h += `<div class="section-label" style="display:flex;align-items:center;justify-content:space-between;"><span>COMING UP</span><button class="attn-viewall" id="addReminderBtn" style="width:auto;padding:4px 0;">+ Add a reminder</button></div>`;
  if(!upAll.length){
    h += `<div class="card no-tap"><div class="card-detail">Nothing coming up in the next month.</div></div>`;
  } else {
    let lastLbl=null;
    upShown.forEach(e=>{ const lb=comingDayLabel(e.date,t); if(lb!==lastLbl){ h+=`<div class="cu-day">${lb}</div>`; lastLbl=lb; } h+=comingUpRowHTML(e); });
    if(upAll.length>UP_CAP) h += `<button class="attn-viewall" id="comingToggle">${homeComingAll?'Show fewer':'Show all next 14 days ('+upAll.length+')'}</button>`;
  }

  main.innerHTML = h;

  if(document.getElementById('emptyAddRabbit')) document.getElementById('emptyAddRabbit').onclick = openAddSheet;
  if(document.getElementById('emptyTour')) document.getElementById('emptyTour').onclick = ()=>startTour(true);
  document.getElementById('qaAddBreeding').onclick = ()=>openQuickBreedSheet();
  document.getElementById('qaKindled').onclick = ()=>{
    const does=rabbits.filter(r=>r.sex==='doe'&&isActive(r)&&r.status!=='growing'&&!inJuniors(r));
    const bred=does.filter(r=>r.status==='pregnant');
    openRabbitPickSheet('Kindled — which doe?', bred.length?bred:does, r=>openKindledSheet(r), bred.length&&bred.length<does.length?'Showing bred does':'');
  };
  document.getElementById('qaWeight').onclick = ()=>openRabbitPickSheet('Add weight — which rabbit?', rabbits.filter(r=>isActive(r)&&r.status!=='external'), r=>openAddWeightSheet(r), '');
  document.getElementById('qaAddRabbit').onclick = openAddSheet;
  if(document.getElementById('showBannerCard')) document.getElementById('showBannerCard').onclick = openShowsSheet;
  main.querySelectorAll('[data-hometile]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.hometile;
    if(k==='sale'){ currentTab='forsale'; }
    else { currentTab='rabbits'; rabbitsGroup='does'; groupAlso=[]; doesFilter=k; selectMode=false; }
    render(); window.scrollTo(0,0);
  });
  if(document.getElementById('addReminderBtn')) document.getElementById('addReminderBtn').onclick=()=>openReminderSheet(null);
  if(document.getElementById('comingToggle')) document.getElementById('comingToggle').onclick=()=>{ homeComingAll=!homeComingAll; render(); };
  if(document.getElementById('doneTodayBtn')) document.getElementById('doneTodayBtn').onclick=()=>{ const l=document.getElementById('doneTodayList'); const open=l.style.display==='none'; l.style.display=open?'block':'none'; document.getElementById('doneChev').innerHTML=open?'&#9662;':'&rsaquo;'; };
  main.querySelectorAll('[data-doneundo]').forEach(b=>b.onclick=()=>{ const d=doneToday[+b.dataset.doneundo]; if(!d) return; d.undo(); doneToday=doneToday.filter(x=>x!==d); saveData(); render(); showToast('Undone'); });
  if(document.getElementById('attnViewAll')) document.getElementById('attnViewAll').onclick = ()=>openAttentionSheet(rows.map(r=>r.html).join(''));
  wireAttentionRows(main);
  wireConvertButtons(main);
  attachCardEvents();
  if(lookRibbonOn()) wireRibbonAttn(main, rows);
}

function renderRabbits(main){
  const ag=activeGroups(), allOn=ag.length===3;
  const groupTabs = `<div class="subnav-wrap"><div class="seg">
    <button data-rgroup="all" class="${allOn?'on':''}">All</button>
    <button data-rgroup="does" class="${ag.includes('does')&&!allOn?'on':''}">Does</button>
    <button data-rgroup="bucks" class="${ag.includes('bucks')&&!allOn?'on':''}">Bucks</button>
    <button data-rgroup="juniors" class="${ag.includes('juniors')&&!allOn?'on':''}">Juniors</button>
  </div></div><div class="card-sub" style="margin:-6px 4px 8px;">Tap more than one to see them together.</div>`;
  let body='', scopeList=[], shownList=[];
  if(ag.length>1){
    const rankC={pregnant:0, nursing:1, open:2, reserved:3};
    const defs={
      does:['DOES', rabbits.filter(r=>r.sex==='doe'&&isActive(r)&&r.status!=='growing'&&!inJuniors(r)), cardHTML, (a,b)=>{ const ra=rankC[a.status]!=null?rankC[a.status]:2, rb=rankC[b.status]!=null?rankC[b.status]:2; return ra!==rb?ra-rb:a.name.localeCompare(b.name); }],
      bucks:['BUCKS', rabbits.filter(r=>r.sex==='buck'&&isActive(r)&&r.status!=='growing'&&!inJuniors(r)), buckCardHTML, (a,b)=>a.name.localeCompare(b.name)],
      juniors:['JUNIORS', rabbits.filter(r=>r.status==='growing'||(r.status==='reserved'&&inJuniors(r))), juniorCardHTML, (a,b)=>(a.dob||'9').localeCompare(b.dob||'9')]
    };
    let h='';
    ag.forEach(g=>{
      const [label,base,card,sorter]=defs[g]; scopeList=scopeList.concat(base);
      const it=herdFilter(base).sort(sorter); shownList=shownList.concat(it);
      if(it.length) h+=`<div class="section-label">${label} &middot; ${it.length}</div>`+(selectMode?selectRowsHTML(it):it.map(r=>card(r)).join(''));
    });
    body = h || `<div class="empty">Nothing matches these filters.</div>`;
  } else if(rabbitsGroup==='does'){
    const rank = {pregnant:0, nursing:1, open:2, reserved:3};
    const labels = {pregnant:'BRED', nursing:'ON A LITTER', open:'OPEN', reserved:'RESERVED'};
    const baseDoes = rabbits.filter(r=>r.sex==='doe'&&isActive(r)&&r.status!=='growing'&&!inJuniors(r)); scopeList=baseDoes;
    const allDoes = herdFilter(baseDoes);
    const totalsRow = `<div class="stats" style="padding:0; margin-bottom:12px;">${
      [['all','All'],['pregnant','Bred'],['nursing','On a litter'],['open','Open']].map(([k,l])=>
        `<div class="stat ${doesFilter===k?'active':''}" data-doesfilter="${k}"><div class="n">${k==='all'?allDoes.length:allDoes.filter(r=>r.status===k).length}</div><div class="l">${l}</div></div>`).join('')
    }</div>`;
    let it=allDoes.sort((a,b)=>{
      const ra=rank[a.status]!=null?rank[a.status]:2, rb=rank[b.status]!=null?rank[b.status]:2;
      if(ra!==rb) return ra-rb;
      if(a.status==='pregnant') return daysToDue(a)-daysToDue(b);
      if(a.status==='nursing') return (a.rebreedDate||'').localeCompare(b.rebreedDate||'');
      return a.name.localeCompare(b.name);
    });
    if(doesFilter!=='all') it = it.filter(r=>r.status===doesFilter);
    shownList=it;
    if(!it.length){ body=totalsRow+`<div class="empty">No does match this filter.</div>`; }
    else{
      let h='', lastGroup=null;
      it.forEach(r=>{
        const g = rank[r.status]!=null?r.status:'open';
        if(g!==lastGroup && doesFilter==='all'){ h+=`<div class="section-label">${labels[g]||g.toUpperCase()}</div>`; lastGroup=g; }
        h+=selectMode?selectRowsHTML([r]):cardHTML(r);
      });
      body=totalsRow+h;
    }
  } else if(rabbitsGroup==='bucks'){
    const baseBucks=rabbits.filter(r=>r.sex==='buck'&&isActive(r)&&r.status!=='growing'&&!inJuniors(r)); scopeList=baseBucks;
    const it=herdFilter(baseBucks).sort((a,b)=>a.name.localeCompare(b.name)); shownList=it;
    body=`<div class="section-label">${it.length} ${projectFilter==='all'?'TOTAL ':''}BUCK${it.length===1?'':'S'}</div>`+
      (it.length?(selectMode?selectRowsHTML(it):it.map(buckCardHTML).join('')):`<div class="empty">${projectFilter==='all'?'No bucks yet. Tap + Add a rabbit above.':'No bucks in this project yet.'}</div>`);
  } else if(rabbitsGroup==='juniors'){
    const baseJr=rabbits.filter(r=>r.status==='growing'||(r.status==='reserved'&&inJuniors(r))).sort((a,b)=>(a.dob||'9').localeCompare(b.dob||'9')); scopeList=baseJr;
    const allJr = herdFilter(baseJr);
    const jrRow = allJr.length ? `<div class="stats" style="padding:0; margin-bottom:12px;">${
      [['all','All',allJr.length],['buck','Bucks',allJr.filter(r=>r.sex==='buck').length],['doe','Does',allJr.filter(r=>r.sex==='doe').length]].map(([k,l,n])=>
        `<div class="stat ${juniorsFilter===k?'active':''}" data-jrfilter="${k}"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('')
    }</div>` : '';
    const it = juniorsFilter==='all' ? allJr : allJr.filter(r=>r.sex===juniorsFilter); shownList=it;
    body = !allJr.length ? `<div class="empty">No juniors on file. They appear automatically after you log a litter.</div>`
      : jrRow + (it.length ? (selectMode?selectRowsHTML(it):it.map(juniorCardHTML).join('')) : `<div class="empty">No junior ${juniorsFilter==='buck'?'bucks':'does'} right now.</div>`);
  }
  // In the Ribbon look the + menu at the top already has "Breeding", so this big button is left out there only.
  const actionRow = (ag.length===1 && rabbitsGroup==='does' && !lookRibbonOn())
    ? `<div class="action-row" style="display:flex; gap:10px; margin:10px 0 14px;">
         <button class="btn btn-primary" style="flex:1;" id="herdRecordBreedingBtn">+ Record a breeding</button>
       </div>`
    : '';
  if(projectFilter!=='all' && !projects.some(p=>p.id===projectFilter)) projectFilter='all';
  projectAlso=projectAlso.filter(id=>projectFilter!=='all' && id!==projectFilter && projects.some(p=>p.id===id));
  const pjSummary = (projects.length && (shownList.length||projectFilter!=='all'||traitFilter)) ? `<div class="pj-summary"><span style="font-weight:600">${selectMode?(projectFilter==='all'?'Tap the rabbits to include':'Tap rabbits to add to '+esc((projects.find(p=>p.id===projectFilter)||{}).name||'')):projectFilter==='all'?'':projectAlso.length?`${shownList.length} in ${esc(activeProjIds().map(id=>(projects.find(p=>p.id===id)||{}).name).filter(Boolean).join(' + '))}`:`${shownList.length} in ${esc((projects.find(p=>p.id===projectFilter)||{}).name||'')}`}</span>${selectMode?`<span><a id="pj-selall">Select all</a> &nbsp; <a id="pj-cancel-sel" href="#" style="font-weight:800;">Cancel</a></span>`:(projectAlso.length?'':'')}</div>` : '';
  main.innerHTML = groupTabs + (selectMode?'':quickPickBar()) + filtersBlock(scopeList) + pjSummary + (selectMode?'':actionRow) + body + (selectMode?selectBarHTML()+'<div style="height:230px"></div>':'');
  wireProjects(main, shownList); wireTraits(); wireQuickPicks();
  { const ft=document.getElementById('flt-toggle'); if(ft) ft.onclick=()=>{ herdFiltersOpen=!herdFiltersOpen; try{ localStorage.setItem('hn_flt_open', herdFiltersOpen?'1':'0'); }catch(e){} render(); }; }
  document.querySelectorAll('[data-pjtarget]').forEach(b=>b.onclick=()=>{ window.__pjTarget=b.dataset.pjtarget; render(); });
  if(document.getElementById('herdRecordBreedingBtn')) document.getElementById('herdRecordBreedingBtn').onclick = openQuickBreedSheet;
  document.querySelectorAll('[data-rgroup]').forEach(b=>b.onclick=()=>{
    const g=b.dataset.rgroup, cur=activeGroups();
    if(g==='all'){ if(cur.length===3){ rabbitsGroup='does'; groupAlso=[]; } else { rabbitsGroup='does'; groupAlso=['bucks','juniors']; } }
    else if(cur.length===3){ rabbitsGroup=g; groupAlso=[]; }   // from All, tapping one shows just that one
    else if(cur.includes(g)){ if(cur.length>1){ const rest=cur.filter(x=>x!==g); rabbitsGroup=rest[0]; groupAlso=rest.slice(1); } }
    else { rabbitsGroup=cur[0]; groupAlso=cur.slice(1).concat([g]); }
    selectMode=false; selectedIds=new Set(); render(); window.scrollTo(0,0);
  });
  document.querySelectorAll('[data-doesfilter]').forEach(b=>b.onclick=()=>{ doesFilter=b.dataset.doesfilter; render(); });
  document.querySelectorAll('[data-jrfilter]').forEach(b=>b.onclick=()=>{ juniorsFilter=b.dataset.jrfilter; render(); });
}

/* ---------- calendar ---------- */
function renderCalendar(main){
  const t = todayStr();
  if(!calSelectedDate) calSelectedDate = t;
  if(!calWeekStart) calWeekStart = startOfWeek(calSelectedDate);

  const events = [];
  rabbits.forEach(r=>{
    if(!isActive(r)) return;
    if(r.status==='pregnant' && r.dueDate){
      events.push({date:r.dueDate, label:`${r.name} — estimated kindling`, sub:`Bred to ${r.partner||'?'} · check for a nest box a few days before`, id:r.id, type:'due', overdue:isOverdue(r)});
    }
    if(r.status==='nursing'){
      if(r.rebreedDate) events.push({date:r.rebreedDate, label:`${r.name} — rebreed target`, sub:`Target set from litter born ${fmtDate(r.litterBornDate)}`, id:r.id, type:'rebreed'});
      if(r.weanDate) events.push({date:r.weanDate, label:`${r.name}'s litter — wean`, sub:'Kits weaned at 6 weeks', id:r.id, type:'wean'});
      if(r.sellDate) events.push({date:r.sellDate, label:`${r.name}'s litter — ready to go`, sub:'8 weeks old, ready for new homes', id:r.id, type:'sell'});
      if(litterUiOn && r.litterBornDate) WEIGH_MILESTONES.forEach(([m,label])=>events.push({date:addDays(r.litterBornDate,m), label:`Weigh ${r.name}'s litter`, sub:label+' old', id:r.id, type:'weigh'}));
    }
  });
  planned.forEach(p=>{
    const doe=rabbits.find(r=>r.id===p.doeId);
    events.push({date:p.targetDate, label:`Planned: ${p.doeName||(doe?doe.name:'?')} × ${p.buckName}`, sub:p.notes||'Planned breeding', id:doe?doe.id:null, plannedId:p.id, type:'planned'});
  });
  customEvents.forEach(e=>{ events.push({date:e.date, label:e.title, sub:'Custom event', id:null, customId:e.id, type:'custom'}); });
  customReminders.filter(remActive).forEach(x=>{ const rb=x.rabbitId?rabbits.find(q=>q.id===x.rabbitId):null; events.push({date:remEffDate(x), label:x.title, sub:['Reminder',rb?rb.name:'',remRepeatLabel(x)].filter(Boolean).join(' · '), id:rb?rb.id:null, remId:x.id, type:'reminder'}); });

  const DOT = {weigh:'var(--ink-soft)', due:'var(--rust)', rebreed:'var(--gold-deep)', wean:'var(--marsh)', sell:'var(--marsh)', planned:'var(--gold-deep)', custom:'var(--ink-soft)', reminder:'var(--marsh)'};

  const days=[]; for(let i=0;i<7;i++){ days.push(addDays(calWeekStart,i)); }
  const dayLabels=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const weekEnd = days[6];
  const rangeLabel = fmtDate(calWeekStart).replace(/, \d{4}$/,'') + ' - ' + fmtDate(weekEnd);

  let strip = `<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
    <button id="calPrevWeek" class="rb-calnav" aria-label="Previous week" style="width:32px; height:32px; border-radius:8px; border:1px solid var(--line-strong); background:var(--card); color:var(--navy); font-size:16px;">&lsaquo;</button>
    <span style="font-size:12px; font-weight:500; color:var(--navy); letter-spacing:.03em; font-family:'Jost',sans-serif;">${rangeLabel}</span>
    <button id="calNextWeek" class="rb-calnav" aria-label="Next week" style="width:32px; height:32px; border-radius:8px; border:1px solid var(--line-strong); background:var(--card); color:var(--navy); font-size:16px;">&rsaquo;</button>
  </div>
  <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:16px;">`;

  days.forEach((d,i)=>{
    const dayEvents = events.filter(e=>e.date===d);
    const isSel = d===calSelectedDate;
    const isToday = d===t;
    const dnum = new Date(d+'T00:00:00').getDate();
    const dotColors = [...new Set(dayEvents.map(e=> e.overdue ? 'var(--rust)' : (DOT[e.type]||'var(--ink-soft)')))].slice(0,3);
    strip += `<button class="rb-cd ${isSel?'sel':''} ${isToday?'today':''}" data-calday="${d}" style="text-align:center; background:none; border:none; padding:0; cursor:pointer;">
      <div style="font-size:10px; color:var(--ink-soft); opacity:${isSel?'1':'.6'}; font-weight:${isSel?'600':'400'}; margin-bottom:4px; font-family:'Jost',sans-serif;">${dayLabels[i]}</div>
      <div class="rb-cdc" style="border-radius:10px; padding:7px 0 6px; background:${isSel?'var(--navbar)':'var(--card)'}; border:1px solid ${isSel?'var(--navbar)':(isToday?'var(--gold-deep)':'var(--line)')};">
        <div style="font-size:14px; font-weight:500; color:${isSel?'#fffdf8':'var(--navy)'}; font-family:'Jost',sans-serif;">${dnum}</div>
        <div style="display:flex; justify-content:center; gap:2px; margin-top:3px; height:4px;">
          ${dotColors.map(c=>`<span style="width:4px; height:4px; border-radius:50%; background:${c};"></span>`).join('')}
        </div>
      </div>
    </button>`;
  });
  strip += `</div>`;

  const selDate = new Date(calSelectedDate+'T00:00:00');
  const weekdayFull = selDate.toLocaleDateString('en-US',{weekday:'long'});
  const dateFull = selDate.toLocaleDateString('en-US',{month:'long', day:'numeric', year:'numeric'});
  const dayEvents = events.filter(e=>e.date===calSelectedDate).sort((a,b)=>(a.overdue?0:1)-(b.overdue?0:1));

  let agenda = `<button class="btn btn-secondary" style="width:100%; margin-bottom:12px;" id="calAddBtn">+ Add an event</button>
    <div class="rb-calh" style="font-family:'Cormorant Garamond',serif; font-weight:600; font-size:17px; color:var(--navy); margin-bottom:10px;">${weekdayFull}, ${dateFull}${calSelectedDate===t?' — Today':''}</div>`;

  if(!dayEvents.length){
    agenda += `<div class="empty">Nothing on the calendar for this day.</div>`;
  } else {
    dayEvents.forEach(e=>{ agenda += calRowHTML(e, e.overdue); });
  }

  main.innerHTML = strip + agenda;

  document.getElementById('calPrevWeek').onclick=()=>{ calWeekStart=addDays(calWeekStart,-7); render(); };
  document.getElementById('calNextWeek').onclick=()=>{ calWeekStart=addDays(calWeekStart,7); render(); };
  document.querySelectorAll('[data-calday]').forEach(b=>b.onclick=()=>{ calSelectedDate=b.dataset.calday; render(); });
  document.getElementById('calAddBtn').onclick=()=>openAddEventSheet(calSelectedDate);
  document.querySelectorAll('[data-calopen]').forEach(b=>b.onclick=()=>{
    const r=rabbits.find(x=>x.id===b.dataset.calopen); if(r) openRabbitProfile(r, b.dataset.calbreed?'breeding':undefined);
  });
  document.querySelectorAll('[data-calremedit]').forEach(b=>b.onclick=(ev)=>{ ev.stopPropagation(); const x=customReminders.find(q=>q.id===b.dataset.calremedit); if(x) openReminderSheet(x); });
  document.querySelectorAll('[data-caledit]').forEach(b=>b.onclick=(ev)=>{ ev.stopPropagation(); const x=customEvents.find(q=>q.id===b.dataset.caledit); if(x) openAddEventSheet(null,x); });
  document.querySelectorAll('[data-calplanedit]').forEach(b=>b.onclick=(ev)=>{ ev.stopPropagation(); const x=planned.find(q=>q.id===b.dataset.calplanedit); if(x) openAddPlannedSheet(null,x); });
  document.querySelectorAll('[data-caldel]').forEach(b=>b.onclick=(ev)=>{
    ev.stopPropagation();
    const gone = customEvents.find(x=>x.id===b.dataset.caldel); if(!gone) return;
    softRemoveItem('event',gone.id).then(ok=>{ if(!ok) return; render();
      showUndoToast('Event removed — kept in Recently deleted', async()=>{ const t=trash.find(q=>q.kind==='event'&&q.item&&q.item.id===gone.id); if(t) await restoreTrashItem(t.id); render(); }, 6000); });
  });
  document.querySelectorAll('[data-calplandel]').forEach(b=>b.onclick=(ev)=>{
    ev.stopPropagation();
    const gone = planned.find(x=>x.id===b.dataset.calplandel); if(!gone) return;
    softRemoveItem('planned',gone.id).then(ok=>{ if(!ok) return; render();

// Search looks in three places, all inside THIS account only:
//  herd  = rabbits in your herd right now
//  anc   = pedigree-only and past rabbits that sit in the pedigree of someone in your herd
//  all   = every record you have ever entered (herd, sold/deceased/retired, and every pedigree-only ancestor)
function searchPool(mode){
  if(mode==='all') return rabbits;
  if(mode==='anc'){
    const idx=relBuildIndex(), keys=new Set();
    rabbits.filter(isActive).forEach(h=>{ relAncestors(h.name, idx, 8).forEach((v,k)=>keys.add(k)); });
    return rabbits.filter(r=>!isActive(r) && keys.has(relKey(r.name)));
  }
  return rabbits.filter(isActive);
}
function scoreSearch(pool,q){
  return pool.map(r=>{
    const n=nameKey(r.name);
    let s=99;
    if(n===q) s=0; else if(n.startsWith(q)) s=1; else if(n.includes(q)) s=2;
    else if(r.alias && nameKey(r.alias).includes(q)) s=2.2;
    else if(r.earNumber && r.earNumber.toLowerCase()===q) s=1;
    else if(r.earNumber && r.earNumber.toLowerCase().includes(q)) s=2.5;
    else if(r.color && r.color.toLowerCase().includes(q)) s=4;
    else if(r.breed && r.breed.toLowerCase().includes(q)) s=4.5;
    else { const d=levenshtein(n,q); const lim = q.length>=8?2 : q.length>=5?1 : 0; if(d<=lim) s=3+d; }
    return {r,s};
  }).filter(x=>x.s<99).sort((a,b)=>a.s-b.s||a.r.name.localeCompare(b.r.name));
}
function renderSearch(main){
  const q=nameKey(searchQuery);
  const counts={herd:scoreSearch(searchPool('herd'),q).length, anc:scoreSearch(searchPool('anc'),q).length, all:scoreSearch(searchPool('all'),q).length};
  const scored=scoreSearch(searchPool(searchMode),q).slice(0,25);
  const chip=(m,l)=>`<button type="button" class="btn ${searchMode===m?'btn-primary':'btn-secondary'} btn-sm" data-smode2="${m}">${l} &middot; ${counts[m]}</button>`;
  // If the search clearly names one rabbit (e.g. "Abu"), say how each other result is related to it.
  const relMap=new Map(), relOrder=[]; let anchor=null; const anchors=[];
  if(q.length>=2){
    // every record whose name contains what was typed counts (a rabbit can be entered under more than one spelling), up to 3
    scoreSearch(searchPool('all'),q).filter(x=>x.s<=2.2).slice(0,3).forEach(x=>anchors.push(x.r));
    anchor=anchors[0]||null;
    anchors.forEach(an=>{
      try{ const g=relativesOf(an,'everyone'); const nm=esc(an.name);
        ['anc','sib','kid','aunt','other'].forEach(k=>(g[k]||[]).forEach(it=>{
          if(relMap.has(it.r.id) || anchors.some(a=>a.id===it.r.id)) return;
          let lab=it.label||''; const ix=lab.search(/ &middot; |, /);
          let out;
          if(k==='other') out='Related to '+nm+' &middot; '+lab;
          else if(ix>=0) out=lab.slice(0,ix)+' of '+nm+lab.slice(ix);
          else out=lab+' of '+nm;
          relMap.set(it.r.id,out); relOrder.push(it.r.id); }));
      }catch(e){}
    });
  }
  const anchorNames=anchors.map(a=>a.name).join(' / ');
  const bar=`<div class="search-scope" style="grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;">${chip('herd','My herd')}${chip('anc','Ancestors of my herd')}${chip('all','Everyone I’ve entered')}</div>`;
  const where={herd:'in your herd',anc:'in the pedigrees of your herd',all:'in everything you’ve entered'}[searchMode];
  let body;
  const relPool=new Set(searchPool(searchMode).map(x=>x.id));
  const relOnly=(!scored.length && anchor) ? relOrder.filter(id=>relPool.has(id)).slice(0,60).map(id=>rabbits.find(x=>x.id===id)).filter(Boolean) : [];
  if(!scored.length && relOnly.length){
    const ext=r=>r.status==='external';
    body=`<div class="section-label" style="grid-column:1/-1;">${esc(anchorNames).toUpperCase()} IS NOT IN THIS LIST &mdash; RELATED RABBITS THAT ARE &middot; ${relOnly.length}</div>`+relOnly.map(r=>`<div class="card" ${ext(r)?'':`data-openprofile="${r.id}"`}><div class="card-top"><div><div class="card-name">${esc(r.name)}</div><div class="card-sub">${subLine(r)}</div></div>${ext(r)?'<span class="badge b-gone">ANCESTOR</span>':statusBadge(r)}</div>
        <div class="rel-path"><span class="rel-arrow">&#8627;</span> ${relMap.get(r.id)}</div>
        <div class="card-actions"><button class="btn btn-secondary btn-sm" data-act="edit" data-id="${r.id}">${ext(r)?'Open / edit':'Edit'}</button><button class="btn btn-secondary btn-sm" data-act="pedigree" data-id="${r.id}">Pedigree</button><button class="btn btn-secondary btn-sm" data-act="relatives" data-id="${r.id}">Relatives</button></div></div>`).join('');
  } else if(!scored.length){
    const other=['herd','anc','all'].filter(m=>m!==searchMode&&counts[m]>0);
    body=`<div class="empty" style="grid-column:1/-1;">No rabbit matches "${esc(searchQuery)}" ${where}.${other.length?' Try another list above — it has matches.':''}</div>`;
  } else {
    const cardHTML=(r)=>{
      const ext=r.status==='external';
      const badge=ext?'<span class="badge b-gone">ANCESTOR</span>':statusBadge(r);
      return `<div class="card" ${ext?'':`data-openprofile="${r.id}"`}><div class="card-top"><div><div class="card-name">${esc(r.name)}</div><div class="card-sub">${subLine(r)}</div></div>${badge}</div>
        ${relMap.get(r.id)?`<div class="rel-path"><span class="rel-arrow">&#8627;</span> ${relMap.get(r.id)}</div>`:(anchors.some(a=>a.id===r.id)?'<div class="rel-path"><span class="rel-arrow">&#8627;</span> This is a rabbit you searched for</div>':'')}
        <div class="card-actions"><button class="btn btn-secondary btn-sm" data-act="edit" data-id="${r.id}">${ext?'Open / edit':'Edit'}</button><button class="btn btn-secondary btn-sm" data-act="pedigree" data-id="${r.id}">Pedigree</button><button class="btn btn-secondary btn-sm" data-act="relatives" data-id="${r.id}">Relatives</button></div></div>`;
    };
    body=`<div class="section-label" style="grid-column:1/-1;">${scored.length} MATCH${scored.length===1?'':'ES'} ${where.toUpperCase()}</div>`+scored.map(({r})=>cardHTML(r)).join('');
    const shown=new Set(scored.map(x=>x.r.id));
    const pool=new Set(searchPool(searchMode).map(x=>x.id));
    const rel=relOrder.filter(id=>!shown.has(id)&&pool.has(id)).slice(0,60).map(id=>rabbits.find(x=>x.id===id)).filter(Boolean);
    if(anchor && rel.length) body+=`<div class="section-label" style="grid-column:1/-1;">RELATED TO ${esc(anchorNames).toUpperCase()} &middot; ${rel.length}</div>`+rel.map(cardHTML).join('');
  }
  let relNote='';
  if(anchors.length && relOrder.length){
    const cnt=m=>{ const ids=new Set(searchPool(m).map(x=>x.id)); return relOrder.filter(id=>ids.has(id)).length; };
    const parts=[['herd','in My herd'],['anc','in Ancestors'],['all','in Everyone']].map(([m,l])=>{ const n=cnt(m); return n?(m===searchMode?`<b>${n} ${l}</b>`:`<a href="#" data-smode2="${m}" style="color:var(--rb-text,var(--gold-deep));font-weight:800;">${n} ${l}</a>`):''; }).filter(Boolean);
    relNote=`<div class="card-sub" style="grid-column:1/-1;margin:2px 4px 4px;">Rabbits related to ${esc(anchorNames)}: ${parts.join(' &middot; ')}</div>`;
  }
  main.innerHTML=bar+relNote+body;
  main.querySelectorAll('[data-smode2]').forEach(b=>b.onclick=(e)=>{ e.preventDefault(); searchMode=b.dataset.smode2; renderMain(); });
  attachCardEvents();
}

function attachSuggest(input, getOptions){
  const box = document.createElement('div');
  box.className = 'suggest-box';
  input.insertAdjacentElement('afterend', box);
  let suppressNext = false;
  function render(){
    if(suppressNext){ suppressNext=false; box.style.display='none'; box.innerHTML=''; return; }
    const q = input.value.trim().toLowerCase();
    const seen = new Set();
    const opts = getOptions().filter(Boolean).filter(o=>{
      const k=o.toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true;
    }).filter(o=>!q || o.toLowerCase().includes(q)).slice(0,6);
    if(!opts.length){ box.style.display='none'; box.innerHTML=''; return; }
    box.style.display='block';
    box.innerHTML = opts.map(o=>`<button type="button" class="suggest-item">${esc(o)}</button>`).join('');
    box.querySelectorAll('.suggest-item').forEach(btn=>{
      btn.addEventListener('mousedown', e=>e.preventDefault());
      btn.addEventListener('click', ()=>{
        suppressNext = true;
        input.value = btn.textContent; box.style.display='none'; box.innerHTML='';
        input.dispatchEvent(new Event('input', {bubbles:true}));
        input.dispatchEvent(new Event('change', {bubbles:true}));
      });
    });
  }
  input.addEventListener('input', render);
  input.addEventListener('focus', render);
  input.addEventListener('blur', ()=>setTimeout(()=>{ box.style.display='none'; },150));
}
function allRabbitNames(excludeId){ return rabbits.filter(r=>r.id!==excludeId).map(r=>r.name); }
function allKnownColors(){ return [...new Set(rabbits.map(r=>r.color).filter(Boolean))].sort(); }

// Live "this rabbit already exists" suggestions on a Name field. Unlike
// attachSuggest, picking one doesn't just fill in text — it jumps
// straight into editing that real record, since the whole point is to
// stop a duplicate being created (e.g. a rabbit that already exists as
// a bare-bones ancestor stub from a pedigree import) and instead pull
// in every field that record already has.
function attachNameMatchSuggest(input){
  const box = document.createElement('div');
  box.className = 'suggest-box';
  input.insertAdjacentElement('afterend', box);
  function render(){
    const q = nameKey(input.value);
    if(q.length<2){ box.style.display='none'; box.innerHTML=''; return; }
    const matches = rabbits.filter(r=>nameKey(r.name).includes(q)).slice(0,6);
    if(!matches.length){ box.style.display='none'; box.innerHTML=''; return; }
    box.style.display='block';
    box.innerHTML = matches.map(r=>`<button type="button" class="suggest-item" data-existingid="${r.id}">${esc(r.name)} <span style="opacity:.6; font-size:11px;">— already in your herd</span></button>`).join('');
    box.querySelectorAll('.suggest-item').forEach(btn=>{
      btn.addEventListener('mousedown', e=>e.preventDefault());
      btn.addEventListener('click', ()=>{
        const r = rabbits.find(x=>x.id===btn.dataset.existingid);
        box.style.display='none'; box.innerHTML='';
        if(r){ closeSheet(); if(isArchived(r)) openUnarchive(r); else openEditSheet(r); }
      });
    });
  }
  input.addEventListener('input', render);
  input.addEventListener('focus', render);
  input.addEventListener('blur', ()=>setTimeout(()=>{ box.style.display='none'; },150));
}

function runCardAct(act,r,btn){

  else if(act==='relatives') openRelativesSheet(r);
  else if(act==='more') openCardMore(r);
}

function openKindledSheet(r, editing){

  const st = { born:born0, alive: editing?existing.length:0, doa:d.DOA||0, peanut:d.peanut||0, passed:d.passed||0,
    rebreed: editing&&r.rebreedDate ? r.rebreedDate : addDays(born0,28),
    touched: !!(editing && r.rebreedDate && r.rebreedDate!==addDays(born0,28)) };
  const stepper=(key,big,min)=>`<div class="stepper ${big?'stepper-lg':''}">
      <button type="button" data-st="${key}" data-d="-1" aria-label="Fewer">&minus;</button>
      <div class="st-num" id="st-${key}">${st[key]}</div>
      <button type="button" data-st="${key}" data-d="1" aria-label="More">+</button></div>`;
  openSheet(`<div class="lit-sheet"><button class="close-x" onclick="closeSheet()">&times;</button>
    <h2>${esc(r.name)} — ${editing?'edit litter':'kindled'}</h2>
    <div class="lit-card"><div class="field"><label>Date kindled</label><input type="date" id="f-born" value="${esc(st.born)}"></div>
    ${needsBuck?`<div class="field" style="margin-top:12px;"><label>Buck (optional)</label><input id="f-buck" placeholder="Type or pick a buck" autocomplete="off">
      <div class="lit-hint" id="f-bredhint"></div></div>`:''}</div>
    ${(editing&&litterUiOn)?`<div class="lit-card"><div class="st-row" style="padding:0;"><div><b>${existing.length} ${existing.length===1?'kit':'kits'} in this litter</b><div class="card-sub">To record a loss, use the litter page.</div></div><button type="button" class="btn btn-secondary btn-sm" id="f-addkit">+ Add a kit</button></div></div>`:`<div class="st-block lit-card lit-alive">
      <div class="st-title">Kits born alive</div>
      ${stepper('alive',true)}
      ${linkedCount?`<div class="card-sub" style="text-align:center; margin-top:6px;">${linkedCount} ${linkedCount===1?'kit already has':'kits already have'} a profile page, so this can't go below ${linkedCount}.</div>`:''}
    </div>`}
    ${(!editing && litterUiOn)?oldKitsNoticeHTML(r):''}
    ${(editing&&litterUiOn)?'':`<details class="lp-fold" ${(st.doa||st.peanut||st.passed)?'open':''} style="margin-bottom:12px;"><summary>Any lost at birth? <span>optional</span></summary>
    <div class="st-lost">
      <div class="st-row"><div class="st-lbl">DOA</div>${stepper('doa')}</div>
      <div class="st-row"><div class="st-lbl">Peanut</div>${stepper('peanut')}</div>
      <div class="st-row"><div class="st-lbl">Passed</div>${stepper('passed')}</div>
    </div></details>`}
    <div class="lit-card"><div class="field"><label>Rebreed date</label>
      <input type="date" id="f-rebreed-date" value="${esc(st.rebreed)}">
      <div class="lit-hint" id="f-rebreed-hint"></div></div></div>
    <div class="lit-note">${(editing&&litterUiOn)?'':'Sex and color can be filled in later from the litter page.'}</div>
    <div class="sheet-actions"><button class="btn btn-secondary" onclick="closeSheet()">Cancel</button><button class="btn btn-primary" id="f-save">Save</button></div>
    ${editing?'<button class="lit-delete" id="f-deletelitter">Delete litter</button>':''}</div>`);
  const bornEl=document.getElementById('f-born'), rebEl=document.getElementById('f-rebreed-date');
  const weeksBetween=(a,b)=>{ const n=daysBetween(a,b); return n%7===0 ? (n/7)+' weeks from birth' : n+' days from birth'; };
  const refresh=()=>{
    ['alive','doa','peanut','passed'].forEach(k=>{ const el=document.getElementById('st-'+k); if(el) el.textContent=st[k]; });
    document.getElementById('f-rebreed-hint').textContent = (st.rebreed&&st.born)?'('+weeksBetween(st.born,st.rebreed)+')':'';
    const bh=document.getElementById('f-bredhint'); if(bh) bh.textContent='She wasn’t marked bred, so her bred date will be set to '+fmtDate(addDays(st.born,-31))+' (31 days before birth).';
  };
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.st, min = k==='alive'?linkedCount:0;
    st[k]=Math.max(min, st[k]+(+b.dataset.d)); refresh();
  });
  const onBorn=()=>{ const v=csvParseDate(bornEl.value); if(!v) return; st.born=v; if(!st.touched){ st.rebreed=addDays(v,28); rebEl.value=st.rebreed; } refresh(); };
  const onReb=()=>{ const v=csvParseDate(rebEl.value); if(v){ st.rebreed=v; st.touched=true; refresh(); } };
  ['change','input','blur'].forEach(ev=>{ bornEl.addEventListener(ev,onBorn); rebEl.addEventListener(ev,onReb); });
  if(needsBuck) attachSuggest(document.getElementById('f-buck'), ()=>rabbits.filter(x=>x.sex==='buck'&&x.status!=='external').map(x=>x.name));
  refresh();
  const akb=document.getElementById('f-addkit'); if(akb) akb.onclick=()=>{ onBorn(); onReb(); saveLitterNow(); addKitToLitter(r); openLitterPage(r.id); };
  const delLitterBtn = document.getElementById('f-deletelitter');
  if(delLitterBtn) delLitterBtn.onclick=()=>{
    armConfirm(delLitterBtn, 'Tap again to confirm', ()=>{
      const delBorn=r.litterBornDate;
      // keep a full copy first, so a deleted litter can be put back from Recently deleted
      (r.removedLitters=r.removedLitters||[]).push({id:uid(), removedAt:todayStr(), litterBornDate:r.litterBornDate, litterKits:r.litterKits, litterDead:r.litterDead, litterLosses:r.litterLosses||[], litterNotes:r.litterNotes||'', weanDate:r.weanDate, sellDate:r.sellDate, rebreedDate:r.rebreedDate, partner:r.partner, bredDate:r.bredDate, entry:(()=>{ const e=(r.breedingHistory||[]).find(x=>x.outcome==='litter'&&x.litterBornDate===r.litterBornDate); return e?JSON.parse(JSON.stringify(e)):null; })()});
      r.litterLosses=[]; r.litterNotes='';
      r.litterBornDate=null; r.litterKits=[]; r.litterDead=null; r.weanDate=null; r.sellDate=null; r.rebreedDate=null; r.lastLitterSummary='';
      const hist = r.breedingHistory||[];
      const entry = hist.find(x=>x.outcome==='litter' && x.litterBornDate===delBorn) || hist[hist.length-1];
      if(entry && entry.outcome==='litter' && entry.autoBred){
        // this breeding only existed because the litter was logged directly, so remove it too
        hist.pop(); r.status='open'; r.dueDate=null; r.bredDate=null; r.partner=null; r.activeBreedingId=null;
      } else {
        if(entry && entry.outcome==='litter'){ entry.outcome=null; entry.litterBornDate=null; entry.litterKits=null; entry.litterDead=null; entry.weanDate=null; entry.sellDate=null; }
        if(r.bredDate){ r.status='pregnant'; r.dueDate=addDays(r.bredDate,31); }
        else { r.status='open'; r.dueDate=null; }
      }
      saveData(); closeSheet(); render(); if(profileRabbitId) renderProfile(); showToast('Litter deleted');
    });
  };
  const saveLitterNow=()=>{
    // read what is actually showing in the date boxes, so what you see is what gets saved
    onBorn(); onReb();
    const yr=+String(st.born||'').slice(0,4), thisYr=new Date().getFullYear();
    if(!st.born || yr<thisYr-15 || yr>thisYr+1){ showToast('Check the kindled date — it says '+(st.born?fmtDate(st.born):'nothing')+'. Fix it, then Save.'); return; }
    const born=st.born||todayStr();
    const wasEditing = editing;
    // kits: new litters start blank; editing adds blanks or drops unlinked kits from the end
    let kits;
    if(editing){
      kits = existing.map(k=>Object.assign({}, k, {id:k.id||uid(), sex:k.sex||'', color:k.color||'', forSale:!!k.forSale, individualId:k.individualId||null}));   // keeps tags, weights, sale, markings and numbers
      while(kits.length<st.alive) kits.push(blankKit());
      for(let i=kits.length-1; i>=0 && kits.length>st.alive; i--){ if(!kits[i].individualId){ (r.removedKits=r.removedKits||[]).push({id:uid(), removedAt:todayStr(), litterBorn:r.litterBornDate, kit:kits[i]}); kits.splice(i,1); } }
    } else {
      kits = Array.from({length:st.alive}, blankKit);
    }
    let buck = '';
    if(needsBuck){
      buck = (document.getElementById('f-buck').value||'').trim();
      if(buck && !rabbits.some(x=>nameKey(x.name)===nameKey(buck))) rabbits.push(blankRabbit({name:buck,sex:'buck',status:'available'}));
      const bred = addDays(born,-31);
      r.bredDate=bred; r.partner=buck||null;
      r.breedingHistory = r.breedingHistory||[];
      const e0={id:uid(), bredDate:bred, partner:buck, dueDate:born, outcome:'pending', litterBornDate:null, litterKits:null, litterDead:null, weanDate:null, sellDate:null, autoBred:true};
      r.breedingHistory.push(e0); r.activeBreedingId=e0.id;
    }
    const oldBorn = r.litterBornDate;
    if(!wasEditing && oldBorn && (r.litterKits||[]).length && !(r.breedingHistory||[]).some(e=>e.outcome==='litter' && e.litterBornDate===oldBorn)){
      // the previous litter has no copy in her breeding history: keep one so it is never lost
      (r.removedLitters=r.removedLitters||[]).push({id:uid(), removedAt:todayStr(), litterBornDate:oldBorn, litterKits:r.litterKits, litterDead:r.litterDead, litterLosses:r.litterLosses||[], litterNotes:r.litterNotes||'', weanDate:r.weanDate, sellDate:r.sellDate, rebreedDate:r.rebreedDate, partner:r.partner, bredDate:null, entry:null});
    }
    if(!wasEditing){ syncLitterEntry(r); r.litterLosses=[]; r.litterNotes=''; }
    r.status='nursing'; r.litterBornDate=born; r.litterKits=kits;
    r.litterDead={DOA:st.doa,peanut:st.peanut,passed:st.passed}; r.weanDate=addDays(born,42); r.sellDate=addDays(born,56);
    r.rebreedDate=st.rebreed||addDays(born,28); r.dueDate=null; r.flag='';
    r.lastLitterSummary=litterSummaryText(r);
    r.breedingHistory = r.breedingHistory||[];
    // when editing, update the history entry for THIS litter (matched by its old birth date), not just the newest one
    let entry = (wasEditing && oldBorn && r.breedingHistory.find(x=>x.outcome==='litter' && x.litterBornDate===oldBorn))
      || r.breedingHistory.find(x=>x.id===r.activeBreedingId) || (wasEditing ? r.breedingHistory[r.breedingHistory.length-1] : null);
    if(!entry){ entry={id:uid(), bredDate:r.bredDate||born, partner:r.partner||'', dueDate:null}; r.breedingHistory.push(entry); }
    entry.outcome='litter'; entry.litterBornDate=born; entry.litterKits=r.litterKits; entry.litterDead=r.litterDead;
    entry.weanDate=r.weanDate; entry.sellDate=r.sellDate;
    r.litterKits.forEach(k=>{
      if(k.individualId){
        const kr=rabbits.find(x=>x.id===k.individualId);
        if(kr){ if(k.sex) kr.sex=k.sex; kr.color=k.color; kr.dob=born; }
      }
    });
    saveData(); closeSheet(); render(); if(profileRabbitId) renderProfile();
    showToast(wasEditing?'Litter updated':`${r.name} moved to nursing`);
  };
  document.getElementById('f-save').onclick=()=>{
    if(!editing && litterUiOn){
      onBorn(); onReb();
      const yr=+String(st.born||'').slice(0,4), thisYr=new Date().getFullYear();
      if(!st.born || yr<thisYr-15 || yr>thisYr+1){ saveLitterNow(); return; }   // shows the date warning
      const sexes={}; let missing=false;
      document.querySelectorAll('[data-pjs]').forEach(sel=>{ sexes[sel.dataset.pjs]=sel.value; if(!sel.value) missing=true; });
      if(missing){ showToast('Pick a sex for the kits from her last litter'); return; }
      convertOldKitsToJuniors(r, sexes);
    }
    saveLitterNow();
  };
}

/* Edit one kit: sex (Doe / Buck / Not sure) and color */
function openKitEditSheet(damId, idx){
  const dam=rabbits.find(x=>x.id===damId); if(!dam||!dam.litterKits||!dam.litterKits[idx]) return;
  const k=dam.litterKits[idx];
  const linked = k.individualId ? rabbits.find(x=>x.id===k.individualId) : null;
  let sex = k.sex||'';
  const colors=['Black','Blue','Tort','Sable','Orange'];
  openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button>
    <h2>Edit kit #${idx+1}</h2>
    <div class="field"><label>Sex</label>
      <div class="seg" id="kit-sex"><button type="button" data-v="doe">Doe</button><button type="button" data-v="buck">Buck</button>${linked?'':'<button type="button" data-v="">Not sure</button>'}</div></div>
    <div class="field"><label>Color</label><input id="kit-color" placeholder="e.g. Black, Blue, Broken&hellip;" value="${esc(k.color||'')}" autocomplete="off">
</div>
    <div class="sheet-actions"><button class="btn btn-secondary" onclick="closeSheet()">Cancel</button><button class="btn btn-primary" id="kit-save">Save</button></div>`);
  const paint=()=>document.querySelectorAll('#kit-sex button').forEach(b=>b.classList.toggle('on', b.dataset.v===sex));
  document.querySelectorAll('#kit-sex button').forEach(b=>b.onclick=()=>{ sex=b.dataset.v; paint(); });
  paint();
  const colorEl=document.getElementById('kit-color');
  attachSuggest(colorEl, allKnownColors);
  document.getElementById('kit-save').onclick=()=>{
    if(linked && !sex){ showToast('This kit has a profile, so pick Doe or Buck'); return; }
    const color=colorEl.value.trim();
    k.sex=sex; k.color=color;
    // keep the matching breeding-history litter entry in step (it is a separate saved copy)
    (dam.breedingHistory||[]).forEach(e=>{
      if(e.outcome==='litter' && e.litterBornDate===dam.litterBornDate && e.litterKits){
        const m=e.litterKits.find(x=>x.id===k.id); if(m && m!==k){ m.sex=sex; m.color=color; }
      }
    });
    if(linked){ linked.sex=sex; linked.color=color; }
    dam.lastLitterSummary=litterSummaryText(dam);
    saveData(); closeSheet(); render(); if(profileRabbitId) renderProfile();
    showToast('Kit #'+(idx+1)+' updated');
  };
}

function openBreedSheet(r, presetBuck, onDone){

  openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button>
    <h2>${esc(r.name)} bred</h2>
    <div class="field"><label>Buck</label><input id="f-buck" placeholder="Type or pick a buck" value="${esc(presetBuck||'')}"></div>
    <div id="f-relate" class="relate-box">Pick a buck to check relatedness.</div>
    <div class="field" style="margin-top:12px;"><label>Bred date</label><input type="date" id="f-bred" value="${esc(todayStr())}"></div>
    <div class="sheet-actions"><button class="btn btn-secondary" onclick="closeSheet()">Cancel</button><button class="btn btn-primary" id="f-save">Save</button></div>`);
  const buckInput=document.getElementById('f-buck'), box=document.getElementById('f-relate'), saveBtn=document.getElementById('f-save');
  attachSuggest(buckInput, ()=>bucks);
  function upd(){
    const b=buckInput.value.trim();
    if(!b){ box.className='relate-box'; box.textContent='Pick a buck to check relatedness.'; saveBtn.textContent='Save'; return; }
    const rel=relatednessSummary(r.name,b);
    box.className='relate-box'; box.innerHTML=relateBoxHTML(rel)+warnBoxHTML(r, findByName(b)||{name:b});
    saveBtn.textContent = 'Save';
  }
  buckInput.addEventListener('input',upd); upd();
  saveBtn.onclick=()=>{
    const buck=buckInput.value.trim(), bred=csvParseDate(document.getElementById('f-bred').value)||todayStr();
    if(buck && !rabbits.some(x=>nameKey(x.name)===nameKey(buck))){
      const dupes=fuzzyMatches(buck);
      if(dupes.length){ openDuplicateSheet(buck, dupes, chosen=>{ commitBreed(r, chosen||buck, bred, onDone); }); return; }
    }
    commitBreed(r, buck, bred, onDone);
  };
}

// Fix the buck or bred date of a breeding that's already recorded (nothing else on her record changes).
function openEditBreedingSheet(r){
  const bucks = rabbits.filter(x=>x.sex==='buck'&&x.status!=='external').map(x=>x.name);
  openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button>
    <h2>${esc(r.name)} — edit breeding</h2>
    <div class="field"><label>Buck</label><input id="f-buck" placeholder="Type or pick a buck" value="${esc(r.partner||'')}" autocomplete="off"></div>
    <div class="field" style="margin-top:12px;"><label>Bred date</label><input type="date" id="f-bred" value="${esc(r.bredDate||todayStr())}"></div>
    <div class="card-sub" id="f-dueline" style="margin-top:8px;"></div>
    <div class="sheet-actions"><button class="btn btn-secondary" onclick="closeSheet()">Cancel</button><button class="btn btn-primary" id="f-save">Save</button></div>`);
  attachSuggest(document.getElementById('f-buck'), ()=>bucks);
  const dueLine=()=>{ const v=csvParseDate(document.getElementById('f-bred').value); document.getElementById('f-dueline').textContent = v ? 'Due about '+fmtDate(addDays(v,31)) : ''; };
  document.getElementById('f-bred').addEventListener('input',dueLine); dueLine();
  const commit=(buck,bred)=>{
    r.partner=buck||null; r.bredDate=bred; r.dueDate=addDays(bred,31);
    const e=(r.breedingHistory||[]).find(x=>x.id===r.activeBreedingId);
    if(e){ e.bredDate=bred; e.partner=buck||''; e.dueDate=r.dueDate; }
    if(buck && !rabbits.some(x=>nameKey(x.name)===nameKey(buck))) rabbits.push(blankRabbit({name:buck,sex:'buck',status:'available'}));
    saveData(); closeSheet(); render(); if(profileRabbitId) renderProfile(); showToast('Breeding updated');
  };
  document.getElementById('f-save').onclick=()=>{
    const buck=document.getElementById('f-buck').value.trim(), bred=csvParseDate(document.getElementById('f-bred').value)||r.bredDate||todayStr();
    if(buck && !rabbits.some(x=>nameKey(x.name)===nameKey(buck))){
      const dupes=fuzzyMatches(buck);
      if(dupes.length){ openDuplicateSheet(buck, dupes, chosen=>{ commit(chosen||buck, bred); }); return; }
    }
    commit(buck, bred);
  };
}
function commitBreed(r, buck, bred, onDone){
  // make sure the finished litter is saved in her history before anything on her record changes
  if(r.litterBornDate && (r.litterKits||[]).length){
    syncLitterEntry(r);
    if(!(r.breedingHistory||[]).some(e=>e.outcome==='litter' && e.litterBornDate===r.litterBornDate)){
      (r.removedLitters=r.removedLitters||[]).push({id:uid(), removedAt:todayStr(), litterBornDate:r.litterBornDate, litterKits:r.litterKits, litterDead:r.litterDead, litterLosses:r.litterLosses||[], litterNotes:r.litterNotes||'', weanDate:r.weanDate, sellDate:r.sellDate, rebreedDate:r.rebreedDate, partner:r.partner, bredDate:null, entry:null});
    }
  }
  const keepOldKits = litterUiOn && unplacedKits(r).length>0;   // new view: unplaced kits stay visible until the next litter is recorded
  r.status='pregnant'; r.partner=buck||null; r.bredDate=bred; r.dueDate=addDays(bred,31);
  if(!keepOldKits){ r.litterBornDate=null; r.litterKits=null; r.litterDead=null; }
  r.flag='';
  r.breedingHistory = r.breedingHistory||[];
  const entry = {id:uid(), bredDate:bred, partner:buck||'', dueDate:r.dueDate, outcome:'pending', litterBornDate:null, litterKits:null, litterDead:null, weanDate:null, sellDate:null};
  r.breedingHistory.push(entry); r.activeBreedingId = entry.id;
  if(buck && !rabbits.some(x=>nameKey(x.name)===nameKey(buck))) rabbits.push(blankRabbit({name:buck,sex:'buck',status:'available'}));
  saveData(); closeSheet(); render(); if(profileRabbitId) renderProfile(); showToast(r.name+' marked bred');
  if(onDone) onDone();
}

function openDuplicateSheet(typedName, matches, onResolve){
  openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button>
    <h2>Possible duplicate</h2>
    <div class="dupe-box">You typed <b>${esc(typedName)}</b>. These look very similar to rabbits already on file.</div>
    <div class="sheet-actions" style="margin:4px 0 14px;"><button class="btn btn-primary" id="f-new" style="width:100%;">It's a different rabbit &mdash; add "${esc(typedName)}" as new</button></div>
    <div class="section-label">OR IS IT ONE OF THESE? (TAP ONE TO USE THAT RABBIT INSTEAD &mdash; NOTHING NEW IS ADDED)</div>
    ${matches.map(m=>`<button class="btn btn-secondary" style="width:100%; margin-bottom:8px; text-align:left;" data-usedupe="${esc(m.name)}">Yes, it's ${esc(m.name)} &mdash; ${m.status}${m.color?' &middot; '+esc(m.color):''}</button>`).join('')}`);
  document.querySelectorAll('[data-usedupe]').forEach(b=>b.onclick=()=>{ closeSheet(); onResolve(b.dataset.usedupe); });
  document.getElementById('f-new').onclick=()=>{ closeSheet(); onResolve(null); };
}

// ===================== Merge duplicates =====================
// Side-by-side merge. Finds likely duplicate pairs (same name, same ear #,
// near-identical names), shows what each record actually contains, lets you
// pick a value only where the two records genuinely conflict, combines
// photos / notes / wins / weigh-ins / breeding history from both, and offers
// a short Undo afterwards.
const MERGE_FIELDS = [
  ['name','Name'],['sex','Sex'],['breed','Breed'],['color','Color'],['earNumber','Ear #'],
  ['dob','Date of birth'],['weight','Weight'],['legsWins','Legs'],['registrationNumber','Reg #'],
  ['gcNumber','GC #'],['sireName','Sire'],['damName','Dam'],['notes','Notes']
];
const MERGE_STATUS_KEYS = ['status','external','partner','bredDate','dueDate','rebreedDate','activeBreedingId','prevStatus','presaleFlag','forSale','sale','graduatedDate','juniorAckDone','nestBoxAckDate','litterConvertAckDate'];
const MERGE_LITTER_KEYS = ['litterBornDate','litterKits','litterDead','weanDate','sellDate','lastLitterSummary','litterLosses','litterNotes'];

function mgNorm(s){ return nameKey(s); }
function mgEmpty(v){ return v===null || v===undefined || (typeof v==='string' && !v.trim()) || (Array.isArray(v) && !v.length); }
function mgStatusText(r){ if(r.status==='external') return 'Ancestor'; const s=r.status||'open'; return s.charAt(0).toUpperCase()+s.slice(1); }
function mgFieldText(r,f){
  const v=r[f];
  if(mgEmpty(v)) return '';
  if(f==='dob') return fmtDate(v);
  if(f==='weight') return fmtWeight(v);
  if(f==='sex') return v==='buck'?'Buck':'Doe';
  return String(v);
}
function mgStatusGroupText(r){
  let t=mgStatusText(r);
  if(r.partner) t+=' · bred to '+r.partner;
  if(r.dueDate) t+=' · due '+fmtDate(r.dueDate);
  return t;
}
function mgLitterText(r){
  if(mgEmpty(r.litterKits) && !r.litterBornDate) return '';
  const n = Array.isArray(r.litterKits) ? r.litterKits.length : r.litterKits;
  return (n!==undefined && n!==null && n!=='' ? n+' kit'+(n==1?'':'s') : 'Litter')+(r.litterBornDate?' born '+fmtDate(r.litterBornDate):'');
}
function mgChildCount(r){
  const n=mgNorm(r.name); if(!n) return 0;
  return rabbits.filter(x=>x.id!==r.id && (mgNorm(x.sireName)===n || mgNorm(x.damName)===n)).length;
}
function mgCompleteness(r){
  let s=0;
  MERGE_FIELDS.forEach(([f])=>{ if(!mgEmpty(r[f])) s++; });
  if(!mgEmpty(r.photos)) s+=2; if(!mgEmpty(r.notesLog)) s++; if(!mgEmpty(r.wins)) s++; if(!mgEmpty(r.weightLog)) s++;
  if(r.status!=='external') s+=2;
  return s;
}
function mgBriefHTML(r){
  const bits=[r.sex==='buck'?'Buck':'Doe', mgStatusText(r)];
  if(r.breed) bits.push(r.breed);
  if(r.color) bits.push(r.color);
  if(r.earNumber) bits.push('Ear '+r.earNumber);
  bits.push(r.dob ? 'Born '+fmtDate(r.dob) : 'no birthdate');
  bits.push(r.weight ? fmtWeight(r.weight) : 'no weight');
  if(r.registrationNumber) bits.push('Reg '+r.registrationNumber);
  const ph=(r.photos||[]).length; if(ph) bits.push(ph+' photo'+(ph===1?'':'s'));
  const kids=mgChildCount(r); if(kids) bits.push('parent of '+kids);
  return `<div style="font-size:14px; font-weight:600; color:var(--navy);">${esc(r.name||'(no name)')}</div>
    <div class="card-sub" style="margin-top:2px; line-height:1.45;">${esc(bits.join(' · '))}</div>`;
}
function mgFindPairs(){
  const out=[];
  for(let i=0;i<rabbits.length;i++) for(let j=i+1;j<rabbits.length;j++){
    const a=rabbits[i], b=rabbits[j];
    const na=mgNorm(a.name), nb=mgNorm(b.name), ea=mgNorm(a.earNumber), eb=mgNorm(b.earNumber);
    let reason=null, rank=9;
    if(na && na===nb){ reason='Same name'; rank=0; }
    else if(ea && ea===eb){ reason='Same ear #'; rank=1; }
    else if(na && nb && a.sex===b.sex && Math.abs(na.length-nb.length)<=2){
      const maxLen=Math.max(na.length,nb.length), tol=maxLen<=7?1:maxLen<=11?2:3;
      if(levenshtein(na,nb)<=tol){ reason='Similar names'; rank=2; }
    }
    if(reason) out.push({a,b,reason,rank});
  }
  out.sort((x,y)=>x.rank-y.rank || mgNorm(x.a.name).localeCompare(mgNorm(y.a.name)));
  return out.slice(0,40);
}

function openMergeSheet(){
  const pairs=mgFindPairs();
  let slots=[null,null];
  openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button>
    <h2>Merge duplicates</h2>
    <div class="card-sub" style="margin-bottom:12px;">Combines two records into one. You'll see both side by side first and choose what to keep, and you can undo right after.</div>
    <div class="section-label">LIKELY DUPLICATES${pairs.length?` (${pairs.length})`:''}</div>
    <div id="mg-pairs">${pairs.length ? pairs.map((p,i)=>`<button class="mg-pair" data-pair="${i}">
        <span class="mg-tag">${esc(p.reason)}</span>
        ${mgBriefHTML(p.a)}
        <div class="mg-vs">AND</div>
        ${mgBriefHTML(p.b)}
      </button>`).join('') : `<div class="empty" style="margin:6px 0 14px;">No likely duplicates found. You can still pick two rabbits yourself below.</div>`}</div>
    <div class="section-label" style="margin-top:16px;">OR PICK TWO YOURSELF</div>
    <div id="mg-slots"></div>
    <div class="field"><input id="mg-q" placeholder="Search by name, ear #, or alias" autocomplete="off"></div>
    <div id="mg-res"></div>
    <div class="sheet-actions"><button class="btn btn-secondary" onclick="closeSheet()">Cancel</button><button class="btn btn-primary" id="mg-go" disabled>Compare</button></div>`);
  document.querySelectorAll('[data-pair]').forEach(b=>b.onclick=()=>{ const p=pairs[+b.dataset.pair]; openMergeCompare(p.a,p.b); });
  const go=document.getElementById('mg-go');
  function paintSlots(){
    document.getElementById('mg-slots').innerHTML = slots.map((r,i)=> r
      ? `<div class="card no-tap" style="display:flex; gap:8px; align-items:flex-start; margin-bottom:8px;"><div style="flex:1;">${mgBriefHTML(r)}</div><button class="btn btn-secondary" style="min-height:34px; padding:6px 10px;" data-clear="${i}">Remove</button></div>`
      : `<div class="card-sub" style="margin-bottom:8px;">Rabbit ${i+1}: search below and tap one</div>`).join('');
    document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{ slots[+b.dataset.clear]=null; paintSlots(); paintResults(); });
    go.disabled = !(slots[0] && slots[1]);
  }
  function paintResults(){
    const q=mgNorm(document.getElementById('mg-q').value);
    const box=document.getElementById('mg-res');
    if(slots[0] && slots[1]){ box.innerHTML=''; return; }
    const chosen=new Set(slots.filter(Boolean).map(r=>r.id));
    const list=rabbits.filter(r=>!chosen.has(r.id) && (!q || mgNorm(r.name).includes(q) || mgNorm(r.earNumber).includes(q) || mgNorm(r.alias).includes(q)))
      .sort((a,b)=>mgNorm(a.name).localeCompare(mgNorm(b.name))).slice(0,12);
    box.innerHTML = list.length ? list.map(r=>`<button class="mg-pair" data-pick="${esc(r.id)}">${mgBriefHTML(r)}</button>`).join('') : `<div class="empty">No matches.</div>`;
    box.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
      const r=rabbits.find(x=>x.id===b.dataset.pick); if(!r) return;
      const i=slots[0]?1:0; slots[i]=r; paintSlots(); paintResults();
    });
  }
  document.getElementById('mg-q').oninput=paintResults;
  go.onclick=()=>{ if(slots[0] && slots[1]) openMergeCompare(slots[0],slots[1]); };
  paintSlots(); paintResults();
}

function openMergeCompare(A,B){
  let base = mgCompleteness(B) > mgCompleteness(A) ? 'B' : 'A';
  const rec = s => s==='A' ? A : B;
  const rows=[];   // {key, label, ta, tb, conflict, kind}
  MERGE_FIELDS.forEach(([f,label])=>{
    const ta=mgFieldText(A,f), tb=mgFieldText(B,f);
    if(!ta && !tb) return;
    rows.push({key:f, label, ta, tb, conflict: !!ta && !!tb && mgNorm(ta)!==mgNorm(tb), kind:'field'});
  });
  // Status / breeding state moves as one unit.
  const sa=mgStatusGroupText(A), sb=mgStatusGroupText(B);
  const bothReal = A.status!=='external' && B.status!=='external';
  rows.push({key:'@status', label:'Status', ta:sa, tb:sb, conflict: bothReal && mgNorm(sa)!==mgNorm(sb), kind:'status'});
  const la=mgLitterText(A), lb=mgLitterText(B);
  if(la || lb) rows.push({key:'@litter', label:'Litter', ta:la, tb:lb, conflict: !!la && !!lb && mgNorm(la)!==mgNorm(lb), kind:'litter'});

  function defaultPicks(b){
    const o = b==='A'?'B':'A', p={};
    rows.forEach(r=>{
      const hasA=!!r.ta, hasB=!!r.tb;
      if(r.kind==='status'){
        const other=rec(o), mine=rec(b);
        p[r.key] = (mine.status==='external' && other.status!=='external') ? o : b;
      } else if(hasA && !hasB) p[r.key]='A';
      else if(hasB && !hasA) p[r.key]='B';
      else p[r.key]=b;
    });
    return p;
  }
  let picks=defaultPicks(base);

  const conflicts=rows.filter(r=>r.conflict), same=rows.filter(r=>!r.conflict);
  const cnt=(f)=>[(A[f]||[]).length,(B[f]||[]).length];
  const combos=[['photos','Photos'],['notesLog','Notes'],['wins','Wins'],['weightLog','Weigh-ins'],['breedingHistory','Breeding history']]
    .map(([f,l])=>{ const [x,y]=cnt(f); return (x||y)?`<div class="card-sub">${l}: ${x} + ${y}, combined</div>`:''; }).join('');
  const kidsA=mgChildCount(A), kidsB=mgChildCount(B);

  const rowHTML=(r,interactive)=>`<div class="mg-lab">${esc(r.label)}</div>
    ${['A','B'].map(s=>{ const t=s==='A'?r.ta:r.tb;
      return interactive
        ? `<button class="mg-opt${t?'':' empty'}" data-row="${esc(r.key)}" data-side="${s}">${t?esc(t):'(blank)'}</button>`
        : `<div class="mg-opt fixed${t?'':' empty'}" data-auto="${esc(r.key)}" data-side="${s}">${t?esc(t):'(blank)'}</div>`; }).join('')}`;

  openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button>
    <h2>Compare records</h2>
    <div class="card-sub" style="margin-bottom:10px;">Tap the value to keep wherever the two disagree. Anything only one record has is kept automatically.</div>
    ${A.sex!==B.sex ? `<div class="dupe-box" style="margin:0 0 10px;">One is a doe and the other a buck. Double-check these are really the same rabbit.</div>`:''}
    <div class="mg-grid" style="margin-bottom:6px;">
      <div></div>
      <div class="card no-tap" style="padding:8px 10px; margin:0;"><div class="section-label" style="margin:0 0 4px;">RECORD A</div>${mgBriefHTML(A)}</div>
      <div class="card no-tap" style="padding:8px 10px; margin:0;"><div class="section-label" style="margin:0 0 4px;">RECORD B</div>${mgBriefHTML(B)}</div>
    </div>
    <div class="section-label" style="margin-top:12px;">MAIN RECORD (the one that stays)</div>
    <div class="seg" style="margin-bottom:6px;"><button id="mg-baseA">Record A</button><button id="mg-baseB">Record B</button></div>
    <div class="card-sub" style="margin-bottom:6px;">Pre-selected as the one with more filled in. If you switch it, your picks reset.</div>
    ${conflicts.length ? `<div class="section-label" style="margin-top:12px;">THEY DISAGREE, PICK ONE</div><div class="mg-grid">${conflicts.map(r=>rowHTML(r,true)).join('')}</div>`
                      : `<div class="card-sub" style="margin:12px 0;">Nothing conflicts between these two.</div>`}
    ${same.length ? `<div class="section-label" style="margin-top:14px;">KEPT AUTOMATICALLY</div><div class="mg-grid">${same.map(r=>rowHTML(r,false)).join('')}</div>`:''}
    ${combos ? `<div style="margin-top:10px;">${combos}</div>`:''}
    <div id="mg-summary" class="dupe-box"></div>
    <div class="sheet-actions"><button class="btn btn-secondary" id="mg-back">Back</button><button class="btn btn-primary" id="mg-do">Merge</button></div>
    <div class="section-label" style="margin-top:20px;">OR JUST REMOVE ONE</div>
    <div class="card-sub" style="margin-bottom:8px;">Use this if one of these is a mistake you'll re-enter, instead of combining them. Nothing from the removed record is kept. You'll have 10 seconds to undo.</div>
    <div class="sheet-actions" style="margin-top:0;"><button class="btn btn-danger" id="mg-rmA">Remove record A</button><button class="btn btn-danger" id="mg-rmB">Remove record B</button></div>
    <div id="mg-rmnote" class="card-sub" style="margin-top:8px;"></div>`);

  function finalName(){ const r=rows.find(x=>x.key==='name'); return r ? rec(picks.name)[ 'name' ] : rec(base).name; }
  function paint(){
    document.getElementById('mg-baseA').classList.toggle('on', base==='A');
    document.getElementById('mg-baseB').classList.toggle('on', base==='B');
    document.querySelectorAll('[data-row]').forEach(b=>b.classList.toggle('on', picks[b.dataset.row]===b.dataset.side));
    // Automatic rows: highlight the side whose value is actually used.
    document.querySelectorAll('[data-auto]').forEach(b=>{
      const r=rows.find(x=>x.key===b.dataset.auto);
      b.classList.toggle('on', !!(b.dataset.side==='A'?r.ta:r.tb) && picks[r.key]===b.dataset.side);
    });
    const drop = base==='A' ? 'B' : 'A';
    const kids = mgChildCount(rec(drop));
    document.getElementById('mg-summary').innerHTML =
      `Record ${drop} will be removed and everything pointing at it${kids?` (${kids} rabbit${kids===1?'':'s'} list it as a parent)`:''} will point to <b>${esc(finalName())}</b> instead. You'll have 10 seconds to undo.`;
  }
  document.getElementById('mg-baseA').onclick=()=>{ base='A'; picks=defaultPicks(base); paint(); };
  document.getElementById('mg-baseB').onclick=()=>{ base='B'; picks=defaultPicks(base); paint(); };
  document.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>{ picks[b.dataset.row]=b.dataset.side; paint(); });
  document.getElementById('mg-back').onclick=openMergeSheet;
  [['A',A,B],['B',B,A]].forEach(([side,x,other])=>{
    const btn=document.getElementById('mg-rm'+side);
    const kids=mgChildCount(x), twin=mgNorm(x.name)===mgNorm(other.name);
    btn.onclick=()=>{
      const note=document.getElementById('mg-rmnote');
      note.textContent = kids && !twin
        ? `${kids} rabbit${kids===1?'':'s'} list ${x.name} as a parent. They'll keep the name but lose this record's details.`
        : '';
      armConfirm(btn,'Tap again to confirm',()=>performRemove(x,other));
    };
  });
  document.getElementById('mg-do').onclick=()=>{
    const keep=rec(base), drop=rec(base==='A'?'B':'A');
    // Resolve each pick to the concrete record to copy from.
    const from={}; rows.forEach(r=>{ from[r.key]=rec(picks[r.key]); });
    performMerge(keep, drop, from);
  };
  paint();
}

function performRemove(x, other){
  const idx=rabbits.indexOf(x), undoLog=[];
  const set=(obj,f,v)=>{ undoLog.push([obj,f,obj[f]]); obj[f]=v; };
  // If the other record has the same name, anything planned with this one moves to it.
  if(other && mgNorm(other.name)===mgNorm(x.name)){
    planned.forEach(p=>{ if(p.doeId===x.id) set(p,'doeId',other.id); if(p.buckId===x.id) set(p,'buckId',other.id); });
  }
  trashAdd(x); saveTrash();
  rabbits=rabbits.filter(r=>r.id!==x.id);
  saveData(); savePlanned(); closeSheet(); render();
  showUndoToast((x.name||'Rabbit')+' removed', ()=>{
    trashDrop(x.id);
    undoLog.reverse().forEach(([obj,f,old])=>{ obj[f]=old; });
    if(!rabbits.some(r=>r.id===x.id)) rabbits.splice(Math.min(idx<0?rabbits.length:idx,rabbits.length),0,x);
    savePlanned();
  }, 10000);
}

function performMerge(k, d, from){
  const kBefore=Object.assign({}, k), dIndex=rabbits.indexOf(d);
  const undoLog=[];   // [obj, field, oldValue]
  const set=(obj,f,v)=>{ undoLog.push([obj,f,obj[f]]); obj[f]=v; };
  const oldK=k.name, oldD=d.name;

  // 1. Scalar fields: read everything first, then write.
  const vals={};
  MERGE_FIELDS.forEach(([f])=>{ const src=from[f]||k; vals[f]=src[f]; });
  const statusSrc=from['@status']||k, litterSrc=from['@litter']||k;
  const statusVals={}; MERGE_STATUS_KEYS.forEach(f=>{ statusVals[f]=statusSrc[f]; });
  const litterVals={}; MERGE_LITTER_KEYS.forEach(f=>{ litterVals[f]=litterSrc[f]; });
  // If only the dropped record has litter info and no pick was recorded for it, keep it.
  if(!from['@litter'] && mgEmpty(k.litterKits) && !mgEmpty(d.litterKits)) MERGE_LITTER_KEYS.forEach(f=>{ litterVals[f]=d[f]; });
  // Same-named ancestors with nothing picked: keep the more active status.
  const take=(src,keys,vv)=>keys.forEach(f=>{ if(vv[f]!==undefined) k[f]=vv[f]; else k[f]=src[f]; });
  Object.keys(vals).forEach(f=>{ if(vals[f]!==undefined) k[f]=vals[f]; });
  take(statusSrc,MERGE_STATUS_KEYS,statusVals);
  take(litterSrc,MERGE_LITTER_KEYS,litterVals);
  const newName=k.name;

  // 2. Combine lists from both records.
  const uniq=(arr,keyFn)=>{ const seen=new Set(), out=[]; arr.forEach(x=>{ const key=keyFn(x); if(!seen.has(key)){ seen.add(key); out.push(x); } }); return out; };
  k.photos = uniq((kBefore.photos||[]).concat(d.photos||[]), p=>p.id||p.dataUrl||JSON.stringify(p));
  k.notesLog = uniq((kBefore.notesLog||[]).concat(d.notesLog||[]), n=>(n.date||'')+'|'+(n.text||''));
  k.wins = uniq((kBefore.wins||[]).concat(d.wins||[]), w=>[w.award,w.date,w.show].join('|'));
  k.weightLog = uniq((kBefore.weightLog||[]).concat(d.weightLog||[]), w=>JSON.stringify(w));
  k.breedingHistory = uniq((kBefore.breedingHistory||[]).concat(d.breedingHistory||[]), e=>e.id||JSON.stringify(e));

  // 3. Keep the other name as an alias so old references still resolve.
  const otherName = mgNorm(newName)===mgNorm(oldK) ? oldD : oldK;
  if(!k.alias){ k.alias = (mgNorm(otherName)!==mgNorm(newName) ? otherName : (d.alias||'')); }
  if(mgNorm(k.alias)===mgNorm(newName)) k.alias='';
  // A rabbit can't be its own parent.
  if(mgNorm(k.sireName)===mgNorm(newName)) k.sireName='';
  if(mgNorm(k.damName)===mgNorm(newName)) k.damName='';
  k.flag='';

  // 4. Repoint everything that referenced either old name or the dropped record.
  const stale=new Set([mgNorm(oldK), mgNorm(oldD)]); stale.delete(mgNorm(newName)); stale.delete('');
  rabbits.forEach(x=>{
    if(x===d) return;
    ['sireName','damName','partner'].forEach(f=>{ if(x[f] && stale.has(mgNorm(x[f]))) set(x,f,newName); });
    (x.breedingHistory||[]).forEach(e=>{ if(e.partner && stale.has(mgNorm(e.partner))) set(e,'partner',newName); });
  });
  planned.forEach(p=>{
    if(p.doeId===d.id) set(p,'doeId',k.id);
    if(p.buckId===d.id) set(p,'buckId',k.id);
    if(p.doeName && stale.has(mgNorm(p.doeName))) set(p,'doeName',newName);
    if(p.buckName && stale.has(mgNorm(p.buckName))) set(p,'buckName',newName);
  });

  trashAdd(d); saveTrash();
  rabbits = rabbits.filter(x=>x.id!==d.id);
  saveData(); savePlanned(); closeSheet(); render();
  showUndoToast('Merged into '+newName, ()=>{
    trashDrop(d.id);
    undoLog.reverse().forEach(([obj,f,old])=>{ obj[f]=old; });
    const kk=rabbits.find(x=>x.id===k.id);
    if(kk){ Object.keys(kk).forEach(key=>{ delete kk[key]; }); Object.assign(kk,kBefore); }
    if(!rabbits.some(x=>x.id===d.id)) rabbits.splice(Math.min(dIndex<0?rabbits.length:dIndex,rabbits.length),0,d);
    savePlanned();
  }, 10000);
}

function openEditSheet(r, origin, opts){
  const lean = !!(opts && opts.lean);   // opened from a pedigree: fields and Save only; sell / retire / delete live in the full profile
  const known = rabbits.filter(x=>x.id!==r.id).map(x=>x.name);
  openSheet(`<button class="close-x" id="f-cancel-x">&times;</button>
    <h2>Edit ${esc(r.name)}</h2>
    <div class="row2">
      <div class="field"><label>Name</label><input id="f-name" value="${esc(r.name||'')}"></div>
    </div>
    <div class="field"><label>Nickname (optional)</label><input id="f-alias" value="${esc(r.alias||'')}" placeholder="Nickname or previous name"></div>

    <div class="row2">
      <div class="field"><label>Breed</label><input id="f-breed" list="breed-options" value="${esc(r.breed||'')}" placeholder="Start typing…">${breedDatalistHTML()}</div>
      <div class="field"><label>Color / Variety</label><input id="f-color" value="${esc(r.color||'')}"></div>

  attachSuggest(document.getElementById('f-sire'), ()=>rabbits.filter(x=>x.sex==='buck'&&x.id!==r.id).map(x=>x.name));
  attachSuggest(document.getElementById('f-dam'), ()=>rabbits.filter(x=>x.sex==='doe'&&x.id!==r.id).map(x=>x.name));
  document.getElementById('f-cancel-x').onclick=()=>done(origin);

  document.getElementById('f-save').onclick=()=>{
    const sire=document.getElementById('f-sire').value.trim(), dam=document.getElementById('f-dam').value.trim();
    const check=(val, cb)=>{
      if(!val || rabbits.some(x=>nameKey(x.name)===nameKey(val))) return cb(val);
      const m=fuzzyMatches(val, r.id);
      if(!m.length) return cb(val);
      openDuplicateSheet(val, m, chosen=>cb(chosen||val));
    };
    check(sire, finalSire=>check(dam, finalDam=>{
      const oldRName=r.name;
      { const nb2=document.getElementById('f-name').value.trim(); if(nb2) r.name=nb2; }   // one name field; any old stored prefix is left untouched
      repointName(oldRName, r.name);
      r.alias=document.getElementById('f-alias').value.trim();
      r.sex=sex; r.breed=document.getElementById('f-breed').value; r.color=document.getElementById('f-color').value;
