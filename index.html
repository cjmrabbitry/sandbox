function drawPedigreeConnectors(){
  const wrap=document.getElementById('pp-grid-wrap'), svg=document.getElementById('pp-lines');
  if(!wrap||!svg) return;
  const cr=wrap.getBoundingClientRect();
  svg.setAttribute('width',cr.width); svg.setAttribute('height',cr.height); svg.setAttribute('viewBox',`0 0 ${cr.width} ${cr.height}`);
  const rc=id=>{ const el=document.getElementById(id); if(!el) return null; const r=el.getBoundingClientRect();
    return {right:r.right-cr.left, left:r.left-cr.left, midY:r.top-cr.top+r.height/2}; };
  const bracket=(c,p1,p2)=>{ const a=rc(c),b=rc(p1),d=rc(p2); if(!a||!b||!d) return '';
    const mx=(a.right+b.left)/2;
    return `<path d="M${a.right},${a.midY} L${mx},${a.midY} M${mx},${b.midY} L${mx},${d.midY} M${mx},${b.midY} L${b.left},${b.midY} M${mx},${d.midY} L${d.left},${d.midY}" stroke="#b08535" stroke-width="1" fill="none"/>`; };
  svg.innerHTML=[bracket('pp-self','pp-sire','pp-dam'),bracket('pp-sire','pp-ss','pp-sd'),bracket('pp-dam','pp-ds','pp-dd'),
    bracket('pp-ss','pp-sss','pp-ssd'),bracket('pp-sd','pp-sds','pp-sdd'),bracket('pp-ds','pp-dss','pp-dsd'),bracket('pp-dd','pp-dds','pp-ddd')].join('');
}
function printPedigreeAdvanced(r, orientation, detail){
  const sizeStr = orientation==='landscape' ? '11in 8.5in' : '8.5in 11in';
  document.getElementById('pp-page-size').textContent = `@page{ size: ${sizeStr}; margin: 0.15in; }`;
  document.getElementById('printPedigree').innerHTML = pedigreePrintHTML(r, orientation, detail);
  document.getElementById('printPedigree').classList.add('active');
  // Wait for the web fonts to actually finish loading before measuring
  // or printing — printing too early can silently use fallback-font
  // metrics that are taller than the real fonts, which pushed content
  // past the fixed page height and got clipped at the bottom edge.
  const ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  ready.then(()=>{
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      drawPedigreeConnectors();
      setTimeout(()=>window.print(),60);
    }));
  });
}

function fillAncestorBoxValues(prefix, anc, put){
  if(!anc) return;
  put(`${prefix}_NAME`, anc.name);
  put(`${prefix}_EAR`, anc.earNumber);
  put(`${prefix}_WEIGHT`, anc.weight);
  put(`${prefix}_COLOR`, anc.color);
  put(`${prefix}_LEGS`, anc.legsWins);
}
function sanitizeForPdf(str){
  if(str===undefined || str===null) return '';
  // The template's font can only render standard Latin/Western
  // characters. Emoji and other special characters used as
  // placeholder buck/doe names (e.g. temp IDs like a raised
  // hand icon) can't be rendered and will crash the PDF export
  // entirely if left in, so they're stripped out here rather
  // than left to fail at save time.
  return String(str).replace(/[^\x00-\xFF]/g, '').replace(/\s+/g, ' ').trim();
}
function buildOfficialPedigreeValues(r){
  const g = p => ancestorByPath(r.name, p);
  const v = {};
  // Every field is set explicitly (blank string if no data) so any
  // stray leftover value already baked into the template PDF (e.g.
  // a stray space character) always gets overwritten, not just skipped.
  Object.keys(PEDIGREE_FIELD_MAP).forEach(role => { v[role] = ''; });
  const put = (role, val) => {
    const clean = sanitizeForPdf(val);
    // If sanitizing wiped out a NAME field entirely (e.g. the recorded
    // name was just an emoji placeholder), show a visible marker
    // instead of a blank box — a blank box would look like no sire/dam
    // is on file at all, which would be misleading.
    if(!clean && val && String(val).trim() && role.endsWith('_NAME')) v[role] = '(name unavailable)';
    else v[role] = clean;
  };
  put('BREED', r.breed);
  put('DATE_OF_BIRTH', r.dob ? fmtDate(r.dob) : '');
  put('SEX', r.sex==='doe' ? 'Doe' : r.sex==='buck' ? 'Buck' : '');
  fillAncestorBoxValues('G1', r, put);
  fillAncestorBoxValues('SIRE', g('s'), put);
  fillAncestorBoxValues('DAM', g('d'), put);
  fillAncestorBoxValues('PGS', g('ss'), put);
  fillAncestorBoxValues('PGD', g('sd'), put);
  fillAncestorBoxValues('MGS', g('ds'), put);
  fillAncestorBoxValues('MGD', g('dd'), put);
  fillAncestorBoxValues('GGSIRE1', g('sss'), put);
  fillAncestorBoxValues('GGDAM1', g('ssd'), put);
  fillAncestorBoxValues('GGSIRE2', g('sds'), put);
  fillAncestorBoxValues('GGDAM2', g('sdd'), put);
  fillAncestorBoxValues('GGSIRE3', g('dss'), put);
  fillAncestorBoxValues('GGDAM3', g('dsd'), put);
  fillAncestorBoxValues('GGSIRE4', g('dds'), put);
  fillAncestorBoxValues('GGDAM4', g('ddd'), put);
  return v;
}
async function downloadOfficialPedigreePDF(r){
  try{
    const { PDFDocument, StandardFonts } = PDFLib;
    const existingBytes = await fetch('pedigree-template.pdf').then(res=>{
      if(!res.ok) throw new Error('Template PDF not found: '+res.status);
      return res.arrayBuffer();
    });
    const pdfDoc = await PDFDocument.load(existingBytes);
    const form = pdfDoc.getForm();
    const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
    const values = buildOfficialPedigreeValues(r);

    const MAX_SIZE = 11, MIN_SIZE = 6, H_PADDING = 8; // points
    Object.entries(values).forEach(([role, value])=>{
      const fieldId = PEDIGREE_FIELD_MAP[role];
      if(!fieldId) return;
      try{
        const field = form.getTextField(fieldId);
        // Shrink-to-fit: measure the field's real width and reduce
        // font size only as much as needed so long values (long
        // rabbit names, colors, etc.) never get clipped at the box
        // edge. Falls back gracefully if widget geometry is missing.
        let fontSize = MAX_SIZE;
        try{
          const widget = field.acroField.getWidgets()[0];
          const rect = widget.getRectangle();
          const availableWidth = Math.max(rect.width - H_PADDING, 1);
          while (fontSize > MIN_SIZE && font.widthOfTextAtSize(value, fontSize) > availableWidth) {
            fontSize -= 0.5;
          }
        }catch(geomErr){ /* keep default MAX_SIZE if geometry read fails */ }
        field.setFontSize(fontSize);
        field.setText(value);
      }
      catch(err){ console.warn('Pedigree field could not be set:', role, err); }
    });
    const pdfBytes = await pdfDoc.save();
    const blob = new Blob([pdfBytes], { type:'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${(r.name||'pedigree').replace(/\s+/g,'-')}-pedigree.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(err){
    console.error(err);
    showToast('Could not generate the official PDF — check console for details.');
  }
}

function summarizeAuditValue(v){
  if(v===null || v===undefined) return '(empty)';
  const s = typeof v==='string' ? v : JSON.stringify(v);
  return s.length>70 ? s.slice(0,70)+'…' : s;
}

  const rabbitsForSale = rabbits.filter(r=>r.forSale && r.status!=='sold' && !isArchived(r) && r.status!=='external');
  const litterKitRows = [];
  rabbits.forEach(d=>{ if(d.sex==='doe'&&d.status==='nursing'&&d.litterKits) d.litterKits.forEach((k,i)=>{ if(k.forSale && !k.individualId) litterKitRows.push({dam:d, kit:k, idx:i}); }); });
  if(!rabbitsForSale.length && !litterKitRows.length){
    main.innerHTML = `<div class="empty">Nothing marked for sale right now.<br>Toggle "Mark for sale" from a rabbit's Edit screen, or "For sale" on a kit's Litters card.</div>`;

  }
  let h='';

        <div class="card-top"><div><div class="card-name">${kit.sex==='buck'?'Buck':'Doe'} kit &middot; ${esc(kit.color||'color?')}</div><div class="card-sub">From ${esc(dam.name)}'s litter, born ${fmtDate(dam.litterBornDate)}</div></div></div>

function renderBackup(main){
  const snap=JSON.stringify({rabbits,planned,customEvents,savedAt:new Date().toISOString()},null,2);

    <div class="section-label">SAVE A SNAPSHOT</div>

      <textarea id="bk-out" readonly style="width:100%; height:130px; margin-top:10px; font-family:'JetBrains Mono',monospace; font-size:10px; padding:8px; border-radius:8px; border:1px solid var(--line-strong); background:var(--card); color:var(--ink);">${esc(snap)}</textarea>
      <div class="card-actions"><button class="btn btn-primary" id="bk-copy">Copy to clipboard</button></div></div>
    <div class="section-label">RESTORE FROM A SNAPSHOT</div>
    <div class="card no-tap"><div class="card-detail">Paste a saved snapshot below. <b>This replaces everything currently in the app.</b></div>
      <textarea id="bk-in" placeholder="Paste snapshot here" style="width:100%; height:90px; margin-top:10px; font-family:'JetBrains Mono',monospace; font-size:10px; padding:8px; border-radius:8px; border:1px solid var(--line-strong); background:var(--card); color:var(--ink);"></textarea>
      <div class="card-actions"><button class="btn btn-danger" id="bk-restore">Restore this snapshot</button></div></div>`;
  document.getElementById('bk-copy').onclick=async()=>{
    const ta=document.getElementById('bk-out'); ta.select();
    try{ await navigator.clipboard.writeText(ta.value); showToast('Copied'); }catch(e){ showToast('Select the text above and copy manually'); }
  };
  let armed=false; const rb=document.getElementById('bk-restore');
  rb.onclick=()=>{
    if(!armed){ armed=true; rb.textContent='Tap again to confirm — replaces everything'; return; }
    const t=document.getElementById('bk-in').value.trim();
    if(!t){ showToast('Paste a snapshot first'); return; }
    try{
      const p=JSON.parse(t);
      if(!Array.isArray(p.rabbits)) throw 0;
      rabbits=p.rabbits; planned=p.planned||[]; customEvents=p.customEvents||[];
      enrichFromRoster();
      saveData(); savePlanned(); saveEvents(); currentTab='home'; render(); showToast('Snapshot restored');
    }catch(e){ showToast("That doesn't look like a valid snapshot"); }
  };
}

/* ---------------- RABBIT PROFILE (full screen) ---------------- */
function contextualActions(r){
  const acts=[];
  if(r.status==='pregnant'){ acts.push(['kindled','Record litter'],['lost','Litter lost']); }
  else if(r.status==='nursing'){ if(canRebred(r)) acts.push(['rebred','Rebred']); acts.push(['wean','Weaned'],['editlitter','Edit litter']); }
  else if(isArchived(r)){ acts.push(['unarchive','Return to roster']); }
  else if(r.status==='growing'){ acts.push(['graduate','Move to roster']); }
  else if(r.sex==='doe'){ acts.push(['bred','Mark doe bred'],['plan','Plan a breeding']); }
  return acts;
}
function profileTabsFor(r){
  const tabs=[['overview','Overview']];
  if(r.sex==='doe' && r.status!=='growing' && r.status!=='external'){ tabs.push(['breeding','Breeding'],['litters','Litters']); }
  tabs.push(['pedigree','Pedigree'],['photos','Photos'],['notes','Notes']);
  return tabs;
}
function openRabbitProfile(r){
  profileRabbitId = r.id; profileTab='overview'; photoActiveCategory='Primary';
  document.getElementById('profileView').classList.add('on');
  renderProfile();
}
function closeProfile(){ profileRabbitId=null; document.getElementById('profileView').classList.remove('on'); render(); }
function renderProfile(){
  const r = rabbits.find(x=>x.id===profileRabbitId);
  const view = document.getElementById('profileView');
  if(!r){ closeProfile(); return; }
  const tabs = profileTabsFor(r);
  if(!tabs.some(t=>t[0]===profileTab)) profileTab='overview';
  view.innerHTML = `
    <div class="profile-head">
      <div class="profile-head-top">
        <button class="profile-back" id="profBack" aria-label="Back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fffdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div>
          <div class="profile-head-name">${esc(r.name)}</div>
          <div class="profile-head-sub">${subLine(r)}${r.status?' &middot; '+esc(r.status.toUpperCase()):''}</div>
        </div>
      </div>
      <div class="profile-tabs">
        ${tabs.map(([k,l])=>`<button class="profile-tab-btn ${profileTab===k?'on':''}" data-ptab="${k}">${l}</button>`).join('')}
      </div>
    </div>
    <div class="profile-body" id="profileBody"></div>`;
  document.getElementById('profBack').onclick=closeProfile;
  document.querySelectorAll('[data-ptab]').forEach(b=>b.onclick=()=>{ profileTab=b.dataset.ptab; renderProfile(); });
  const body = document.getElementById('profileBody');
  if(profileTab==='overview') body.innerHTML = overviewTabHTML(r);
  else if(profileTab==='breeding') body.innerHTML = breedingTabHTML(r);
  else if(profileTab==='litters') body.innerHTML = littersTabHTML(r);
  else if(profileTab==='pedigree') body.innerHTML = `${pedigreeTreeHTML(r)}<div class="sheet-actions" style="flex-wrap:wrap;"><button class="btn btn-secondary" style="flex:1;" id="profPrint">Print / Save PDF</button><button class="btn btn-primary" style="flex:1;" id="profOfficialPdf">Download Official Pedigree PDF</button></div>`;
  else if(profileTab==='photos') body.innerHTML = photosTabHTML(r);
  else if(profileTab==='notes') body.innerHTML = notesTabHTML(r);
  wireProfileTab(r);
}
function overviewTabHTML(r){
  const primary = (r.photos||[]).find(p=>p.category==='Primary');
  const acts = contextualActions(r);
  const rows = [
    ['Name', r.name], ['Ear #', r.earNumber||'—'], ['Sex', r.sex==='doe'?'Doe':'Buck'],
    ['Breed', r.breed||'—'], ['Color', r.color||'—'], ['DOB', r.dob?fmtDate(r.dob):'—'],
    ['Status', r.status], ['Registration', r.registrationNumber||'—'],
    ['Sire', r.sireName||'—'], ['Dam', r.damName||'—']
  ];
  return `
    ${primary?`<img class="primary-photo" src="${primary.dataUrl}" alt="${esc(r.name)}">`:''}
    ${acts.length?`<div class="qa-row">${acts.map(([a,l])=>`<button class="btn btn-secondary btn-sm" data-pa="${a}">${l}</button>`).join('')}</div>`:''}
    ${r.flag?`<div class="flag">${esc(r.flag)}</div>`:''}
    <div class="overview-grid">${rows.map(([l,v])=>`<div class="ov-cell"><div class="ov-label">${l.toUpperCase()}</div><div class="ov-val">${esc(v)}</div></div>`).join('')}</div>
    <button class="btn btn-secondary" style="width:100%;" data-pa="edit">Edit details</button>`;
}
function breedingTabHTML(r){
  let cur='';
  if(r.status==='pregnant'){
    const d=daysToDue(r);
    cur = `<div class="card no-tap"><div class="card-name" style="font-size:16px;">Current breeding</div>
      <div class="card-detail">Bred to <b>${esc(r.partner||'?')}</b> on ${fmtDate(r.bredDate)}<br>Estimated kindling: <b>${fmtDate(r.dueDate)}</b> (${d<0?-d+' days overdue':d===0?'today':'in '+d+' days'})</div>
      <div class="card-actions"><button class="btn btn-primary btn-sm" data-pa="kindled">Record litter</button><button class="btn btn-danger btn-sm" data-pa="lost">Litter lost</button></div></div>`;
  } else if(r.status==='nursing'){
    cur = `<div class="card no-tap"><div class="card-name" style="font-size:16px;">Currently on a litter</div>
      <div class="card-detail">${r.litterKits?r.litterKits.length:0} kits, born ${fmtDate(r.litterBornDate)}</div>
      <div class="card-actions"><button class="btn btn-secondary btn-sm" data-pa="litters">View in Litters tab</button></div></div>`;
  } else if(r.sex==='doe' && r.status!=='growing'){
    cur = `<div class="card no-tap"><div class="card-detail">Currently open — not bred.</div>
      <div class="card-actions"><button class="btn btn-primary btn-sm" data-pa="bred">Mark doe bred</button><button class="btn btn-secondary btn-sm" data-pa="plan">Plan a breeding</button></div></div>`;
  }
  const hist = (r.breedingHistory||[]).slice().sort((a,b)=>b.bredDate.localeCompare(a.bredDate));
  const histHTML = hist.length ? hist.map(e=>historyEntryHTML(r,e)).join('') : `<div class="empty">No breedings logged yet.</div>`;
  return `${cur}<div class="section-label">BREEDING HISTORY</div>${histHTML}`;
}
function littersTabHTML(r){
  if(r.status==='nursing') return nurseryCardHTML(r).replace('data-openprofile','data-noop');
  const litters = (r.breedingHistory||[]).filter(e=>e.outcome==='litter').slice().sort((a,b)=>b.litterBornDate.localeCompare(a.litterBornDate));
  if(!litters.length) return `<div class="empty">No litters recorded yet for ${esc(r.name)}.</div>`;
  return `<div class="section-label">PAST LITTERS</div>`+litters.map(e=>{
    const dead=e.litterDead?`${(e.litterDead.DOA||0)+(e.litterDead.peanut||0)+(e.litterDead.passed||0)} lost`:'';
    return `<div class="card no-tap"><div class="card-name" style="font-size:16px;">Born ${fmtDate(e.litterBornDate)}</div>
      <div class="card-detail">Sired by ${esc(e.partner||'?')} &middot; ${e.litterKits?e.litterKits.length:0} kits${dead?' &middot; '+dead:''}</div></div>`;
  }).join('');
}
function photoCategories(){ return ['Primary','Front','Side Profile','Pedigree Photo','Other']; }
function photosTabHTML(r){
  const cats = photoCategories();
  const photos = (r.photos||[]).filter(p=>p.category===photoActiveCategory);
  return `
    <div class="photo-chips">${cats.map(c=>`<button class="photo-chip ${photoActiveCategory===c?'on':''}" data-pcat="${esc(c)}">${esc(c)}</button>`).join('')}</div>

    <div class="photo-grid">${photos.map(p=>`<div class="photo-thumb-wrap" data-popen="${p.id}"><img src="${p.dataUrl}" alt=""><button class="photo-del" data-pdel="${p.id}">&times;</button></div>`).join('')}</div>

function notesTabHTML(r){
  const log = (r.notesLog||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  return `
    <div class="field"><textarea id="profNoteInput" placeholder="Add a note about ${esc(r.name)}..."></textarea></div>
    <button class="btn btn-primary" style="width:100%; margin-bottom:16px;" id="profAddNote">Add note</button>
    ${log.length?log.map(n=>`<div class="note-entry"><div class="note-date">${fmtDate(n.date)}</div><div class="note-text">${esc(n.text)}</div></div>`).join(''):`<div class="empty">No notes yet.</div>`}`;

function wireProfileTab(r){
  document.querySelectorAll('[data-pa]').forEach(b=>{
    b.onclick=()=>{
      const a=b.dataset.pa;
      if(a==='kindled') openKindledSheet(r);
      else if(a==='editlitter') openKindledSheet(r,true);
      else if(a==='lost') armConfirm(b,'Tap again to confirm',()=>{ markLitterLost(r); saveData(); renderProfile(); render(); showToast(r.name+' marked open'); });
      else if(a==='rebred'||a==='bred') openBreedSheet(r);
      else if(a==='plan'){ openAddPlannedSheet(r.id); }
      else if(a==='wean'){ r.status='open'; saveData(); renderProfile(); render(); showToast(r.name+' weaned'); }
      else if(a==='graduate'){ r.status=r.sex==='doe'?'open':'available'; saveData(); renderProfile(); render(); showToast(r.name+' moved to the main roster'); }
      else if(a==='unarchive') openUnarchive(r);
      else if(a==='edit') openEditSheet(r, renderProfile);
      else if(a==='pedigree'){ profileTab='pedigree'; renderProfile(); }
      else if(a==='addphoto'){ profileTab='photos'; renderProfile(); }
      else if(a==='addnote'){ profileTab='notes'; renderProfile(); }
      else if(a==='litters'){ profileTab='litters'; renderProfile(); }
    };
  });
  if(profileTab==='breeding'){
    document.querySelectorAll('[data-histedit]').forEach(b=>b.onclick=()=>{
      const [damId,entryId]=b.dataset.histedit.split(':');
      const dam=rabbits.find(x=>x.id===damId); const entry=dam&&dam.breedingHistory.find(x=>x.id===entryId);
      if(dam&&entry) openHistoryEditSheet(dam, entry, ()=>{ closeSheet(); renderProfile(); });
    });
  }
  if(profileTab==='pedigree'){
    wirePedigreeTaps(document.getElementById('profileBody'), r, renderProfile);
    const pb=document.getElementById('profPrint'); if(pb) pb.onclick=()=>openPrintOptionsSheet(r, renderProfile);
    const pob=document.getElementById('profOfficialPdf'); if(pob) pob.onclick=()=>downloadOfficialPedigreePDF(r);
  }
  if(profileTab==='litters'){ attachCardEvents(); }
  if(profileTab==='photos'){
    document.querySelectorAll('[data-pcat]').forEach(b=>b.onclick=()=>{ photoActiveCategory=b.dataset.pcat; renderProfile(); });
    const addBtn=document.getElementById('profAddPhoto');
    if(addBtn) addBtn.onclick=()=>{
      const input=document.getElementById('photoFileInput');
      input.onchange=()=>{
        const file=input.files[0]; input.value='';
        if(!file) return;
        const reader=new FileReader();
        reader.onload=()=>{
          r.photos=r.photos||[];
          r.photos.push({id:uid(), category:photoActiveCategory, dataUrl:reader.result, addedAt:todayStr()});
          saveData(); renderProfile(); showToast('Photo added');
        };
        reader.readAsDataURL(file);
      };
      input.click();
    };
    document.querySelectorAll('[data-pdel]').forEach(b=>b.onclick=(ev)=>{
      ev.stopPropagation();
      armConfirm(b,'Tap again',()=>{ r.photos=(r.photos||[]).filter(p=>p.id!==b.dataset.pdel); saveData(); renderProfile(); });
    });
    document.querySelectorAll('[data-popen]').forEach(el=>el.onclick=(ev)=>{
      if(ev.target.closest('[data-pdel]')) return;
      const photo=(r.photos||[]).find(p=>p.id===el.dataset.popen);
      if(photo) openPhotoViewer(r, photo);
    });
  }
  if(profileTab==='notes'){
    const addBtn=document.getElementById('profAddNote');
    if(addBtn) addBtn.onclick=()=>{
      const ta=document.getElementById('profNoteInput'); const text=ta.value.trim();
      if(!text){ showToast('Write a note first'); return; }
      r.notesLog=r.notesLog||[]; r.notesLog.push({id:uid(), date:todayStr(), text});
      saveData(); renderProfile(); showToast('Note added');
    };
  }
}

let pvState = null; // { rabbitId, photoId, mode:'view'|'crop', scale, tx, ty }

  el.innerHTML = `

      ${cropping ? `<div class="pv-crop-mask"></div><div class="pv-crop-box" id="pvCropBox">
        <div class="pv-crop-handle" data-h="nw"></div><div class="pv-crop-handle" data-h="ne"></div>
        <div class="pv-crop-handle" data-h="sw"></div><div class="pv-crop-handle" data-h="se"></div>
      </div>` : `<div class="pv-hint">Pinch or scroll to zoom &middot; drag to pan</div>`}
    </div>
    <div class="pv-bottombar">
      ${cropping
        ? `<button class="btn btn-secondary" id="pvCropCancel">Cancel</button><button class="btn btn-primary" id="pvCropApply">Apply crop</button>`
        : `<button class="btn btn-secondary" id="pvCropBtn">Crop</button>`}
    </div>`;
  wirePhotoViewer(r, photo);
}
function pvApplyTransform(){
  const img=document.getElementById('pvImg'); if(!img) return;
  img.style.transform = `translate(${pvState.tx}px, ${pvState.ty}px) scale(${pvState.scale})`;
}
function wirePhotoViewer(r, photo){
  document.getElementById('pvClose').onclick = closePhotoViewer;
  const delBtn = document.getElementById('pvDelete');
  delBtn.onclick = ()=>{
    armConfirm(delBtn, 'Tap again to delete', ()=>{
      r.photos = (r.photos||[]).filter(p=>p.id!==photo.id);
      saveData(); closePhotoViewer(); renderProfile(); showToast('Photo deleted');
    });
  };

  if(pvState.mode==='view'){
    const stage = document.getElementById('pvStage');
    const img = document.getElementById('pvImg');
    pvApplyTransform();
    const pointers = new Map();
    let lastDist = null, lastMid = null;

    function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
    function mid(a,b){ return {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; }
    function clampPan(){
      const maxPan = Math.max(0, (pvState.scale-1)) * (stage.clientWidth/2) + 40;
      pvState.tx = Math.max(-maxPan, Math.min(maxPan, pvState.tx));
      pvState.ty = Math.max(-maxPan, Math.min(maxPan, pvState.ty));
    }

    stage.onpointerdown = (e)=>{
      stage.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if(pointers.size===2){
        const [a,b] = [...pointers.values()];
        lastDist = dist(a,b); lastMid = mid(a,b);
      }
    };
    stage.onpointermove = (e)=>{
      if(!pointers.has(e.pointerId)) return;
      const prev = pointers.get(e.pointerId);
      const cur = {x:e.clientX, y:e.clientY};
      pointers.set(e.pointerId, cur);
      if(pointers.size===2){
        const [a,b] = [...pointers.values()];
        const d = dist(a,b), m = mid(a,b);
        if(lastDist){
          const factor = d/lastDist;
          pvState.scale = Math.max(1, Math.min(5, pvState.scale*factor));
        }
        if(lastMid){ pvState.tx += m.x-lastMid.x; pvState.ty += m.y-lastMid.y; }
        lastDist = d; lastMid = m;
        clampPan(); pvApplyTransform();
      } else if(pointers.size===1 && pvState.scale>1){
        pvState.tx += cur.x-prev.x; pvState.ty += cur.y-prev.y;
        clampPan(); pvApplyTransform();
      }
    };
    function endPointer(e){
      pointers.delete(e.pointerId);
      if(pointers.size<2){ lastDist=null; lastMid=null; }
    }
    stage.onpointerup = endPointer;
    stage.onpointercancel = endPointer;
    stage.onwheel = (e)=>{
      e.preventDefault();
      const factor = e.deltaY<0 ? 1.12 : 1/1.12;
      pvState.scale = Math.max(1, Math.min(5, pvState.scale*factor));
      clampPan(); pvApplyTransform();
    };
    stage.ondblclick = ()=>{
      pvState.scale = pvState.scale>1 ? 1 : 2.5;
      pvState.tx=0; pvState.ty=0;
      pvApplyTransform();
    };
    document.getElementById('pvCropBtn').onclick = ()=>{
      pvState.mode='crop'; pvState.scale=1; pvState.tx=0; pvState.ty=0;
      renderPhotoViewer();
    };
  } else {
    wireCropMode(r, photo);
  }
}
function wireCropMode(r, photo){
  const img = document.getElementById('pvImg');
  const box = document.getElementById('pvCropBox');
  document.getElementById('pvCropCancel').onclick = ()=>{ pvState.mode='view'; renderPhotoViewer(); };

  function initBox(){
    const ir = img.getBoundingClientRect();
    const w = ir.width*0.8, h = ir.height*0.8;
    box.dataset.x = ir.left + (ir.width-w)/2;
    box.dataset.y = ir.top + (ir.height-h)/2;
    box.dataset.w = w; box.dataset.h = h;
    paintBox();
  }
  function paintBox(){
    const stage = document.getElementById('pvStage').getBoundingClientRect();
    box.style.left = (parseFloat(box.dataset.x)-stage.left)+'px';
    box.style.top = (parseFloat(box.dataset.y)-stage.top)+'px';
    box.style.width = box.dataset.w+'px';
    box.style.height = box.dataset.h+'px';
  }
  // Wait a frame so the image has its natural rendered size before measuring.
  requestAnimationFrame(()=>requestAnimationFrame(initBox));

  const MIN=40;
  function imgBounds(){ return img.getBoundingClientRect(); }

  box.onpointerdown = (e)=>{
    if(e.target.closest('.pv-crop-handle')) return;
    e.preventDefault();
    box.setPointerCapture(e.pointerId);
    const startX=e.clientX, startY=e.clientY;
    const ox=parseFloat(box.dataset.x), oy=parseFloat(box.dataset.y);
    box.onpointermove = (ev)=>{
      const ib = imgBounds();
      const w=parseFloat(box.dataset.w), h=parseFloat(box.dataset.h);
      let nx = ox + (ev.clientX-startX), ny = oy + (ev.clientY-startY);
      nx = Math.max(ib.left, Math.min(ib.left+ib.width-w, nx));
      ny = Math.max(ib.top, Math.min(ib.top+ib.height-h, ny));
      box.dataset.x=nx; box.dataset.y=ny; paintBox();
    };
    box.onpointerup = ()=>{ box.onpointermove=null; box.onpointerup=null; };
  };

  box.querySelectorAll('.pv-crop-handle').forEach(h=>{
    h.onpointerdown = (e)=>{
      e.stopPropagation(); e.preventDefault();
      h.setPointerCapture(e.pointerId);
      const corner = h.dataset.h;
      const startX=e.clientX, startY=e.clientY;
      const ox=parseFloat(box.dataset.x), oy=parseFloat(box.dataset.y);
      const ow=parseFloat(box.dataset.w), oh=parseFloat(box.dataset.h);
      h.onpointermove = (ev)=>{
        const ib = imgBounds();
        const dx = ev.clientX-startX, dy = ev.clientY-startY;
        let x=ox,y=oy,w=ow,hh=oh;
        if(corner==='se'){ w=ow+dx; hh=oh+dy; }
        else if(corner==='sw'){ x=ox+dx; w=ow-dx; hh=oh+dy; }
        else if(corner==='ne'){ y=oy+dy; w=ow+dx; hh=oh-dy; }
        else if(corner==='nw'){ x=ox+dx; y=oy+dy; w=ow-dx; hh=oh-dy; }
        w=Math.max(MIN,w); hh=Math.max(MIN,hh);
        x=Math.max(ib.left, Math.min(ib.left+ib.width-w, x));
        y=Math.max(ib.top, Math.min(ib.top+ib.height-hh, y));
        // Prevent the box's far edge from being pushed past the image edge as it grows.
        w=Math.min(w, ib.left+ib.width-x); hh=Math.min(hh, ib.top+ib.height-y);
        box.dataset.x=x; box.dataset.y=y; box.dataset.w=w; box.dataset.h=hh;
        paintBox();
      };
      h.onpointerup = ()=>{ h.onpointermove=null; h.onpointerup=null; };
    };
  });

  document.getElementById('pvCropApply').onclick = ()=>{
    const ib = imgBounds();
    const scaleX = img.naturalWidth/ib.width, scaleY = img.naturalHeight/ib.height;
    const sx = (parseFloat(box.dataset.x)-ib.left)*scaleX;
    const sy = (parseFloat(box.dataset.y)-ib.top)*scaleY;
    const sw = parseFloat(box.dataset.w)*scaleX;
    const sh = parseFloat(box.dataset.h)*scaleY;
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1,Math.round(sw)); canvas.height = Math.max(1,Math.round(sh));
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    photo.dataUrl = canvas.toDataURL('image/jpeg', 0.9);
    saveData();
    pvState.mode='view'; pvState.scale=1; pvState.tx=0; pvState.ty=0;
    renderPhotoViewer(); renderProfile();
    showToast('Photo cropped');
  };
}

/* ============================================================
   CSV IMPORT — parses a CSV, auto-matches columns to fields,
   and asks how to handle any name collisions before committing.
   ============================================================ */
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF) text = text.slice(1); // strip BOM from Excel exports
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"'){ if(next === '"'){ field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\r'){ /* handled by \n */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length===1 && r[0].trim()===''));
}
const CSV_FIELD_ALIASES = {
  name: ['name','rabbit name','rabbit'],
  sex: ['sex','gender'],
  breed: ['breed'],
  color: ['color','colour','color variety','variety','color / variety'],
  earNumber: ['ear #','ear#','ear number','ear tag','eartag'],
  dob: ['dob','date of birth','birthdate','birth date'],
  weight: ['weight','weight lbs','weight (lbs)'],
  legsWins: ['legs wins','legs (wins)','legs','wins'],
  registrationNumber: ['registration #','registration number','reg #','reg number','registration'],
  sireName: ['sire','sire name','father'],
  damName: ['dam','dam name','mother'],
  status: ['status'],
  notes: ['notes','note'],
};
function csvNormalizeHeader(s){ return s.toLowerCase().trim().replace(/[_\-]/g,' ').replace(/\s+/g,' '); }
function mapCsvHeaders(headerRow){
  const map = {};
  headerRow.forEach((h,i)=>{
    const norm = csvNormalizeHeader(h);
    for(const [field,aliases] of Object.entries(CSV_FIELD_ALIASES)){
      if(map[field]===undefined && aliases.includes(norm)) map[field]=i;
    }
  });
  return map;
}
function csvNormalizeSex(s){
  if(!s) return 'doe';
  const v = s.trim().toLowerCase();
  return ['buck','male','m','b'].includes(v) ? 'buck' : 'doe';
}
function csvParseDate(s){
  if(!s) return null;
  s = s.trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m){ return `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`; }
  return null; // unrecognized format — left blank rather than guessed wrong
}
let csvImportRows = [];
function openImportCsvSheet(){
  openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button>
    <h2>Import from CSV</h2>
    <div class="card-sub" style="margin-bottom:12px;">Upload a CSV with a header row. Columns like Name, Sex, Breed, Color, Ear #, DOB, Weight, Legs (wins), Sire, Dam, Notes are matched automatically — you don't need exact column names or a particular order. Only Name is required.</div>
    <button class="btn btn-primary" style="width:100%;" id="csvPickBtn">Choose CSV file</button>
    <div id="csvPreviewArea"></div>`);
  document.getElementById('csvPickBtn').onclick = ()=>document.getElementById('csvFileInput').click();

      try{ handleCsvParsed(reader.result); }
      catch(err){ console.error(err); showToast("Couldn't read that file — check it's a plain CSV export."); }
    };
    reader.readAsText(file);
  };
}
function handleCsvParsed(text){
  const rows = parseCSV(text);
  const area = document.getElementById('csvPreviewArea');
  if(rows.length < 2){ area.innerHTML = `<div class="empty">No data rows found in that file.</div>`; return; }
  const headerMap = mapCsvHeaders(rows[0]);
  if(headerMap.name===undefined){
    area.innerHTML = `<div class="dupe-box">Couldn't find a "Name" column in the header row. Rename the column to "Name" and try again.</div>`;
    return;
  }
  const dataRows = rows.slice(1).filter(r=>r.some(c=>c.trim()!==''));
  csvImportRows = dataRows.map(cols=>{
    const get = (field)=> headerMap[field]!==undefined ? (cols[headerMap[field]]||'').trim() : '';
    const name = get('name');
    const data = {
      name, sex: csvNormalizeSex(get('sex')), breed: get('breed'), color: get('color'),
      earNumber: get('earNumber'), dob: csvParseDate(get('dob')), weight: get('weight'),
      legsWins: get('legsWins'), registrationNumber: get('registrationNumber'),
      sireName: get('sireName'), damName: get('damName'), notes: get('notes'),
    };
    const statusRaw = get('status').trim().toLowerCase();
    if(statusRaw) data.status = statusRaw;
    else data.status = data.sex==='doe' ? 'open' : 'available';
    const existing = name ? findByName(name) : null;
    return { data, existing, action: existing ? 'skip' : 'new' };
  }).filter(row=>row.data.name);
  renderCsvPreview();
}
function renderCsvPreview(){

          <div class="card-sub">Matches existing rabbit &middot; ${esc(row.existing.status)}${row.existing.color?' &middot; '+esc(row.existing.color):''}</div>
          <div class="seg" style="margin-top:8px;" data-csvrow="${i}">
            <button data-v="skip" class="${row.action==='skip'?'on':''}">Skip</button>

        </div>`;
      }).join('')}` : ''}
    <div class="sheet-actions"><button class="btn btn-secondary" onclick="closeSheet()">Cancel</button><button class="btn btn-primary" id="csvImportBtn">Import</button></div>`;
  document.querySelectorAll('[data-csvrow]').forEach(seg=>{
    seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      csvImportRows[+seg.dataset.csvrow].action = b.dataset.v;
      seg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
    });
  });
  const skipAll = document.getElementById('csvSkipAll');
  if(skipAll) skipAll.onclick = ()=>{ csvImportRows.forEach(r=>{ if(r.existing) r.action='skip'; }); renderCsvPreview(); };
  const updateAll = document.getElementById('csvUpdateAll');
  if(updateAll) updateAll.onclick = ()=>{ csvImportRows.forEach(r=>{ if(r.existing) r.action='update'; }); renderCsvPreview(); };
  document.getElementById('csvImportBtn').onclick = commitCsvImport;
}
async function commitCsvImport(){
  let imported=0, updated=0, skipped=0;
  // Two passes, deliberately: if pass 1 also linked sire/dam as it went,
  // an ancestor listed by name in one row (e.g. as a Sire) but given its
  // own full row later in the same file would get created twice — once
  // as an empty stub when first referenced, once as its real row. Doing
  // every row's own create/update first, then linking ancestry only
  // after all rows exist, makes the row order in the CSV irrelevant.
  csvImportRows.forEach(row=>{
    if(row.existing && row.action==='skip'){ skipped++; return; }
    if(row.existing && row.action==='update'){
      const ex = row.existing;
      Object.keys(row.data).forEach(k=>{ if(row.data[k]) ex[k]=row.data[k]; });
      updated++;
    } else {
      rabbits.push(blankRabbit(row.data));
      imported++;
    }
  });
  csvImportRows.forEach(row=>{
    if(row.existing && row.action==='skip') return;
    if(row.data.sireName) ensureAncestor(row.data.sireName,'buck');
    if(row.data.damName) ensureAncestor(row.data.damName,'doe');
  });
  const saved = await saveData();
  closeSheet(); render();
  if(saved){
    const parts=[]; if(imported) parts.push(imported+' imported'); if(updated) parts.push(updated+' updated'); if(skipped) parts.push(skipped+' skipped');
    showToast(parts.join(', ')||'Nothing to import');
  } else {
    showSaveError(`The import ran, but ${imported+updated} record${imported+updated===1?'':'s'} couldn't be saved to your account. Check your internet connection and try the import again.`);
  }
  csvImportRows = [];
}

/* ============================================================
   PEDIGREE PDF IMPORT — reads a 4-generation pedigree exported
   from "Rabbit Register" (Evans Software), matches the rabbit,
   its parents, grandparents, and great-grandparents by their
   fixed positions on the page, and feeds the results into the
   exact same review-and-commit flow as the CSV importer above
   (csvImportRows / renderCsvPreview / commitCsvImport) — so
   duplicate handling, the two-pass ancestor linking, and the
   review UI are all identical and already tested.
   ============================================================ */
// Box positions are fixed for this template on landscape Letter
// (792x612pt) — verified against the software's own drawn borders.
const PEDIGREE_PDF_BOXES = [
  ['SELF', 30, 271, 202, 353],
  ['SIRE', 216, 138, 387, 209],
  ['DAM', 216, 414, 387, 485],
  ['PGS', 402, 70, 573, 140],
  ['PGD', 402, 207, 573, 278],
  ['MGS', 402, 346, 573, 416],
  ['MGD', 402, 483, 573, 554],
  ['GGSIRE1', 588, 39, 760, 102],
  ['GGDAM1', 588, 108, 760, 171],
  ['GGSIRE2', 588, 177, 760, 240],
  ['GGDAM2', 588, 246, 760, 309],
  ['GGSIRE3', 588, 315, 760, 378],
  ['GGDAM3', 588, 384, 760, 447],
  ['GGSIRE4', 588, 453, 760, 516],
  ['GGDAM4', 588, 521, 760, 585],
];
const PEDIGREE_MALE_ROLES = new Set(['SIRE','PGS','MGS','GGSIRE1','GGSIRE2','GGSIRE3','GGSIRE4']);
const PEDIGREE_PARENT_OF = {
  SELF: ['SIRE','DAM'], SIRE: ['PGS','PGD'], DAM: ['MGS','MGD'],
  PGS: ['GGSIRE1','GGDAM1'], PGD: ['GGSIRE2','GGDAM2'],
  MGS: ['GGSIRE3','GGDAM3'], MGD: ['GGSIRE4','GGDAM4'],
};
function pdfLinesFromItems(items){
  const lines = [];
  const sorted = items.slice().sort((a,b)=>a.top-b.top||a.x-b.x);
  for(const it of sorted){
    if(!it.str.trim()) continue;
    let line = lines.find(l=>Math.abs(l.top-it.top)<3);
    if(!line){ line={top:it.top, parts:[]}; lines.push(line); }
    line.parts.push(it);
  }
  lines.sort((a,b)=>a.top-b.top);
  return lines.map(l=>l.parts.sort((a,b)=>a.x-b.x).map(p=>p.str).join(' ').replace(/\s+/g,' ').trim());
}
function pdfParseWeight(s){
  if(!s) return '';
  const m = s.match(/(\d+)\s*#(?:\s*(\d+)\s*oz)?/);
  if(!m) return '';
  const lbs = parseInt(m[1],10) + (m[2]?parseInt(m[2],10)/16:0);
  return (Math.round(lbs*100)/100).toString();
}
function pdfParseDob(s){
  if(!s) return null;
  const m = s.match(/([A-Za-z]+)\s+(\d{1,2}),\s+(\d{4})/);
  if(!m) return null;
  const d = new Date(`${m[1]} ${m[2]}, ${m[3]}`);
  if(isNaN(d)) return null;
  return d.toISOString().slice(0,10);
}
function pdfParseBoxLines(lines, role){
  if(!lines.length) return null;
  const data = { name: lines[0], color:'', earNumber:'', registrationNumber:'', weight:'', legsWins:'', dob:null, gc:'', sex:null };
  for(const line of lines.slice(1)){
    let m;
    if((m=line.match(/Ear\s*#:\s*(\S*)\s*Reg\s*#:\s*(\S*)/i))){ data.earNumber=m[1]||''; data.registrationNumber=m[2]||''; continue; }
    if((m=line.match(/Weight:\s*(.+)/i))){ data.weight=pdfParseWeight(m[1]); continue; }
    if((m=line.match(/GC\s*#:\s*(\S*)\s*Legs:\s*(\d*)/i))){ data.gc=m[1]||''; data.legsWins=m[2]||''; continue; }
    if((m=line.match(/DOB:\s*(.+)/i))){ data.dob=pdfParseDob(m[1]); continue; }
    if((m=line.match(/Sex:\s*(Buck|Doe)/i))){ data.sex = m[1].toLowerCase()==='buck'?'buck':'doe'; continue; }
    if(!data.color && !/^(BOS|BOB|BOV|BIS|Placed|\d)/.test(line)){ data.color=line; continue; }
    // otherwise: a show-win line — not imported
  }
  if(role!=='SELF') data.sex = PEDIGREE_MALE_ROLES.has(role) ? 'buck' : 'doe';
  return data;
}
// Box positions are fixed for the Everbreed template on landscape

];
// Everbreed draws every box with a colored border — blue for a buck,
// pink for a doe. For every ancestor slot that color is exactly
// PEDIGREE_MALE_ROLES (sire-side roles are always the male half of a
// breeding by definition, generation after generation, so it's
// reused as-is rather than duplicated). The one box whose sex isn't
// fixed by tree position is SELF — the featured rabbit could be
// either — so its sex is instead read straight off the "BUCK"/"DOE"
// badge printed in that box, which is the text-layer equivalent of
// reading its border color.

// pdf.js text items include small Font-Awesome glyph icons (paw/
// gender symbols) as Private-Use-Area characters. They carry no
// name/field text but their vertical position doesn't line up with
// the real text baseline, which throws off line-grouping — so they're
// filtered out before grouping rather than after.
function pdfIsIconGlyph(s){
  const t = (s||'').trim();
  if(!t) return true;
  for(const ch of t){ const c=ch.codePointAt(0); if(c<0xE000||c>0xF8FF) return false; }
  return true;
}
function pdfDashClean(v){ v=(v||'').trim(); return (!v||v==='-') ? '' : v; }

// Everbreed's box layout isn't fixed: on the big SELF box each label
// ("ID:", "DOB:", "COLOR:", "BREED:"...) gets its own line, but on the
// smaller ancestor boxes two labels share a line ("ID: ABU DOB:
// 03/23/2024"). Rather than pattern-match a specific line shape, every
// field line in the box is joined into one string and each label's
// value is sliced out from right after that label up to wherever the
// next known label starts — so it works the same either way.
function pdfEverbreedExtractFields(text){
  const labels = ['ID','DOB','COLOR','BREED','WEIGHT','GC #','GEN'];
  const positions=[];
  labels.forEach(label=>{
    const re = new RegExp('\\b'+label.replace('#','\\#')+'\\s*:','i');
    const m = text.match(re);
    if(m) positions.push({label, idx:m.index, len:m[0].length});
  });
  positions.sort((a,b)=>a.idx-b.idx);
  const out={};
  positions.forEach((p,i)=>{
    const start=p.idx+p.len;
    const end = i+1<positions.length?positions[i+1].idx:text.length;
    out[p.label]=text.slice(start,end).trim();
  });
  return out;
}
function pdfParseEverbreedBoxLines(lines, role){
  if(!lines.length) return null;
  const nameParts=[]; const fieldLines=[]; let sex=null;
  lines.forEach(line=>{
    const t=line.trim(); if(!t) return;
    if(/^(BUCK|DOE)$/i.test(t)){ sex = /^BUCK$/i.test(t)?'buck':'doe'; return; }
    if(/\b(ID|DOB|COLOR|BREED|WEIGHT|GC\s*#|GEN)\s*:/i.test(t)) fieldLines.push(t);
    else nameParts.push(t); // cattery prefix and/or given name, in reading order
  });
  const f = pdfEverbreedExtractFields(fieldLines.join(' '));
  const weightRaw = pdfDashClean(f['WEIGHT']);
  const weightMatch = weightRaw.match(/[\d.]+/); // strips a trailing " lbs"
  if(!sex) sex = role==='SELF' ? null : (PEDIGREE_MALE_ROLES.has(role) ? 'buck' : 'doe');
  return {
    name: nameParts.join(' ').replace(/\s+/g,' ').trim(),
    color: pdfDashClean(f['COLOR']),
    breed: pdfDashClean(f['BREED']), // read per-box (mixed-breed pedigrees are possible)
    earNumber: pdfDashClean(f['ID']),
    registrationNumber: '', // Everbreed's layout has no separate reg # field
    weight: weightMatch ? weightMatch[0] : '',
    legsWins: '', // no leg-count field in this layout
    dob: csvParseDate(pdfDashClean(f['DOB'])),
    gc: pdfDashClean(f['GC #']), // Grand Champion # — carried into notes, same as Rabbit Register's GC #
    sex,
  };
}
function parseEverbreedPedigreePdf(items, viewport){
  if(Math.abs(viewport.width-792)>15 || Math.abs(viewport.height-612)>15){
    return { ok:false, error:"This PDF's page size doesn't match the expected Everbreed layout, so the positions couldn't be read reliably." };
  }
  const cleanItems = items.filter(it=>!pdfIsIconGlyph(it.str));
  const slots = {};
  for(const [role,x0,top,x1,bottom] of EVERBREED_PDF_BOXES){
    const boxItems = cleanItems.filter(it=>it.x>=x0-2 && it.x<=x1+2 && it.top>=top-2 && it.top<=bottom+2);
    slots[role] = pdfParseEverbreedBoxLines(pdfLinesFromItems(boxItems), role);
  }
  if(!slots.SELF || !slots.SELF.name){
    return { ok:false, error:"Couldn't find the main rabbit's details on this pedigree — the file may not match the expected Everbreed layout." };
  }
  if(!slots.SELF.sex) slots.SELF.sex = 'doe'; // badge text wasn't read — harmless fallback, reviewed before import anyway

  // Same collapse-duplicates + two-pass ancestor linking as the
  // Rabbit Register parser: a real ancestor can legitimately occupy
  // more than one tree position (line-breeding), so each unique name
  // becomes exactly one row.
  const rows = [];
  const seen = new Set();
  for(const [role] of EVERBREED_PDF_BOXES){
    const data = slots[role];
    if(!data || !data.name) continue;
    const key = data.name.trim().toLowerCase();
    if(seen.has(key)) continue;
    seen.add(key);
    const [sireRole, damRole] = PEDIGREE_PARENT_OF[role] || [];
    const sireData = sireRole ? slots[sireRole] : null;
    const damData = damRole ? slots[damRole] : null;
    const rowData = {
      name: data.name, sex: data.sex, breed: data.breed || '', color: data.color,
      earNumber: data.earNumber, dob: data.dob, weight: data.weight,
      legsWins: data.legsWins, registrationNumber: data.registrationNumber,
      sireName: sireData ? sireData.name : '', damName: damData ? damData.name : '',
      notes: data.gc ? `GC #: ${data.gc}` : '',
      status: data.sex==='doe' ? 'open' : 'available',
    };
    const existing = findByName(rowData.name);
    rows.push({ data: rowData, existing, action: existing ? 'skip' : 'new' });
  }
  return { ok:true, rows };
}

async function parsePedigreePdf(arrayBuffer){
  if(!window.pdfjsLib) return { ok:false, error:"The PDF reader didn't load — refresh the page and try again." };
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer) }).promise;
  const page = await pdf.getPage(1);
  const viewport = page.getViewport({ scale: 1 });
  const textContent = await page.getTextContent();
  const items = textContent.items
    .map(it => ({ str: it.str, x: it.transform[4], top: viewport.height - it.transform[5] }))
    .filter(it => it.str.trim());

  const fullText = items.map(i=>i.str).join(' ');

  if(/everbreed/i.test(fullText)){
    return parseEverbreedPedigreePdf(items, viewport);
  }
  if(!/Rabbit Register/i.test(fullText)){
    return { ok:false, error:"This doesn't look like a supported pedigree PDF — this importer currently understands Rabbit Register (Evans Software) and Everbreed pedigree exports." };
  }
  if(Math.abs(viewport.width-792)>15 || Math.abs(viewport.height-612)>15){
    return { ok:false, error:"This PDF's page size doesn't match the expected Rabbit Register layout, so the positions couldn't be read reliably." };
  }

  const headerItems = items.filter(it => it.top<65 && it.x<580);
  const headerLines = pdfLinesFromItems(headerItems);
  const breedLine = headerLines.find(l=>/Pedigree\s*$/i.test(l));
  const breed = breedLine ? breedLine.replace(/\s*Pedigree\s*$/i,'').trim() : '';

  const slots = {};
  for(const [role,x0,top,x1,bottom] of PEDIGREE_PDF_BOXES){
    const boxItems = items.filter(it=>it.x>=x0-2 && it.x<=x1+2 && it.top>=top-2 && it.top<=bottom+2);
    slots[role] = pdfParseBoxLines(pdfLinesFromItems(boxItems), role);
  }
  if(!slots.SELF || !slots.SELF.name){
    return { ok:false, error:"Couldn't find the main rabbit's details on this pedigree — the file may not match the expected layout." };
  }

  // Collapse duplicate individuals — the same real ancestor can
  // legitimately occupy more than one tree position (line-breeding) —
  // down to exactly one row each, keeping every role's sire/dam link
  // pointed at the correct (already-collapsed) name.
  const rows = [];
  const seen = new Set();
  for(const [role] of PEDIGREE_PDF_BOXES){
    const data = slots[role];
    if(!data || !data.name) continue;
    const key = data.name.trim().toLowerCase();
    if(seen.has(key)) continue;
    seen.add(key);
    const [sireRole, damRole] = PEDIGREE_PARENT_OF[role] || [];
    const sireData = sireRole ? slots[sireRole] : null;
    const damData = damRole ? slots[damRole] : null;
    const rowData = {
      name: data.name, sex: data.sex, breed, color: data.color,
      earNumber: data.earNumber, dob: data.dob, weight: data.weight,
      legsWins: data.legsWins, registrationNumber: data.registrationNumber,
      sireName: sireData ? sireData.name : '', damName: damData ? damData.name : '',
      notes: data.gc ? `GC #: ${data.gc}` : '',
      status: data.sex==='doe' ? 'open' : 'available',
    };
    const existing = findByName(rowData.name);
    rows.push({ data: rowData, existing, action: existing ? 'skip' : 'new' });
  }
  return { ok:true, rows, breed };
}
function openImportPedigreePdfSheet(){
  openSheet(`<button class="close-x" onclick="closeSheet()">&times;</button>
    <h2>Import from Pedigree PDF</h2>
    <div class="card-sub" style="margin-bottom:12px;">Upload a 4-generation pedigree PDF exported from Rabbit Register (Evans Software) or Everbreed — the formats many breeders share when a rabbit changes hands. The rabbit, its parents, grandparents, and great-grandparents are all read automatically and matched up by name, with everything shown to you for review before anything is added.</div>
    <button class="btn btn-primary" style="width:100%;" id="pdfPickBtn">Choose pedigree PDF</button>
    <div id="csvPreviewArea"></div>`);
  document.getElementById('pdfPickBtn').onclick = ()=>document.getElementById('pedigreePdfFileInput').click();
  document.getElementById('pedigreePdfFileInput').onchange = async (e)=>{
    const file = e.target.files[0]; e.target.value='';
    if(!file) return;
    const area = document.getElementById('csvPreviewArea');
    area.innerHTML = `<div class="empty">Reading PDF…</div>`;
    try{
      const buf = await file.arrayBuffer();
      const result = await parsePedigreePdf(buf);
      if(!result.ok){ area.innerHTML = `<div class="dupe-box">${esc(result.error)}</div>`; return; }
      csvImportRows = result.rows;
      renderCsvPreview();
    }catch(err){
      console.error(err);
      area.innerHTML = `<div class="dupe-box">Couldn't read that PDF — make sure it's a Rabbit Register or Everbreed pedigree export.</div>`;
    }
  };
}

// Authentication UI
let authMode = 'login';
const authScreen = document.getElementById('authScreen');
const authForm = document.getElementById('authForm');
const authEmail = document.getElementById('authEmail');
const authPassword = document.getElementById('authPassword');
const authConfirm = document.getElementById('authConfirm');
const authConfirmWrap = document.getElementById('authConfirmWrap');
const authSubmit = document.getElementById('authSubmit');
const authMessage = document.getElementById('authMessage');
const authLoginTab = document.getElementById('authLoginTab');
const authSignupTab = document.getElementById('authSignupTab');
const authForgot = document.getElementById('authForgot');

function setAuthMessage(text,ok=false){ authMessage.textContent=text||''; authMessage.className='auth-message'+(ok?' ok':''); }
function setAuthMode(mode){
  authMode=mode;
  const signup=mode==='signup';
  authLoginTab.classList.toggle('on',!signup);
  authSignupTab.classList.toggle('on',signup);
  authConfirmWrap.style.display=signup?'block':'none';
  authConfirm.required=signup;
  authSubmit.textContent=signup?'Create account':'Sign in';
  authForgot.style.display=signup?'none':'block';
  authPassword.autocomplete=signup?'new-password':'current-password';
  setAuthMessage('');
}

authLoginTab.onclick=()=>setAuthMode('login');
authSignupTab.onclick=()=>setAuthMode('signup');

authForm.onsubmit=async (e)=>{
  e.preventDefault();
  const email=authEmail.value.trim();
  const password=authPassword.value;
  if(authMode==='signup' && password!==authConfirm.value){ setAuthMessage('Passwords do not match.'); return; }
  authSubmit.disabled=true;
  setAuthMessage(authMode==='signup'?'Creating your HerdNerd Pro account…':'Signing you in…',true);
  try{
    if(authMode==='signup'){
      const {data,error}=await sb.auth.signUp({email,password});
      if(error) throw error;
      if(data.session){
        setAuthMessage('Account created. Loading HerdNerd Pro…',true);
      } else {
        setAuthMessage('Account created. Check your email to confirm your account, then sign in.',true);
        authPassword.value=''; authConfirm.value='';
        setAuthMode('login'); authEmail.value=email;
      }
    } else {
      const {error}=await sb.auth.signInWithPassword({email,password});
      if(error) throw error;
    }
  }catch(err){ setAuthMessage(err.message||'Something went wrong.'); }
  finally{ authSubmit.disabled=false; }
};

authForgot.onclick=async ()=>{
  const email=authEmail.value.trim();
  if(!email){ setAuthMessage('Enter your email address first.'); authEmail.focus(); return; }
  authForgot.disabled=true;
  try{
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});
    if(error) throw error;
    setAuthMessage('Password reset instructions sent to your email.',true);
  }catch(err){ setAuthMessage(err.message||'Could not send reset email.'); }
  finally{ authForgot.disabled=false; }
};

async function enterApp(user){
  try{
    document.body.classList.add('auth-locked');
    await initCloudStorage(user);
    await loadMyProfile();
    if(myProfile && myProfile.access_granted===false){
      await sb.auth.signOut();
      currentUser=null; cloudDataReady=false; cloudDataCache={}; myProfile=null; isAdminUser=false; adminSelf=null;
      authScreen.classList.remove('hidden');
      setAuthMessage("Your account doesn't have access yet. Contact CJM Legacy Rabbitry to get set up.");
      return;
    }
    authScreen.classList.add('hidden');
    document.body.classList.remove('auth-locked');
    await loadData();
  }catch(err){
    console.error(err);
    authScreen.classList.remove('hidden');
    document.body.classList.add('auth-locked');
    setAuthMessage('Could not connect to HerdNerd Pro data. '+(err.message||''));
  }
}

sb.auth.onAuthStateChange((event,session)=>{
  if(session?.user){
    if(event==='INITIAL_SESSION' || event==='SIGNED_IN' || event==='USER_UPDATED') enterApp(session.user);
  } else {
    currentUser=null; cloudDataReady=false; cloudDataCache={};
    myProfile=null; isAdminUser=false; adminSelf=null; viewingAsCustomer=null;
    authScreen.classList.remove('hidden');
    document.body.classList.add('auth-locked');
    setAuthMode('login');
    authPassword.value=''; authConfirm.value='';
  }
});

// Ask Supabase for the current session so a returning user goes straight in.
sb.auth.getSession().then(({data})=>{
  if(data.session) enterApp(data.session.user);
});
</script>
